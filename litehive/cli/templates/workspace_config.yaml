# Litehive workspace configuration.
# This file is written automatically the first time Litehive bootstraps a repo.
# Static defaults can be edited by hand. Runtime engine routing values below
# are used only to bootstrap the audited database-backed settings store.

# Bootstrap default engine; use `litehive engine default <engine>` after init.
default_engine: codex

# Optional engine used for recovery runs. Keep `auto` or unset to follow defaults.
recovery_engine: auto

# Optional path to a Litehive source checkout for upstream issue/task handoff.
litehive_source_path: null

# Process profile controls the scaffolded workspace context prompt.
process_profile: generic

# Per-engine default model overrides. Leave null to use adapter defaults.
codex_model: null
opencode_model: zai-coding-plan/glm-5-turbo
goz_model: glm-5-turbo
gemini_model: null
copilot_model: null
claude_model: claude-sonnet-4-20250514

# Claude-specific guardrail to avoid runaway interactive sessions.
claude_max_turns: 100

# Retry policy for task execution.
default_retry_limit: 3

# Failure kinds that are eligible for retry.
retry_on:
  - execution_limit
  - timeout

# Stage-local retry budget before the pipeline escalates.
default_stage_retry_limit: 2

# Consecutive QA/reviewer rejection loop cap before manual intervention.
default_rejection_loop_limit: 3

# Pool runner defaults for `litehive run --drain`.
# `pool_stop_on_failure` exits the drain loop after the first non-`done` task.
pool_stop_on_failure: false
# `pool_max_tasks: null` means "no cap"; set an integer to stop after N tasks.
pool_max_tasks: null
# `pool_stop_on_dirty_git` blocks the pool when tracked repo changes exist
# outside Litehive-managed files.
pool_stop_on_dirty_git: false
# `pool_stop_on_attention` blocks the pool whenever pending operator
# attention items exist in `.litehive/attention/`.
pool_stop_on_attention: false

# Lifecycle hooks keyed by hook point.
# Supported keys:
#   before_grooming, after_grooming, before_implementing, after_implementing,
#   before_testing, after_testing, before_accepting, after_accepting,
#   after_commit
# Each hook supports either a bare command string or a mapping with:
#   command: shell command string
#   description: optional operator-facing label
#   timeout_seconds: optional timeout budget
#   instructions_on_failure: optional guidance surfaced on failure
# Example:
# runner_hooks:
#   after_implementing:
#     - command: uv run pytest -q
#       description: run the full suite before QA
runner_hooks: {}

# Timeout budget for detecting hung live subagents and top-level runs.
# `task_time_budget_seconds` is the cumulative wall-clock budget for all
# subagent turns on one task before commit_to_git. When it is exceeded before
# commit, Litehive flags the task for manual review and moves on.
task_time_budget_seconds: 3600.0
# Litehive kills a stalled live Codex subprocess after 300 seconds without new
# stdout, then lets the normal stage retry flow restart that stage.
# `inactivity_timeout_seconds` is separate daemon/runner stale-state handling.
subagent_inactivity_timeout_seconds: 300.0
inactivity_timeout_seconds: null

# External engine sandbox configuration used for adapters that launch outside the repo.
external_engine_sandbox:
  enabled: false
  backend: docker
  runtime_binary: docker
  image: litehive-external-engine:latest
  workspace_mount_path: /workspace
  binary_mount_root: /litehive/bin
  runtime_args: []
  default_network_mode: none
  default_workspace_mode: rw
  read_only_rootfs: true
  drop_capabilities: true
  no_new_privileges: true
  tmpfs:
    - /tmp
  # Per-engine sandbox overrides. Each engine policy supports:
  #   enabled, network_mode, workspace_mode, environment,
  #   credential_inputs[{env_var, mount_path}], extra_ro_binds,
  #   extra_rw_binds, setenv
  engine_policies: {}

# Bootstrap engine freezes keyed by engine name -> UTC timestamp.
# Use `litehive engine freeze/unfreeze` after init.
# Example:
# engine_freeze:
#   gemini: 2026-05-01T00:00:00Z
engine_freeze: {}

# Bootstrap engine fallback order when the preferred engine is unavailable.
# Use `litehive engine preference <comma-separated-engines>` after init.
engine_preference:
  - codex
  - opencode
  - gemini
  - copilot
  - goz

# Optional startup guidance injected by role.
# Example:
# agent_startup_guidance:
#   planner:
#     - Rewrite scope with `litehive agent update ...` before passing grooming.
#   swe:
#     - Run focused tests before `litehive agent report --verdict pass ...`.
agent_startup_guidance: {}

# Workspace defaults for automatic commits and display labels.
# `auto_commit: false` leaves commit creation to the operator/agent.
auto_commit: true
# Human-facing label used in prompts and rendered task metadata.
task_mode_name: tasks
# Human-facing label used for the implementing stage in prompts/context.
implementation_mode_name: implementation
