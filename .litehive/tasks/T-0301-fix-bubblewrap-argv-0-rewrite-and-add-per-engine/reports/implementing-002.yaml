summary: 'Implemented bubblewrap argv[0] rewrite plus per-engine extra_ro_binds support.
  ExternalEngineSandboxPolicy now carries extra_ro_binds, normalization validates
  absolute paths, formatting/status round-trip includes the field, and bubblewrap
  mounts each declared host path read-only after fail-closed host existence checks
  with a clear SandboxError. _wrap_bubblewrap now rewrites the executed command argv[0]
