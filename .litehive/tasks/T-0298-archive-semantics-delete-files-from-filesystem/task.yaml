goal: 'Change litehive close/archive to: 1) sync the task''s intent and state to DB,
  2) git rm -r the task directory from .litehive/tasks/, 3) commit the deletion. The
  DB retains everything forever. Archived tasks are accessible via litehive archive
  list/show/restore, not via filesystem.'
acceptance_criteria:
- litehive close <id> --outcome done deletes .litehive/tasks/<id-slug>/ and commits
  the deletion
- DB retains full task_intent, task_state, task_journal, stage_reports, comments for
  archived tasks
- litehive archive list queries DB, shows all archived tasks
- litehive archive show <id> prints the archived task from DB
- litehive archive restore <id> recreates filesystem files from DB and re-adds task
  to queue
- No .litehive/archive/ directory or archive/INDEX.csv in the repo anymore
- Existing archive entries migrated to DB on first run
- All tests pass
