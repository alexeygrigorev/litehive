  \ engine in `litehive/pipeline/_models.py` via `resolve_engine_plan(...): task.engine\
  \ -> config.default_engine`.\n- User-visible task views and editable update payloads\
  \ still expose task engine in `litehive/cli/tasks.py`, `litehive/cli/status.py`,\
  \ and `litehive/cli/_parse.py`.\n- Existing switch-task flow in `litehive/workspace/task_status.py`\
  \ persists `task.engine`, so removing the field requires either adapting or explicitly\
  \ retiring that path in this task.\n- Docs still advertise task-specific engines\
  \ in `docs/configuration.md`.\n\nTests run:\n- None. Grooming only; this pass is\
  \ based on source inspection.\n\nExecution plan for implementing/testing:\n1. Remove\
  \ `engine` from durable task schema and task creation/update persistence surfaces\
  \ (`TaskRecord`, `create_task`, `update_task`, editable YAML payloads, CLI add/update\
  \ handlers/parsers, and any serialization assumptions).\n2. Change engine resolution\
  \ to stop reading task-level engine and rely only on run-level override when present,\
  \ otherwise workspace/global selection (`select_engine` / `resolve_engine_plan`\
  \ / related tests).\n3. Update user-facing task output and docs so task records\
  \ no longer claim a stored engine override.\n4. Resolve the current `switch_task_engine`\
  \ dependency explicitly during implementation: either rework it to use non-durable\
