  \ that behavior and its tests as part of this task. Do not leave a dead reference\
  \ to the removed field.\n5. Run focused tests first around config/task CLI/status/list/show/switch\
  \ paths, then run `uv run pytest -q` to satisfy the final acceptance criterion.\n\
  \nRecommended acceptance criteria rewrite:\n- New tasks created with `litehive add`\
  \ do not accept or persist a task-specific engine override.\n- Existing tasks updated\
