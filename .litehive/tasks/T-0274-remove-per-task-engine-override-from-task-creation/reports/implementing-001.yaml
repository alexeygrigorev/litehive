step: implementing
verdict: pass
source: agent
summary: 'Root cause: Litehive still exposed a hidden per-task engine override through
  the Python task-creation API. Even after CLI and task-record cleanup, litehive.tasks.crud.create_task
  with an engine keyword was still accepted and rewrote .litehive/config.yaml default_engine
  during task creation, which violated the task contract and the shared global engine-selection
  model. Fix made: removed the engine parameter and config-rewrite logic from litehive/tasks/crud.py
  so task creation can no longer mutate workspace engine preference. Updated remaining
  tests that were still relying on task-specific engine injection to set workspace
  defaults explicitly instead, and added a regression test that create_task with an
  engine keyword now raises and leaves default_engine unchanged. Verification: uv
  run ruff check --select E402,F401 litehive tests passed; forbidden noqa suppression
  gate passed; focused pytest coverage over the touched engine/task suites passed
  (225 passed); targeted web snapshot regression passed (17 passed); full suite passed
  (uv run pytest => 919 passed in 131.62s). Retry guidance: the failed implementing
  stage should be retried; task creation no longer accepts or acts on a task-specific
  engine input, and engine choice now stays with run override or shared workspace
  preference/quota logic only.'
