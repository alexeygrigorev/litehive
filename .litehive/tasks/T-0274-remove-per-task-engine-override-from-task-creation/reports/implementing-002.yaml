summary: 'Removed the durable task engine override from task creation/update surfaces
  and task records. TaskRecord no longer defines or serializes an engine field; add/update
  CLI parsers no longer expose --engine; editable YAML/web task-detail updates no
  longer accept or persist engine; task/status/web displays now use workspace default
  or runtime subagent engine instead of task.yaml. Engine resolution now goes through
  the shared global path: resolve_engine_plan no longer reads task.engine, and recovery/merge/status
  code paths were updated to fall back to workspace defaults plus shared select_engine/quota
  handling. I kept switch-task as a runtime-only switch annotation/requeue flow rather
  than a durable task field write, and updated docs/tests accordingly. Verified with:
  uv run ruff check --select E402,F401 litehive tests (pass); forbidden noqa suppression
  gate command from task prompt (pass); focused pytest sweep for config/task/web/status
  surfaces (pass, 176 passed); full suite uv run pytest -q (pass, 918 passed in 133.60s).
  Evidence for acceptance criteria: task.yaml/task serialization no longer includes
  engine, add/update no longer persist per-task engine overrides, runtime selection
  no longer reads task.engine, and all tests pass.'
