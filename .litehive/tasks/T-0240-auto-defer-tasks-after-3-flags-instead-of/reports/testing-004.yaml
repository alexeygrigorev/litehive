feedback: "## QA Verdict: PASS\n\n### What was verified\n\nAll 6 acceptance criteria\
  \ confirmed through code review and test execution.\n\n**1. TaskRecord has flag_count\
  \ field (int, default 0) persisted in task.yaml**\n- Verified in `litehive/models/task_models.py:84`:\
  \ `flag_count: int = 0` on TaskRecord.\n- Test `test_new_task_starts_with_flag_count_zero`\
  \ and `test_flag_count_persisted_in_task_yaml` confirm default and persistence.\n\
  \n**2. flag_count increments every time a task transitions to flagged status**\n\
  - `_apply_flag_count_auto_defer()` in `litehive/workspace/runtime_tracking.py:57-64`\
  \ increments on `status == \"flagged\"`.\n- Called from `finish_task_run_transition()`\
  \ (pipeline path) and `litehive/web/actions.py:202-203` (web verdict path).\n- Tests\
  \ `test_flag_count_increments_on_flagged_transition` and `test_flag_count_increments_each_time`\
  \ confirm.\n\n**3. After flag_count reaches 3, task is set to deferred with reason\
  \ \"flagged 3 times - needs human review\"**\n- Same helper sets `status = \"deferred\"\
  ` and `flag_reason = \"flagged 3 times - needs human review\"` when `flag_count\
  \ >= 3`.\n- Tests `test_auto_defer_after_three_flags`, `test_auto_defer_after_more_than_three_flags`,\
  \ and `test_auto_defer_via_finish_task_run_transition` confirm.\n\n**4. litehive\
  \ requeue warns and requires --force when flag_count >= 3**\n- `requeue_task()`\
  \ in `litehive/workspace/task_status.py:280-284` raises ValueError when `flag_count\
  \ >= 3` and `force` is False.\n- `--force` argument added to requeue CLI in `litehive/cli/parser.py:687-689`.\n\
  - CLI handler in `litehive/cli/queue.py:148` passes force through.\n- Tests `test_requeue_blocked_without_force_after_three_flags`,\
  \ `test_cli_requeue_fails_without_force`, `test_cli_requeue_succeeds_with_force`\
  \ confirm.\n\n**5. flag_count is NOT reset by requeue (lifetime counter)**\n- `requeue_task()`\
  \ calls `_reset_task_for_recovery()` which does not touch `flag_count`.\n- Tests\
  \ `test_flag_count_survives_requeue` and `test_requeue_succeeds_with_force_after_three_flags`\
  \ (asserts flag_count == 3 after requeue) confirm.\n\n**6. All existing tests pass**\n\
  - 14/14 new tests pass (0.61s).\n- 281 existing tests pass across test_task_commands_and_daemon.py,\
  \ test_runtime_pool.py, test_runner_workflow.py (75s total).\n- 1 pre-existing failure\
  \ (`test_opencode_strips_provider_env`) unrelated to this change \u2014 mock signature\
  \ mismatch in base.py, present on main."
