feedback: "## Implementation Complete\n\n### Changes Made\n\n1. **litehive/models/task_models.py**:\
  \ Added `flag_count: int = 0` field to `TaskRecord`, persisted in task.yaml via\
  \ existing serialization.\n\n2. **litehive/workspace/runtime_tracking.py**: Added\
  \ `_apply_flag_count_auto_defer()` helper that increments `flag_count` when task\
  \ status is \"flagged\" and auto-defers (sets status to \"deferred\" with reason\
  \ \"flagged 3 times - needs human review\") when flag_count reaches 3. Called from\
  \ `finish_task_run_transition()` which is the centralized pipeline completion point.\n\
  \n3. **litehive/web/actions.py**: Also calls `_apply_flag_count_auto_defer()` in\
  \ the web verdict submission path where tasks can be flagged.\n\n4. **litehive/tasks/crud.py**:\
  \ Updated `_normalize_task_flag_reason()` to preserve `flag_reason` for auto-deferred\
  \ tasks (status=\"deferred\" with flag_count >= 3).\n\n5. **litehive/workspace/task_status.py**:\
  \ Added `force: bool = False` parameter to `requeue_task()`. Raises ValueError when\
  \ `flag_count >= 3` and `force` is False.\n\n6. **litehive/cli/parser.py**: Added\
  \ `--force` argument to the `requeue` subcommand.\n\n7. **litehive/cli/queue.py**:\
  \ Passes `force` from CLI args to `requeue_task()`.\n\n### Acceptance Criteria Verification\n\
  \n- \u2705 TaskRecord has flag_count field (int, default 0) persisted in task.yaml\n\
  - \u2705 flag_count increments every time a task transitions to flagged status\n\
  - \u2705 After flag_count reaches 3, task is set to deferred with reason \"flagged\
  \ 3 times - needs human review\"\n- \u2705 litehive requeue warns and requires --force\
  \ when flag_count >= 3\n- \u2705 flag_count is NOT reset by requeue (it is a lifetime\
  \ counter on TaskRecord, not touched by _reset_task_for_recovery)\n- \u2705 All\
  \ existing tests pass (pre-existing failures on main confirmed unrelated)\n\n###\
  \ Tests\n\nNew test file: `tests/test_flag_count_auto_defer.py` with 14 tests covering:\n\
  - New tasks start with flag_count=0\n- flag_count persisted in task.yaml\n- flag_count\
  \ increments on each flagged transition\n- flag_count not incremented for non-flagged\
  \ status\n- Auto-defer after 3 flags with correct status/reason\n- Auto-defer works\
  \ for flag_count > 3 (force-requeued tasks)\n- Auto-defer via finish_task_run_transition\
  \ pipeline path\n- Requeue blocked without --force after 3 flags\n- Requeue succeeds\
  \ with --force after 3 flags\n- Requeue allowed without --force below threshold\n\
  - CLI requeue fails without --force\n- CLI requeue succeeds with --force\n- flag_count\
  \ survives requeue (lifetime counter)\n\nTest results: 14/14 new tests pass. Existing\
  \ tests: test_task_commands_and_daemon.py (104 pass), test_runtime_pool.py (64 pass),\
  \ test_runner_workflow.py (113 pass, 1 pre-existing failure), test_retry_commit_and_recovery.py\
  \ + test_recovery_agent.py (117 pass, 4 pre-existing failures)."
