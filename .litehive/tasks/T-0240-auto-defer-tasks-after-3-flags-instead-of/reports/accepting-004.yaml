summary: 'Acceptance PASS. I verified the implementation directly in the current worktree
  and reran the acceptance gates. Code review confirmed TaskRecord now includes flag_count:
  int = 0 in litehive/models/task_models.py and that flagged outcomes route through
  the shared helper in litehive/workspace/runtime_tracking.py. That helper increments
  flag_count on each flagged transition and, once the counter reaches 3, converts
  the task to status=deferred and sets flag_reason=''flagged 3 times - needs human
  review''. The web verdict path in litehive/web/actions.py also calls the same helper,
  so manual/web flagging uses the same lifetime counter logic. I also verified litehive/tasks/crud.py
  preserves flag_reason for auto-deferred tasks and litehive/workspace/task_status.py
  blocks requeue when flag_count >= 3 unless force=True; the CLI exposes and passes
  through --force via litehive/cli/parsers/requeue.py and litehive/cli/queue.py. Requeue
  does not reset flag_count, so the counter remains lifetime state. Acceptance criteria
  evidence: (1) flag_count exists on TaskRecord and is persisted in task.yaml, (2)
  flag_count increments on each flagged transition via the shared runtime helper,
  (3) the third flag auto-defers with reason ''flagged 3 times - needs human review'',
  (4) requeue requires --force once flag_count >= 3, (5) requeue preserves flag_count,
  and (6) the test suite is green in this worktree. Commands run: uv run ruff check
  --select E402,F401 litehive tests -> passed; uv run pytest -q tests/test_flag_count_auto_defer.py
  -> 8 passed in 0.56s; uv run pytest -q tests/test_task_commands_and_daemon.py tests/test_runtime_pool.py
  tests/test_runner_workflow.py -> 308 passed in 56.65s; uv run pytest -q -> 972 passed
  in 194.72s.'
