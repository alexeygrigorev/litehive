id: T-0240
slug: auto-defer-tasks-after-3-flags-instead-of
title: Auto-defer tasks after 3 flags instead of allowing infinite requeue loops
created_at: '2026-04-09T07:50:34+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: Prevent infinite flagged/requeue loops by tracking a lifetime flag counter on
  the TaskRecord runtime state, auto-deferring on the third flag with a human-review
  reason, and requiring --force to requeue tasks already flagged 3 or more times.
acceptance_criteria:
- TaskRecord.flag_count defaults to 0 and persists with the task runtime state for
  new and existing tasks.
- Each transition into flagged increments flag_count exactly once, including repeated
  passes after requeue.
- When a flagged transition would raise flag_count to 3, Litehive persists flag_count=3,
  stores status deferred instead of flagged, and sets reason 'flagged 3 times - needs
  human review'.
- litehive queue requeue refuses tasks with flag_count >= 3 unless --force is supplied
  and prints a clear operator-facing warning.
- Requeue never resets flag_count; forced requeue preserves the lifetime counter for
  later trips.
- Regression coverage includes runtime-state persistence or hydration, the third-flag
  auto-defer path, the CLI or operator force gate, and the existing relevant tests
  remain green.
constraints:
- Keep the work scoped to this behavior and do not move runtime-only task state back
  into task.yaml.
plan:
- Confirm whether the runtime, persistence, and CLI layers already satisfy the behavior
  so grooming does not reopen solved work.
- If any delta remains, keep follow-up scoped to the smallest change in flag transition
  handling, requeue gating, and focused regression tests.
