id: T-0240
slug: auto-defer-tasks-after-3-flags-instead-of
title: Auto-defer tasks after 3 flags instead of allowing infinite requeue loops
created_at: '2026-04-09T07:50:34+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: Stop tasks that repeatedly cycle through flagged and requeue without human intervention.
  Persist a lifetime flag counter on the task record, auto-defer on the third flag
  with a human-review reason, and require --force to requeue tasks whose flag_count
  is already 3 or higher.
acceptance_criteria:
- TaskRecord persists flag_count in task.yaml as an integer defaulting to 0 for new
  and existing tasks.
- Every transition into flagged increments flag_count exactly once, including repeated
  passes after requeue.
- When a task would be flagged with flag_count reaching 3, Litehive stores flag_count=3,
  changes status to deferred instead of flagged, and sets reason 'flagged 3 times
  - needs human review'.
- litehive queue requeue refuses tasks with flag_count >= 3 unless --force is supplied
  and prints a clear operator-facing warning.
- Requeue never resets flag_count; forced requeue preserves the lifetime counter for
  later trips.
- Regression coverage includes persistence, the third-flag auto-defer path, the CLI/operator
  force gate, and the existing relevant tests remain green.
constraints: []
plan:
- Verify whether the behavior already exists in the runtime, status, persistence,
  and CLI layers; close as duplicate if the stated acceptance criteria are already
  satisfied.
- If any delta remains, implement the smallest change set in TaskRecord persistence,
  flagged-status transitions, and requeue gating.
- Add or update focused tests for persistence, third-flag auto-defer, and forced requeue
  semantics, then run the relevant test slices required by the change.
