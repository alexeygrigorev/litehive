slug: auto-defer-tasks-after-3-flags-instead-of
title: Auto-defer tasks after 3 flags instead of allowing infinite requeue loops
created_at: '2026-04-09T07:50:34+00:00'
task_type: null
mode: implementation
pipeline_mode: full
priority: high
pm_complexity: simple
planned_effort: s
depends_on: []
goal: "Tasks that repeatedly flag (implement\u2192reject\u2192flag\u2192requeue\u2192\
  repeat) waste tokens indefinitely. Add a lifetime flag_count to track how many times\
  \ a task has been flagged. After 3 flags, auto-defer instead of flagging. Block\
  \ litehive requeue without --force after 3+ flags."
acceptance_criteria:
- TaskRecord has a flag_count field (int, default 0) persisted in task.yaml
- flag_count increments every time a task transitions to flagged status
- After flag_count reaches 3, task is set to deferred instead of flagged with reason
  'flagged 3 times - needs human review'
- litehive requeue warns and requires --force when flag_count >= 3
- flag_count is NOT reset by requeue (it is a lifetime counter)
- All existing tests pass
