goal: Expose engine health, freeze state, usage data, and per-task engine switching
  in the browser using the same observability and mutation paths that power the CLI.
acceptance_criteria:
- Engine endpoints expose default engine, freeze state, engine capabilities, and engine-monitoring
  or quota data from the existing config and observability modules.
- The browser shows default engine, freeze windows, provider or usage summaries, and
  quota or health warnings in a dedicated engine section.
- Browser controls can freeze or unfreeze engine routing and switch an individual
  task to a different engine using the same backend functions as the CLI.
- Missing or corrupt engine-monitoring data is rendered as a recoverable warning rather
  than breaking the dashboard.
- Tests cover engine status serialization plus freeze and switch mutations.
