- role: qa
  step: testing
  verdict: reject
  message: "REJECT\n\nEXPECTED behavior:\n`repair` should fix queue inconsistencies\
    \ as part of the single workspace repair flow. At minimum, queued/interrupted\
    \ tasks missing from `state.queue` should be restored, and invalid or duplicate\
    \ queue entries should be removed/deduplicated. The command help text promises:\
    \ \"Repair stale active tasks, interrupted runs, and queue inconsistencies\".\n\
    \nOBSERVED behavior:\n`litehive.cli.workspace.repair_command()` only delegates\
    \ to `repair_workspace_state()`, and that implementation currently performs stale-runner\
    \ recovery plus legacy comment migration. It does not repair queue inconsistencies.\
    \ In QA reproductions, `repair` returned success with `repaired: no` while leaving\
    \ the queue corrupted unchanged.\n\nReproduction steps:\n1. Create a workspace\
    \ and task.\n2. Set the task status to `queued`.\n3. Save workspace state with\
    \ an inconsistent queue.\n   Case A: `state.queue = []` even though the task is\
    \ still `queued`.\n   Case B: `state.queue = [task_id, task_id, \"T-9999\"]`.\n\
    4. Run `litehive.cli.workspace.repair_command(workspace)`.\n5. Reload workspace\
    \ state.\n\nObserved results from QA:\n- Case A remained `[]` after repair; the\
    \ queued task was not restored.\n- Case B remained `[task_id, task_id, \"T-9999\"\
    ]` after repair; duplicates/nonexistent entries were not cleaned up.\n- The command\
    \ output reported:\n  - `repaired: no`\n  - `removed_queue_entries: -`\n  - `deduped_queue_entries:\
    \ -`\n  - `restored_queue_entries: -`\n\nWhich task requirements are not met:\n\
    - Goal not met: add a single repair command for stale active tasks, interrupted\
    \ runs, and queue inconsistencies.\n- The current implementation covers stale\
    \ active/interrupted run recovery, but queue inconsistency repair is not implemented\
    \ in the repair path.\n\nAdditional validation:\n- Focused existing tests passed:\
    \ `pytest -q tests/test_recovery_runtime.py tests/test_task_comments.py tests/test_status_broken_states.py`\n\
    - Those tests validate stale-runner recovery/status diagnostics/comment migration,\
    \ but they do not cover queue inconsistency repair.\n"
