goal: "After merging a task worktree into main, run after_merge hooks (e.g. test suite)\
  \ on main to verify the merge didn't break anything. If hooks fail, send the task\
  \ back to the SWE agent (implementing stage) to fix the issues \u2014 do NOT revert\
  \ the merge."
acceptance_criteria:
- When runner_hooks.after_merge is configured with a blocking command and that command
  fails after commit_to_git integrates the task, the task is requeued at implementing
  instead of done so SWE fixes the already-merged main state.
- A post-merge verification failure does not revert, reset, or abort the successful
  merge; the merged commit remains on main and is the state the next implementation
  pass sees.
- runner_hooks.after_merge is accepted by config normalization and CLI hook parsing,
  and the hook runs from the main checkout after merge during commit_to_git.
- When no after_merge hook is configured, commit_to_git remains backward compatible
  and completes without running an extra verification step.
- Regression coverage proves the success path, the failing-hook requeue path, and
  the no-hook compatibility path.
constraints:
- Keep changes scoped to commit_to_git post-merge verification and related hook/routing
  surfaces.
- Do not revert a successful merge when post-merge verification fails.
plan:
- Add after_merge as a supported runner hook point in config validation, CLI parsing/help
  text, and any operator-facing status/docs surfaces that enumerate hook points.
- Extend commit_to_git to execute blocking after_merge hooks on the main checkout
  only after the merge succeeds and before the task is finalized as done.
- On after_merge hook failure, preserve the merged state, record hook artifacts/report
  evidence, and route the task back to implementing rather than merge_failed or done.
- Add targeted tests for after_merge success, failure-routing-without-revert, and
  no-hook backward compatibility.
