summary: 'Verified the existing implementation for post-merge verification in commit_to_git.
  Confirmed litehive/config/constants.py accepts runner_hooks.after_merge, litehive/cli/parser.py
  exposes after_merge in configure help, litehive/runtime/_hooks.py maps commit_to_git
  post-merge success to the after_merge hook point, litehive/runtime/_commit.py runs
  blocking after_merge hooks on the main checkout after a successful merge and, on
  hook failure, preserves the merged main state, records retry_decision=retry, and
  requeues the task at queued/implementing instead of reverting. Also confirmed litehive/runner/core.py
  honors commit_to_git retry_decision=retry by finishing the run queued so SWE can
  continue from the merged state. Focused verification run: uv run pytest -q tests/test_retry_commit_and_recovery.py::test_commit_to_git_runs_after_merge_hook_on_main_and_finishes
