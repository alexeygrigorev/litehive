summary: 'Verified post-merge commit_to_git behavior for runner_hooks.after_merge
  with focused regression tests. Evidence: tests/test_retry_commit_and_recovery.py::test_commit_to_git_runs_after_merge_hook_on_main_and_finishes
  confirms the blocking after_merge hook executes on the main checkout after merge
  and task finishes done when the hook passes; tests/test_retry_commit_and_recovery.py::test_commit_to_git_requeues_implementing_when_after_merge_hook_fails
  confirms a failing blocking after_merge hook preserves the merged main commit, removes
  the task worktree, leaves merged file content on main, and requeues the task at
  queued/implementing with retry handoff instead of reverting; tests/test_retry_commit_and_recovery.py::test_commit_to_git_skips_after_merge_when_hook_not_configured
  confirms backward-compatible skip behavior; tests/test_config_and_run_cli.py::test_configure_persists_runner_hooks
  confirms after_merge is accepted and persisted in runner_hooks config; tests/test_runner_workflow.py::test_runner_requeues_commit_to_git_retry_request_back_to_implementing
  confirms the runner honors commit_to_git retry_decision=retry by finishing queued
  and preserving implementing as the next stage. Command run: uv run pytest -q tests/test_retry_commit_and_recovery.py::test_commit_to_git_runs_after_merge_hook_on_main_and_finishes
