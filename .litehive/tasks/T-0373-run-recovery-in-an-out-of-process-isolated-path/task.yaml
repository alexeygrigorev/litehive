id: T-0373
slug: run-recovery-in-an-out-of-process-isolated-path
title: Spawn a recovery agent when SubagentManager can't start an engine
created_at: '2026-04-15T07:59:57+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: 'Right now when SubagentManager.run() raises before ever spawning codex (e.g.
  AttributeError from a clobbered heru stub, missing binary, broken config), the pipeline
  emits Crash -> recovering -> the recovery agent uses the same SubagentManager path
  -> same exception -> recovery_crashed -> loop. The recovery agent never gets to
  read stderr, diagnose, or repair. Catch that specific failure shape at the SubagentManager
  boundary and spawn a recovery agent directly: hand it the failing exception text
  and tell it litehive cannot start its own subagents, then let it do what recovery
  agents do. No prescribed checks, no prescribed repair action, no pure-Python health
  checks - just make sure the agent actually gets a real codex turn so it has a chance
  to diagnose and fix the problem.'
acceptance_criteria:
- When SubagentManager.run raises before the engine subprocess starts, a recovery
  agent is spawned with the failing exception text in its prompt and gets a real codex
  turn.
