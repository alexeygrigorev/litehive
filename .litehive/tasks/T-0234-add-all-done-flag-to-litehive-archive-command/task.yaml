goal: litehive archive without args currently tries to archive all done tasks but
  fails on missing references. Add explicit --all-done flag for bulk archival that
  skips missing/broken tasks gracefully. Without --all-done or a task_id, show usage
  help.
acceptance_criteria:
- litehive archive --all-done archives all done tasks, skipping any missing references
- litehive archive T-XXXX archives a single task (existing behavior)
- litehive archive with no args shows help instead of bulk archiving
- Missing task references during bulk archive are logged and skipped, not fatal
