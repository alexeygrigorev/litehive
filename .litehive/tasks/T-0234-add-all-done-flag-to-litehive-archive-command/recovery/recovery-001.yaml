summary: "Diagnosed the prior accepting block as a Litehive infrastructure issue,\
  \ not an archive-task regression. The blocking hook in .litehive/config.yaml was\
  \ grepping the entire litehive/tests tree, so T-0234 was blocked by an unrelated\
  \ baseline suppression in tests/test_web_daemon_monitor.py (from tests.workspace_helpers\
  \ import *  # noqa: F401,F403) that the archive task did not introduce. Fixed Litehive\
  \ by making runner hooks task-aware in litehive/runtime/_hooks.py: hooks now receive\
  \ LITEHIVE_TASK_ID, LITEHIVE_TASK_STEP, LITEHIVE_HOOK_POINT, LITEHIVE_WORKSPACE_ROOT,\
  \ LITEHIVE_EXECUTION_ROOT, and LITEHIVE_CHANGED_PATHS derived from changed litehive/tests\
  \ files in the current execution root. Updated the before_pm_acceptance grep hook\
  \ in .litehive/config.yaml to inspect only LITEHIVE_CHANGED_PATHS, so unrelated\
  \ repository-wide baseline violations no longer block acceptance retries for untouched\
  \ tasks. Added focused coverage in tests/test_task_commands_and_daemon.py for hook\
  \ env propagation and changed-path scoping. Verification was limited to recovery-scope\
  \ checks only: uv run pytest tests/test_task_commands_and_daemon.py -k 'pre_acceptance_hook\
  \ or changed_hook_paths or runner_hook' -> 7 passed, 97 deselected in 2.86s. Also\
  \ directly executed the updated grep hook command and confirmed it exits 0 for empty/unrelated\
  \ changed-path scopes and exits 1 only when LITEHIVE_CHANGED_PATHS targets tests/test_web_daemon_monitor.py.\
  \ Accepting should now be retried with the repaired hook scoping; I did not rerun\
  \ the task\u2019s normal acceptance loop or submit the prior agent\u2019s verdict."
