summary: 'Acceptance pass. Verified the archive CLI change against the task criteria
  by inspecting the implementation in litehive/cli/parser.py, litehive/cli/queue.py,
  and litehive/tasks/archive.py, plus the focused coverage in tests/test_archive.py.
  Confirmed parser now requires explicit --all-done for bulk archive, preserves positional
  task_id single-task archive, and prints archive subcommand help with exit code 2
  when invoked without task_id or --all-done. Confirmed bulk archive now passes an
  on_skip callback that logs archive skipped: <task_id> (<reason>) and continues on
  ValueError/FileNotFoundError instead of failing the whole command. Verification
  run: uv run pytest tests/test_archive.py -q -> 21 passed in 1.34s. I also ran a
  direct CLI check: uv run litehive archive --workspace <tmpdir>, which printed usage
  for litehive archive including --all-done and exited with code 2. Test coverage
  explicitly exercises single-task archive, explicit --all-done bulk archive, no-arg
  help behavior, and logged skip handling for broken bulk references. Acceptance criteria
  are met.'
