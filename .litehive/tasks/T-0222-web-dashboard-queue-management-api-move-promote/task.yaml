goal: 'Add POST endpoints to the web dashboard for queue management: move a task to
  a specific position, promote a task to front, and prioritize multiple tasks. Add
  drag-and-drop or button-based queue reordering in the frontend.'
acceptance_criteria:
- POST /api/queue/move endpoint moves a task to a specified position in the queue
- POST /api/queue/promote endpoint moves a task to the front of the queue
- POST /api/queue/prioritize endpoint reorders multiple tasks to the front
- Frontend queue panel shows reorder controls (move up/down buttons or drag-and-drop)
- Queue changes are reflected immediately in the UI after mutation
