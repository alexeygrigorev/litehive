summary: 'Reviewed the queue-management dashboard changes against the task acceptance
  criteria and confirmed they are met. Verified in litehive/web/server.py that POST
  /api/queue/move requires task_id plus integer position, calls move_queued_task,
  and returns {ok, queue, snapshot}; POST /api/queue/promote accepts task_id, preserves
  resumable-task semantics by routing flagged/interrupted/parked-style tasks through
  resume_task(front=True), otherwise promotes queued tasks via move_queued_task(...,
  1); POST /api/queue/prioritize validates a non-empty ordered task_ids list and returns
  updated queue plus snapshot while surfacing queue-helper validation errors as 4xx
  JSON responses. Verified in litehive/web/templates/index.html that the queue panel
  exposes discoverable reorder controls with Promote, Move Up, and Move Down buttons,
  and that successful queue mutations immediately replace state.snapshot with response.snapshot
  and re-render so the UI updates without a manual reload. Independently reran the
  focused verification with uv run pytest tests/test_web_snapshot_lockfree.py -q and
  it passed: 26 passed in 6.04s. The passing evidence includes test_queue_move_endpoint_moves_task_and_returns_updated_snapshot,
  test_queue_promote_endpoint_resumes_flagged_task_to_front, test_queue_prioritize_endpoint_reorders_tasks_and_rejects_duplicates,
  and test_render_index_includes_queue_controls_and_refresh_wiring. Acceptance criteria
  satisfied; ready for commit_to_git.'
