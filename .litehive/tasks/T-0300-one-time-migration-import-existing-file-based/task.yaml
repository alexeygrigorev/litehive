  Idempotent: running again does nothing if already migrated.'
acceptance_criteria:
- litehive db migrate-workspace scans .litehive/ and populates data.db from existing
  files
- "For each task: task.yaml intent \u2192 task_intent, task state fields \u2192 task_state,\
  \ thread.yaml \u2192 comments table + rename file, journal.md \u2192 task_journal,\
  \ reports/ \u2192 stage_reports, artifacts/ \u2192 hook_artifacts, runtime.yaml\
  \ \u2192 task_state runtime fields, events.jsonl \u2192 events"
- "state.yaml \u2192 pool_state + queue, engine-monitoring.yaml \u2192 engine_monitoring,\
  \ archive/INDEX.csv \u2192 task_intent (status=done)"
- 'After successful migration, obsolete files are git rm''d in a single commit with
  message ''chore: migrate workspace to SQLite'''
- 'Idempotent: second run does nothing, detects existing schema version'
- Pre-migration backup created automatically in case something goes wrong
