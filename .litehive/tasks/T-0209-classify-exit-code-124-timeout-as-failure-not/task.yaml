goal: When a subagent process exits with code 124 (killed by timeout), litehive classifies
  it as completed. It should be classified as failed/interrupted. This causes the
  text verdict fallback to generate a fake pass verdict from partial transcript.
acceptance_criteria:
- Exit code 124 is classified as failed, not completed
- Any non-zero exit code is not classified as completed
- Timeout-killed agents do not produce pass verdicts
