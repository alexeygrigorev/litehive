  message: "Shaped T-0210 around one outcome source: only `litehive agent report`\
    \ may create a stage verdict or task update. Current code still allows transcript-derived\
    \ outcomes via `parse_stage_report_text()` / `STAGE_RESULT`, and `litehive/agents/manager.py`\
    \ still falls back there when no CLI report is found. Scope kept in one bugfix\
    \ because nudge behavior, timeout classification, and parser removal are the same\
    \ verdict-integrity concern.\n\nTASK_UPDATE:\ngoal: Make `litehive agent report`\
    \ the only authoritative stage verdict submission path. Remove transcript-derived\
    \ verdict/task-update parsing, continue the same session once with an explicit\
    \ nudge when an agent exits cleanly without reporting, and treat missing reports\
    \ after the nudge plus all non-zero exits (including exit code 124 timeout) as\
    \ failed outcomes that can never produce pass.\nacceptance_criteria:\n  - Stage\
    \ verdicts and task updates are sourced only from CLI-submitted `litehive agent\
    \ report` entries persisted on the task thread; transcript content, including\
    \ `STAGE_RESULT:` JSON and `VERDICT:` text, cannot create or override a verdict.\n\
    \  - When an agent turn exits with code 0 and no CLI report was submitted for\
    \ that step, the pipeline continues the same session once with a nudge prompt\
    \ telling the agent to run `litehive agent report --verdict <pass|reject|blocked>`.\n\
    \  - If the nudged continuation still ends without a CLI report, the stage outcome\
    \ is failure/reject with a warning that the agent did not submit a verdict via\
    \ the CLI.\n  - Any non-zero exit code, including exit code 124, is recorded as\
    \ failed for verdict purposes and can never yield a pass verdict even if the transcript\
    \ contains `pass`, `fail`, or `STAGE_RESULT` content.\n  - `_parse_verdict`, `_extract_line`,\
    \ `_extract_int`, `_extract_list`, `_extract_section_block`, and any remaining\
    \ transcript-verdict fallback code are removed from the codebase and exports.\n\
    \  - `parse_stage_report_text` no longer derives verdicts from transcript text;\
    \ if it remains, it is reduced to non-authoritative warning/feedback handling\
    \ only, or replaced entirely by the CLI-thread report loader.\n  - Tests cover:\
    \ successful CLI-reported pass, clean exit without report causing a single nudge,\
    \ missing report after nudge causing reject/fail, timeout exit code 124 causing\
    \ failed status, and misleading transcript verdict text being ignored.\nconstraints:\n\
    \  - Keep changes scoped to verdict submission and classification; do not broaden\
    \ into unrelated state-machine or prompt cleanup beyond the nudge copy needed\
    \ to instruct `litehive agent report`.\n  - Treat T-0197, T-0200, and T-0209 as\
    \ subsumed by this task; do not duplicate implementation work across separate\
    \ tasks.\nplan:\n  - Trace the authoritative report path from `litehive.tasks.reports`\
    \ / `litehive.agents.parsing.stage_report_from_subagent` through `litehive/agents/manager.py`,\
    \ and remove the fallback that converts transcript content into verdicts or task\
    \ updates.\n  - Move missing-report handling into the agent execution lifecycle\
    \ so a clean exit without CLI submission triggers `NudgeRequired`, resumes the\
    \ same session once, and only then resolves to failure when no report appears.\n\
    \  - Tighten exit classification so non-zero exits, especially `124`, remain failed\
    \ and cannot preserve or synthesize a pass outcome from transcript content.\n\
    \  - Delete dead transcript parsing helpers and compatibility exports, then rewrite\
    \ affected tests to assert CLI-only verdict sourcing and the new nudge/failure\
    \ behavior.\npm_complexity: moderate\nplanned_effort: m\npriority: critical\n"
