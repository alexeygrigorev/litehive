  message: "GROOMING PASS \u2014 task is well-scoped and ready for implementation.\n\
    \n## Scope\nRemove all text-based verdict parsing so that only `litehive report`\
    \ CLI produces verdicts. Extend the nudge mechanism to all engines (not just Claude).\
    \ Default to fail when no CLI verdict is submitted. Subsumes T-0197, T-0200, T-0209\
    \ (all already marked duplicate).\n\n## Key findings from codebase analysis\n\n\
    1. **Text parsing to remove** (engines/base.py):\n   - `_parse_verdict()` (lines\
    \ 726-737): text fallback that defaults completed\u2192pass\n   - `_extract_line()`\
    \ (lines 576-578), `_extract_int()` (lines 581-588), `_extract_list()` (lines\
    \ 591-602), `_extract_section_block()` (lines 670-687)\n   - Text fallback path\
    \ in `parse_stage_report_text()` (lines 536-572): the branch that fires when no\
    \ structured STAGE_RESULT JSON is found\n\n2. **Fallback chain in subagents/_parsing.py**\
    \ (`stage_report_from_subagent`, lines 12-66):\n   - Step 1: thread comments from\
    \ `litehive report` CLI \u2192 KEEP\n   - Step 2: resource limit events \u2192\
    \ KEEP\n   - Step 3: engine-specific parsing \u2192 SIMPLIFY (remove text fallback)\n\
    \   - Step 4: text-based `parse_stage_report_text()` fallback \u2192 REMOVE\n\n\
    3. **Nudge logic** (runtime/_execution.py, lines 970-1003): currently Claude-only.\
    \ Should generalize to any engine with session continuation support.\n\n4. **Exit\
    \ code 124**: timeout sets exit_code=124 and status=\"failed\" correctly in _execution.py:311,\
    \ but `_parse_verdict` can override this to \"pass\" via text fallback \u2014\
    \ removing text parsing fixes this automatically.\n\n## Plan\n\n### Step 1: Remove\
    \ text-parsing helpers from engines/base.py\n- Delete `_extract_line`, `_extract_int`,\
    \ `_extract_list`, `_extract_section_block`, `_parse_verdict`\n- Simplify `parse_stage_report_text()`:\
    \ only accept structured STAGE_RESULT JSON submissions; if missing/invalid, return\
    \ a fail verdict (not text-parsed verdict)\n- Keep `_extract_stage_result_submission()`\
    \ for structured JSON parsing\n\n### Step 2: Simplify subagents/_parsing.py fallback\
    \ chain\n- Remove step 4 (text-based fallback to `parse_stage_report_text`)\n\
    - When no CLI verdict and no resource limit event and no engine-specific report:\
    \ return fail verdict with message \"agent did not submit verdict via litehive\
    \ report\"\n\n### Step 3: Generalize nudge mechanism (runtime/_execution.py)\n\
    - Remove Claude-only guard: trigger nudge for any engine that has session continuation\n\
    - After nudge, re-check thread for CLI verdict\n- If still missing after nudge:\
    \ verdict is fail (not pass, not blocked)\n\n### Step 4: Ensure exit code 124\
    \ \u2192 fail\n- Verify that with text parsing removed, timeout (exit_code=124)\
    \ can never produce a pass verdict\n- The status is already set to \"failed\"\
    \ at _execution.py:311; removing `_parse_verdict` fallback eliminates the path\
    \ where \"completed\" status could produce \"pass\"\n\n### Step 5: Update tests\n\
    - Update test_stage_result_submission.py: remove tests for text-fallback behavior,\
    \ add tests asserting text-only transcripts produce fail\n- Update test_feedback_cap.py:\
    \ adjust for structured-only path\n- Update test_runner_workflow.py: adjust parsing\
    \ tests\n- Add test: exit code 124 never produces pass verdict\n- Add test: agent\
    \ completing without CLI report gets nudge, then fail if still missing\n\n## Acceptance\
    \ criteria verification plan\n- AC1 (only CLI produces verdict): grep for _parse_verdict,\
    \ _extract_line \u2014 must be gone\n- AC2 (nudge on missing): test that session\
    \ continuation triggers nudge prompt\n- AC3 (fail after nudge): test that missing\
    \ verdict after nudge \u2192 fail\n- AC4 (helpers removed): grep confirms removal\n\
    - AC5 (no text fallback): parse_stage_report_text with text-only input \u2192\
    \ fail\n- AC6 (exit 124 \u2192 failed): test timeout scenario produces fail verdict\n\
    - AC7 (non-zero exit \u2192 no pass): test non-zero exit code never maps to pass\n\
    \n## PM Sizing\nPM_COMPLEXITY: moderate\nPLANNED_EFFORT: m\n\nTASK_UPDATE:\nplan:\n\
    \  - \"Remove _parse_verdict, _extract_line, _extract_int, _extract_list, _extract_section_block\
    \ from engines/base.py\"\n  - \"Simplify parse_stage_report_text to only accept\
    \ structured STAGE_RESULT JSON; return fail verdict otherwise\"\n  - \"Remove\
    \ text-based fallback (step 4) from stage_report_from_subagent in subagents/_parsing.py\"\
    \n  - \"Generalize nudge mechanism in runtime/_execution.py to all engines with\
    \ session continuation (not just Claude)\"\n  - \"After nudge, if still no CLI\
    \ verdict, return fail verdict\"\n  - \"Verify exit code 124 (timeout) can never\
    \ produce pass verdict with text parsing removed\"\n  - \"Update tests: remove\
    \ text-fallback tests, add tests for fail-on-missing-verdict, nudge flow, timeout\u2192\
    fail\"\npm_complexity: moderate\nplanned_effort: m"
