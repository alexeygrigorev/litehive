goal: Add a litehive daemon subcommand group that replaces scripts/run-all.sh. Supports
  run, status, stop, restart, and instances. Each iteration spawns a fresh subprocess
  so code changes are picked up automatically. Daemon PID and workspace are registered
  globally so instances can list all running daemons across projects.
acceptance_criteria:
- litehive daemon run --workspace <root> starts a background daemon for that workspace,
  refuses a second live daemon for the same workspace, and records the live daemon
  in the global registry at ~/.config/litehive/daemons.yaml rather than under .litehive/.
- 'The daemon loop preserves current run-all semantics: it repairs first, runs one
  fresh litehive run subprocess per iteration so new code is picked up automatically,
  writes timestamped iteration logs under .litehive/logs/run-all/, continues after
  task_requeued, and stops on queue exhaustion, blocked-tasks-only, or explicit pool
  stop reasons.'
- litehive daemon status --workspace <root>, stop, and restart operate on the workspace
  daemon lifecycle and report useful state using the registered PID plus workspace-local
  logs/status.
- litehive daemon instances lists running daemons across workspaces from the global
  registry and prunes or ignores stale entries whose PIDs are no longer alive.
- Operator-facing docs, tests, and install flow are updated so the supported workflow
  uses litehive daemon subcommands instead of scripts/run-all.sh and scripts/run-all-status.sh,
  while preserving proof through real CLI execution for pool-wrapper behavior.
