goal: Replace the 1.5-second polling mechanism with Server-Sent Events (SSE) for real-time
  updates. Add an SSE endpoint that streams workspace state changes and agent output
  as they happen. Keep polling as fallback for browsers that don't support SSE.
acceptance_criteria:
- GET /api/stream SSE endpoint streams workspace snapshot diffs when state changes
- Agent transcript/stdout/stderr updates are pushed to the frontend in real-time via
  SSE
- Frontend switches from polling to SSE when available, with polling as fallback
- SSE connection handles reconnection gracefully on network interruptions
- Reduced server load compared to 1.5s polling when workspace is idle
