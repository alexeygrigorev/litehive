  verdict: pass
  message: "## Grooming complete for T-0104\n\n### What I verified\nExplored the codebase\
    \ to assess the current implementation state. The core schema-validated stage\
    \ result submission API is substantially implemented:\n- `StageResultSubmission`\
    \ Pydantic model (extra=forbid) in `litehive/models.py` lines 270-287\n- `_extract_stage_result_submission()`\
    \ + `_format_stage_result_validation_errors()` in `litehive/engines/base.py`\n\
    - `parse_stage_report_text()` prefers structured STAGE_RESULT over text fallback\n\
    - Agent prompts in `litehive/subagents/_prompts.py` instruct agents to emit STAGE_RESULT\
    \ JSON\n\n### Gap identified\nTop-level `acceptance_criteria` in `StageResultSubmission`\
    \ is accepted by the schema but silently dropped when building the StageReport.\
    \ The prompt example shows `\"acceptance_criteria\":[]` at the top level of STAGE_RESULT,\
    \ but this value is never forwarded to task updates. To update task acceptance\
    \ criteria via the structured path, agents must use `task_update.acceptance_criteria`\
    \ \u2014 but the prompt does not show this. The fix: when `submission.acceptance_criteria`\
    \ is non-empty and `task_update` does not already set `acceptance_criteria`, merge\
    \ it into the task_update dict before constructing the StageReport.\n\n### Test\
    \ coverage gap\nNo dedicated unit tests exist for the structured STAGE_RESULT\
    \ path: valid all-fields parsing, extra-field rejection, missing required field,\
    \ validation warning format, task_update forwarding. Only indirect coverage in\
    \ test_feedback_cap.py and test_engine_variants_and_timeline.py.\n\n### Task update\n\
    Goal: Add a Pydantic-validated JSON submission format (STAGE_RESULT:) that agents\
    \ use to report stage outcomes. Extra fields are rejected, validation errors surface\
    \ as warnings and trigger text fallback, and all declared fields (verdict, summary,\
    \ files_changed, tests, warnings, follow_up_tasks, task_update, acceptance_criteria)\
    \ are correctly routed into the downstream pipeline.\n\nAcceptance criteria:\n\
    1. A valid STAGE_RESULT: JSON block is parsed via the structured path (not text\
    \ fallback), producing a StageReport with correct verdict, summary, files_changed,\
    \ tests, and warnings.\n2. A STAGE_RESULT: block with an extra (unknown) field\
    \ is rejected, its validation error is appended as a warning, and parsing falls\
    \ back to the text format.\n3. A STAGE_RESULT: block missing the required verdict\
    \ field produces a human-readable validation warning, and parsing falls back to\
    \ the text format.\n4. acceptance_criteria provided at the top level of STAGE_RESULT\
    \ are applied to the task record (same outcome as providing them via task_update.acceptance_criteria).\n\
    5. task_update fields inside STAGE_RESULT (e.g. goal, acceptance_criteria, pm_complexity)\
    \ are applied to the task record after grooming.\n6. Dedicated unit tests cover:\
    \ valid structured submission, extra-field rejection, missing-field rejection,\
    \ validation warning format, and acceptance_criteria forwarding. All existing\
    \ tests pass.\n\nPlan:\n1. In parse_stage_report_text (engines/base.py): when\
    \ submission.acceptance_criteria is non-empty and task_update dict does not already\
    \ set acceptance_criteria, merge it in before constructing StageReport.\n2. Add\
    \ dedicated tests in tests/test_runner_workflow.py or a new tests/test_stage_result_submission.py\
    \ covering the six acceptance criteria above.\n3. Optionally: update the prompt\
    \ example to show acceptance_criteria inside task_update to guide agents toward\
    \ the correct pattern.\n\nPM_COMPLEXITY: simple\nPLANNED_EFFORT: s"
