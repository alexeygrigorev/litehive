goal: Add a CLI command (e.g. litehive engine status or litehive engine status codex)
  that shows current usage stats, quota status, and whether the engine is available.
  Should work for all engines that have monitoring data and for codex show proactive
  quota check results.
acceptance_criteria:
- litehive engine status shows a summary for all engines (invocations, successes,
  failures, limits, last used)
- litehive engine status codex shows codex-specific quota (used percent, limit_reached,
  reset time) from the proactive quota API
- Works without arguments (all engines) and with a specific engine name
