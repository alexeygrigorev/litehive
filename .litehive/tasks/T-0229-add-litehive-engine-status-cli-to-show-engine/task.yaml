goal: Add an operator-facing litehive engine status CLI that reports per-engine monitoring
  data and Codex proactive quota state so users can see availability and recent usage
  without opening raw YAML.
acceptance_criteria:
- Running litehive engine status --workspace . exits successfully and prints one summary
  entry per engine present in .litehive/engine-monitoring.yaml, including invocation
  count, success count, failure count, limit-event count, availability/status, and
  last-used or last-observed timestamp.
- Running litehive engine status codex --workspace . exits successfully and prints
  Codex proactive quota fields derived from the quota API/cache, including used percent,
  whether quota is currently exhausted, and the next reset time when available.
- 'The command supports both forms: no engine argument for the all-engine summary
  and a specific engine name to scope output to one engine.'
- When monitoring data is absent for the requested scope, the command prints a clear
  no-data result instead of crashing.
constraints: []
plan:
- Extend the litehive engine parser so status is a supported subcommand and the engine
  name becomes optional only for that subcommand while preserving existing set/freeze/unfreeze
  behavior.
- Implement a status handler in litehive/cli/engine.py that reads workspace engine
  monitoring, formats an all-engine summary, and filters to a single engine when requested.
- For Codex status, reuse the existing proactive quota check/monitoring path so the
  CLI surfaces used percent, limit_reached, and reset metadata without duplicating
  quota logic.
- Add focused CLI and observability tests covering all-engine output, single-engine
  filtering, Codex quota details, and no-data handling.
- Update operator-facing docs for the new command and expected output fields.
