summary: 'Verified the web dashboard task-mutation surface end to end with focused
  HTTP tests and code inspection. Ran: uv run pytest -q tests/test_web_task_actions.py
  -> 2 passed in 1.67s. Evidence from the passing tests: POST /api/tasks creates a
  task from title plus optional goal/priority/engine/acceptance_criteria and returns
  JSON with ok=true and task_id; POST /api/tasks/{id}/update updates goal/priority/engine/acceptance_criteria/constraints/plan_steps;
  POST /api/tasks/{id}/close records a deferred outcome and reason; POST /api/tasks/{id}/requeue
  accepts front=true and returns queue_position; POST /api/tasks/{id}/abandon cancels
  the task; POST /api/tasks/active/stop parks the active task and clears active_task_id.
  Error handling is also covered: missing title, unsupported close outcome, and invalid
  task id all return structured JSON errors instead of HTML. Code inspection confirmed
  litehive/web/actions.py routes these endpoints through the same litehive.tasks helpers
  used by the CLI (create_task, update_task, close_task, requeue_task, abandon_task,
  stop_current_task), litehive/web/server.py wraps mutation errors into JSON responses,
  and litehive/web/templates/index.html includes UI controls wired to the new endpoints.'
