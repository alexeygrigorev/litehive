summary: 'Reviewed T-0221 against the task.yaml acceptance criteria and accepted it.
  Verified the backend mutation helpers in litehive/web/actions.py call the same litehive.tasks
  functions used by the CLI: create_task, update_task, close_task, requeue_task, abandon_task,
  and stop_current_task. Verified litehive/web/server.py exposes POST /api/tasks,
  /api/tasks/{id}/update, /close, /requeue, /abandon, and /api/tasks/active/stop,
  and that mutation errors now return structured JSON with ok=false; user-correctable
  invalid task ids are mapped to HTTP 400 instead of HTML/tracebacks. Verified litehive/web/templates/index.html
  includes dashboard controls wired to create, update, close, requeue, abandon, and
  stop-active actions and refreshes snapshot state after successful submissions. Ran
  focused verification: uv run pytest -q tests/test_web_task_actions.py -> 2 passed
  in 1.69s. That test coverage confirms create with title/goal/priority/engine/acceptance_criteria,
  update of goal/priority/engine/acceptance_criteria/constraints/plan_steps, close
  with deferred outcome and reason, requeue with front=true and queue_position, abandon,
  stop-active clearing active_task_id, and structured JSON errors for missing title,
  unsupported outcome, and invalid task id. Acceptance criteria are met.'
