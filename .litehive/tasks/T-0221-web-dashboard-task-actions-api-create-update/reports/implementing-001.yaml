summary: 'Verified the web dashboard task-mutation implementation is complete for
  create, update, close, requeue, abandon, and stop-active. Confirmed the backend
  mutation helpers in litehive/web/actions.py call the same litehive.tasks helpers
  used by the CLI (create_task, update_task, close_task, requeue_task, abandon_task,
  stop_current_task), the POST routes are wired in litehive/web/server.py, and the
  dashboard UI in litehive/web/templates/index.html posts to the new endpoints for
  create/update/close/requeue/abandon/stop-active. Re-ran focused verification with
  uv run pytest -q tests/test_web_task_actions.py and it passed: 2 passed in 1.70s.
  That test file covers success cases for POST /api/tasks, /api/tasks/{id}/update,
  /api/tasks/{id}/close, /api/tasks/{id}/requeue with front=true, /api/tasks/{id}/abandon,
  and /api/tasks/active/stop, plus structured JSON error handling for missing title,
  unsupported close outcome, and invalid task id. Current local diff in litehive/web/server.py
  ensures mutation errors return {ok:false,error:...} JSON and maps invalid task-id
  mutation requests to HTTP 400 instead of HTML/tracebacks, matching the acceptance
  criteria for structured user-correctable error responses.'
