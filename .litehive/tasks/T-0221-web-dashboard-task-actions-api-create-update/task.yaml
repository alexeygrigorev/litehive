goal: 'Add POST endpoints to the web dashboard for task mutation operations: create
  task, update task properties, close task (with outcome), requeue task, abandon task,
  and stop active task. Each endpoint should call the same underlying functions as
  the CLI commands. Include proper error handling and JSON responses.'
acceptance_criteria:
- POST /api/tasks endpoint creates a new task with title, goal, priority, engine,
  and acceptance criteria
- POST /api/tasks/{id}/update endpoint modifies task properties (goal, priority, engine,
  acceptance criteria, constraints, plan steps)
- POST /api/tasks/{id}/close endpoint closes a task with outcome (wont_do, deferred,
  duplicate) and reason
- POST /api/tasks/{id}/requeue endpoint requeues a flagged or closed task, with optional
  front parameter
- POST /api/tasks/{id}/abandon endpoint cancels and removes a task
- POST /api/tasks/active/stop endpoint stops the currently active task
- All endpoints return proper JSON responses with success/error status
- Frontend UI adds action buttons and forms for each operation
