goal: Make operator monitoring catch silent backlog damage even when the active task
  and runner still look healthy. Surface recent flagged tasks, recovery failures,
  and cycle_start_failed incidents directly from the runtime DB in status/doctor output
  so routine status checks do not miss them.
acceptance_criteria:
- A DB-backed operator status or doctor command reports tasks flagged within a configurable
  recent window (default 24h), including task id, title, timestamp, and flag reason/context.
- The same output reports recent recovery failures such as cycle_start_failed and
  litehive repair failures, grouped/countable so an operator can see a wave instead
  of one task at a time.
- When the live runner is healthy but backlog damage occurred recently, the status
  output still returns a non-clean summary that calls this out explicitly instead
  of reporting only active-task health.
- The implementation reads from the runtime DB only; it does not scrape YAML files
  or rely on transient log parsing for the core summary.
- 'Tests cover at least: healthy live queue with recent flagged tasks, recent repair-failure
  wave, and fully clean state.'
