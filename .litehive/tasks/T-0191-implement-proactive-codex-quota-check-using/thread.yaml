- role: swe
  step: implementing
  verdict: pass
  message: 'Implemented proactive codex quota checking via chatgpt.com API.


    ## Files Changed

    - litehive/engines/_codex_quota.py (NEW): Core quota check module with bearer
    token reading from ~/.codex/auth.json, API call to GET chatgpt.com/backend-api/wham/usage,
    response parsing for rate_limit.limit_reached + primary_window (5h) and secondary_window
    (weekly) used_percent and reset_at, 60s TTL cache, and fail-open error handling.

    - litehive/runtime/_execution.py: Added proactive codex quota check before each
    codex invocation in the engine selection loop (line ~702). When limit_reached=true,
    codex is skipped and fallback engine is used via the existing engine switch path.
    Also records quota status to engine monitoring.

    - litehive/cli/_dry_run.py: Added same proactive quota check in dry-run engine
    selection so quota-blocked codex is surfaced in --dry-run output.

    - litehive/observability/_engine_monitoring.py: Added record_codex_quota_check()
    that surfaces quota used_percent (as usage percent with limit=100), reset_at,
    and per-window metadata in engine-monitoring.yaml.

    - tests/test_codex_quota.py (NEW): 17 targeted tests covering token reading (success,
    missing file, bad JSON, missing field), response parsing (limit reached/not reached,
    empty response), quota check with caching (cache hit, cache expiry, no auth),
    block reason (limit reached, not reached, fail-open), and monitoring integration
    (records quota, skips error status).

    - tests/conftest.py (NEW): Autouse fixture that neutralizes real codex quota API
    calls during tests (except test_codex_quota.py which uses explicit fake fetchers).


    ## Acceptance Criteria Verification

    1. Quota checked before each codex invocation: YES - check_codex_quota() called
    in _execution.py engine loop before invocation

    2. Bearer token from ~/.codex/auth.json: YES - _read_bearer_token() reads tokens.access_token

    3. limit_reached=true skips codex: YES - codex_quota_block_reason() returns blocking
    reason, engine fallback path executes

    4. reset_at from response used: YES - parsed from API response, stored in monitoring

    5. Both primary and secondary windows checked: YES - _parse_quota_response() extracts
    both

    6. Engine monitoring shows quota: YES - record_codex_quota_check() writes used_percent,
    reset_at, per-window metadata

    7. No wasted invocations: YES - check happens BEFORE invocation, not after failure

    8. Cache with 60s TTL: YES - module-level cache with configurable TTL

    9. Claude/Copilot out of scope: YES - only codex is checked


    ## Tests

    - 17 tests added in test_codex_quota.py, all passing

    - Existing test suites pass (2 pre-existing failures unrelated to this change:
    test_configure_persists_process_profile and test_drain_task_pool_allows_future_queue_mutation_during_active_run)


    ## Design Notes

    - Fail-open: if auth.json is missing, API call fails, or response is unexpected,
    codex is NOT blocked

    - Cache is module-level with monotonic clock for TTL

    - Monitoring recording is best-effort (wrapped in try/except)'
