    - tests/test_codex_quota.py (NEW): 17 targeted tests covering token reading (success, missing file, bad JSON, missing field), response parsing (limit reached/not reached, empty response), quota check with caching (cache hit, cache expiry, no auth), block reason (limit reached, not reached, fail-open), and monitoring integration (records quota, skips error status).

    - tests/conftest.py (NEW): Autouse fixture that neutralizes real codex quota API calls during tests (except test_codex_quota.py which uses explicit fake fetchers).


