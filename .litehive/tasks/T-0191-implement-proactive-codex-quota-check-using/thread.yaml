    4. reset_at from response used: YES - parsed from API response, stored in monitoring

    5. Both primary and secondary windows checked: YES - _parse_quota_response() extracts both

    6. Engine monitoring shows quota: YES - record_codex_quota_check() writes used_percent, reset_at, per-window metadata

    7. No wasted invocations: YES - check happens BEFORE invocation, not after failure

    8. Cache with 60s TTL: YES - module-level cache with configurable TTL

    9. Claude/Copilot out of scope: YES - only codex is checked


    ## Tests

    - 17 tests added in test_codex_quota.py, all passing

    - Existing test suites pass (2 pre-existing failures unrelated to this change: test_configure_persists_process_profile and test_drain_task_pool_allows_future_queue_mutation_during_active_run)


    ## Design Notes

    - Fail-open: if auth.json is missing, API call fails, or response is unexpected, codex is NOT blocked

    - Cache is module-level with monotonic clock for TTL

    - Monitoring recording is best-effort (wrapped in try/except)'
