    ## Grooming Assessment


    ### Scope

    The task replaces the current reactive quota detection (wait for codex to fail, then classify the failure and fall back) with a proactive check before each codex invocation. This is cleanly scoped to the codex engine only, as noted in the acceptance criteria.


    ### Integration Points Identified

    1. **Auth token**: `~/.codex/auth.json` → `tokens.access_token` (structure confirmed)

    2. **Pre-invocation check**: `runtime/_execution.py:build_executor()` line ~701 already checks `budget_ledger.block_reason(engine_name)` before invocation — the proactive quota check slots in alongside this

    3. **Engine fallback**: existing fallback loop in `build_executor()` lines 697-867 handles engine switching when an engine is blocked — returning a block reason from quota check will naturally trigger fallback to the next engine

    4. **Monitoring**: `observability/_engine_monitoring.py` already tracks `reset_at`, `used_percent` fields — these can be populated from the proactive API response instead of only from post-failure parsing

    5. **Dry-run**: `cli/_dry_run.py` line ~69 also checks `block_reason()` — proactive quota should surface there too


    ### Acceptance Criteria Review

    All 9 criteria are observable and verifiable. The note about Claude/Copilot being out of scope is clear.


    ### Risk

    The chatgpt.com API is undocumented. Implementation must fail-open: if the quota check itself fails (network, auth, unexpected schema), codex should still be attempted rather than blocked.


    ### PM Sizing

    - **Complexity**: moderate — clear integration points but involves external API, caching, and graceful degradation

    - **Effort**: M — new module + integration into two existing paths + tests + monitoring update'
