summary: 'Implemented cross-workspace virtualenv sanitization in heru/base.py via
  a shared build_invocation_env helper. ExternalCLIAdapter.build_invocation now routes
  through that helper, which removes inherited Python env markers (VIRTUAL_ENV, CONDA_PREFIX,
  CONDA_DEFAULT_ENV, __PYVENV_LAUNCHER__) only when invocation cwd is outside LITEHIVE_WORKSPACE_ROOT;
  same-workspace invocations keep the inherited env. Updated heru/adapters/claude.py
  to reuse the same helper so Claude gets the same cross-workspace stripping without
  dropping CLAUDE_* passthrough. Updated litehive/agents/_manager.py to pass LITEHIVE_WORKSPACE_ROOT
  alongside LITEHIVE_TASK_ID in extra_env so daemon/manager-launched subprocesses
  can distinguish caller workspace from target cwd. Added focused regression coverage:
  tests/test_engine_variants_and_timeline.py::test_engine_invocation_strips_inherited_virtual_env_for_other_project,
  ::test_engine_invocation_preserves_virtual_env_within_caller_workspace, and ::test_claude_invocation_preserves_claude_credentials_while_stripping_virtual_env_for_other_project;
  plus tests/test_tasks_and_subagents.py::test_subagent_manager_passes_workspace_root_in_extra_env
  to lock the integration point. Verification run: uv run pytest -q tests/test_engine_variants_and_timeline.py
  -k ''virtual_env or claude_invocation_preserves or codex_build_invocation_uses_exec_for_resume_with_session_context
  or claude_build_invocation'' -> 7 passed; uv run pytest -q tests/test_tasks_and_subagents.py
  -k ''workspace_root_in_extra_env'' -> 1 passed; uv run ruff check --select E402,F401
  litehive tests -> passed; forbidden noqa F401/F403 grep gate -> passed. Acceptance
  evidence: shared base adapter path now owns the sanitization, non-Claude adapters
  inherit it by default, same-workspace preservation is tested, and Claude credential
  passthrough remains intact while VIRTUAL_ENV is stripped for other-project execution.'
