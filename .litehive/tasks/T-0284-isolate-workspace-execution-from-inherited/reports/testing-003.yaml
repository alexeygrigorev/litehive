summary: 'Verified the cross-workspace env sanitization in the shared adapter path.
  I inspected heru/base.py and confirmed ExternalCLIAdapter.build_invocation now delegates
  env construction to build_invocation_env, which removes inherited Python virtualenv
  markers (VIRTUAL_ENV, CONDA_PREFIX, CONDA_DEFAULT_ENV, __PYVENV_LAUNCHER__) only
  when the invocation cwd is outside LITEHIVE_WORKSPACE_ROOT, then preserves extra_env
  values. I inspected heru/adapters/claude.py and confirmed Claude reuses the same
  helper, so CLAUDE_* passthrough remains intact while inherited virtualenv state
  is stripped for cross-workspace runs. I inspected litehive/agents/_manager.py and
  confirmed the manager now passes LITEHIVE_WORKSPACE_ROOT in extra_env, which is
  the integration point needed for daemon-on-project-A / subprocess-on-project-B behavior.
  Verification run: uv run pytest -q tests/test_engine_variants_and_timeline.py -k
  ''virtual_env or claude_invocation_preserves or codex_build_invocation_uses_exec_for_resume_with_session_context
  or claude_build_invocation'' -> 7 passed; uv run pytest -q tests/test_tasks_and_subagents.py
  -k ''workspace_root_in_extra_env'' -> 1 passed; uv run pytest -q -> 976 passed.
  Acceptance criteria evidence: heru/base.py owns the stripping logic, non-Claude
  adapters inherit it through ExternalCLIAdapter.build_invocation, Claude keeps credential
  passthrough while stripping VIRTUAL_ENV for other-project execution, and test_engine_invocation_strips_inherited_virtual_env_for_other_project
  passes.'
