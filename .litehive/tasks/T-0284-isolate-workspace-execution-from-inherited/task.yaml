goal: When the daemon runs on project A and an agent subprocess runs on project B,
  the inherited VIRTUAL_ENV from A should not leak into B's subprocess. Strip VIRTUAL_ENV
  (and similar vars) when the execution cwd differs from the caller's workspace. The
  fix must be in heru/base.py since litehive/agents/base.py is a re-export.
acceptance_criteria:
- When ExternalCLIAdapter.build_invocation is invoked for a cwd outside the caller
  workspace, the resulting invocation env excludes inherited Python virtualenv markers
  such as VIRTUAL_ENV.
- When the invocation cwd stays within the caller workspace, the inherited environment
  is preserved; the sanitization only applies to cross-workspace execution.
- The default ExternalCLIAdapter.build_invocation path covers the non-Claude adapters
  without per-adapter patches.
- Claude applies the same cross-workspace virtualenv stripping while preserving CLAUDE_*
  credential and config passthrough.
- A focused regression test named test_engine_invocation_strips_inherited_virtual_env_for_other_project
  passes.
constraints:
- Keep the fix in heru/base.py; litehive/agents/base.py remains a re-export shim.
- Preserve existing adapter-specific stripped_env_vars behavior and scope this task
  to inherited virtualenv leakage only.
plan:
- Add a shared environment-sanitizing helper in heru/base.py that compares the caller
  workspace with the invocation cwd and removes inherited virtualenv markers only
  for cross-workspace execution.
- Route ExternalCLIAdapter.build_invocation through that helper so codex, gemini,
  copilot, goz, and opencode inherit the behavior automatically.
- Update the Claude adapter to reuse the same helper while keeping its stdin/resume
  behavior and CLAUDE_* passthrough unchanged.
- Add focused regression coverage for cross-workspace stripping and same-workspace
  preservation, then run the narrow pytest target covering the new behavior.
