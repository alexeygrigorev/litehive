goal: When the daemon runs on project A and an agent subprocess runs on project B,
  the inherited VIRTUAL_ENV from A should not leak into B's subprocess. Strip VIRTUAL_ENV
  (and similar vars) when the execution cwd differs from the caller's workspace. The
  fix must be in heru/base.py since litehive/agents/base.py is a re-export.
acceptance_criteria:
- heru/base.py strips VIRTUAL_ENV when invocation cwd is outside the caller's workspace
- Works for all adapters by default via ExternalCLIAdapter.build_invocation
- Claude adapter still supports credential passthrough (CLAUDE_* vars not dropped)
- test_engine_invocation_strips_inherited_virtual_env_for_other_project passes
