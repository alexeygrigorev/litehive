goal: Mirror the queue-focused CLI operations in the browser so operators can inspect
  active, queued, and resumable work and change execution order without leaving the
  dashboard.
acceptance_criteria:
- The queue API exposes active, queued, and resumable task groupings equivalent to
  litehive queue output.
- Browser actions exist for move, promote, prioritize, and resume, backed by the same
  queue and status functions used by the CLI.
- Queue reorder and resume actions update the rendered browser state immediately after
  a successful mutation.
- Queue validation failures are returned as structured errors instead of generic HTTP
  500 responses.
- Tests cover queue reordering plus resumable-task flows from interrupted, parked,
  flagged, and closed states.
