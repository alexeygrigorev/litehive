goal: 'Run task execution in dedicated git worktrees so task changes stay isolated
  from the main checkout. After acceptance, Litehive should own the final git integration
  flow: create the task commit in the worktree, merge or cherry-pick it back to main
  deterministically, and then clean up the worktree.'
acceptance_criteria:
- Each runnable task can execute in its own isolated git worktree instead of the main
  checkout.
- Accepted work is committed by Litehive in the task worktree, not by the agent.
- Litehive merges, cherry-picks, or otherwise integrates the accepted task commit
  back to the main branch deterministically.
- Main checkout stays clean except for the controlled integration step and persistent
  .litehive state.
