goal: Enhance the task detail panel in the web dashboard to show all task information
  (matching litehive show output) and allow inline editing of task properties. Add
  views for task events timeline, full report history, and recovery artifacts.
acceptance_criteria:
- Selecting a task in the web dashboard shows a detail view with the durable task
  record fields from task.yaml, including goal, acceptance criteria, constraints,
  plan, dependencies, and git metadata.
- Inline editing from the task detail view can update goal, acceptance criteria, constraints,
  plan steps, priority, and engine, and saved changes persist to task.yaml and appear
  after refresh.
- The task events timeline renders entries from events.jsonl in chronological order.
- The report history view exposes the full reports/ history for the task rather than
  truncating to the most recent five entries.
- The task detail view shows recovery artifacts from recovery/ when present and shows
  an explicit empty state when none exist.
- The task detail view shows the discussion thread from thread.yaml in recorded order.
constraints: []
plan:
- Extend the web snapshot/detail payload so task detail includes the full durable
  task record plus thread, events, full report history, and recovery artifact summaries
  from existing task files.
- Add a task-detail mutation path that reuses the existing task metadata update flow
  for editable fields and returns validation-friendly responses to the UI.
- Expand the dashboard task detail panel to render the full task record, discussion,
  events, report history, and recovery sections, with an inline edit mode for supported
  fields.
- Add targeted tests for snapshot serialization and task-detail edit persistence,
  including full report history, event ordering, thread rendering, and recovery artifact
  visibility.
