goal: Enhance the task detail panel in the web dashboard to show all task information
  (matching litehive show output) and allow inline editing of task properties. Add
  views for task events timeline, full report history, and recovery artifacts.
acceptance_criteria:
- Task detail view shows all fields from task.yaml including goal, acceptance criteria,
  plan, constraints, dependencies, and git metadata
- Inline edit mode allows modifying goal, acceptance criteria, constraints, plan steps,
  priority, and engine
- Task events timeline shows entries from events.jsonl in chronological order
- Full report history view shows all stage reports, not just the last 5
- Recovery artifacts section shows recovery reports when present
- Thread/discussion view shows the task discussion thread from thread.yaml
