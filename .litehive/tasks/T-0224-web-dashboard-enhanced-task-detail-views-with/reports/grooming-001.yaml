summary: 'Recovered grooming after confirming the prior planner wrote its verdict
  only to the task-worktree-local .litehive/tasks/.../thread.yaml instead of the canonical
  workspace task record. Root cause was litehive/cli/report.py resolving the main
  workspace only after a local task lookup miss; because task metadata exists inside
  worktrees too, the report landed in the wrong place and the runner concluded no
  verdict had been submitted. Fixed by canonicalizing the workspace root at the start
  of report submission so worktree invocations always append thread comments to the
  main workspace task. Added a regression test covering report submission from a task
  worktree and re-ran the nearby stage-result submission suite. Preserved the useful
  grooming work by syncing the planner-shaped acceptance criteria, PM sizing, and
  implementation plan back into the canonical task.yaml. Verification: uv run pytest
  -q tests/test_task_commands_and_daemon.py -k report_command_from_task_worktree_writes_to_main_workspace;
  uv run pytest -q tests/test_stage_result_submission.py. Task T-0224 is runnable
  again and grooming is complete.'
