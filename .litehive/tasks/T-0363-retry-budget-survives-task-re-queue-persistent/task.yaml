goal: Stage retry counters still reset too aggressively across task requeues. Persist
  cross-run failure memory so a task that exhausts the same stage repeatedly cannot
  loop forever via manual or automatic requeue without explicit operator intent.
acceptance_criteria:
- Task state keeps cross-run failed-run history or an equivalent persistent counter
  keyed by failure shape/stage.
- Repeated exhaustion of the same stage no longer re-enters the queue silently; it
  requires explicit operator action or consumes a cross-run budget.
- Planner/grooming surfaces can see prior failed-run history when deciding whether
  a task is fundamentally unfixable.
