goal: Prevent Litehive child processes that execute in a task worktree or other target
  workspace from inheriting an unrelated operator-shell Python virtual environment.
acceptance_criteria:
- When Litehive launches subagents or runner hooks against a task worktree or other
  execution root, the child process environment does not forward an unrelated parent
  VIRTUAL_ENV from the caller shell.
- Workspace-scoped helper commands continue to pass required Litehive metadata env
  vars, but uv resolves the target workspace environment instead of warning about
  the caller repo's active venv.
- Focused regression coverage demonstrates cross-workspace execution no longer emits
  the uv VIRTUAL_ENV mismatch warning in captured stderr/log artifacts.
constraints:
- Prefer the smallest change that removes the failure mode.
- Call out any remaining edge cases or follow-up risk explicitly.
plan:
- Localize every child-process launch path that starts from os.environ.copy() and
  can target a task worktree or alternate workspace execution root.
- Add a shared environment-sanitizing helper so subagent adapters, runner hooks, and
  daemon-launched workspace commands drop inherited VIRTUAL_ENV when executing outside
  the caller workspace while preserving required Litehive env vars.
- Add focused regression tests that simulate a parent-shell VIRTUAL_ENV and assert
  the child env/logs use the target workspace without uv mismatch warnings.
- Run the narrow affected pytest selection first, then any broader smoke command needed
  to prove the fix did not break normal workspace execution.
