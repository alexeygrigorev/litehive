goal: Make 'litehive show T-XXXX' resolve each dependency to a human-readable status
  label from active task records or the archive index, instead of printing bare task
  IDs.
acceptance_criteria:
- When a task has live dependencies, 'litehive show T-XXXX' prints each dependency
  with its current task status so operators can see state without separate lookup.
- When a dependency is no longer in active task records but exists in .litehive/tasks/archive/INDEX.csv,
  'litehive show T-XXXX' marks that dependency as archived.
- When a dependency cannot be found in either active task records or the archive index,
  'litehive show T-XXXX' marks it clearly as missing.
- Existing automated tests still pass after the change.
constraints: []
plan:
- Inspect current show/display helpers and choose a dependency-status formatter that
  keeps list/queue output unchanged unless a shared helper clearly fits.
- Resolve dependency IDs against active tasks first, then fall back to .litehive/tasks/archive/INDEX.csv
  for archived markers, and emit an explicit missing marker when neither source contains
  the ID.
- Add targeted CLI tests for live, archived, and missing dependencies in show output,
  then run the relevant test module and the full suite.
