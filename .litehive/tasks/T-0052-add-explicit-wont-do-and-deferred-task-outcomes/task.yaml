goal: Introduce intentional non-implementation outcomes such as wont_do, deferred,
  or duplicate so PM can explicitly decide not to proceed without overloading failed
  or silently dropping work. These outcomes should preserve the task record, rationale,
  and any follow-up links, and they should remain visible in status/reporting instead
  of disappearing from the workflow.
acceptance_criteria:
- PM can explicitly close a non-done task as `wont_do`, `deferred`, or `duplicate`,
  with persisted rationale and optional follow-up linkage where applicable.
- The chosen non-implementation outcome remains durably visible in task records and
  user-facing reporting surfaces such as `litehive status` and any pool/status summaries,
  rather than appearing only as generic cancellation.
- Closing a task with one of these outcomes removes it from runnable queue execution
  without deleting or hiding the task record.
- Existing cancellation semantics for interruption and `abandon` remain distinct from
  intentional PM close outcomes, with state-machine documentation updated to match
  the implemented behavior.
- Focused tests cover task close persistence, CLI/status/reporting visibility, and
  separation between explicit non-implementation outcomes and generic execution cancellation.
