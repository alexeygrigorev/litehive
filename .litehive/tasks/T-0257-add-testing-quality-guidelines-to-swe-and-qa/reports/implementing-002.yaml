summary: Updated shared stage prompt text in litehive/config/profiles/_shared.yaml
  so the SWE implementing prompt now instructs agents to write assertions that fail
  when the feature is broken, avoid framework/defaults/constants coverage, keep one
  test per behavior, and avoid duplicate coverage; and the QA testing prompt now tells
  agents to reject always-pass tests, duplicate coverage, tests over 50 lines, and
  monolithic tests covering 5+ behaviors. Added Python profile testing guidance in
  litehive/config/profiles/python.yaml for pytest, tmp_path over manual tempfiles,
  mocking external calls instead of internal logic, and avoiding time.sleep in tests.
  Added Django profile testing guidance in litehive/config/profiles/django.yaml to
  avoid ORM round-trip/CASCADE and standalone URL resolution tests, prefer setUpTestData
  for read-only fixtures, and use assertContains over string matching. Verified prompt/profile
  rendering with uv run pytest -q tests/test_runner_workflow.py tests/test_workspace_bootstrap.py
  (143 passed in 9.94s) and ran the implementing hook lint command uv run ruff check
  --select E402,F401 litehive tests (passed).
