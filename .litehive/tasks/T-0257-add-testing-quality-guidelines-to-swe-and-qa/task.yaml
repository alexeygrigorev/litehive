goal: Embed testing best practices into the agent prompts so agents write better tests.
  Rules should be generic (apply to any project) with profile-specific additions.
  Add to both SWE (implementing stage) and QA (testing stage) prompts.
acceptance_criteria:
- 'Universal testing rules added to SWE implementing prompt: every assertion must
  fail if feature is broken, do not test framework behavior, do not test defaults/constants,
  one test per behavior, no duplicate coverage'
- 'Universal testing rules added to QA testing prompt: reject tests that always pass,
  reject tests that duplicate existing coverage, reject tests over 50 lines, reject
  monolithic tests that test 5+ behaviors'
- 'Python profile stage_overlay includes: use pytest, use tmp_path not manual tempfiles,
  mock external calls not internal logic, no time.sleep in tests'
- 'Django profile stage_overlay includes: do not test ORM round-trips or CASCADE,
  do not test URL resolution separately, use setUpTestData for read-only fixtures,
  use assertContains not string matching'
- Rules are in the prompt text, not just config guidance - agents see them every run
- All existing tests pass
