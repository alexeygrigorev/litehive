goal: Single CLI command that stops a running task cleanly, switches that task's engine
  override, preserves same-stage recovery context, and requeues it so the next litehive
  run iteration resumes with the new engine.
acceptance_criteria:
- The new switch command targets a task-level engine override, not the workspace default
  engine, and persists the requested engine on the task record before the task is
  queued again.
- If the target task is currently active, the command stops the live runner/subagent
  cleanly and leaves no stale active-subagent state or live PID recorded for that
  task.
- After a successful switch, the task is queued for the next iteration at the same
  runnable stage it was interrupted from, preserving continuation/handoff evidence
  needed to resume prior work rather than restarting from backlog or a fresh implementation
  pass.
- The command appends a task thread comment that records why the switch happened,
  the previous and new engines, and where operators can find the prior subagent work
  or recovery evidence.
- Focused CLI tests cover at least the active-task switch path and verify task engine
  persistence, queue/runnable-state outcome, and thread-comment evidence.
constraints: []
plan:
- Inspect the current stop, resume, update, and thread-comment code paths to choose
  the narrowest composition point for a new switch command.
- Define switch semantics around task-level engine override plus same-stage recovery
  for the active task, explicitly reusing existing stop/recovery helpers where possible
  instead of adding a second interruption model.
- Implement the CLI command and any narrow task-layer helper needed to atomically
  stop the active task, persist the new engine, append switch context to the thread,
  and queue the task for the next iteration.
- Add focused tests for successful active-task switching and any guardrails such as
  non-active task handling or stale-runner failure behavior.
