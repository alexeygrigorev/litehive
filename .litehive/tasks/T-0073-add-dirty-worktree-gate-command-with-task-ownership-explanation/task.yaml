goal: Add a read-only CLI command that reports whether dirty git state should block
  the workspace and explains whether each dirty location belongs to the main checkout
  or a specific task/worktree.
acceptance_criteria:
- litehive dirty-worktree-gate --workspace . reports a clean result when the main
  checkout and recorded task worktrees have no dirty paths.
- When dirty paths exist, the command classifies the blocking state deterministically
  and explains ownership as main-checkout, task-owned worktree, ambiguous ownership,
  or missing recorded worktree using task ids or worktree paths when known.
- The command reuses shared git/worktree inspection helpers instead of duplicating
  ad-hoc git status parsing, so ownership-aware dirty-state logic stays consistent
  with existing pool/worktree behavior.
- Focused tests cover at least clean workspace, dirty main checkout, dirty known task
  worktree, and ambiguous or missing ownership cases for the command output and exit
  behavior.
