summary: 'Planner grooming passed after repo inspection and task reshaping. Verified
  the implementation seam and current behavior: heru/adapters/goz.py currently sets
  GozCLIAdapter.DEFAULT_CAPABILITIES.supports_model_override=False, while litehive/pipeline/_models.py::resolve_model
  returns None for engines that do not support model override and otherwise resolves
  in order run override -> task.model -> workspace_model_for_engine(config, engine_name).
