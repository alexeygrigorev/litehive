summary: 'Accepted after direct verification in the current worktree. I confirmed
  heru/adapters/goz.py sets GozCLIAdapter.DEFAULT_CAPABILITIES.supports_model_override=True
  and that the adapter forwards model values to goz run via --model. I verified tests/test_config.py::test_resolve_model_honors_goz_run_task_and_workspace_overrides
  covers the required goz precedence path: resolve_model(task, config, engine_name=''goz'',
  model_override=''run-model'') returns ''run-model'', then falls back to task.model,
  then to workspace config.goz_model when task.model is unset. I also verified tests/test_goz_adapter.py
  asserts the adapter advertises supports_model_override=True and includes --model
  in the invocation argv, and tests/test_engine_variants_and_timeline.py::test_goz_engine_in_registry
  now matches the new capability so the registry is consistent with the adapter. Verification
  I ran as reviewer: uv run pytest -q tests/test_config.py -k goz tests/test_goz_adapter.py
  -> 7 passed, 38 deselected in 0.34s; uv run pytest -q tests/test_engine_variants_and_timeline.py
  -k test_goz_engine_in_registry -> 1 passed, 48 deselected in 0.32s; uvx ruff check
  --select E402,F401 litehive tests heru -> All checks passed; uv run pytest -q ->
  972 passed in 183.19s. Acceptance criteria met: capability flag is true in heru/adapters/goz.py,
  resolve_model for engine goz honors explicit override/task/workspace precedence,
  and the named goz config test plus the smoke suite pass.'
