goal: Set supports_model_override=True on GozCLIAdapter in heru/ so litehive's resolve_model()
  uses the configured goz_model. Apply to heru/adapters/goz.py since litehive/agents/adapters/goz.py
  is a re-export.
acceptance_criteria:
- The goz engine advertises model override support through GozCLIAdapter.DEFAULT_CAPABILITIES
  in heru/adapters/goz.py.
- resolve_model(task, config, engine_name='goz', model_override='X') returns 'X',
  and without a run override it resolves task.model before workspace goz_model.
- Focused pytest coverage passes for the goz model-resolution path and goz command
  building, including a test that proves goz honors run, task, and workspace model
  selection.
constraints: []
plan:
- Update heru/adapters/goz.py so the goz adapter reports supports_model_override=True.
- Add or adjust focused tests in tests/test_config.py and tests/test_goz_adapter.py
  to cover goz run override, task model fallback, workspace goz_model fallback, and
  --model command wiring.
- Run focused pytest coverage for the touched behavior and confirm the acceptance
  criteria with test evidence.
