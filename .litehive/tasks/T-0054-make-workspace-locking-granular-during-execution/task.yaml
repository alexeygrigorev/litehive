goal: Replace the long-held workspace mutation lock with short atomic state-transition
  locks so queue/task intake and non-conflicting queue updates can happen while a
  runner is active. Keep conflict protection for active-task transitions and runner
  ownership, but allow adding, reprioritizing, and updating future queued tasks during
  execution. Re-read queue state between tasks so new work can be picked up safely.
acceptance_criteria:
- Queue and backlog mutations such as add, move, promote, and update can succeed while
  another task is actively running, without holding a workspace-wide lock for the
  whole execution.
- Active-task transitions remain protected so two runners cannot claim or mutate the
  same active task concurrently, and conflicting mutations still raise a clear workspace
  conflict.
- Add targeted tests that cover concurrent queue mutation during an active run and
  verify the runner re-reads queue state safely between tasks.
