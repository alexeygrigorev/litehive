  \n2. **Resume prompt says 'continue where you left off'** \u2014 MET. Existing code\
  \ at line 847 produces `\"Please continue where you left off. Complete the task.\"\
  ` when `resume_session_id` is set. Verified in test assertions.\n\n3. **Only one\
  \ resume attempt per crash** \u2014 MET. `crash_resume_attempted` flag prevents\
  \ second resume. Verified by `test_crash_resume_only_once`.\n\n4. **Only applies\
  \ to engines that support session resume (claude)** \u2014 MET. Condition checks\
  \ `engine_name == \"claude\"`. Verified by `test_crash_resume_skipped_for_non_claude`.\n\
  \n5. **Journal logs the resume attempt clearly** \u2014 MET. Journal entry includes\
  \ exit code, session ID, and \"Resuming\". Verified by `test_crash_resume_journal_entry`.\n\
  \n### Test Evidence\n```\nuv run pytest tests/test_crash_resume.py -q \u2192 4 passed\
  \ in 2.41s\n```\n\n### Files Changed\n- litehive/runtime/_execution.py\n- tests/test_crash_resume.py\
  \ (new)"
