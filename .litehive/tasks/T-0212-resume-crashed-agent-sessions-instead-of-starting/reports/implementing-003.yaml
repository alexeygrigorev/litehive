feedback: "## Implementation Summary\n\nAdded crash-resume logic for unclassified\
  \ agent crashes in `litehive/runtime/_execution.py`.\n\n### Changes\n\n**litehive/runtime/_execution.py**\
  \ (~15 lines added):\n- Added `crash_resume_attempted = False` flag before the executor\
  \ while loop (line 842)\n- Before the existing break condition (line 871-892), added\
  \ detection for unclassified crashes: `failure is None and result.exit_code != 0\
  \ and engine_name == \"claude\" and not crash_resume_attempted`\n- When detected\
  \ with a valid session ID from `extract_engine_continuation`, sets `resume_session_id`,\
  \ logs to journal, sets `crash_resume_attempted = True`, and `continue`s the loop\n\
  - If no session ID or not claude, falls through to the existing break\n\n**tests/test_crash_resume.py**\
  \ (4 tests, all passing):\n- `test_crash_resume_triggers_session_resume_for_claude`\
  \ \u2014 Verifies crash triggers resume with correct session ID and \"continue where\
  \ you left off\" prompt\n- `test_crash_resume_only_once` \u2014 Verifies second\
  \ crash does not trigger another crash-resume\n- `test_crash_resume_skipped_for_non_claude_engines`\
  \ \u2014 Verifies codex crashes do not trigger resume\n- `test_crash_resume_journal_entry`\
  \ \u2014 Verifies journal contains exit code, session ID, and \"Resuming\"\n\n###\
  \ Acceptance Criteria Verification\n\n1. **Agent crash with exit 1 and no failure\
  \ classification triggers resume with same session ID** \u2014 MET. Verified by\
  \ test_crash_resume_triggers_session_resume_for_claude.\n2. **Resume prompt says\
  \ 'continue where you left off'** \u2014 MET. Uses existing line 846-847 prompt.\
  \ Verified in test.\n3. **Only one resume attempt per crash** \u2014 MET. `crash_resume_attempted`\
  \ flag. Verified by test_crash_resume_only_once.\n4. **Only applies to engines that\
  \ support session resume (claude)** \u2014 MET. Checks `engine_name == \"claude\"\
  `. Verified by test_crash_resume_skipped_for_non_claude.\n5. **Journal logs the\
  \ resume attempt clearly** \u2014 MET. Verified by test_crash_resume_journal_entry.\n\
  \n### Test Evidence\n```\nuv run pytest tests/test_crash_resume.py -q \u2192 4 passed\
  \ in 2.67s\n```\n\n### Files Changed\n- litehive/runtime/_execution.py\n- tests/test_crash_resume.py\
  \ (new)"
