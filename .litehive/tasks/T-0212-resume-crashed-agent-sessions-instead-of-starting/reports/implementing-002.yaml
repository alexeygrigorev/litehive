feedback: "## Implementation Complete\n\n### Changes\n- **litehive/runtime/_builder.py**\
  \ (lines 161, 190-206): Added crash-resume logic. When `failure is None` and `exit_code\
  \ != 0` for the `claude` engine, extracts session ID via `extract_engine_continuation`\
  \ and retries once with `resume_session_id`. A `crash_resume_attempted` boolean\
  \ flag ensures only one resume attempt per crash.\n- **tests/test_crash_resume.py**\
  \ (new, 4 tests): Covers all acceptance criteria.\n\n### Acceptance Criteria Verification\n\
  \n1. **Agent crash with exit 1 and no failure classification triggers resume with\
  \ same session ID** \u2014 MET. Line 190-206 detects `failure is None and result.exit_code\
  \ != 0`, extracts session ID, sets `resume_session_id`. Verified by `test_crash_resume_triggers_session_resume_for_claude`.\n\
  2. **Resume prompt says 'continue where you left off'** \u2014 MET. Line 166 produces\
  \ `\"Please continue where you left off. Complete the task.\"` when `resume_session_id`\
  \ is set. Verified in test assertions.\n3. **Only one resume attempt per crash**\
  \ \u2014 MET. `crash_resume_attempted` flag set to True on first resume prevents\
  \ further attempts. Verified by `test_crash_resume_only_once_per_crash`.\n4. **Only\
  \ applies to engines that support session resume (claude)** \u2014 MET. Condition\
  \ checks `engine_name == \"claude\"` at line 193. Verified by `test_crash_resume_skipped_for_non_claude_engines`.\n\
  5. **Journal logs the resume attempt clearly** \u2014 MET. Journal entry includes\
  \ exit code, session ID, and \"Resuming\". Verified by `test_crash_resume_journal_entry`.\n\
  \n### Test Evidence\n```\nuv run pytest tests/test_crash_resume.py -q \u2192 4 passed\
  \ in 2.98s\n```\n\n### Files Changed\n- litehive/runtime/_builder.py\n- tests/test_crash_resume.py\
  \ (new)"
