  verdict: pass
  message: "## Implementation Summary\n\nAdded crash-resume logic for unclassified\
    \ agent crashes in `litehive/runtime/_execution.py`.\n\n### What was changed\n\
    \n**litehive/runtime/_execution.py** (lines 842, 871-887):\n- Added `crash_resume_attempted\
    \ = False` flag before the executor while loop\n- Before the existing break condition,\
    \ added detection for unclassified crashes: `failure is None and result.exit_code\
    \ != 0 and not crash_resume_attempted`\n- When detected on the `claude` engine\
    \ with a valid session ID from `extract_engine_continuation`, sets `resume_session_id`,\
    \ logs to journal, and continues the loop\n- Sets `crash_resume_attempted = True`\
    \ so a second crash breaks normally\n\n### How it meets the acceptance criteria\n\
    \n1. **Agent crash with exit 1 and no failure classification triggers resume with\
    \ same session ID** \u2014 The new code block at line 871 detects `failure is\
    \ None and result.exit_code != 0`, extracts the session ID via `extract_engine_continuation`,\
    \ and sets `resume_session_id` which is passed to the next `subagents.run()` call.\n\
    \n2. **Resume prompt says 'continue where you left off'** \u2014 The existing\
    \ code at line 846-847 already uses `\"Please continue where you left off. Complete\
    \ the task.\"` when `resume_session_id` is set.\n\n3. **Only one resume attempt\
    \ per crash** \u2014 The `crash_resume_attempted` boolean flag (line 842) is set\
    \ to True on first resume and prevents further resume attempts.\n\n4. **Only applies\
    \ to engines that support session resume (claude)** \u2014 The condition checks\
    \ `engine_name == \"claude\"` before attempting resume.\n\n5. **Journal logs the\
    \ resume attempt clearly** \u2014 The journal entry includes the exit code, session\
    \ ID, and describes the crash-resume action.\n\n### Tests added (4 passing)\n\n\
    **tests/test_crash_resume.py**:\n- `test_crash_resume_triggers_session_resume_for_claude`\
    \ \u2014 Verifies crash triggers resume with correct session ID and journal entry\n\
    - `test_crash_resume_only_once_per_crash` \u2014 Verifies second crash does not\
    \ trigger another resume\n- `test_crash_resume_skipped_for_non_claude_engines`\
    \ \u2014 Verifies codex crashes do not trigger resume\n- `test_crash_resume_journal_entry`\
    \ \u2014 Verifies journal contains crash details and session ID\n\nAll 4 tests\
    \ pass: `uv run pytest tests/test_crash_resume.py -q` \u2192 4 passed"
