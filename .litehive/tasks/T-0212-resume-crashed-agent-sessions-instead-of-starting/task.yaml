id: T-0212
slug: resume-crashed-agent-sessions-instead-of-starting
title: Resume crashed agent sessions instead of starting from scratch
depends_on: []
task_type: null
engine: null
model: null
mode: implementation
pipeline_mode: full
status: queued
flag_reason: null
pipeline_status: implementing
priority: medium
