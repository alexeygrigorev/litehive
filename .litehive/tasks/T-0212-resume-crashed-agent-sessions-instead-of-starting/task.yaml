title: Resume crashed agent sessions instead of starting from scratch
created_at: '2026-04-07T15:41:35+00:00'
task_type: null
pipeline_mode: full
priority: medium
depends_on: []
goal: When an agent exits with code 1 and no specific failure classification (not
  quota, not timeout, not interrupted), resume the same Claude session instead of
  starting a new one. The session ID is already extracted via extract_engine_continuation.
  Currently the executor loop breaks without retrying when failure is None but exit
  code != 0. It should detect this case, extract the continuation session ID, and
  retry once with resume_session_id.
acceptance_criteria:
- Agent crash with exit 1 and no failure classification triggers a resume attempt
  with the same session ID
- Resume prompt says 'continue where you left off'
- Only one resume attempt per crash - if the resumed session also crashes, proceed
  normally
- Only applies to engines that support session resume (claude)
- Journal logs the resume attempt clearly
