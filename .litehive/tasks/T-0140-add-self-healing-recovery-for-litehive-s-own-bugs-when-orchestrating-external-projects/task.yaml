goal: When an external-project task fails because of a Litehive control-plane bug,
  Litehive should perform one bounded self-heal attempt against the configured Litehive
  source repo, validate the fix with uv run pytest, merge the fix to Litehive main,
  log the recovery actions on the originating task thread, and requeue the original
  task at the same stage for the next wrapper iteration.
acceptance_criteria:
- Recovery classifies a failure as a Litehive bug versus a project bug by inspecting
  traceback paths and only routes into self-heal when the failing frames resolve
  to Litehive-owned code rather than the external project.
- litehive_source_path is the configured locator for the Litehive source repo used
  by self-heal, and recovery records an explicit blocker instead of guessing when
  that repo is unavailable.
- For Litehive bugs discovered while working in an external project, recovery performs
  the repair in a Litehive worktree rooted at litehive_source_path with Litehive-specific
  context, not inside the target project checkout.
- The self-heal flow runs uv run pytest in the Litehive repo before any merge, and
  a failing Litehive test run prevents merge while leaving explicit recovery evidence
  on the originating task.
- A successful self-heal merges the Litehive fix onto Litehive main and requeues
  the original external-project task at the same stage so the next wrapper iteration
  runs with the repaired Litehive code.
- Self-heal is capped at one attempt per unique failure fingerprint or traceback signature
  so the runner cannot loop indefinitely on the same Litehive bug.
- The originating task thread and recovery artifacts log the classification decision,
  Litehive worktree or branch used, test command and result, merge outcome, and requeue
  decision for auditability.
constraints:
- Keep changes scoped to the self-heal path for Litehive-owned failures triggered
  while orchestrating external projects.
- Reuse existing recovery, worktree, merge, and upstream-contribution primitives
  where possible instead of adding a parallel persistence or orchestration path.
- Do not treat normal target-project bugs as Litehive self-heal candidates; project-local
  failures must continue through the existing recovery or rejection flow.
plan:
- Inspect the current recovery trigger, evidence, and prompt flow to define a deterministic
  Litehive-bug classification rule and durable failure fingerprint.
- Extend recovery routing so external-project failures classified as Litehive-owned
  launch a bounded self-heal attempt against litehive_source_path rather than only
  filing or logging an upstream issue.
- Implement the Litehive self-heal execution path in a Litehive worktree, including
  Litehive-specific prompt context, uv run pytest, and merge-to-main behavior.
- Persist audit details and attempt tracking so the originating task thread and recovery
  report show the self-heal decision, test result, merge result, and requeue action.
- Add focused regression coverage for classification, attempt-capping, successful
  self-heal plus requeue, and failed-pytest or blocked-source-path cases.
