goal: When litehive fails due to a bug in its own code (not the target project), the
  recovery agent should fix the litehive source, run litehive tests, merge the fix,
  and requeue the original task so it succeeds on the next iteration
acceptance_criteria:
- recovery agent classifies errors as litehive bugs vs project bugs by inspecting
  the traceback
- litehive_source_path config field points to the litehive source repo
- for litehive bugs the recovery agent works in a litehive worktree with litehive
  context, not the target project
- recovery agent runs uv run pytest on litehive before merging the fix
- successful self-heal merges to litehive main so the next wrapper iteration uses
  the fixed code
- self-heal is capped at 1 attempt per error to prevent loops
- all self-heal actions are logged to the task thread for auditability
