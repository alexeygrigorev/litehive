goal: Create the initial browser surface for Litehive. Add a web package or clearly
  named browser entrypoint plus a read-only snapshot API backed by existing status,
  state, and activity helpers. This task establishes the HTML shell, routing, and
  JSON contracts that later operator actions build on.
acceptance_criteria:
- A browser entrypoint exists under litehive/web or another clearly named package
  and serves a basic operator page.
- A read-only snapshot API returns active task, queue summary, recent activity, waiting-for-you
  state, engine health, runner or daemon state, and linkable task summaries derived
  from current CLI or state helpers.
- The initial page renders the same high-level sections as litehive status without
  requiring terminal access.
- The implementation uses non-blocking, read-only workspace reads for dashboard polling
  or streaming paths.
