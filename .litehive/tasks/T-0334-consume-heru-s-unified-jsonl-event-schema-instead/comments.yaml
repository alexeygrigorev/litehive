- role: reviewer
  step: accepting
  verdict: reject
  message: 'Rejecting T-0334.


    EXPECTED behavior:

    - After moving Litehive to heru''s unified JSONL contract, continuation handoff/resume
    must still work end-to-end.

    - The pipeline session path must capture the continuation emitted by `SubagentManager.run(...)`
    and persist a usable resume id for the next turn.


    OBSERVED behavior:

    - `SubagentManager` extracts the unified continuation and persists it into task/session
    artifacts, but drops it from the returned `SubagentResult` (`litehive/agents/manager.py:178`,
    `litehive/agents/manager.py:243-257`, `litehive/agents/manager.py:285-290`).

    - `HeruEngineAdapter` still tries to recover the next-turn resume id from `result.execution.continuation`,
    which is never populated, so the pipeline keeps `session.engine_session_id` unchanged
    (`litehive/pipeline/heru_factory.py:128-165`).

    - I reproduced this directly with a fake codex unified continuation event: the
    run wrote `session.yaml` with `continuation: {session_id: codex-thread-123, ...}`,
    while `HeruEngineAdapter._extract_continuation_id(result, None)` returned `None`.


    Reproduction steps:

    1. Run a `SubagentManager.run(...)` against a fake engine that returns unified
    stdout containing a `continuation` event.

    2. Observe that the generated `session.yaml` contains the continuation, proving
    the manager parsed it.

    3. Call `HeruEngineAdapter._extract_continuation_id(result, None)` on the returned
    `SubagentResult`.

    4. It returns `None`, so the pipeline session store cannot persist the resume
    id for the next turn.


    Acceptance criteria not met:

    - `No behavioral regression: nudge flow, verdict submission, and continuation
    handoff still work end-to-end` is not satisfied. The reported verification only
    covers nudge/verdict flows plus smoke tests; it does not cover the pipeline session
    resume path, and that path is currently broken.

    - The task''s stated runtime/session seam is incomplete because the pipeline still
    cannot consume the parsed unified continuation for session persistence.

    '
