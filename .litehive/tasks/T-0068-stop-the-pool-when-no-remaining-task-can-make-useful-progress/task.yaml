goal: Make `litehive run --drain` continue after a task is requeued when another
  task can still run, and stop only when the refreshed pool has no task that can
  make useful progress.
acceptance_criteria:
- '`litehive run --drain` does not stop with `task_requeued` just because the most
  recent task finished in `queued`; after each iteration it re-reads the refreshed
  queue and continues while at least one task is still runnable.'
- When a task is requeued and the refreshed pool has no runnable work left, drain
  mode stops cleanly with the no-useful-progress outcome (`blocked_tasks_remaining`
  when tasks remain but are blocked, otherwise `queue_exhausted`) instead of treating
  the requeue itself as the stop reason.
- Existing stop conditions that genuinely require operator intervention or an intentional
  pause, including human checkpoints and continue-or-rollback requirements, still
  stop drain mode immediately.
- Targeted regression tests cover both the mixed-pool case (requeued task plus another
  runnable task keeps draining) and the no-runnable-work case (requeued task plus
  only blocked work stops cleanly).
constraints:
- Keep changes scoped to drain stop semantics and directly related tests/reporting.
plan:
- Inspect the drain loop and stop-reason helpers in `litehive/runtime.py` to separate
  pool-level no-progress detection from single-task `task_requeued` semantics.
- Recompute queue viability after each drained execution using the existing task-selection
  logic so requeued work only stops the pool when nothing runnable remains.
- Add focused regression coverage in `tests/test_workspace.py` for mixed runnable
  and no-runnable requeue scenarios, while keeping human checkpoint behavior unchanged.
- Update any user-facing stop-reason reporting that would otherwise still describe
  a no-progress drain stop as `task_requeued`.
