acceptance_criteria:
- Heru CopilotCLIAdapter only defines Copilot command and stream parsing on top of
  ExternalCLIAdapter, inherits the shared build_invocation/run_live contract, and
  passes resume_session_id through the shared --continue/--resume command path.
- SubagentManager routes live Copilot execution through the shared run_live handling,
  injects subagent_inactivity_timeout_seconds into inactivity_timeout_seconds, and
  contains no Copilot-only timeout or restart branch.
- The workspace default for subagent_inactivity_timeout_seconds is 300.0 seconds,
  and the only engine-specific override in this execution path is the OpenCode override
  rather than any Copilot-specific override.
- A no-new-stdout inactivity kill is classified as transient timeout, and the normal
  HeruEngineAdapter plus AgentNode retry flow reruns the same engine while reusing
  persisted continuation or resume session identifiers when available.
- If those shared behaviors already exist, close T-0088 as duplicate instead of adding
  Copilot-only runtime behavior.
constraints:
