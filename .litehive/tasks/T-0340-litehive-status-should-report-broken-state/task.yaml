goal: "`litehive status` today either (a) shows 'all good' even when the daemon is\
  \ dead/stuck, or (b) crashes with a traceback when a dependency file is corrupt.\
  \ Neither communicates 'this system is broken'. Status should be a single source\
  \ of truth that surfaces every recoverable brokenness as a human-readable indicator.\n\
  \n### Broken states status must surface\n1. **Corrupt registry files** (~/.config/litehive/workspaces.yaml,\
  \ daemons.yaml) \u2014 today's overnight failure: yaml.safe_load raises, status\
  \ command crashes. Should instead: catch the parse error, print 'registry: CORRUPT\
  \ at <path> (line N)', continue reporting the rest.\n2. **Stale runner lock** (daemon_status=stopped\
  \ but state.yaml still has active_task_id, or lockfile exists without live pid).\
  \ Should print 'runner_state: STALE (no live pid for active_task_id=T-XXXX)'.\n\
  3. **Stale heartbeat** (runner says 'running' but heartbeat_at is >10 min old).\
  \ Should print 'runner_state: WEDGED (heartbeat N min stale)'.\n4. **Corrupt state.yaml**\
  \ (yaml parse error). Same treatment as registry.\n5. **Daemon process dead but\
  \ state says running** (pid from daemon_status not in ps). Print 'daemon_status:\
  \ STOPPED (pid N not alive)'.\n6. **Last daemon cycle crashed** (latest .litehive/logs/run-all/<latest>/\
  \ has a repair.log with a traceback and no 000N-run.log for that timestamp). Print\
  \ 'last_cycle: FAILED at <timestamp>, check <path>'.\n7. **Heru editable path broken**\
  \ (uv sync can't resolve ../heru from a worktree). Print 'heru_link: BROKEN (worktrees\
  \ cannot resolve heru)'.\n8. **Workspace config syntax error** (.litehive/config.yaml\
  \ parse error). Print 'config: CORRUPT (line N)'.\n\n### Design\n- Each check is\
  \ a function that returns Ok or a (severity, message) tuple\n- litehive status runs\
  \ all checks and prints results inline\n- At the END, if any check is WARN/ERROR,\
  \ exit code is non-zero and a summary line 'health: 3 broken, 1 warning' prints\n\
  - If everything is fine, current compact output continues to be the default\n- All\
  \ yaml reads wrapped in try/except so status never crashes \u2014 the point is to\
  \ surface problems, not propagate them\n\n### Integration with recovery\n- Each\
  \ broken-state check has a known fix (cleaning the registry, breaking the lock,\
  \ restarting daemon, rebuilding venv). Document the recommended fix in the error\
  \ message so the user knows what to do.\n- When the recovery agent (stage-level)\
  \ can't catch a broken state, litehive status acts as the safety net so the user\
  \ notices before an overnight run is wasted.\n\n### Testing\n- Unit tests that corrupt\
  \ workspaces.yaml and verify litehive status does NOT raise\n- Tests for each broken\
  \ state above"
acceptance_criteria:
- "litehive status never raises on corrupt yaml files \u2014 catches ParseError and\
  \ reports 'CORRUPT at <path> line N'"
- status surfaces stale runner locks, stale heartbeats, dead pids, corrupt state.yaml,
  corrupt registry
- status exit code is non-zero when any check reports ERROR severity
- a 'health:' summary line prints when any check fails
- each broken-state indicator includes a one-line remediation hint
- unit tests corrupt each relevant file and verify status reports without crashing
