id: T-0340
slug: litehive-status-should-report-broken-state
title: litehive status should report broken-state indicators (not crash, not lie)
created_at: '2026-04-11T05:31:45+00:00'
task_type: null
mode: implementation
pipeline_mode: full
priority: high
pm_complexity: null
planned_effort: null
