  message: "Grooming passed after repo inspection.\n\nWhat I verified\n- `litehive/cli/status.py`\
    \ currently calls `load_config()` and `load_state()` up front, so corrupt `.litehive/config.yaml`\
    \ or `.litehive/state.yaml` can still crash `litehive status` before it prints\
    \ anything.\n- Global registry reads still flow through YAML loaders in `litehive/config/workspace_registry.py`\
    \ and `litehive/daemon/registry.py`, so corrupt `~/.config/litehive/workspaces.yaml`\
    \ or `daemons.yaml` is a real crash vector for status-adjacent reads.\n- The existing\
    \ runner status model already distinguishes `running`, `late`, and `stale`, but\
    \ the task\u2019s requested `WEDGED if heartbeat >10 min` is stricter than the\
    \ current shared 60-second heartbeat-late threshold. That should remain a status-only\
    \ diagnostic, not a global lock/recovery behavior change.\n- This is not a duplicate\
    \ of T-0247 (`litehive health`). That task added a broader health command; this\
    \ task is specifically about making `litehive status` the trustworthy default\
    \ and ensuring it never lies or crashes on recoverable broken state.\n\nRecommended\
    \ implementation shape\n1. Add a read-only status diagnostics layer that can safely\
    \ inspect config/state/registry/log files and PIDs without relying on crash-prone\
    \ normal loaders for the first read.\n2. Model each requested condition as an\
    \ independent probe returning `ok` or `(severity, key, message)` so `litehive\
    \ status` can report every detectable issue in one pass.\n3. Keep today\u2019\
    s compact output when all probes are clean, but when any probe returns WARN/ERROR,\
    \ print the broken-state indicators inline, emit a final `health:` summary, and\
    \ return non-zero.\n4. Cover the behavior with focused status tests that corrupt\
    \ the relevant YAML files and simulate stale/dead daemon and runner conditions\
    \ without requiring a real daemon process.\n\nScope guard\n- Keep changes scoped\
    \ to `litehive status` and status-supporting helpers/tests.\n- Do not redesign\
    \ `litehive health`, daemon recovery, or workspace repair in this task.\n- Treat\
    \ the 10-minute stale-heartbeat rule as a status presentation rule only; do not\
    \ change the shared `HEARTBEAT_LATE_THRESHOLD_SECONDS` semantics used elsewhere\
    \ unless a failing test proves it is required.\n\nTASK_UPDATE:\n```yaml\ntask_type:\
    \ bugfix\ngoal: >-\n  Make `litehive status` the trustworthy default health readout\
    \ for a workspace:\n  it must never crash on corrupt YAML or inconsistent daemon/runner\
    \ state, and it\n  must surface every recoverable broken state as a human-readable\
    \ indicator with a\n  one-line remediation hint instead of reporting an all-good\
    \ view.\nacceptance_criteria:\n  - >-\n    `litehive status` catches YAML parse\
    \ failures in workspace and global status\n    dependencies and continues running,\
    \ reporting `CORRUPT` with the file path and\n    line number for `.litehive/config.yaml`,\
    \ `.litehive/state.yaml`,\n    `~/.config/litehive/workspaces.yaml`, and `~/.config/litehive/daemons.yaml`.\n\
    \  - >-\n    Status surfaces a stale runner lock as `runner_state: STALE` when\
    \ the workspace\n    still points at an active task or lock metadata but there\
    \ is no live runner PID,\n    and the message includes the affected task id when\
    \ available plus a remediation hint.\n  - >-\n    Status surfaces a wedged runner\
    \ as `runner_state: WEDGED` when the runner still\n    appears running but its\
    \ heartbeat is more than 10 minutes old, and this 10-minute\n    threshold is\
    \ implemented as a status-only diagnostic rather than a change to shared\n   \
    \ runner-lock/recovery timing.\n  - >-\n    Status surfaces a dead daemon PID\
    \ as `daemon_status: STOPPED (pid N not alive)`\n    instead of reporting `running`,\
    \ and includes a restart/remediation hint.\n  - >-\n    Status surfaces the most\
    \ recent failed daemon cycle when the latest run-all log\n    directory contains\
    \ a traceback-bearing repair log and no matching `*-run.log`,\n    reporting `last_cycle:\
    \ FAILED at <timestamp>, check <path>`.\n  - >-\n    Status surfaces a broken\
    \ Heru editable/worktree link as `heru_link: BROKEN` when\n    worktrees cannot\
    \ resolve the expected Heru source path, without requiring a full\n    `uv sync`\
    \ during a normal healthy status run.\n  - >-\n    When any probe reports WARN\
    \ or ERROR, `litehive status` exits non-zero and prints\n    a final `health:\
    \ <broken> broken, <warning> warning` summary line; when all probes\n    are clean,\
    \ the existing compact default output remains unchanged.\n  - >-\n    Automated\
    \ tests cover each broken-state indicator above and explicitly verify that\n \
    \   corrupt YAML inputs are reported without raising exceptions from `litehive\
    \ status`.\nconstraints:\n  - Keep changes scoped to `litehive status`, its read-only\
    \ diagnostics/helpers, and tests.\n  - Do not broaden this task into `litehive\
    \ health` redesign or repair automation changes.\n  - Do not change shared runner/recovery\
    \ heartbeat thresholds to satisfy the 10-minute status warning.\nplan:\n  - Add\
    \ safe read helpers for status-facing reads of config, state, and registry YAML\
    \ that preserve parse-error location details.\n  - Implement independent status\
    \ probes for corrupt registry/config/state, stale runner lock, wedged heartbeat,\
    \ dead daemon pid, failed last cycle, and broken Heru link.\n  - Thread probe\
    \ results into both default and `--full` status output so healthy output stays\
    \ compact but broken states are always visible.\n  - Add focused pytest coverage\
    \ for each failure mode using file fixtures and PID/heartbeat monkeypatching instead\
    \ of real daemon orchestration.\npm_complexity: moderate\nplanned_effort: m\n\
    ```\n"
