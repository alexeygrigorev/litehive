- role: qa
  step: testing
  verdict: reject
  message: 'REJECT


    EXPECTED behavior:

    `litehive status` should never raise on recoverable broken-state inputs. That
    includes `--full`, which the task explicitly scoped in: broken-state probes should
    feed both default and full status output, and all YAML reads in the status path
    should be caught and rendered as human-readable indicators instead of producing
    a traceback.


    OBSERVED behavior:

    `litehive status --full` still crashes when `.litehive/.runner.lock` is corrupt.
    The new diagnostics layer safely reads the runner lock, but `_cmd_status_full()`
    bypasses it and calls `runner_status(root)` directly at `litehive/cli/status.py:184`.
    That flows into `read_runner_lock_metadata()` at `litehive/workspace/locking.py:52`,
    which does a bare `yaml.safe_load(...)` with no `try/except`, so Typer prints
    a traceback instead of status output.


    Reproduction steps:

    1. Create a workspace: `python - <<''PY''\nfrom pathlib import Path\nfrom tests.workspace_helpers
    import ensure_workspace\nimport tempfile\nroot = Path(tempfile.mkdtemp())\nensure_workspace(root)\n(root/''.litehive''/''.runner.lock'').write_text(''['',
    encoding=''utf-8'')\nprint(root)\nPY`

    2. Run full status with agent env cleared: `env -u LITEHIVE_AGENT_ROLE uv run
    litehive status --workspace <workspace> --full`

    3. Observe a traceback ending in `ParserError` from `yaml.safe_load`, rather than
    a rendered status issue line.


    Acceptance criteria not met:

    - `litehive status` should act as the trustworthy default/full readout and not
    crash on recoverable broken-state files.

    - "All yaml reads wrapped in try/except so status never crashes" is not satisfied
    on the `--full` path.

    - The implementation plan item "Thread probe results into both default and `--full`
    status output so healthy output stays compact but broken states are always visible"
    is not satisfied for corrupt runner-lock input.


    Notes:

    - The new fast/default path tests pass, but there is no coverage for the equivalent
    `--full` failure mode.

    '
