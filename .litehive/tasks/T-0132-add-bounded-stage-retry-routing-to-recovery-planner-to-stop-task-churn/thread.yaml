- role: planner
  step: grooming
  verdict: pass
  message: 'GROOMED T-0132: Add bounded stage retry routing to recovery/planner to
    stop task churn.


    ## Task assessment

    Goal, acceptance criteria (6), constraints (4), and plan are well-specified. No
    acceptance criteria gaps. Dependency on T-0131 (legacy-task normalization) is
    recorded. PM sizing set: moderate complexity, M effort.


    ## Architecture clarifications for SWE


    ### Per-stage retry counters (new field in TaskRuntime)

    Add: stage_retry_counts: dict[str, int] = Field(default_factory=dict)

    Keys are stage names. Increment when a verdict causes a same-stage retry.


    ### Which verdicts increment the counter

    - (''testing'', ''fail'') -> implementing: increment implementing_count

    - (''testing'', ''reject'') -> implementing: increment implementing_count

    - (''accepting'', ''fail'') -> implementing: increment implementing_count

    - (''accepting'', ''reject'') -> implementing: increment implementing_count

    - (''implementing'', ''reject'') no _ROUTES entry, same stage: increment implementing_count

    - (''grooming'', ''reject'') retry at grooming: increment grooming_count


    ### Threshold config

    Extend TaskRetryPolicy with: stage_retry_limits: dict[str, int] = Field(default_factory=dict)

    Add default_stage_retry_limits to WorkspaceConfig (e.g. implementing:3, testing:3,
    accepting:3, grooming:2).

    Task-level stage_retry_limits override config defaults.


    ### Escalation routing in runner.py

    When stage_retry_counts[stage] >= effective_limit:

    - implementing/testing churn: route to grooming, set escalation_target=''recovery''

    - accepting/grooming churn: route to grooming, set escalation_target=''planner''

    Route = task.pipeline_status=''grooming'', task.status=''queued''. Preserve last_outcome
    and continuation_handoff.


    ### Durable reason

    Add to TaskOutcomeState: escalation_target: str | None = None, escalated_from_stage:
    str | None = None.

    Set last_outcome.reason = ''stage_retry_limit_reached'' (reuse or extend OutcomeReasonCode).


    ### Required tests

    1. Normal retry: implementing rejects once then passes - no escalation

    2. Recovery escalation: implementing rejects N>=threshold times - routes to grooming
    with escalation_target=''recovery''

    3. Planner escalation: accepting rejects N>=threshold times - routes to grooming
    with escalation_target=''planner''

    4. Counter resets when a stage succeeds


    ### Files

    - litehive/models.py: TaskRuntime.stage_retry_counts, TaskRetryPolicy.stage_retry_limits,
    TaskOutcomeState escalation fields

    - litehive/config.py: default_stage_retry_limits

    - litehive/runner.py: counter increment + threshold check + escalation routing

    - litehive/tasks.py: persist/reset stage_retry_counts

    - tests/: 3-4 new focused tests

    - docs/state-machine.md: update per PLAN.md change-gate rule


    PM_COMPLEXITY: moderate

    PLANNED_EFFORT: m'
