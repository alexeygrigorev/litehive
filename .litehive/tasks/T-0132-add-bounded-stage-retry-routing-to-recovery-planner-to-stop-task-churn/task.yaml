goal: >-
  Stop endless implementation, testing, and acceptance retry loops by adding
  durable bounded retry routing. After repeated failures or rejections on the
  same stage, litehive should route the task to recovery or planner instead of
  blindly sending it back to SWE again.
acceptance_criteria:
- >-
  Litehive tracks retry or loop counts per task and per stage in durable runtime
  or task state.
- >-
  Repeated implementing, testing, or accepting churn stops being treated as
  normal progress after a configured threshold.
- >-
  After the threshold, the task is rerouted deterministically: implementation or
  testing failures go to recovery, and ambiguous or repeatedly underspecified
  loops can be routed to planner.
- >-
  Status or report output records why the retry policy escalated, including a
  reason such as stage retry limit reached or repeated review churn.
- >-
  The policy does not break normal single-retry behavior for ordinary tasks that
  fail once and then continue.
- >-
  Focused tests cover at least one normal retry path, one recovery escalation,
  and one planner escalation.
constraints:
- >-
  Build on top of the legacy-task normalization work so underspecified tasks are
  groomed before retry thresholds are evaluated.
- >-
  Keep the routing deterministic and local; the runner decides when to escalate
  rather than leaving that decision to subagents.
- >-
  Preserve existing last-outcome and continuation-handoff context when the task
  is escalated.
- >-
  Avoid creating a new sink state; escalated tasks must remain resumable and
  visible in the runnable lifecycle.
plan:
- >-
  Define stage-level retry counters and which verdicts contribute to churn for
  implementing, testing, accepting, and commit-adjacent retries.
- >-
  Add deterministic escalation rules to recovery or planner after repeated
  same-stage loops.
- >-
  Record durable escalation reasons in runtime or task state and surface them in
  status or report output.
- >-
  Add focused tests for normal retry behavior and anti-churn escalation.
