goal: "The planner writes an execution plan from task.yaml alone. If the work is already\
  \ done (task re-queued from a previous successful run, or work merged from a different\
  \ task), the planner doesn't know \u2014 it scopes work that's already complete\
  \ and passes grooming, then the SWE wastes a full cycle re-discovering 'git diff\
  \ is empty'. Grooming should include a pre-flight that checks current main against\
  \ acceptance criteria and lets the planner close the task as outcome=duplicate/done\
  \ before any SWE work happens."
acceptance_criteria:
- 1. BeforeGroomingHook runs 'git log main --grep=T-XXXX' and includes any matching
  commits in the planner prompt.
- '2. Planner prompt: ''if the task is already complete on main, close it with outcome=done
  via TASK_UPDATE and pass''.'
- '3. Test: mock a task whose commit is on main, run grooming, assert planner closes
  it as done.'
