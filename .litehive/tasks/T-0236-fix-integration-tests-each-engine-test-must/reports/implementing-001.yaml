  report --verdict pass --role swe --message ok. Smoke prompts remain one-sentence
  reply-only prompts, nudge still runs the engine twice and the second run executes
  a single litehive report command, and the per-test timeout guard remains 30s in
  tests_integration/conftest.py with README aligned. Verified targeted slices: env
  LITEHIVE_INTEGRATION_ENGINES=gemini uv run pytest tests_integration/test_gemini.py
  -q --durations=10 -> 2 passed in 32.62s, slowest call 19.55s for test_gemini_nudge_submits_verdict_via_cli;
  env LITEHIVE_INTEGRATION_ENGINES=codex uv run pytest tests_integration/test_codex.py
  -q --durations=10 -> 3 passed in 26.36s. Verified full installed-engine suite: env
  LITEHIVE_INTEGRATION_ENGINES=codex,claude,copilot,gemini,opencode,goz /usr/bin/time
  -p uv run pytest tests_integration -q --durations=20 -> 14 passed in 119.02s, real
  119.85s. Slowest calls were copilot nudge 13.83s, gemini nudge 13.75s, opencode
  nudge 12.07s, claude nudge 11.76s, codex nudge 10.46s, goz nudge 6.54s. This satisfies:
  each integration test under 20 seconds, all installed-engine smoke tests pass, all
  installed-engine nudge verdict tests pass, prompts are minimal one-sentence prompts,
  timeout is 30 seconds, and full tests_integration/ completes under 3 minutes.'
