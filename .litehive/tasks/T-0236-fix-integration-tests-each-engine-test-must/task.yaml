goal: 'Integration tests currently time out at 60s because engine prompts are too
  complex. Simplify prompts to minimal one-shot responses so each test completes in
  under 20 seconds. The nudge test should: run engine with a trivial prompt, then
  run again with litehive report command. No STAGE_RESULT, no complex instructions.'
acceptance_criteria:
- Each integration test completes in under 20 seconds
- All engine smoke tests pass for installed engines (codex, claude, copilot, gemini,
  opencode, goz)
- All nudge verdict tests pass for installed engines
- Prompts are minimal - one sentence, no multi-step instructions
- Integration test timeout is 30 seconds (conftest.py), not 180
- uv run pytest tests_integration/ completes in under 3 minutes for all installed
  engines
