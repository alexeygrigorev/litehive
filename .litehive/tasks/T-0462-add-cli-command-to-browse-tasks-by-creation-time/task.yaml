goal: Add a CLI command that lists tasks created in a configurable recent period and
  shows task id, title, created time, and provenance/source metadata, including parent
  task context when the task was created by a Litehive agent.
acceptance_criteria:
- A command exists to browse tasks created in a configurable recent period such as
  the last 24 hours, with a default period and an override flag like --since.
- Each output row includes at least task id, title, created timestamp, and provenance/source.
- When provenance metadata is available, the command also shows parent/current task
  context for agent-created tasks.
- The implementation uses persisted task metadata / database state and does not require
  per-task manual inspection.
- Tests cover at least one recent-period listing case and verify created time and
  provenance fields are rendered.
