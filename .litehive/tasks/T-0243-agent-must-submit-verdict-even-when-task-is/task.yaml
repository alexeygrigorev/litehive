goal: 'When an SWE agent discovers the task is already implemented (code exists, tests
  pass), it must submit a pass verdict with evidence, not exit silently. Currently
  agents exit with code 0 and no verdict, triggering the empty SWE guard rejection.
  The agent prompt should explicitly instruct: if the work is already done, verify
  it and submit pass with evidence. The empty SWE guard should also distinguish ''agent
  did nothing'' from ''work was already done and agent verified it''.'
acceptance_criteria:
- 'Agent prompt includes instruction: if the task is already implemented, run tests
  to verify and submit pass with evidence listing what you verified'
- 'Agent prompt includes instruction: never exit without calling litehive report'
- Empty SWE guard allows pass when agent submits verdict via CLI even with zero file
  changes (the verdict is the evidence)
- PM reviewer can close a task as already-done when SWE reports it was pre-implemented
- SWE can use litehive update to narrow scope or modify acceptance criteria if the
  task needs changes, then the task re-enters the pipeline with updated criteria
- Agent can use litehive close --outcome wont_do/duplicate if the task is genuinely
  obsolete
- All existing tests pass
