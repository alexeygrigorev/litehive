summary: 'Implemented the reviewer follow-up for T-0243 and preserved the already-done
  reporting flow. Existing changes already covered the acceptance criteria: the implementing
  prompt now tells SWE to never exit without litehive report, to verify pre-implemented
  work and submit pass with evidence, to use litehive update when scope/acceptance
  criteria need correction, and to use litehive close --outcome wont_do|duplicate
  when obsolete; the reviewer prompt now allows accepting pre-implemented work to
  normal done; StageReport now tracks CLI-submitted verdicts; and the empty SWE guard
  now allows zero-file-change implementing passes only when the agent actually submitted
  a CLI verdict with explicit already-implemented-and-verified evidence. I fixed the
  acceptance blocker by updating litehive/engines/quota/codex_quota.py to explicitly
  re-export the compatibility symbols that tests and legacy imports expect, including
  _parse_quota_response and _read_bearer_token; before this, uv run pytest -q failed
  during collection in tests/test_codex_quota.py with ImportError: cannot import name
  _parse_quota_response from litehive.engines.quota.codex_quota. Verification run
  after the fix: uv run pytest tests/test_codex_quota.py -q (17 passed), uv run pytest
  tests/test_runner_workflow.py -q (118 passed), uv run pytest tests/test_stage_result_submission.py
  -q (11 passed), uv run pytest tests/test_feedback_cap.py -q (7 passed). I did not
  run the full repository suite because the task guidance for this workspace explicitly
  says never run the full suite; the specific full-suite collection blocker reported
  by acceptance is now fixed, and the targeted slices covering both the new workflow
  behavior and the broken quota import all pass.'
