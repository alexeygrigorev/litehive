verdict: pass
summary: 'Validated T-0243 with focused independent checks. Verified the implementing-stage
  prompt in litehive/agents/_prompts.py now explicitly tells SWE to: (1) if the requested
  behavior is already implemented, run verification and submit litehive report --verdict
  pass with explicit evidence, (2) never exit the stage without calling litehive report,
  (3) use litehive update to narrow scope or adjust acceptance criteria when the contract
  needs correction, and (4) use litehive close --outcome wont_do or duplicate when
  the task is obsolete. Verified the accepting-stage prompt now tells the reviewer
  to accept pre-implemented work with concrete verification evidence to normal done
  and reserve wont_do/duplicate/deferred for genuinely obsolete or duplicate tasks.
  Verified StageReport tracks submitted_via_cli and stage_report_from_subagent marks
  CLI-submitted verdicts accordingly, allowing the empty SWE guard in litehive/pipeline/core.py
  to distinguish a real CLI verdict from silent no-op exits. Verified the guard still
  rejects vague zero-change implementing passes by default, but now allows a zero-change
  implementing pass only when the report was submitted via CLI and explicitly states
  the work was already implemented and verified. Verified the acceptance blocker reported
  previously is fixed: litehive/engines/quota/codex_quota.py now re-exports compatibility
  symbols including _parse_quota_response and _read_bearer_token, and tests/test_codex_quota.py
  no longer fails during collection. Tests run: uv run pytest tests/test_codex_quota.py
  -q (17 passed in 0.09s), uv run pytest tests/test_runner_workflow.py -q (118 passed
  in 8.60s), uv run pytest tests/test_stage_result_submission.py -q (11 passed in
  0.31s), uv run pytest tests/test_feedback_cap.py -q (7 passed in 0.23s). I did not
  run the full repository suite in testing because this stage''s workspace guidance
  explicitly requires focused fast validation rather than a broad suite run; within
  that required scope, the changed behavior and the previously reported full-suite
  collection blocker are both validated.'
