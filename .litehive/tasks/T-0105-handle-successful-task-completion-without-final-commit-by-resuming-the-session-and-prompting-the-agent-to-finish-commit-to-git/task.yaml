goal: When a task finishes successfully but the final checkpoint commit has not been
  created yet, Litehive should resume or continue the runner-owned commit_to_git stage
  automatically instead of asking the agent to commit. In a worktree-based flow, this
  should finish the task-local commit and any required merge-back/integration step
  under runner control.
acceptance_criteria:
- Accepted task changes without a final checkpoint commit are detected automatically.
- Litehive resumes or continues the runner-owned commit_to_git path instead of treating
  the task as finished.
- Agents are not required to run git commit themselves for normal task completion.
- For worktree-backed tasks, the runner completes the commit and the merge-back or
  equivalent integration step deterministically.
