goal: Move engine adapters, invocation building, transcript parsing, quota checking,
  and session resume logic from litehive/agents/ into a heru/ package within the repo.
  litehive imports from heru instead of litehive/agents/adapters/. First step toward
  a separate heru package (see https://pypi.org/project/heru/).
acceptance_criteria:
- heru/ package exists at repo root with adapters for all engines (claude, codex,
  copilot, gemini, goz, opencode)
- Engine invocation building, transcript parsing, and quota checking live in heru/
- litehive/agents/ imports from heru/ instead of containing adapter code directly
- 'heru CLI entry point works standalone: heru ''prompt'' --engine claude'
- All existing litehive tests pass
- No functional changes - pure code move and re-export
constraints: []
plan:
- Create heru/ package at repo root with adapters/, quota/, models.py, types.py
- Move all 6 adapter pairs (claude, codex, copilot, gemini, goz, opencode) + common.py
- Move base.py (ExternalCLIAdapter contract, CLIExecutionResult, CLIInvocation)
- Move quota modules (claude, codex, copilot, zai)
- Move _models.py, _engine_detection.py, _sandbox.py, _continuation.py
- Create heru types.py with standalone versions of EngineUsageWindow, RuntimeEngineContinuation
  etc
- 'Split _prompts.py: generic prompt helpers to heru, stage orchestration stays in
  litehive'
- 'Split sandbox.py: generic backend logic to heru, LitehiveConfig integration stays'
- Update litehive/agents/ to import from heru/ instead of containing adapter code
- Add heru CLI entry point (heru 'prompt' --engine claude)
- Verify all litehive tests pass
