summary: 'Extracted the engine adapter layer into a new top-level heru package and
  converted litehive.agents adapter/base/quota modules into compatibility shims that
  import from heru. Added heru/__init__.py registry exports, heru/base.py, heru/adapters/
  for claude/codex/copilot/gemini/goz/opencode plus impl/common modules, heru/quota/
  helpers, heru/types.py and heru/models.py compatibility exports, heru/_engine_detection.py,
