title: Add duplicate task detection using sqlitesearch when creating tasks
created_at: '2026-04-17T13:23:09+00:00'
task_type: bugfix
pipeline_mode: full
priority: high
depends_on: []
goal: When litehive task add creates a new task, use sqlitesearch (https://github.com/alexeygrigorev/sqlitesearch)
  to maintain a full-text search index of task titles and goals. Before creating,
  search for similar existing tasks and warn about potential duplicates. This prevents
  the duplicate task problem we hit tonight (goz adapter tasks, web dashboard tasks
  recreated after deletion).
acceptance_criteria:
- sqlitesearch index is maintained with task titles and goals
- litehive task add warns when similar tasks already exist (queued, in_progress, or
  done)
- Duplicate warning shows task ID, title, and status of potential matches
