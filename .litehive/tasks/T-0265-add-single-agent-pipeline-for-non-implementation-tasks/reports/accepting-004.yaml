feedback: 'PASS: Verified the new pipeline-mode contract and the live CLI entrypoint
  for T-0265.


  What I verified:

  - `litehive add --mode single` persists `pipeline_mode: single`.

  - Default `litehive add` and `litehive add --mode full` persist `pipeline_mode:
  full`.

  - `--record-mode` still preserves independent `implementation` vs `tasks` task-record
  shaping.

  - Single-mode prompt framing tells the lone implementing agent it owns the full
  task outcome, should use the goal and acceptance criteria directly, should not assume
  later `testing` or `accepting` stages, and may finish at `done` without file changes.

  - Runner behavior remains correct for single mode (`implementing` only, then `done`
  with no changes or `commit_to_git` with changes) and full mode remains on the existing
  staged pipeline.


  Code evidence:

  - `litehive/cli/parsers/add.py` repurposes `--mode` to `full|single` and adds `--record-mode`.

  - `litehive/cli/tasks.py` derives `pipeline_mode` from `args.mode` with default
  `full` and keeps record mode independent.

  - `litehive/agents/_prompts.py` adds the single-mode end-to-end overlay.

  - `litehive/pipeline/core.py` still routes single mode through one worker stage
  plus optional commit.

  - `litehive/cli/__init__.py` uses injected `typer.Context` for the real `add` entrypoint
  so `uv run litehive add ...` works on Typer 0.24.1.


  Tests run:

  - `uv run pytest -q tests/test_task_commands_and_daemon.py -k "add_command and (pipeline_mode
  or record_mode or force_implementation_mode or persists_task_type or persists_pm_sizing
  or lacks_acceptance_criteria or allows_future_task)"` -> 8 passed

  - `uv run pytest -q tests/test_runner_workflow.py -k "full_mode_is_default_pipeline_mode
  or single_mode"` -> 6 passed

  - `uv run ruff check --select E402,F401 litehive tests` -> passed


  Direct CLI evidence:

  - `uv run litehive add "Research task" --workspace <tmpdir> --goal "Check docs"
  --acceptance-criteria "Answer is backed by repo evidence" --mode single` created
  a task whose `task.yaml` contains `mode: implementation` and `pipeline_mode: single`.

  - `uv run litehive add "Full task" --workspace <tmpdir> --mode full --record-mode
  tasks --task-type review` created a task whose `task.yaml` contains `mode: tasks`
  and `pipeline_mode: full`.


  Acceptance criteria status: all met.


  Note: `litehive add` still prints `priority` twice, but that output duplication
  is pre-existing and unrelated to this task.'
