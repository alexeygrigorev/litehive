feedback: 'VERDICT: PASS


  Verified the new pipeline-mode contract and single-agent behavior for T-0265.


  What I verified:

  - `litehive add --mode single` persists `pipeline_mode: single` and leaves record
  mode independent (`litehive/cli/parsers/add.py`, `litehive/cli/tasks.py`).

  - `litehive add` without `--mode`, and `litehive add --mode full`, persist `pipeline_mode:
  full`.

  - `--record-mode` preserves the existing `implementation` vs `tasks` record-shaping
  behavior independently of pipeline mode.

  - Single-mode prompt framing explicitly tells the lone implementing agent it owns
  the full task outcome, should use the goal and acceptance criteria directly, should
  not assume later testing/accepting stages, and may finish at `done` without file
  changes (`litehive/agents/_prompts.py`).

  - Runner behavior remains correct: single mode executes only `implementing`, then
  goes to `done` when `files_changed` is empty, or continues to `commit_to_git` when
  files were changed; full mode still follows the existing staged pipeline (`tests/test_runner_workflow.py`).


  Tests run:

  - `uv run pytest -q tests/test_task_commands_and_daemon.py -k "add_command and (pipeline_mode
  or record_mode or force_implementation_mode or persists_task_type or persists_pm_sizing
  or lacks_acceptance_criteria or allows_future_task)"` -> 8 passed

  - `uv run pytest -q tests/test_runner_workflow.py -k "full_mode_is_default_pipeline_mode
  or single_mode"` -> 6 passed

  - `uv run ruff check --select E402,F401 litehive tests` -> passed


  Direct CLI evidence:

  - `uv run litehive add "Research task" --workspace <tmpdir> --goal "Check docs"
  --acceptance-criteria "Answer is backed by repo evidence" --mode single` created
  a task with `mode: implementation` and `pipeline_mode: single`.

  - `uv run litehive add "Full task" --workspace <tmpdir> --mode full --record-mode
  tasks --task-type review` created a task with `mode: tasks` and `pipeline_mode:
  full`.


  Acceptance criteria status:

  - Met: `litehive add --mode single` creates a single-pipeline task.

  - Met: `litehive add` default and `--mode full` create full-pipeline tasks.

  - Met: single mode is framed and tested as one worker stage with direct goal/AC
  ownership, finishing at `done` without changes or routing to `commit_to_git` with
  changes.

  - Met: full mode behavior remains unchanged in the runner tests.


  Notes:

  - The `add` command still prints `priority` twice, but that is pre-existing output
  noise and unrelated to this task.'
