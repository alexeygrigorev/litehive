feedback: 'VERDICT: PASS


  Verified the pipeline-mode contract and the real CLI entrypoint for T-0265.


  What I verified:

  - `litehive add --mode single` persists `pipeline_mode: single` while keeping record
  mode independent.

  - `litehive add` without `--mode`, and `litehive add --mode full`, persist `pipeline_mode:
  full`.

  - `--record-mode` still preserves the existing `implementation` vs `tasks` task-record
  shaping independently of pipeline mode.

  - Single-mode prompt framing in `litehive/agents/_prompts.py` explicitly tells the
  lone implementing agent it owns the full task outcome, should use the goal and acceptance
  criteria directly, should not assume later `testing` or `accepting` stages, and
  may finish at `done` without file changes.

  - Runner behavior remains correct in `litehive/pipeline/core.py`: single mode executes
  only `implementing`, then goes to `done` when `files_changed` is empty or continues
  to `commit_to_git` when files were changed; full mode still follows the existing
  staged pipeline.

  - The live Typer entrypoint fix in `litehive/cli/__init__.py` is required in this
  environment: `add()` now uses injected `typer.Context` instead of `typer.get_current_context()`,
  so `uv run litehive add ...` works on Typer 0.24.1.


  Tests run:

  - `uv run pytest -q tests/test_task_commands_and_daemon.py -k "add_command and (pipeline_mode
  or record_mode or force_implementation_mode or persists_task_type or persists_pm_sizing
  or lacks_acceptance_criteria or allows_future_task)"` -> 8 passed

  - `uv run pytest -q tests/test_runner_workflow.py -k "full_mode_is_default_pipeline_mode
  or single_mode"` -> 6 passed

  - `uv run ruff check --select E402,F401 litehive tests` -> passed


  Direct CLI evidence:

  - `uv run litehive add "Research task" --workspace <tmpdir> --goal "Check docs"
  --acceptance-criteria "Answer is backed by repo evidence" --mode single` created
  a task whose `task.yaml` contains `mode: implementation` and `pipeline_mode: single`.

  - `uv run litehive add "Full task" --workspace <tmpdir> --mode full --record-mode
  tasks --task-type review` created a task whose `task.yaml` contains `mode: tasks`
  and `pipeline_mode: full`.


  Acceptance criteria status:

  - Met: `litehive add --mode single` creates a task that runs under single pipeline
  mode.

  - Met: `litehive add` default and `--mode full` create full-pipeline tasks.

  - Met: single mode is framed as one worker stage with direct goal/acceptance-criteria
  ownership, finishing at `done` without changes or routing to `commit_to_git` with
  changes.

  - Met: full mode remains unchanged in the runner behavior covered by the focused
  tests.


  Notes:

  - `litehive add` still prints `priority` twice, but that output duplication is pre-existing
  and unrelated to this task.'
