acceptance_criteria:
- litehive add --mode single creates a task that runs one agent and completes
- litehive add --mode full creates a task with the full pipeline (default)
- single mode runs one agent with the goal and acceptance criteria then marks done
  or commits
- full mode is unchanged from current behavior
