goal: Introduce a Docker-based sandbox for external engine execution so subagents
  run with controlled filesystem, network, and permission boundaries instead of broad
  unrestricted execution. Only the specific executor being used for that run should
  have its required binary, credentials, and environment propagated into the sandbox;
  unrelated provider credentials and executors must not leak into the container. The
  sandbox should be configurable per workspace and visible in task/run observability.
