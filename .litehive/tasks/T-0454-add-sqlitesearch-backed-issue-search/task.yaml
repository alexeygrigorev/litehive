goal: After sqlitesearch is integrated for duplicate detection, expose a user-facing
  way to search Litehive issues/tasks by natural-language query without scanning task
  files. Reuse the same maintained sqlitesearch index rather than building a second
  search path.
acceptance_criteria:
- A CLI entrypoint lets the user search issues/tasks with a free-text query and returns
  ranked matches with task ID and title.
- Search reads from the sqlitesearch-backed index introduced by T-0430 rather than
  scanning task YAML files on each query.
- Results include enough context to decide whether an existing issue/task already
  covers the query (for example title plus a short goal/snippet).
- Focused tests cover indexing/querying behavior, empty-result handling, and regression
  against the existing duplicate-detection index maintenance path.
