goal: |
  Root cause of repeated daemon outages: `_register_workspace` in
  litehive/config/workspace.py:172 does read-modify-write on
  ~/.config/litehive/workspaces.yaml with no locking, no atomic rename.
  Concurrent pytest processes corrupt it regularly — yesterday's 4-hour
  outage, and again today after compaction. Tests call
  `ensure_workspace(tmp_path)` hundreds of times, each one polluting the real
  global registry with pytest tmpdirs and racing each other.

  Two problems, one task:

  ### 1. Kill the yaml registry, put it in SQLite
  The registry is structured data that is read and written concurrently by
  multiple processes. That is exactly what SQLite is for. yaml + fcntl +
  os.replace is the wrong solution — SQLite already handles concurrent writes,
  atomic commits, and crash safety. One `workspaces` table, columns
  (workspace_id, path, last_seen). Reads and writes go through a single
  connection per process. No file lock, no atomic-write dance.

  Location: one global SQLite DB at `~/.local/share/litehive/litehive.db`
  (coordinates with T-0342). Per-workspace `data.db` stays as-is — this is
  the CROSS-workspace registry only.

  Delete `~/.config/litehive/workspaces.yaml` and the yaml read/write code
  entirely. One-time migration on first run: if the old yaml exists, import
  its entries into SQLite, then remove the file.

  ### 2. Tests must not touch the global registry
  Even with SQLite, tests should NOT be writing to the user's real global DB.
  Every `ensure_workspace(tmp_path)` call in a test registers that tmpdir as
  a workspace, polluting the user's registry and eventually filling it with
  thousands of dead pytest paths.

  Fix: conftest.py session fixture sets `LITEHIVE_HOME=<tmp>` (or
  `XDG_DATA_HOME=<tmp>`) so tests get a fully isolated global root. No
  monkeypatching individual path helpers — one env var, whole test session.

  ### Resilience
  - Daemon should survive a corrupt/missing global DB by rebuilding it from
    the CWD workspace marker, not by crashing. But with SQLite this becomes
    a much rarer failure mode than the yaml version.
  - Daemon's pool run loop should catch unhandled exceptions and restart the
    cycle (bounded retry) instead of exiting silently — corruption in one
    global file should not kill a 40-task backlog.

  ### Verification
  - Parallel pytest run (xdist -n 4) completes without touching the user's
    real `~/.local/share/litehive/litehive.db`
  - Grep confirms no remaining code path reads or writes `workspaces.yaml`
  - Daemon runs through 30+ task cycles without any global-state corruption
acceptance_criteria:
- "Workspace registry lives in a SQLite table, not yaml"
- "workspaces.yaml read/write code is deleted"
- "One-time migration on first run: if ~/.config/litehive/workspaces.yaml exists, import into SQLite and remove the old file"
- "conftest.py sets LITEHIVE_HOME (or XDG_DATA_HOME) to a tmp dir so tests never touch the user's real global registry"
- "Parallel pytest run (xdist -n 4) completes with the user's real registry untouched"
- "Daemon survives a corrupt/missing global DB without exiting the run loop"
