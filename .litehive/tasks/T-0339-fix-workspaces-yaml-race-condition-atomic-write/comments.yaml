    via new `litehive_database_path()` in `litehive/config/paths.py`.

    - Removed the YAML read/modify/write registry flow from `litehive/config/workspace.py`;
    `resolve_workspace()` / `ensure_workspace()` now read and write through the SQLite
    registry API.

    - Added one-time legacy migration: on first registry access, if `~/.config/litehive/workspaces.yaml`
    exists and is readable, entries are imported into the `workspaces` table and the
    YAML file is removed.

    - Removed the test-only `LITEHIVE_SKIP_REGISTRY` bypass. `tests/conftest.py` now
    gives the whole pytest session isolated `XDG_CONFIG_HOME`, `XDG_DATA_HOME`, and
    `XDG_STATE_HOME`, so tests exercise the real registry without touching the user-global
    one.

    - Added focused tests for SQLite registry bootstrap, legacy YAML migration/removal,
    parallel multi-process registration, and rebuilding after a corrupt global DB.


    Acceptance-criteria evidence

    - SQLite registry only: `litehive/config/workspace.py` no longer contains YAML
    registry logic; registry access is centralized in `litehive/config/workspace_registry.py`
    against SQLite table `workspaces(workspace_id, path, last_seen)`.

    - YAML read/write removed from live registry path: `rg -n "LITEHIVE_SKIP_REGISTRY|workspace_registry_path"
    tests litehive -S` now finds no live registry API usages; remaining `workspaces.yaml`
    references are the explicit legacy-migration helper/tests only.

    - One-time migration/removal verified by `tests/test_workspace_bootstrap.py::test_workspace_registry_migrates_legacy_yaml_once`.

    - Test isolation verified by session-scoped XDG fixture in `tests/conftest.py`
