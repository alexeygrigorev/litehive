    for `$HOME/.local/share/litehive/litehive.db` around `uv run pytest -q -n 4 tests/test_workspace_bootstrap.py
    tests/test_config.py`.

    - Corrupt/missing global DB resilience verified by `tests/test_workspace_bootstrap.py::test_workspace_registry_rebuilds_after_corruption`;
    the registry is rebuilt and `ensure_workspace()` succeeds instead of crashing.

    - Daemon-cycle recovery was intentionally not changed here per the embedded task
    update / T-0341 ownership; this task stays scoped to the workspace registry.


    Verification run

    - `uv run ruff check --select E402,F401 litehive tests` -> passed

    - `uv run pytest -q -n 4 tests/test_workspace_bootstrap.py tests/test_config.py`
    -> 89 passed

    - `uv run pytest -q` -> 519 passed, 5 skipped

