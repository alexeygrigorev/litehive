feedback: "Fixed the infinite flag/recover loop for T-0215 (analysis/planning task).\n\
  \nROOT CAUSE: The empty SWE guard in pipeline/core.py rejects implementing passes\
  \ that produce no file changes and no tests. Analysis/planning tasks legitimately\
  \ produce no code changes \u2014 their output is task records under .litehive/tasks/\
  \ which the guard filters out. When the guard rejects, the task gets flagged. Recovery\
  \ unflaggs and re-enters implementing. The guard rejects again. This loop repeated\
  \ 50+ times for T-0215.\n\nFIX (litehive/pipeline/core.py):\n1. Prior pass bypass:\
  \ If the task already has a prior implementing report with verdict=pass, skip the\
  \ guard. This handles re-entry via recovery where the work was already completed.\n\
  2. .litehive/tasks/ change detection: Track .litehive/tasks/ file changes separately\
  \ from code changes. If the only changes are under .litehive/tasks/ (planning output),\
  \ accept them as valid output instead of rejecting.\n\nTESTS (tests/test_runner_workflow.py):\n\
  - test_empty_swe_guard_skipped_when_prior_implementing_pass_exists: verifies the\
  \ guard is skipped when a prior implementing pass report exists (analysis task re-entering\
  \ implementing)\n- test_empty_swe_guard_rejects_when_no_prior_pass: verifies the\
  \ guard still rejects empty passes when no prior pass exists (original behavior\
  \ preserved)\n\nAll 113 runner workflow tests pass. The 1 pre-existing failure in\
  \ test_retry_commit_and_recovery.py is unrelated (stale monkeypatch target _commit_to_git_report).\n\
  \nACCEPTANCE CRITERIA:\n1. Current web dashboard code analyzed and documented: litehive/web/\
  \ package (3647 lines across __init__.py, actions.py, common.py, server.py, snapshot.py,\
  \ templates/index.html). HTTP surface documented in prior thread entries.\n2. Follow-up\
  \ tasks created for each feature area: T-0221 through T-0227 exist with clear scope\
  \ and acceptance criteria. 6 of 7 are already done.\n\nFiles changed: litehive/pipeline/core.py,\
  \ tests/test_runner_workflow.py"
