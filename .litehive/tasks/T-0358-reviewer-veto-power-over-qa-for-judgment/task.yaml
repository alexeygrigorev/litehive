goal: "When QA rejects a task N times but the after_implementing hook (ruff + pytest)\
  \ passes, the pipeline should route directly to accepting and let the reviewer make\
  \ the final call. This fixes the T-0325/T-0317 pattern where QA pedantically rejects\
  \ work that materially meets the acceptance criteria \u2014 tests pass, CLI works,\
  \ but QA keeps wanting stylistic changes. The reviewer represents the user/PM perspective\
  \ and should have authority to override QA on style-vs-substance disagreements."
acceptance_criteria:
- "1. Add rule to litehive/pipeline/rules.py: testing Reject \u2192 accepting when\
  \ stage_retry[testing] >= 2 AND state.last_report.hook_ok is True (not via retry_target=IMPLEMENTING)."
- "2. Reviewer prompt (litehive/pipeline/agents/reviewer.py) acknowledges when it's\
  \ being called after a QA override with the last QA rejection reason, and explicitly\
  \ says 'you can override QA if the work materially meets intent \u2014 tests pass\
  \ and hooks are green.'"
- 3. New test in tests/test_pipeline_v2_transitions.py exercising the QA-reject-then-reviewer-accept
  path.
- "4. Existing retry semantics preserved: implementing \u2192 testing retry still\
  \ allowed up to stage_retry_limit; only the final testing\u2192accepting bypass\
  \ is new."
