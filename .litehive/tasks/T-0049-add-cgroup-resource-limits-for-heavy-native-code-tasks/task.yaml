goal: Introduce explicit resource controls for subagent execution, especially for
  native-code projects such as Rust and C++. Use cgroups or equivalent container resource
  limits to cap memory, CPU, and process counts so out-of-memory conditions do not
  destabilize the host. OOM and limit events should be surfaced as structured task
  outcomes with clear reporting, and project profiles should be able to define sensible
  default limits for stacks like Rust/C++.
acceptance_criteria:
- Workspace configuration can define subagent resource limits for heavy native-code
  execution, including memory, CPU, and process-count caps, with validation and sensible
  defaults.
- Litehive applies those limits when launching subagents by using cgroups or an equivalent
  container/runtime resource-control mechanism, so heavy child processes cannot destabilize
  the host when limits are enabled.
- Native-code-oriented project profiles expose sensible default limits for at least
  Rust and C/C++ style workloads, while still allowing workspace overrides.
- When a subagent hits an OOM condition or another configured resource limit, Litehive
  records and surfaces a structured outcome with a clear reason in persisted task/runtime/session
  reporting rather than only a generic failed or blocked status.
- Observability surfaces the effective resource-control context and the resulting
  limit event clearly enough to diagnose why a task stopped.
- Focused automated tests cover config normalization, launch-time limit application,
  and structured reporting/classification for OOM or resource-limit failures.
