goal: 'Recovery is split between workspace/recovery.py (1037 lines, startup repair)
  and pipeline/_recovery.py (747 lines, execution recovery). Merge into pipeline/recovery/
  with clear separation: detection.py, workspace_repair.py, execution_recovery.py.'
acceptance_criteria:
- Single recovery package at pipeline/recovery/
- workspace/recovery.py removed, functions moved to pipeline/recovery/
- No function over 100 lines
- All existing tests pass
constraints:
- Keep changes scoped to consolidating recovery code and preserving current recovery semantics.
- Avoid user-visible workflow changes unless they are required to preserve the existing recovery contract.
plan:
- Inventory current recovery responsibilities, public entry points, and import sites
  across litehive.workspace.recovery, litehive.pipeline._recovery, CLI/status callers,
  queue ops, and tests.
- Create litehive/pipeline/recovery/ with explicit module boundaries such as detection.py,
  workspace_repair.py, and execution_recovery.py, plus package exports that preserve
  the intended public API.
- Move startup-repair and stale-runner reconciliation logic out of litehive.workspace.recovery
  into the new package, update callers, and keep report/state behavior unchanged.
- Move stage-recovery, commit-recovery, rollback, and recover logic out of litehive.pipeline._recovery
  into the new package, update imports/tests, and remove the old modules once callers
  are migrated or intentionally shimmed.
- Break up oversized recovery helpers so each touched function is at most 100 lines,
  then run the targeted recovery test suite followed by the full existing test suite
  required by the task.
