summary: 'Accepted after direct review and local verification. I inspected litehive/web/snapshot.py
  and confirmed read_engine_dashboard now attaches a normalized quota payload built
  from the existing litehive.engines.quota readers for codex, claude, copilot, and
  Z.AI-backed goz/opencode. The payload includes codex 5h and weekly used-percent
  windows with reset timestamps, claude 5h and 7d utilization windows, copilot premium
  remaining/entitlement plus reset date, and goz/opencode API-call and token windows
  with remaining quota. Error handling is fail-open: engines with missing credentials/CLI
  surface status=unavailable plus error details instead of breaking the dashboard.
  I inspected litehive/web/templates/index.html and confirmed the dashboard renders
  a dedicated Quota Status section and that refreshSnapshot fetches /api/snapshot
  first, then refreshes /api/engines asynchronously when engine data is not yet loaded,
  so page render is not blocked by quota reads on load. I ran uv run pytest tests/test_web_snapshot_lockfree.py
  -q -> 28 passed in 12.08s, which covers normalized quota serialization, unavailable
  fallback behavior, and /api/engines exposure. I also ran the full suite with uv
  run pytest -q -> 836 passed, 3 skipped in 110.48s. Based on code inspection plus
  passing focused and full regression tests, the acceptance criteria are met.'
