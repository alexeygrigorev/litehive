summary: 'Implemented engine quota status on the web dashboard. Added normalized quota
  payloads in litehive/web/snapshot.py for codex (5h + weekly used percent and reset),
  claude (5h + 7d utilization and reset), copilot (premium remaining/entitlement,
  used percent, reset), and Z.AI-backed goz/opencode (api calls + tokens windows with
  remaining quota). The payload is fail-open and returns unavailable/error details
  when credentials or CLIs are missing. Updated litehive/web/templates/index.html
  to render a new Quota Status section and changed page-load refresh flow so /api/snapshot
  renders first while /api/engines refreshes asynchronously, which avoids blocking
  the page on quota reads. Verification: uv run pytest tests/test_web_snapshot_lockfree.py
  -q (28 passed). Added focused tests covering quota normalization, unavailable fallback
  states, and API exposure of the new quota payload.'
