goal: Litehive should stop logging repeated JSONL parse warnings when Codex emits
  normal command_execution payloads whose command or aggregated output content breaks
  line-oriented JSONL parsing, while preserving the shared parser's warning behavior
  for genuinely malformed non-Codex input.
acceptance_criteria:
- Codex transcript, error, and usage parsing no longer emit JSONL parse warnings for
  the observed normal command_execution payload shape during focused test coverage.
- The fix lives in heru/adapters/_codex_impl.py and does not relax generic iter_jsonl_payloads
  warning behavior for unrelated malformed input.
- A focused regression test covers the command_execution payload shape or equivalent
  malformed-line case, and the existing relevant test suite passes.
constraints:
- Keep the change scoped to Codex adapter handling; do not move the fix into the litehive
  shim or broadly disable parser warnings.
- Prefer the smallest normalization or filtering change that preserves valid Codex
  event classification.
plan:
- Localize where Codex command_execution payloads reach shared JSONL parsing and identify
  the minimal adapter-layer interception point.
- Implement a targeted normalization or filtering path in heru/adapters/_codex_impl.py
  so normal command_execution payloads no longer trigger parse-warning spam.
- Add a focused regression test for the observed payload shape and run the relevant
  pytest coverage plus the existing smoke suite if practical.
