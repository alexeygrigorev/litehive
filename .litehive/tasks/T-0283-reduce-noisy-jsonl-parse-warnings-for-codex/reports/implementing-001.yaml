summary: 'Root cause was in Litehive sandbox infrastructure, not the Codex adapter
  change. The prior implementing attempt had already fixed the task scope in heru/adapters/_codex_impl.py
  and heru/adapters/codex.py, but full-suite completion was blocked by unrelated Litehive
  regressions in sandbox/worktree coverage. I verified and kept the Codex parser fix,
  then repaired the Litehive blocker in litehive/agents/sandbox.py by making the filtered
  system mirrors copy/link real files and preserve symlinks instead of creating sandbox-visible
  symlinks back to host paths, and by aligning the merge-resolver hidden git binary
  path with the wrapper mount. That removes the bubblewrap failures like bwrap: Can''t
  create file at /usr/bin/bash: No such file or directory. I also kept the worktree
  expectation update in tests/test_sandbox_git_profiles.py because _remove_origin_remote()
  is intentionally disabled, so task worktree creation should not claim to strip origin
  from shared config. A follow-up regression from the sandbox fix dropped the explicit
  engine-binary --ro-bind; I corrected that so existing launcher expectations still
  hold. Verification: uv run pytest -q tests/test_sandbox_git_profiles.py -> 11 passed;
  uv run pytest -q tests/test_runner_workflow.py::test_sandbox_launcher_wraps_selected_engine_with_bubblewrap_policy
