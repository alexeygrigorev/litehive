summary: 'Root cause: the implementing guard only works when StageReport.files_changed
  survives the CLI submission path, but the real litehive report flow dropped that
  field. Fix made: added repeated --files-changed support in litehive/cli/parsers/report.py,
  persisted it from litehive/cli/report.py into TaskThreadComment.files_changed, and
  restored it in litehive/agents/_parsing.py when rebuilding CLI-submitted StageReports.
  I also updated the CLI test helper and added regressions proving that CLI-submitted
  reports preserve claimed files and that an implementing CLI pass claiming foo.py
  on a clean worktree is rewritten by the existing guard to verdict=reject with outcome_reason_code=hallucinated_completion
  and journal evidence. Verified with uv run pytest -q tests/test_config.py -k report_parser
  ; uv run pytest -q tests/test_task_commands_and_daemon.py -k report_command_from_task_worktree_writes_to_main_workspace
  or report_command_uses_registry_outside_repo or report_command_fails_clearly_when_workspace_cannot_be_resolved
  ; uv run pytest -q tests/test_runner_workflow.py -k hallucinated_completion or empty_swe_guard
  or stage_report_from_subagent_marks_cli_verdict_source or preserves_cli_claimed_files
  ; repro script now prints files_changed=[foo.py] ; uv run ruff check --select E402,F401
  litehive tests. This stage should be retried: the production CLI path now preserves
  claimed files so the hallucinated_completion guard can reject bogus completion reports
  instead of treating them as empty passes.'
