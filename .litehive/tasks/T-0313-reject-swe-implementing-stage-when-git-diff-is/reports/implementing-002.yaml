summary: 'Implemented an implementing-stage hallucination guard in litehive/pipeline/core.py.
  Before allowing implementing -> testing, the runner now checks git status --porcelain
  in the task worktree; if the SWE report claims non-empty files_changed but the worktree
  is clean, the report is rewritten to verdict=reject with outcome_reason_code=hallucinated_completion,
  files_changed is cleared so the self-report is not trusted, a clear guard explanation
  is appended to the task journal, and the task is routed back to implementing. Legitimate
  no-op/preimplemented passes with empty files_changed are still allowed through by
  the existing verified-preimplemented path. I also added hallucinated_completion
  to the allowed outcome reason codes in litehive/models/common.py and extended the
  implementing retry routing so implementing-stage rejects requeue cleanly instead
  of spinning inside the same run. Added regression coverage in tests/test_runner_workflow.py
  for files_changed=[''foo.py''] with a clean git worktree, asserting reject routing,
  hallucinated_completion persistence, cleared files_changed, and journal evidence.
  Updated tests/test_recovery_agent.py so its git-backed fake executor now creates
  a real implementing-stage worktree change instead of falsely claiming one. Verification:
  uv run pytest -q tests/test_runner_workflow.py -k ''hallucinated_completion or empty_swe_guard''
  tests/test_recovery_agent.py::test_runner_records_blocked_recovery_report_when_preflight_cannot_be_repaired
  ; uv run ruff check --select E402,F401 litehive tests ; uv run pytest -q (979 passed).'
