id: T-0313
slug: reject-swe-implementing-stage-when-git-diff-is
title: Add implementing-stage filesystem guard for pass reports
created_at: '2026-04-10T14:54:31+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: Reject implementing pass reports when the worktree is clean, using live git-status
  evidence instead of trusting files_changed alone.
acceptance_criteria:
- The implementing stage runner verifies (via 'git status --porcelain' in the task
  worktree) that the worktree actually has changes before accepting a pass verdict
  from the SWE
- If the worktree is clean AND the SWE's stage report claims files_changed is non-empty,
  the report is rewritten to verdict=fail with reason_code=hallucinated_completion,
  and the stage routes back to implementing without trusting the self-report
- "If both worktree and report agree on no-op (genuine 'already done' with empty files_changed),\
  \ the stage is allowed through \u2014 this is the legitimate no-op case"
- The hallucinated_completion failure is recorded in the journal with a clear explanation
  so future retries see that the prior 'completion' was bogus
- 'Test: simulate a SWE that returns a completion report listing files_changed=[''foo.py'']
  but never actually modified foo.py. Assert the stage is rejected with hallucinated_completion.'
