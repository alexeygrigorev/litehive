goal: "Root cause of T-0240's multi-day confirmation-bias loop: the first SWE hallucinated\
  \ a completion report without actually invoking any file-edit tool. The report described\
  \ extensive file changes but 'git status' in the worktree was empty. Nothing in\
  \ the pipeline caught the discrepancy \u2014 the bogus report was accepted, persisted\
  \ in the task thread, and fed to every subsequent SWE retry as ground truth, causing\
  \ all 14 subagents across 5 pipeline passes to confirm the lie. Add a cheap deterministic\
  \ guard at the end of every implementing stage: compare the SWE's self-reported\
  \ files_changed against the actual 'git status --porcelain' in the worktree. If\
  \ the report claims any non-empty files_changed but the worktree is clean, the stage\
  \ fails with verdict=reject and reason 'agent reported changes but worktree is clean\
  \ \u2014 likely hallucination'. This is a one-line check that would have caught\
  \ the T-0240 hallucination on pass 1 and prevented it from poisoning the task thread."
acceptance_criteria:
- The implementing stage runner verifies (via 'git status --porcelain' in the task
  worktree) that the worktree actually has changes before accepting a pass verdict
  from the SWE
- If the worktree is clean AND the SWE's stage report claims files_changed is non-empty,
  the report is rewritten to verdict=fail with reason_code=hallucinated_completion,
  and the stage routes back to implementing without trusting the self-report
- "If both worktree and report agree on no-op (genuine 'already done' with empty files_changed),\
  \ the stage is allowed through \u2014 this is the legitimate no-op case"
- The hallucinated_completion failure is recorded in the journal with a clear explanation
  so future retries see that the prior 'completion' was bogus
- 'Test: simulate a SWE that returns a completion report listing files_changed=[''foo.py'']
  but never actually modified foo.py. Assert the stage is rejected with hallucinated_completion.'
