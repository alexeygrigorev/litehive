goal: The pipeline currently routes both agent crashes (Timeout, engine died, no verdict)
  and semantic rejections (QA says 'work doesn't meet acceptance criteria') to the
  same 'recovering' stage. The recovery agent can only fix the first kind. For judgment
  disagreements, it's 3+ wasted minutes before recovery_failed -> failed terminal.
  Should distinguish the two so recovery only runs for infrastructure crashes.
acceptance_criteria:
- 1. Add SemanticReject event emitted by QA/reviewer in agents when verdict=reject
  for reasons that aren't crash/timeout.
- '2. Rule table: Crash/Timeout -> recovering (as today); SemanticReject -> stage_retry_limit
  exhausted -> failed directly (skip recovery).'
- '3. Recovery agent prompt explicitly states: ''you fix infrastructure crashes, not
  judgment disagreements''.'
- 4. Integration test covering both paths.
