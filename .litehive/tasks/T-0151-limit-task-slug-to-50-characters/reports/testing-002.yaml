feedback: "## QA Verification \u2014 T-0151: Limit task slug to 50 characters\n\n\
  ### Acceptance Criteria\n\n1. **slugify() truncates output to at most 50 characters**\
  \ \u2014 PASS. Verified at litehive/tasks.py:1101-1111. max_length=50 default parameter,\
  \ truncation logic present. Manual test: slugify('this-is-a-very-long-task-slug-that-should-be-truncated-at-fifty-characters-or-fewer')\
  \ returns 44-char slug.\n\n2. **Truncation avoids cutting mid-word and strips trailing\
  \ hyphens** \u2014 PASS. rsplit(\"-\", 1)[0] at line 1110 ensures word-boundary\
  \ truncation. strip(\"-\") at line 1111 removes trailing hyphens. Fallback to hard\
  \ truncation (50 'a' chars) confirmed working.\n\n3. **Existing tasks with longer\
  \ slugs load and resolve correctly** \u2014 PASS. slugify() is only called at task\
  \ creation (lines 1600, 1678). task_dir() reads stored slug from task.yaml, never\
  \ re-slugifies. Directory scanning uses T-(\\d{4})- prefix pattern. No migration\
  \ needed.\n\n4. **Unit test covers slug truncation and word-boundary trimming**\
  \ \u2014 PASS. 5 tests in tests/test_slugify.py: short slugs unchanged, truncation\
  \ at 50 chars with word boundary, exactly 50 chars unchanged, word-boundary trimming,\
  \ empty/special-char input. All 5 pass.\n\n### Tests Run\n- `uv run pytest tests/test_slugify.py\
  \ -v` \u2014 5/5 passed\n- Manual verification via python -c confirmed truncation,\
  \ boundary trimming, and no trailing hyphens\n\n### Files Changed\n- litehive/tasks.py:\
  \ added max_length=50 parameter to slugify() with word-boundary-aware truncation\n\
  - tests/test_slugify.py: new file with 5 tests"
