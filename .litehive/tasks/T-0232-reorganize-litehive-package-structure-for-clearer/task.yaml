goal: 'Restructure the litehive package to have clearer domain boundaries. Key changes:
  (1) Merge engines/ + subagents/ into agents/ (adapters/ for CLI adapters, manager/prompts/parsing/session
  at top level). (2) Merge runner/ + runtime/ into pipeline/ (runner state machine
  + orchestration + commit + recovery + hooks + budget). (3) Slim down tasks/ to data
  + queue only, extract workspace state management (locking, status transitions, recovery,
  runtime tracking) into workspace/. (4) Move git_ops.py into git/ package. (5) Move
  events.py into observability/. All existing imports must keep working via re-exports
  during transition.'
acceptance_criteria:
- engines/ and subagents/ merged into agents/ with adapters/ subdirectory
- runner/ and runtime/ merged into pipeline/
- "tasks/ contains only data, CRUD, queue, paths, persistence \u2014 workflow/locking/recovery/status\
  \ transitions moved to workspace/"
- git_ops.py moved to git/ package
- events.py moved to observability/
- All existing tests pass without modification
- Old import paths work via re-exports (backward compat)
