summary: 'Implemented the package-boundary refactor with backward-compatible re-exports.
  Canonical packages now exist at litehive/agents (merged former engines + subagents,
  with adapters/ and quota/ plus manager/prompts/parsing/session helpers), litehive/pipeline
  (merged former runner + runtime), litehive/workspace (moved locking, workflow/state
  transitions, recovery, runtime tracking, task status helpers out of tasks), litehive/git
  (moved git_ops to git/ops.py with package exports), and litehive/observability/events.py
  (moved event persistence under observability). Existing legacy import paths continue
  to work via shim modules/packages under litehive.engines, litehive.subagents, litehive.runner,
  litehive.runtime, litehive.tasks.{locking,workflow,recovery,runtime_tracking,task_status},
  litehive.git_ops, and litehive.events. I also restored legacy private monkeypatch
  seams used by tests, especially under litehive.subagents._manager and litehive.tasks.locking.
  Verified with python -m compileall litehive, a direct import smoke test covering
  new and old module paths, and focused pytest slices: uv run pytest -q tests/test_tasks_and_subagents.py
  (61 passed, 3 skipped), uv run pytest -q tests/test_engine_variants_and_timeline.py
  (48 passed), uv run pytest -q tests/test_runtime_pool.py (64 passed), and uv run
  pytest -q tests/test_tasks_and_subagents.py::test_subagent_artifacts_capture_sandbox_metadata
  tests/test_tasks_and_subagents.py::test_subagent_artifacts_capture_structured_resource_limit_event
  tests/test_runtime_pool.py tests/test_observability_and_status.py (138 passed).
  This provides evidence for the accepted boundary moves plus backward-compat import
  coverage without modifying tests.'
