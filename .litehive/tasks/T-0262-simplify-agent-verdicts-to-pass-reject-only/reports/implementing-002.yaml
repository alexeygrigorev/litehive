summary: 'Implemented pass/reject-only agent verdict flow. Updated agent prompts and
  report guidance to offer only pass or reject, including grooming guidance that now
  tells planners to reject when context/criteria are insufficient instead of emitting
  blocked. Normalized agent-submitted legacy fail to reject across structured STAGE_RESULT
  parsing, litehive report CLI ingestion, task thread comments, and web verdict submission;
  agent-submitted blocked in structured stage results is also coerced away from agent-facing
  paths so blocked remains system-owned. Kept runner/system fail and blocked semantics
  intact for infrastructure errors, resource limits, and commit/recovery flows. Verified
  QA reject and reviewer reject both route back to implementing, and added regression
  coverage for legacy fail alias handling in parser/web flows plus updated engine/crash-resume
  expectations for reject-on-no-agent-verdict behavior. Verification: uv run pytest
  -q tests/test_stage_result_submission.py tests/test_web_snapshot_and_verdicts.py
  tests/test_runner_workflow.py (149 passed); uv run ruff check --select E402,F401
  litehive tests (passed); forbidden noqa gate check (passed); uv run pytest -q (903
  passed). Acceptance criteria met: agent prompts now advertise pass/reject only;
  litehive report accepts pass/reject and normalizes legacy fail to reject; blocked
  no longer appears on agent-facing verdict surfaces and remains system-generated;
  QA reject requeues to implementing same as acceptance reject; full suite passes.'
