goal: 'Agents currently submit pass/fail/reject/blocked verdicts. This causes routing
  confusion: fail triggers recovery instead of going back to SWE. Simplify to pass
  or reject only. If the agent cannot complete the work, that is a reject with an
  explanation. Blocked and fail are infrastructure concerns detected by the system,
  not by agents.'
acceptance_criteria:
- Agent prompt only offers pass and reject as verdict options
- litehive report CLI accepts pass and reject from agents
- If an agent submits fail, it is treated as reject (backward compat)
- blocked verdict only comes from system (hooks, missing deps, quota) never from agents
- QA reject routes back to implementing, same as acceptance reject
- All existing tests pass
