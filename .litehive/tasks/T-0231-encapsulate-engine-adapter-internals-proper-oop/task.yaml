goal: Engine adapters expose private implementation details (like _OPENCODE_STRIPPED_ENV_VARS)
  that leak into the registry in engines/__init__.py. Each adapter should encapsulate
  its own defaults (binary name, capabilities, stripped env vars, etc.) so the registry
  just instantiates adapters without knowing their internals. The registry should
  be a simple list of adapter classes, not a manually constructed dict with adapter-specific
  config.
acceptance_criteria:
- Each adapter class defines its own defaults (binary, capabilities, stripped_env_vars) internally
- engines/__init__.py registry is a simple instantiation without adapter-specific kwargs
- No private constants (_OPENCODE_STRIPPED_ENV_VARS etc) are exported from adapters/
- Adapter-specific functions (_codex_live_events, _OPENCODE_STRIPPED_ENV_VARS, etc.) become methods/attributes on their respective adapter classes, not standalone module-level functions
- All existing tests pass
- Public API (get_engine, ENGINES dict) unchanged
