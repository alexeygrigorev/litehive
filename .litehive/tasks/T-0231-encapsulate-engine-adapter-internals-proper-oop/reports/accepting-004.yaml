summary: 'EXPECTED behavior: the adapter encapsulation refactor should preserve existing
  engine behavior and all existing tests should pass, including Claude crash-resume
  flow resuming with the captured session ID. OBSERVED behavior: full-suite validation
  is not green. uv run pytest -q -x fails in tests/test_crash_resume.py::test_crash_resume_triggers_session_resume_for_claude
  with AssertionError: Expected at least one resume call, got calls: ... and the recorded
  failure summary shows grooming failed with unhandled error: name ''RuntimeEngineContinuation''
  is not defined. In the implementation, ClaudeCLIAdapter.extract_continuation() returns
  RuntimeEngineContinuation at litehive/engines/adapters/claude.py:154, but RuntimeEngineContinuation
  is not imported in that module at litehive/engines/adapters/claude.py:22-26, so
  Claude continuation extraction breaks at runtime and no resume call is issued. Steps
  to reproduce: 1) run uv run pytest -q -x from the repo root; 2) observe failure
  in tests/test_crash_resume.py::test_crash_resume_triggers_session_resume_for_claude;
  3) inspect litehive/engines/adapters/claude.py around lines 154-165. Acceptance
  criteria status: satisfied by inspection and focused tests: adapter defaults now
  live on adapter classes, litehive/engines/__init__.py instantiates from a simple
  adapter-class list without adapter-specific kwargs, private adapter internals are
  no longer exported from litehive.engines.adapters, and the existing public lookup
  API get_engine plus ENGINE_REGISTRY remains intact. Not satisfied: All existing
  tests pass, and therefore the task is not acceptable yet.'
