goal: If a running subagent produces no new stdout or events for 5 minutes, kill the
  process and fail the execution so the engine fallback or recovery agent can take
  over
acceptance_criteria:
- subagent processes that produce no stdout for 5 minutes are killed automatically
- killed subagent result is classified as a retryable execution error so engine fallback
  kicks in
- the timeout duration is configurable via config (default 5 minutes)
- the timeout check uses the live stdout file modification time, not wall clock from
  start
