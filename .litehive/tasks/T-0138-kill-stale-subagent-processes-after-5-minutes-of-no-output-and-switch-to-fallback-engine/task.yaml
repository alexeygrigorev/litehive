goal: If a running subagent produces no new stdout or events for 5 minutes, kill the
  process and fail the execution so the engine fallback or recovery agent can take
  over
acceptance_criteria:
- subagent processes that produce no stdout for 5 minutes are killed automatically
- killed subagent result is classified as a retryable execution error so engine fallback
  kicks in
- the timeout duration is configurable via config (default 5 minutes)
- the timeout check uses the live stdout file modification time, not wall clock from
  start
constraints: []
plan:
- Add a configurable subagent inactivity timeout setting with a 5-minute default and
  document how it is loaded from workspace/global config.
- Change live subagent artifact writes so stdout activity is reflected by real stdout
  file modification time rather than heartbeat rewrites with unchanged content.
- Detect stale live subagent stdout inactivity, terminate the recorded process, and
  classify the result as a retryable timeout/execution error so normal engine fallback
  routing engages.
- Add focused tests for config normalization, live stdout mtime based timeout behavior,
  and runtime fallback after a killed stale subagent.
