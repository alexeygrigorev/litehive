    - uv run pytest -q tests/test_retry_commit_and_recovery.py -k falls_back_from_codex_to_opencode_on_usage_limit


    Evidence against acceptance criteria:

    1. Stale subagents with no new stdout are killed automatically via pid SIGTERM
    once stdout mtime exceeds the configured timeout.

    2. The killed result is reported as retryable_execution_error with classification
    timeout, and runtime fallback switches engines after the timeout.

    3. Timeout duration is configurable in Litehive config and defaults to 300 seconds.

    4. Timeout detection is based on the live stdout.txt modification time, and unchanged
    heartbeat updates no longer refresh that file timestamp.'
