    PM sizing is moderate / m. No task-local runtime artifacts or prior reports exist
    for T-0138 yet, so grooming was based on targeted repo inspection.


    Relevant implementation path: litehive/runtime.py already falls through engine
    attempts when SubagentManager returns failure.kind=retryable_execution_error and
    the classification matches the retry policy. litehive/subagents.py is where live
    stdout/stderr artifacts are persisted and where execution failures are classified.
    litehive/config.py has no existing subagent inactivity timeout knob, so this task
    should add one there with a default of 300 seconds and normal config loading/serialization
    coverage.


    Important implementation constraint: ExternalCLIAdapter.run_live emits periodic
    heartbeat on_update calls even when no new bytes arrive, and SubagentManager._write_session_progress
    currently rewrites stdout.txt on every update. If implemented naively, stdout.txt
    mtime will stay fresh forever and the acceptance criterion about using live stdout
    file modification time will never trigger. The implementation should preserve
    stdout.txt mtime as a signal of real stdout growth, not heartbeat snapshot churn.


    Recommended execution plan for SWE:

    1. Add config for subagent inactivity timeout with default 5 minutes.

    2. Adjust live artifact persistence so unchanged stdout snapshots do not refresh
    stdout.txt mtime.

    3. Detect stale stdout inactivity during live execution, terminate the recorded
    subagent pid, and surface the result as retryable_execution_error with classification
    timeout.

    4. Add focused tests in config/subagent/runtime coverage for config loading, mtime-based
    timeout behavior, and engine fallback after the killed stale subagent.


    Tests run during grooming: none. Evidence gathered by inspection only.'
