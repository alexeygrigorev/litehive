- role: swe
  step: implementing
  verdict: pass
  message: 'Implemented stale live subagent timeout handling with configurable subagent_inactivity_timeout_seconds
    defaulting to 300 seconds. Live progress persistence now preserves stdout.txt
    mtime when stdout is unchanged, so inactivity is measured from the stdout artifact
    mtime instead of process start or heartbeat callbacks. When a live subagent exceeds
    the timeout, Litehive sends SIGTERM to the recorded pid, aborts the live adapter
    cleanly, converts the result into a retryable execution error classified as timeout,
    and runtime engine fallback continues through the existing fallback path.


    Verified with focused pytest coverage:

    - uv run pytest -q tests/test_config_and_run_cli.py -k subagent_inactivity_timeout
