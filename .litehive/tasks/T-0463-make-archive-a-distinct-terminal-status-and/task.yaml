id: T-0463
slug: make-archive-a-distinct-terminal-status-and
title: Make archive a distinct terminal status and forbid archive requeue
created_at: '2026-04-21T21:22:20+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: Separate archive from deletion in the task lifecycle. Archiving a task should
  change its terminal status to archived, move it out of the live queue, and keep
  it queryable as archived history. Archived tasks must not be requeued or resumed;
  operators should only create a new similar task instead of reviving an archived
  one.
acceptance_criteria:
- Archiving any task sets its persisted terminal status to archived.
- Archived tasks are excluded from the runnable queue and cannot be requeued, resumed,
  or switched active.
- CLI surfaces clearly distinguish archived from done/closed/deferred tasks.
- Attempting to requeue an archived task fails with an operator-facing message directing
  users to create a new task instead.
