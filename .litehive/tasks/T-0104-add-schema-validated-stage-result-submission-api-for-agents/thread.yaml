  message: '## Grooming complete for T-0104


    ### What I verified

    Explored the codebase to assess implementation state. The core schema-validated
    stage result API is substantially implemented: StageResultSubmission Pydantic
    model (extra=forbid) in models.py; _extract_stage_result_submission() + _format_stage_result_validation_errors()
    in engines/base.py; parse_stage_report_text() prefers structured STAGE_RESULT
    over text fallback; agent prompts instruct agents to emit STAGE_RESULT JSON.


    ### Gap: acceptance_criteria not forwarded

    Top-level acceptance_criteria in StageResultSubmission is accepted by the schema
    but silently dropped when building StageReport. The prompt example shows acceptance_criteria
    at the top level of STAGE_RESULT JSON, but this value never reaches task updates.
    Fix: when submission.acceptance_criteria is non-empty and task_update does not
    already set acceptance_criteria, merge it in before constructing StageReport.


    ### Gap: no dedicated tests

    No dedicated unit tests for the structured STAGE_RESULT path: valid all-fields
    parsing, extra-field rejection, missing required field, validation warning format,
    task_update forwarding.


    ### Goal

    Add a Pydantic-validated JSON submission format (STAGE_RESULT:) that agents use
    to report stage outcomes. Extra fields are rejected, validation errors surface
    as warnings and trigger text fallback, and all declared fields including acceptance_criteria
    are correctly routed into the pipeline.


    ### Acceptance criteria

    1. A valid STAGE_RESULT: JSON block produces a StageReport via the structured
    path (not text fallback) with correct verdict, summary, files_changed, tests,
    and warnings.

    2. A STAGE_RESULT: block with an extra (unknown) field is rejected: validation
    error appended as warning, parsing falls back to text.

    3. A STAGE_RESULT: block missing the required verdict field produces a human-readable
    validation warning and parsing falls back to text.

    4. acceptance_criteria at the top level of STAGE_RESULT are applied to the task
    record (same as task_update.acceptance_criteria).

    5. task_update fields inside STAGE_RESULT (goal, acceptance_criteria, pm_complexity)
    are applied to the task record after grooming.

    6. Dedicated unit tests cover valid structured submission, extra-field rejection,
    missing-field rejection, validation warning format, and acceptance_criteria forwarding.
    All existing tests pass.


    ### Plan

    1. In parse_stage_report_text (engines/base.py): merge submission.acceptance_criteria
    into task_update when non-empty and not already set.

    2. Add dedicated tests in a new tests/test_stage_result_submission.py covering
    all six acceptance criteria.

    3. Optionally update the prompt example to show acceptance_criteria inside task_update.


    PM_COMPLEXITY: simple

    PLANNED_EFFORT: s'
