goal: Introduce an explicit interrupted or resumable outcome for tasks that stop due
  to runner or subagent termination. Interrupted tasks should not become failed; they
  should preserve the last known stage and subagent context and support a first-class
  resume path back into execution.
acceptance_criteria:
- Tasks stopped by runner or subagent termination persist an explicit interrupted
  or resumable durable outcome instead of being treated as failed, flagged, or user-cancelled.
- Interrupted task state preserves the last known pipeline stage plus the most recent
  subagent context needed to diagnose and resume the run.
- Stale-runner recovery and in-process interruption handling converge on the same
  persisted interruption model rather than using separate ad hoc markers.
- Resuming an interrupted task is a first-class path that returns the task to execution
  at the preserved stage, subject only to existing intentional rerouting rules such
  as missing acceptance criteria.
- CLI and status/queue observability clearly surface interrupted or resumable tasks
  so they are distinguishable from normal queued, flagged, cancelled, or closed tasks.
- Focused tests cover durable interruption recording, stale recovery, preserved subagent
  context, and successful resume behavior without regressing existing review-requeue
  flows.
- 'Purpose: build a local-first deterministic coding workspace with YAML-backed task
