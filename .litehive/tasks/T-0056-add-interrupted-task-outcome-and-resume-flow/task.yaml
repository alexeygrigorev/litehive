- 'Implemented adapters: `codex`, `opencode`, `gemini`, `copilot`.'
- 'Planned later: `claude`.'
- 'Engine selection precedence: run override, then task preference, then workspace
  default.'
- 'The intended execution loop is: `grooming -> implementing -> testing -> accepting
  -> commit_to_git`.'
- QA rejection should return the same task to SWE; it should not become terminal failure.
- PM rejection should return the same task to SWE; it should not go back to backlog.
- Review rejection is normal iteration, not a final task outcome.
- '`failed` is not the desired long-term lifecycle state for review rejection; state-machine
  cleanup is planned.'
- Tasks that cannot be worked on right now should be parked or requeued, not dropped.
- Explicit non-implementation outcomes such as `wont_do`, `deferred`, or `duplicate`
  should stay visible with rationale.
- Any future state-machine change should update the durable state-machine documentation
  in the repo.
- 'Workspace locking should become granular: short atomic locks for active-task transitions,
  but queue intake and non-conflicting queue updates should remain possible while
  a runner is active.'
- Interrupted runners and subagents should become resumable states with recorded context
  rather than silent stale `running` state.
- Keep changes scoped to the current task.
- Prefer targeted tests over broad test suites.
- Use local YAML state under `.litehive/` as the source of truth.
- Do not invent extra persistence layers unless the task requires it.
- Prefer committed task outputs so completed changes are easy to revert and recover.
- '`codex` is currently used for self-hosted testing.'
- '`opencode` should run with model `zai-coding-plan/glm-5.1`.'
- '`gemini` and `copilot` adapters exist, but their usage should still be validated
  through real task runs.'
- '`claude` support is deferred and should remain opt-in because quota is limited.'
- When claude support is added, prefer Claude Sonnet for testing rather than Opus
  to reduce quota usage.
- '`opencode` must not inherit provider credential env vars; the adapter strips the
  same variables as the `oc()` wrapper from `~/.bashrc`.'
- 'Execution visibility is a first-class requirement: task runs should expose current
  stage, subagent status, transcript/output, and recent progress clearly.'
- Long pool runs should leave durable per-iteration logs so failures can be diagnosed
  after the fact.
- Live subagent state should be written to disk while the subagent is still running,
  not only after completion.
- Tasks may opt into human checkpoints before acceptance or commit; those pauses should
  stop the pool cleanly and leave the task queued at the next stage.
- If you add a new workflow or command, document it here so future runs inherit the
  same context.
- 'Orchestrator model: the local runner is the manager and owns stage routing.'
- 'Routing model: routing stays deterministic and local; subagents execute assigned
  stages but do not self-route.'
- 'Shared stages: grooming -> implementing -> testing -> accepting -> commit_to_git.'
- 'Role model: orchestrator-as-manager: `pm` grooms and accepts, `swe` implements,
  `qa` verifies.'
- 'Source of truth: tasks and implementation state live under `.litehive/`.'
- 'Task source of truth: issues or task records define scope; prompts and transcripts
  are supporting evidence.'
- 'TDD expectations: prefer test-first or test-tight changes and explain deviations.'
- 'Verification discipline: verification should be explicit, focused, and independent
  enough to catch regressions.'
- 'Acceptance flow: implementation must pass verification before acceptance.'
- 'Commit and recovery: successful tasks checkpoint to git; rollback and recover should
  remain deterministic.'
- General software project workflow with deterministic local orchestration.
- Favor incremental, reviewable changes over broad refactors.
- Keep implementation, verification, and acceptance evidence explicit.
- Start from the shared process contract, then add repository context and task data.
- Combine the generic base prompt with the selected project overlay instead of replacing
  the base.
- Apply stage defaults first, then append any project-specific stage overlay for that
  step.
- Keep stage prompts explicit about role, verification expectations, and final report
  format.
- No acceptance criteria defined.
- Structured acceptance criteria are still missing on the task record, but the current
  task context is sufficient to infer them.
- 'As the PM for grooming, either provide explicit `ACCEPTANCE_CRITERIA:` bullets
  or let the runner persist the inferred version by returning `VERDICT: PASS`.'
- 'You may return `VERDICT: PASS` without restating them; the runner will infer and
  persist the criteria after grooming.'
- 'If the current task context is not sufficient after all, return `VERDICT: BLOCKED`
  instead of passing grooming without criteria.'
- To override the inferred version, you may add an `ACCEPTANCE_CRITERIA:` section
  with concrete `- ` bullets that can be persisted directly.
- 'Return `VERDICT: BLOCKED` only if the inferred criteria are incomplete or incorrect
  and the task still needs more information.'
- 'The delivered change achieves the stated goal: Introduce an explicit interrupted
