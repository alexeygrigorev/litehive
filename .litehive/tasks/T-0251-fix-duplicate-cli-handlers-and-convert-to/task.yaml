goal: Replace the duplicated top-level CLI branching in litehive/cli/__init__.py with
  a single command dispatch table while preserving current command behavior, fallback
  behavior, and daemon/worktree subcommand error handling.
acceptance_criteria:
- Running each top-level CLI command routes through one unique handler path in litehive/cli/__init__.py,
  with no duplicate handler branches or duplicate github import helper imports remaining
  in that module.
- Top-level command execution is resolved by dictionary lookup rather than a long
  if/elif chain, while preserving the existing handlers and return codes for supported
  commands.
- Daemon subcommands are resolved by a dedicated dispatch table and still raise the
  same parser error when the daemon subcommand is missing or unsupported.
- The parser duplicate-detection regression guard and the existing CLI test suite
  relevant to command dispatch pass without requiring command name or argument changes.
constraints: []
plan:
- Inspect litehive/cli/__init__.py and group top-level commands, daemon subcommands,
  and worktree subcommands into explicit dispatch maps with the current handlers.
- Refactor main() to resolve commands through dict lookup, keeping the existing run-next-task
  and TUI fallback paths unchanged.
- Remove duplicate imports and duplicate handler branches, then run targeted CLI/parser
  tests that cover duplicate detection and dispatch behavior.
