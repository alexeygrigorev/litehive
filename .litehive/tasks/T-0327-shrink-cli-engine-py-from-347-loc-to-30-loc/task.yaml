goal: "litehive/cli/engine.py is 347 lines for what is effectively 'edit a dict in\
  \ yaml'. Keep the useful commands (freeze / unfreeze / status) but implement them\
  \ as thin wrappers over load_config + yaml.safe_dump.\n\n### Keep\n- `litehive engine\
  \ freeze <name> [--until <date>] [--reason <text>]` \u2014 set engine_freeze[name]\
  \ in .litehive/config.yaml\n- `litehive engine unfreeze <name>` \u2014 remove engine_freeze[name]\n\
  - `litehive engine status` \u2014 print current engine_freeze state + default engine\
  \ + engine capabilities one-line\n\n### Cut\n- Any ceremony for validating engine\
  \ names beyond 'is it in ENGINE_CHOICES from heru'\n- Any duration-parsing complexity\
  \ (accept ISO date only; keep it simple)\n- Any multi-step wizards or interactive\
  \ prompts\n- Duplication with status or config dump commands\n- Helper functions\
  \ that exist to format a freeze entry across three different contexts\n\n### Target\
  \ size\n~30 LOC for the three commands + ~10 LOC for a shared load/save helper.\
  \ Total ~40 LOC.\n\n### Preserve\n- engine_freeze config field structure\n- is_engine_frozen()\
  \ function in pipeline selector\n- active_engine_freezes()\n- The data the web dashboard\
  \ reads (if T-0324 hasn't deleted web yet)"
acceptance_criteria:
- litehive/cli/engine.py reduced to ~40 LOC total
- litehive engine freeze / unfreeze / status commands work
- engine_freeze config field and is_engine_frozen() unchanged
- All existing tests for freeze/unfreeze behavior pass
