feedback: "Implemented litehive self-heal recovery for external project orchestration.\n\
  \n## Changes\n\n**litehive/runtime/_recovery.py:**\n- Added branching logic in `_attempt_stage_recovery`:\
  \ when `failure_owner == \"litehive\"` and `litehive_source_path` exists on disk,\
  \ routes to the self-heal path instead of standard recovery\n- Added `_run_litehive_self_heal()`\
  \ function that:\n  - Creates a new SubagentManager with `execution_root=source_root`\
  \ (litehive source tree)\n  - Builds an enriched prompt with SELF-HEAL instructions,\
  \ traceback, and `uv run pytest -q` verification requirement\n  - Records fingerprint\
  \ to `task.runtime.self_heal_traceback_fingerprints` regardless of outcome (prevents\
  \ retry loops)\n  - Records recovery reports with trigger `litehive_self_heal` and\
  \ `failure_classification=\"litehive\"`\n- Fingerprint deduplication: if the same\
  \ traceback fingerprint was already attempted, skips self-heal and returns None\n\
  - Standard project/unknown recovery path is completely unchanged\n\n**tests/test_self_heal_recovery.py\
  \ (new, 6 tests):**\n- `TestClassifyFailureOwner::test_litehive_source_path_match`\
  \ - verifies litehive-owned classification\n- `TestClassifyFailureOwner::test_project_path_match`\
  \ - verifies project-owned classification\n- `TestSelfHealRecovery::test_self_heal_launches_agent_against_litehive_source`\
  \ - verifies self-heal agent receives SELF-HEAL prompt with traceback and pytest\
  \ instructions, SubagentManager gets execution_root=source_root, recovery report\
  \ has trigger=litehive_self_heal\n- `TestSelfHealRecovery::test_self_heal_skips_duplicate_fingerprint`\
  \ - verifies dedup prevents retry\n- `TestSelfHealRecovery::test_project_failure_uses_standard_recovery_path`\
  \ - verifies project failures are unchanged\n- `TestSelfHealRecovery::test_self_heal_failed_records_blocker_and_fingerprint`\
  \ - verifies failed self-heal records blocker and still saves fingerprint\n\n**tests/test_retry_commit_and_recovery.py\
  \ (updated 2 existing tests):**\n- Updated `test_attempt_stage_recovery_launches_recovery_agent_for_litehive_traceback`\
  \ to expect `litehive_self_heal` trigger and verify SELF-HEAL prompt content\n-\
  \ `test_attempt_stage_recovery_launches_agent_for_litehive_traceback_with_no_source_repo`\
  \ unchanged (missing source path correctly falls through to standard recovery)\n\
  \n## Acceptance criteria verification\n1. When failure_owner is litehive and litehive_source_path\
  \ is configured and exists, recovery agent launches with cwd=litehive_source_path\
  \ \u2713\n2. Recovery prompt includes traceback, failure context, and explicit instruction\
  \ to fix litehive source and run pytest \u2713\n3. Duplicate self-heal attempts\
  \ for same traceback fingerprint are skipped \u2713\n4. Project/unknown failures\
  \ use standard recovery path unchanged \u2713\n5. Test verifies litehive-owned recovery\
  \ path \u2713\n6. Test verifies project-owned recovery path unchanged \u2713\n\n\
  ## Tests run\n- `uv run pytest tests/test_self_heal_recovery.py tests/test_recovery_agent.py\
  \ tests/test_retry_commit_and_recovery.py -q` \u2192 99 passed\n\nSTAGE_RESULT:\n\
