goal: Whenever a task fails to complete cleanly at any stage (implementing, testing,
  accepting, commit_to_git, or any other), the state machine should always launch a
  recovery agent to investigate and try to fix the issue before flagging the task. The
  recovery agent is the last step before giving up, not an optional path. The pool
  should never stop on failure - it should recover or flag and move on.
acceptance_criteria:
- Recovery agent fires on any unclean task completion, not just specific stages
- Recovery agent gets the failure reason, stage, task context, and any relevant artifacts
- If recovery agent fixes the issue, the stage retries and succeeds
- If recovery agent cannot fix it, task is flagged with detailed diagnostics
- Pool continues in both cases - never stops on task failure
- Works for all failure types including commit_to_git merge failures, test failures, and agent crashes
