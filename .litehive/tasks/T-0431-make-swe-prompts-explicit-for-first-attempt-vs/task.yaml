id: T-0431
slug: make-swe-prompts-explicit-for-first-attempt-vs
title: Make SWE prompts explicit for first attempt vs rejection retry
created_at: '2026-04-17T15:27:25+00:00'
task_type: refactor
pipeline_mode: full
priority: high
depends_on: []
goal: Make retry-capable role prompts explicit about first attempt versus retry after
  rejection. Replace the current implicit pattern of one baseline instruction block
  plus a conditional last_rejection append with clearly named fresh and retry prompt
  variants selected from prompt state for swe, qa, reviewer, merge-resolver, and recovery.
acceptance_criteria:
- Retry-capable roles expose clearly named fresh and retry prompt or instruction sources
  at the role or base prompt-construction layer instead of hiding the distinction
  inside a single INSTRUCTIONS string plus serializer append.
- 'The selection logic is obvious in code: fresh prompt when no last_rejection applies
  to the current role or stage, retry prompt when last_rejection is present.'
- Retry variants for swe, qa, reviewer, merge-resolver, and recovery explicitly tell
  the agent to read the rejection carefully, rerun the cited reproduction or verification
  commands exactly when still applicable, fix the cited failures, and not escape through
  blocked or environmental claims without current evidence.
- serialize_prompt renders the already-selected variant cleanly; the last rejection
  section may remain for context, but it is not the only mechanism that conveys retry
  behavior.
- Tests cover both fresh and retry prompt paths and assert that retry-only guidance
  appears when last_rejection is set and the fresh variant appears otherwise.
constraints:
- Keep changes scoped to role prompt construction, prompt serialization, and tests
  for retry-capable roles only.
- Do not broaden this task into pipeline routing, rejection persistence, or unrelated
  prompt copy changes outside the explicit first-attempt versus retry split.
plan:
- Inspect the current prompt construction flow in roles/base.py, the retry-capable
  role modules, and prompt_serializer.py to identify where fresh versus retry intent
  is currently implicit.
- Refactor prompt construction so retry-capable roles define explicit fresh and retry
  prompt content and the base prompt builder selects the variant from last_rejection
  rather than relying on a conditional append to a single instruction block.
- Keep prompt serialization focused on rendering the chosen prompt variant plus rejection
  context, without making the serializer the only place that differentiates retries.
- Add or update focused prompt serializer tests for fresh and retry cases, covering
  SWE and at least one other retry-capable role so both paths are locked down.
