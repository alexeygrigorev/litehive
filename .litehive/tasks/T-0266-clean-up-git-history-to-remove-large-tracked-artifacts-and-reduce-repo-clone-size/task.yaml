acceptance_criteria:
- No reachable commit in the rewritten repository contains tracked execution-residue
  paths under .litehive/tasks/*/subagents/, .litehive/tasks/*/events.jsonl, .litehive/worktrees/,
  or .litehive/runtime/.
- The rewritten repository still contains the current durable project and Litehive
