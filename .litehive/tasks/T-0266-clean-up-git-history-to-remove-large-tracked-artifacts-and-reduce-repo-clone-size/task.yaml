  small (under 10MB)
acceptance_criteria:
- No reachable commit in the rewritten repository contains tracked execution-residue
  paths under .litehive/tasks/*/subagents/, .litehive/tasks/*/events.jsonl, .litehive/worktrees/,
  or .litehive/runtime/.
- The rewritten repository still contains the current durable project and Litehive
  state needed for normal use, including code plus tracked task metadata such as task.yaml,
  journal.md, thread.yaml, reports, and recovery manifests.
- After the rewrite is force-pushed to origin, a fresh full clone of the repository
  has a .git object database under 10MB on disk.
- Verification shows the largest historical blobs tied to prior Litehive execution
  residue are gone from reachable history after repack/prune.
