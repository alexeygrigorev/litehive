  has a .git object database under 10MB on disk.
- Verification shows the largest historical blobs tied to prior Litehive execution
  residue are gone from reachable history after repack/prune.
constraints: []
plan:
- 'Measure the current repository: identify the largest reachable blobs and confirm
  which transient Litehive paths must be removed from history while keeping durable
  task records.'
- Perform the history rewrite from a disposable mirror clone or other safe isolated
  copy using git-filter-repo, removing the transient Litehive paths from all refs
  and repacking the repository afterward.
- Verify the rewritten history locally by checking that the targeted paths and blobs
  are absent, that durable task metadata still exists at HEAD, and that the packed
  object database meets the under-10MB target in a fresh clone.
- Force-push the rewritten refs to origin only after local verification succeeds,
  then record the exact verification commands and resulting size metrics in the task
  report.
