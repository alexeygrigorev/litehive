goal: Add browser endpoints and UI controls for task lifecycle mutations so operators can create, edit, close, requeue, abandon, and stop tasks from the web dashboard using the same domain operations as the CLI.
acceptance_criteria:
- Task creation is available from the browser and captures title, goal, acceptance criteria, priority, dependencies, and pipeline mode.
- Task edit actions update the same fields exposed by litehive task update by reusing the existing metadata update path.
- Browser actions exist for close, requeue, abandon, and stop-active-task and call the same backend functions as litehive task close, litehive queue requeue, litehive task abandon, and litehive queue stop.
- Mutation endpoints return structured success and validation error payloads that let the browser refresh task and queue state deterministically.
- The browser UI includes confirmations and inline error handling for destructive task actions.
- Tests cover happy-path and invalid-state behavior for each task action endpoint.
