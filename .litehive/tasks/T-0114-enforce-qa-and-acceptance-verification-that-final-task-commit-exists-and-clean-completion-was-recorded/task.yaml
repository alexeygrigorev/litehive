goal: Enforce QA and acceptance verification that workflow/control-plane features
  are only considered done when the real end-to-end lifecycle works, including final
  checkpoint commit, resumability, and actual CLI behavior.
acceptance_criteria:
- QA rejects workflow features unless they are validated through the real litehive
  CLI/task lifecycle, not only isolated unit tests.
- A task that claims completion or commit reliability must prove that commit_to_git
  succeeds and records a final checkpoint commit.
- A task that claims resume or recovery behavior must prove that an interrupted task
  resumes from the correct stage in a real workspace run.
- A task that claims run-all or pool behavior must prove the behavior through the
  wrapper or real CLI execution, not only direct helper-function tests.
- Acceptance rejects features whose promise is broader than what QA actually demonstrated.
