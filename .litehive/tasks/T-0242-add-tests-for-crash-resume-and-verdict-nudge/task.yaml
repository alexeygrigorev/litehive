goal: 'The crash resume and verdict nudge logic in _builder.py has no dedicated test
  coverage for multi-engine scenarios. Add unit tests that verify: crash resume fires
  for engines with resume_id, nudge fires on timeout with thread_id, nudge uses exec
  fallback for codex.'
acceptance_criteria:
- 'Test: crash resume fires for claude (session_id)'
- 'Test: crash resume fires for codex (thread_id via exec)'
- 'Test: crash resume skips engines without resume_id (copilot, goz)'
- 'Test: verdict nudge fires on timeout when resume_id available'
- 'Test: nudge result replaces original result for report parsing'
- All tests pass within 60s timeout
constraints: []
plan:
- Map current builder branches for crash-resume and verdict-nudge to concrete engine-specific
  test cases, reusing existing workspace helper fixtures where possible.
- 'Add focused unit coverage for crash-resume across engines: claude resumes via session_id,
  codex resumes via thread_id-driven exec fallback, and engines without resume_id
  do not trigger a resume call.'
- Add focused unit coverage for verdict nudge on timeout when a resume_id exists,
  including codex nudge behavior and an assertion that the nudge result replaces the
  original execution for stage-report parsing.
- Run only the touched test modules first, then the narrow regression set covering
  crash-resume, stage-report parsing, and engine transcript handling, keeping the
  total verification under the 60s acceptance budget.
