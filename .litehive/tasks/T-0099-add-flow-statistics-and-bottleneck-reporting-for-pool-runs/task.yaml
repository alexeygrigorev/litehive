goal: Extend the pool run summary (pool-summary.txt and durable YAML under .litehive/logs/pool-runs/)
  with per-stage flow statistics derived from completed-task report YAMLs and a bottleneck
  field naming the pipeline stage with the highest average duration or most retries.
acceptance_criteria:
- After litehive run --drain completes, pool-summary.txt includes a flow_statistics
  section with per-stage counts (pass, fail, retry) and duration metrics (avg_seconds,
  min_seconds, max_seconds).
- pool-summary.txt includes a bottleneck field naming the pipeline stage with the
  highest average duration (ties broken by retry count).
- The durable YAML under .litehive/logs/pool-runs/ contains the same flow_statistics
  and bottleneck fields.
- Statistics cover only tasks processed in the current pool run (completed + flagged),
  not the full workspace history.
- Pipeline stages with no report data in the current run are omitted from flow_statistics
  rather than shown as zeros.
- All existing tests still pass.
- 'New focused tests verify: flow stats aggregation from mock report YAML data, bottleneck
  selection when stages differ, bottleneck tie-breaking by retry count, and correct
  inclusion of flow_statistics and bottleneck fields in pool_summary_report_lines
  output.'
constraints: []
plan:
- 'Add _compute_flow_statistics(root, task_ids) in litehive/cli/_pool.py: reads report
  YAMLs for the given task IDs, groups by step, computes pass/fail/retry counts and
  duration metrics per stage.'
- Add _identify_bottleneck(flow_stats) that returns the stage name with highest avg_seconds,
  tiebroken by retry_count.
- Extend _pool_summary_report_data to call these helpers with completed+flagged task
  IDs and add flow_statistics and bottleneck keys to the returned dict.
- Extend _pool_summary_report_lines to emit per-stage flow_statistics lines and a
  bottleneck line in the text output.
- Add focused tests in tests/test_observability_and_status.py covering the four bottleneck/aggregation
  cases.
