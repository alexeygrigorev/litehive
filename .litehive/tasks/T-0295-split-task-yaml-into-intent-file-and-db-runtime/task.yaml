goal: Today task.yaml mixes intent (goal, acceptance_criteria, plan, constraints,
  depends_on) with runtime state (status, pipeline_status, flag_count, git commit_sha,
  updated_at, runtime snapshot). Split so task.yaml on disk only contains intent fields
  and runtime lives in the SQLite task_state table.
acceptance_criteria:
- 'task.yaml on disk contains only: id, slug, title, created_at, task_type, mode,
  pipeline_mode, priority, pm_complexity, planned_effort, depends_on, goal, acceptance_criteria,
  constraints, plan, human_checkpoints, git.auto_commit, git.commit_message, created_from,
  upstream_origin, github_origin'
- Runtime fields (status, pipeline_status, updated_at, flag_count, flag_reason, git.commit_sha,
  git.worktree_path, git.checkpoint_*, retry_policy state, runtime.*) move to task_state
  table in DB
- TaskRecord.save() writes intent to file, state to DB transactionally
- TaskRecord.load() merges file intent + DB state into one runtime object
- litehive show displays both intent and state
- All tests pass
