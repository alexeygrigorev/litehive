goal: Detect stale subagent or runner processes when process state disagrees with
  task state, and recover the task at the same stage automatically as a fallback to
  event-based timeout handling.
acceptance_criteria:
- T-0125 only handles stale or missing process detection and state/process mismatch;
  it does not define the primary inactivity heartbeat.
- If the recorded subagent or runner pid is gone while the task still says running,
  recover the task at the same stage automatically.
