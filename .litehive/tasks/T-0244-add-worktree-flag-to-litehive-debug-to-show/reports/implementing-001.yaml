summary: 'Implemented litehive debug --worktree and cleared the existing regression
  blockers needed for a green suite. Verified the debug path still resolves the recorded
  task worktree, prints ''no worktree'' when unset or missing, lists uncommitted files
  from git status --porcelain --untracked-files=all, and lists committed-ahead files
  from git merge-base <main HEAD> HEAD plus git diff --name-only <fork-point> HEAD.
  Kept the parser/docs/context updates and fixed several backward-compatibility regressions
  uncovered during acceptance: resumed retry prompts now preserve the structured continuation
  handoff block; runtime shims for _builder and _recovery now alias the live pipeline
  modules so monkeypatch-based tests and callers affect the real implementation; pipeline
  core now imports _attempt_stage_recovery through the runtime compatibility surface
  in recovery paths; the daemon stop API again returns the historical JSON error shape
  when already stopped; and litehive.tasks.locking exposes fcntl again for lock-free
  snapshot tests. Tests run: uv run pytest tests/test_debug_command.py -q => 17 passed;
  uv run pytest tests/test_config_and_run_cli.py::test_engine_status_command_scopes_to_single_engine_and_shows_codex_quota
  -q => 1 passed; uv run pytest tests/test_retry_commit_and_recovery.py::test_run_next_task_reuses_structured_continuation_handoff_on_retry
  -q => 1 passed; uv run pytest tests/test_retry_commit_and_recovery.py::test_run_next_task_preserves_future_task_added_during_commit_failure
  -q => 1 passed; uv run pytest tests/test_retry_commit_and_recovery.py::test_runner_requeues_same_stage_after_successful_litehive_self_heal
  -q => 1 passed; uv run pytest tests/test_retry_commit_and_recovery.py::test_rollback_completed_task_restores_state_when_rollback_commit_fails
  -q => 1 passed; uv run pytest tests/test_web_daemon_monitor.py::test_web_daemon_api_returns_json_error_when_stop_requested_while_stopped
  -q => 1 passed; uv run pytest tests/test_web_snapshot_lockfree.py::test_build_workspace_snapshot_does_not_block_on_runner_lock
  -q => 1 passed; uv run pytest -q --maxfail=1 => 904 passed, 3 skipped. Evidence
  now satisfies all four acceptance criteria, including the existing-test-suite requirement.'
