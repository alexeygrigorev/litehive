  when the recorded path is missing, collects uncommitted files from ''git status
  --porcelain --untracked-files=all'', and collects committed-ahead files from ''git
  merge-base <main checkout HEAD> HEAD'' plus ''git diff --name-only <fork-point>
  HEAD''. Focused verification passed with ''uv run pytest tests/test_debug_command.py
