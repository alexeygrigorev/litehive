  command output contains ''5h_used: 100%'' and ''weekly_used: 34%'' but does not
  contain the expected string ''used_percent: 100.0''. Acceptance criteria status:
  criteria 1-3 are satisfied by code inspection plus the passing debug-command tests;
  criterion 4 (''All existing tests pass'' / existing behavior remains intact) is
  not satisfied because the suite currently fails.'
