goal: Define the canonical litehive task state machine with clear states, allowed
  transitions, and meanings for review rejection, blocking, parking, cancellation,
  done, and intentional non-implementation outcomes. The output must include durable
  documentation in the repo and matching implementation updates. Any future state-machine
  change should require updating the state-machine documentation as part of the same
  work.
acceptance_criteria:
- A `docs/state-machine.md` file exists in the repo with the canonical state machine,
  all `TaskStatus` values, all `PipelineStatus` stages, all allowed transitions from
  `_ROUTES`, all verdict meanings, all `OutcomeReasonCode` values, and specific explanations
  for review rejection, blocking, parking, cancellation, done, and intentional non-implementation
  outcomes.
- '`wont_do`, `deferred`, and `duplicate` are available as explicit `OutcomeReasonCode`
  values in `models.py` and are settable via a `litehive close` command (or equivalent)
  that marks a task terminal without running the pipeline.'
- 'The `retry_limit_exhausted` reason code in `models.py` is actually enforced in
  `runner.py`: when the rejection counter reaches `max_retries`, the runner transitions
  the task to `flagged` with `reason_code="retry_limit_exhausted"` instead of retrying
  indefinitely.'
- At least one test covers the retry-limit-exhausted path and asserts that the task
  ends as `flagged` with `reason_code="retry_limit_exhausted"`.
- '`docs/state-machine.md` is cross-referenced from `PLAN.md` and `README.md` as the
  authoritative state-machine reference.'
- A clearly visible note in `docs/state-machine.md` (and mirrored in `PLAN.md`) states
  that any change to `_ROUTES`, `TaskStatus`, `PipelineStatus`, or `OutcomeReasonCode`
  must be accompanied by an update to `docs/state-machine.md` in the same commit.
constraints: []
plan:
- 'Step 1 (models): Add `wont_do`, `deferred`, `duplicate` to `OutcomeReasonCode`
  Literal in `litehive/models.py`.'
- 'Step 2 (runner): Enforce `retry_limit_exhausted` in `litehive/runner.py` - after
  incrementing `rejections`, check `if rejections > self.max_retries` and terminate
  with `flagged` / `retry_limit_exhausted` instead of continuing the loop.'
- 'Step 3 (tasks/CLI): Add `close_task()` helper in `litehive/tasks.py` that sets
  a task to `cancelled` status with a caller-supplied `OutcomeReasonCode` (`wont_do`,
  `deferred`, `duplicate`, `execution_cancelled`); wire it to a `litehive close <task-id>
  --outcome <code> --reason <text>` CLI command in `litehive/cli.py`.'
- 'Step 4 (docs): Create `docs/state-machine.md` documenting all states, transitions
  table, verdict meanings, outcome codes, and the change-gate rule.'
- 'Step 5 (cross-refs): Add a brief "State machine" section to `PLAN.md` and `README.md`
  pointing at `docs/state-machine.md`.'
- 'Step 6 (tests): Add tests for (a) retry-limit-exhausted termination, (b) `close_task`
  with each non-implementation outcome code, (c) `litehive close` CLI command.'
