goal: 'Add endpoints to the web dashboard for daemon lifecycle management: start daemon,
  stop daemon, restart daemon, and show daemon status including PID and recent logs.
  The frontend should show daemon state and provide control buttons.'
acceptance_criteria:
- POST /api/daemon/start endpoint starts the workspace daemon
- POST /api/daemon/stop endpoint stops the workspace daemon
- POST /api/daemon/restart endpoint restarts the workspace daemon
- GET /api/daemon/status endpoint returns daemon PID, uptime, and recent log entries
- Frontend shows daemon status indicator (running/stopped) with start/stop/restart
  buttons
- Daemon log viewer in the frontend shows recent run-all logs with auto-refresh
