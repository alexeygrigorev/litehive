goal: Expose daemon lifecycle controls in the Litehive web monitor with JSON endpoints
  for start, stop, restart, and status, plus a dashboard panel that shows running/stopped
  state, PID, uptime, and recent run-all logs with polling-based refresh.
acceptance_criteria:
- When the workspace daemon is stopped, POST /api/daemon/start starts it and returns
  JSON showing daemon_status=running with the new PID for that workspace.
- When the workspace daemon is running, POST /api/daemon/stop stops it and returns
  JSON showing daemon_status=stopped; a follow-up status read shows no active daemon
  PID.
- When the workspace daemon is running, POST /api/daemon/restart replaces the daemon
  process and returns JSON with both the previous PID and the new PID.
- GET /api/daemon/status returns JSON for the current workspace that includes daemon
  state, PID when running, started_at-derived uptime, and recent run-all log previews.
- The web dashboard renders a daemon status panel with a running/stopped indicator
  plus start, stop, and restart controls wired to the daemon API.
- The dashboard refresh loop updates daemon status and recent run-all log output without
  a full page reload.
constraints:
- Reuse the existing daemon lifecycle helpers and workspace-local run-all log readers
  instead of duplicating daemon orchestration logic.
- Keep the web monitor local-only and scoped to the current workspace.
- Daemon control failures should return clear JSON errors to the frontend instead
  of hanging or silently failing.
plan:
- Add a daemon-status payload builder in the web layer that wraps existing daemon
  registry/status helpers and recent run-all log previews.
- Implement GET /api/daemon/status and POST /api/daemon/start, /api/daemon/stop, and
  /api/daemon/restart with consistent JSON success and error responses.
- Extend the monitor template and client script with a daemon control panel, button
  actions, and polling-based refresh of daemon state and logs.
- Add focused tests for daemon control endpoints, status payload shape, and dashboard
  behavior around lifecycle actions and refresh.
