id: T-0341
slug: daemon-level-recovery-if-a-task-can-t-be-launched
title: 'Daemon-level recovery: if a task can''t be launched, attempt one recovery
  session'
created_at: '2026-04-11T05:38:12+00:00'
task_type: null
mode: implementation
pipeline_mode: full
priority: critical
pm_complexity: null
planned_effort: null
depends_on:
