goal: Add a rescue command that scans all merge_failed tasks and attempts to recover
  their code by cherry-picking the non-task-metadata changes onto current main. Useful
  when the worktree completed all stages but the merge stalled (as with the T-0264/T-0269/T-0280
  incident tonight).
acceptance_criteria:
- litehive rescue-worktrees lists all merge_failed tasks and their worktree commits
- --apply flag cherry-picks each worktree commit onto main with conflict resolution
  strategy
- Skips .litehive/tasks/*/ metadata files during cherry-pick to avoid conflicts
- Reports which worktrees cherry-picked cleanly and which need manual work
