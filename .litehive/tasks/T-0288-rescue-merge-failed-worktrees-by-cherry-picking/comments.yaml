    \ from the applied patch so task artifact conflicts do not block feature-code\
    \ recovery.\n5. A clean or already-landed rescue should also finalize state: remove\
    \ the task from pending rescue visibility, clear any `unmerged_worktrees` entry\
    \ for that task, update task/journal evidence, and record the reconciled main\
    \ commit SHA or explicit no-op outcome.\n6. Add focused tests for preview output,\
    \ clean apply, metadata-skip behavior, manual-conflict reporting, already-landed/no-op\
    \ handling, and \u201Crerun preview no longer lists rescued task\u201D.\n\nTASK_UPDATE:\n\
    goal: Rescue merge_failed task worktrees by replaying recoverable code changes\
    \ onto current main without reintroducing per-task Litehive metadata conflicts.\n\
    acceptance_criteria:\n  - `litehive worktree rescue` lists each merge_failed task\
    \ that still has a recorded worktree, including the task id, recorded worktree\
    \ path, and the commit SHA(s) or commit count that are ahead of current main and\
    \ eligible for rescue.\n  - `litehive worktree rescue --apply` from a clean main\
    \ checkout cherry-picks each eligible task's recoverable commits onto main in\
    \ commit order and reports, per task, whether rescue applied cleanly, was already\
    \ landed/no-op, or now needs manual conflict resolution.\n  - Files under `.litehive/tasks/<task-id>-*/`\
    \ are excluded from the applied rescue patch, so task artifact conflicts do not\
    \ block recovery of the task's feature code.\n  - After a task is rescued cleanly\
    \ or recognized as already landed, rerunning the preview no longer lists it as\
    \ pending rescue, and the task/journal record the reconciled main commit SHA or\
    \ explicit no-op outcome.\nconstraints:\n  - Keep scope limited to merge_failed\
    \ worktree rescue; do not broaden this into generic workspace repair or doctor\
    \ autofix behavior.\n  - Prefer `litehive worktree rescue` as the public command\
    \ to stay aligned with the grouped CLI introduced by T-0264; add a hidden alias\
