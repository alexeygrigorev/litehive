- role: swe
  step: implementing
  verdict: pass
  message: 'Implemented `litehive worktree rescue` and wired it through the grouped
    CLI. Preview mode now scans merge_failed tasks with managed worktrees and prints
    task id, worktree path, and worktree commits ahead of current main. Apply mode
    requires a clean main/master checkout outside non-.litehive changes, then replays
    each candidate oldest-first with `git cherry-pick --no-commit`, drops per-task
    metadata under .litehive/tasks/<task-id>-*/ from the staged rescue patch, auto-resolves
    metadata-only conflicts by keeping main''s metadata, and reports per-task statuses
    as clean, already_landed, manual_conflict, missing_worktree, or no_commits. Successful
    clean/no-op rescues clear the task worktree path, remove the task from state.unmerged_worktrees,
    persist the reconciled main commit SHA, and append journal evidence so rerunning
    preview no longer lists rescued tasks. Added focused tests covering preview listing,
    clean apply with metadata skipping, already-landed/no-op reconciliation, manual-conflict
    reporting, and rerun preview hiding rescued tasks. Verification run: uv run pytest
    -q tests/test_task_commands_and_daemon.py -k ''worktree_rescue or worktree_ls
    or worktree_clean'' -> 7 passed; uv run ruff check --select E402,F401 litehive
    tests -> pass; forbidden noqa suppression guard -> pass. I also ran uv run pytest
    -q for the full repo; it failed in pre-existing sandbox/profile tests outside
    this change set: tests/test_sandbox_git_profiles.py::{test_no_git_profile_hides_git_from_path_and_absolute_paths,test_merge_resolver_profile_allows_safe_git_commands,test_merge_resolver_profile_rejects_force_push_and_logs_attention,test_merge_resolver_profile_rejects_filter_repo_and_reset_hard_origin,test_task_worktree_origin_is_removed_before_handoff}.
    Those failures were bubblewrap/path/profile issues and existing worktree-origin
    behavior, not in the rescue command paths touched here.'
