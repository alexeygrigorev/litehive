    \ to validate against in grooming.\n\nTests run:\n- `litehive doctor` -> pass\
    \ (`doctor: clean workspace=...`)\n- No automated pytest slice was run in grooming;\
    \ this stage was repo/task inspection only.\n\nImplementation guidance:\n1. Add\
    \ the rescue command under the worktree command group as the primary public surface:\
    \ `litehive worktree rescue`. If product insists on the old spelling from the\
    \ task text, keep `litehive rescue-worktrees` as a hidden compatibility alias\
