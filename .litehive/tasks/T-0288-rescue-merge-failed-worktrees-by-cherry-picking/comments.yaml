    \ updating task/state/journal data so rescued tasks are not offered again.\n \
    \ - Cover the feature with targeted command/recovery tests rather than broad end-to-end\
    \ suites.\npm_complexity: moderate\nplanned_effort: m\n\nVerdict: pass to implementing."
