summary: 'Accepted. I verified the new public surface is ''litehive worktree rescue''
  under the grouped worktree CLI and that parser wiring resolves command=worktree/worktree_command=rescue.
  Reviewed the implementation in litehive/cli/worktree.py and confirmed preview enumerates
  merge_failed tasks with managed worktrees, including task id, worktree path, and
  commits ahead of current main; apply mode requires a clean main/master checkout,
  cherry-picks candidate commits oldest-first with --no-commit, strips per-task metadata
  under .litehive/tasks/<task-id>-* and archive equivalents from the staged patch,
  auto-resolves metadata-only conflicts by keeping main''s metadata, and reports clean/already_landed/manual_conflict/missing_worktree/no_commits
  per task. I also verified finalize logic clears task worktree_path, removes state.unmerged_worktrees
  entries, records the reconciled main HEAD SHA for rescued/already-landed/no-op cases,
  and appends journal evidence so rescued tasks disappear from later preview runs.
  Verification run in this workspace: uv run pytest -q tests/test_task_commands_and_daemon.py
  -k ''worktree_rescue'' -> 4 passed, 115 deselected in 1.71s. Additional parser check:
  build_parser().parse_args([''worktree'',''rescue'',''--workspace'',''.'']) produced
  command=''worktree'', worktree_command=''rescue'', apply=False. Acceptance criteria
  met: preview listing, apply cherry-pick with metadata skipping, per-task clean/manual
  reporting, and post-rescue state cleanup/no-longer-listed behavior are all covered
  by the implementation and focused tests.'
