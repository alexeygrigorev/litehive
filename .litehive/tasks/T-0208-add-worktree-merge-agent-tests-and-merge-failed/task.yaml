goal: 'Cover the worktree rebase/merge flow with tests and add proper tracking for
  failed merges. Three parts: (1) Tests mocking the merge agent for all scenarios:
  rebase succeeds, rebase fails but merge succeeds, rebase fails and merge has conflict
  and agent resolves, rebase fails and merge has conflict and agent fails. (2) Add
  merge_failed pipeline status so tasks that fail worktree merge are tracked separately
  from generic flagged. (3) Keep a list of unmerged worktrees in state.yaml so they
  can be resolved later.'
acceptance_criteria:
- 'Tests cover: rebase success, merge success after rebase fail, agent resolves conflict,
  agent fails to resolve'
- Tests mock SubagentManager.run to simulate merge agent behavior
- merge_failed pipeline status exists and is set when worktree merge cannot be resolved
- state.yaml tracks unmerged worktrees with task ID and worktree path
- litehive status shows tasks with merge_failed status
- All tests pass
