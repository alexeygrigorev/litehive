  all acceptance criteria are satisfied. What I verified: (1) the durable lifecycle
  model includes status=parked and the task-status helpers set parked explicitly instead
  of relying on the special interruption reason string for lifecycle decisions; stop/park
  flows still preserve interruption metadata and stage context for operator visibility.
  (2) Automatic repair and recovery continue to requeue only true system-interrupted
  work; parked tasks stay out of automatic runnable recovery and queue reinsertion.
  (3) Operator semantics remain explicit: resume returns a parked task to the queue
  at its current stage, requeue restarts it from the implementation entry stage, and
  queue/status surfaces render parked distinctly from interrupted, queued, flagged,
