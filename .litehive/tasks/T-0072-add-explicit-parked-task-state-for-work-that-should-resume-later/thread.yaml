    Reviewer acceptance pass.


    What I verified:

    - The durable task model includes status=parked and lifecycle helpers route parked
    work by status instead of the special interruption reason string.

    - `litehive stop` preserves stage/interruption context and leaves non-commit work
    parked for manual operator action.

    - Repair/recovery requeues true system-interrupted tasks but does not automatically
    reinsert parked tasks.

    - `litehive resume` preserves the parked task''s current stage, while `litehive
    requeue` restarts it from the implementation entry stage.

    - Queue/status surfaces show parked work distinctly as resumable, and the state-machine
    docs now describe parked as an explicit lifecycle state.

    - Dirty-worktree gating now has explicit parked-vs-interrupted semantics: interrupted
    task-owned dirt keeps the gate open for automatic resumption, while parked task-owned
    dirt remains blocked until the operator resumes or requeues intentionally.


