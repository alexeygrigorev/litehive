id: T-0072
slug: add-explicit-parked-task-state-for-work-that-should-resume-later
title: Add explicit parked task state for work that should resume later
depends_on: []
task_type: null
engine: null
model: null
mode: implementation
pipeline_mode: full
status: deferred
flag_reason: null
pipeline_status: implementing
priority: medium
pm_complexity: moderate
planned_effort: m
created_at: '2026-04-01T06:36:00+00:00'
updated_at: '2026-04-09T05:07:51+00:00'
goal: Replace the current magic-string handling for user-stopped work with an explicit
  parked task lifecycle state so Litehive can distinguish resumable system interruptions
  from intentionally parked tasks in durable state, CLI output, repair logic, and
  status documentation.
acceptance_criteria:
- Task lifecycle models and transition logic support an explicit parked task status,
  and `litehive stop` records parked work through that status instead of relying on
  the interruption reason string `Task stopped via CLI`.
- Parked tasks stay out of automatic runnable recovery and queue reinsertion, while
  system-interrupted tasks remain resumable and continue to re-enter the runnable
  queue through repair and recovery flows.
- 'Operator flows remain explicit: `litehive resume` can return a parked task to the
  queue at its current stage, `litehive requeue` continues to mean restart from the
  implementation entry stage, and queue/status output makes parked work visibly distinct
  from interrupted, flagged, queued, and closed tasks.'
- Focused pytest coverage proves the parked versus interrupted behavior for stop,
  repair, dirty-worktree resume gating, and resume/requeue command semantics.
- '`docs/state-machine.md` and any user-facing lifecycle copy that currently describes
  parked tasks as special interrupted tasks are updated to match the explicit parked
  status contract.'
constraints:
- Keep changes scoped to task lifecycle state, recovery logic, CLI/status surfaces,
  focused tests, and the required state-machine documentation update.
- Preserve the existing meaning of explicit close outcomes `wont_do`, `deferred`,
  and `duplicate`; this task is about resumable parked work, not non-implementation
  closure.
- Do not weaken the current distinction between resume-from-current-stage and requeue-from-implementation-entry-stage.
plan:
- Add the explicit parked status to the durable task model and replace string-based
  parked detection helpers with status-based checks in task selection, stop, repair,
  and dirty-worktree gating paths.
- Update CLI commands and observability surfaces so stop/resume/requeue/status/queue
  expose parked work clearly and keep operator semantics unambiguous.
- Add focused tests covering parked versus interrupted lifecycle behavior and update
  the state-machine documentation to match the new contract.
