id: T-0235
slug: recovery-agent-must-diagnose-and-fix-litehive
title: Recovery agent must diagnose and fix litehive infrastructure bugs, not redo
  failed agent work
created_at: '2026-04-08T15:16:20+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: 'The recovery agent''s job is to analyze WHY an agent failed (check logs, stdout,
  stderr, session.yaml, exit codes), identify the bug in litehive''s own code, fix
  it, and submit a recovery verdict so the next run succeeds. It should NOT re-run
  tests or try to submit the failed stage''s verdict itself. Example: when agents
  consistently fail to submit verdicts, the recovery agent should check the subagent
  logs, discover that codex resume was broken or litehive report was targeting the
  wrong task, fix the litehive code, and report what it fixed.'
acceptance_criteria:
- 'Recovery agent prompt clearly states: your job is to fix litehive infrastructure,
  not redo the failed agent''s work'
- Recovery agent is given the failed subagent's stdout, stderr, session.yaml, and
  exit code in its prompt
- 'Recovery agent is told to check: did the agent produce output? did it try to call
  litehive report? what error did it get? what is the root cause in litehive''s code?'
- Recovery agent runs in the litehive source repo (not the task worktree) so it can
  fix litehive code
- Recovery agent submits its own verdict describing what it found and fixed, not the
  failed stage's verdict
- After recovery fixes litehive code, the failed stage is retried automatically with
  the fix in place
- All existing tests pass
constraints:
- The recovery agent must NEVER try to do the failed agent's job (run tests, submit
  the stage verdict, implement the task)
- The recovery agent works on litehive source code, not on the task's code
- "Recovery should be fast \u2014 diagnose from logs, fix one thing, verify, report"
plan:
- Rewrite the recovery agent prompt in litehive/subagents/_prompts.py and litehive/config/__init__.py
  (agent_startup_guidance.recovery)
- Include failed subagent artifacts (stdout, stderr, session.yaml, exit code, transcript)
  in the recovery prompt
- Make recovery agent run against litehive source, not the task worktree
- Update _attempt_stage_recovery in litehive/runtime/_recovery.py to pass diagnostic
  artifacts
- Add clear examples in the prompt of what recovery should do vs what it should NOT
  do
- Test with a mock failure scenario
