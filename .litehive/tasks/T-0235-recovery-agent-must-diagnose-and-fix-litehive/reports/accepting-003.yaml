summary: 'Accepted in review. I verified the implementation directly in the current
  worktree and reran the partitioned full pytest proof successfully. By inspection,
  the recovery startup guidance and recovery-role prompt now explicitly tell the recovery
  agent to diagnose why the previous agent failed, start from stdout/stderr/transcript/session
  metadata/exit code plus any litehive report attempt, fix Litehive infrastructure
  rather than redo the failed stage, submit its own recovery verdict, and preserve
  the legacy runnable-path wording expected by workflow tests. I also verified in
  litehive/runtime/_recovery.py that failed-subagent diagnostics are loaded into the
  prompt, the diagnosis checklist explicitly asks whether the agent produced output,
  whether it tried litehive report, what exact error it got, and what Litehive root
  cause should be fixed, recovery resolves to litehive_source_path when configured,
  falls back to the current Litehive workspace root only when no explicit source path
  is configured, blocks cleanly when no Litehive source repo is available, and successful
  recovery returns retry_decision=retry so the failed stage is retried automatically.
  I also confirmed the follow-on regressions are fixed: crash-resume journaling again
  records resuming <engine> session <id>, stale instance aliases no longer mask real
  run overrides in engine detection, and superseded raw subagent artifacts are pruned
  again. Test evidence from this acceptance pass: uv run pytest -q tests/test_archive.py
