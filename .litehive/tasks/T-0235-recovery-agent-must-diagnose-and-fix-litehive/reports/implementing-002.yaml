summary: 'Implemented and verified the recovery-agent infrastructure changes already
  staged in this worktree, then fixed two follow-on regressions discovered during
  finish-line verification: (1) restored live-engine detection so a rebound inherited
  ExternalCLIAdapter.run does not wrongly outrank inherited run_live in litehive/subagents/_engine_detection.py,
  and (2) re-enabled pruning of superseded raw subagent artifacts in litehive/subagents/_manager.py
  so older prompt/stdout/stderr/transcript files are cleaned up again while the latest
  subagent evidence remains available for recovery diagnostics. Focused verification
  that is green: uv run pytest -q tests/test_tasks_and_subagents.py -> 60 passed in
