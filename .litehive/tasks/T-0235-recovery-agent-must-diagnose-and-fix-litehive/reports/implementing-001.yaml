summary: 'Finished the recovery-agent hardening and closed the remaining finish-line
  regressions. I kept the recovery contract intact: recovery startup guidance still
  tells the agent to diagnose the prior agent failure, inspect stdout/stderr/transcript/session
  metadata/exit code plus any litehive report attempt, fix Litehive infrastructure
  instead of redoing the failed stage, run from the Litehive source repo when configured,
  and submit its own recovery verdict so the failed stage can be retried. Final implementation
  adjustments in this pass: moved built-in startup guidance out of litehive/config/__init__.py
  into litehive/config/startup_guidance.py so the config facade stays under the workspace
  bootstrap line-count constraint; restored the missing _prune_superseded_subagent_artifacts
  import in litehive/subagents/_manager.py so completed subagent runs prune superseded
  raw artifacts again without crashing timeline/fallback flows; and tightened litehive/subagents/_engine_detection.py
