summary: 'Verified T-0235 with focused independent recovery validation. Confirmed
  the default recovery startup guidance explicitly says the recovery agent must diagnose
  why the previous agent failed, fix Litehive infrastructure bugs, start from stdout/stderr/transcript/session
  metadata/exit code plus any litehive report attempt or error, and submit its own
  recovery verdict rather than redo the failed stage or report that stage verdict
  on the prior agent''s behalf (litehive/config/__init__.py, litehive/subagents/_prompts.py).
  Confirmed recovery runtime loads failed-subagent diagnostics from session.yaml/stdout.txt/stderr.txt/transcript.md,
  extracts exit code and litehive-report clues, injects them into the recovery and
  self-heal prompts, and asks the agent to check whether output was produced, whether
  litehive report was attempted, what exact error occurred, and what Litehive root
  cause should be fixed (litehive/runtime/_recovery.py). Confirmed recovery execution
  root selection runs against litehive_source_path when configured, falls back to
  the current Litehive workspace root only when no explicit source path is configured,
  blocks cleanly when a configured Litehive source checkout is missing, and marks
  successful recovery reports with retry_decision=retry so the failed stage is retried.
  Also confirmed the acceptance regressions remain fixed: the recovery role prompt
  still includes the legacy runnable-path wording expected by workflow tests, and
  Claude crash-resume journaling still records resuming claude session <id>. Tests
  run: uv run pytest -q tests/test_crash_resume.py::test_crash_resume_triggers_session_resume_for_claude
  tests/test_retry_commit_and_recovery.py::test_run_next_task_skips_retries_for_non_retryable_failure
  tests/test_runner_workflow.py::test_stage_prompt_uses_recovery_role_when_requested
  tests/test_runner_workflow.py::test_recovery_prompt_includes_default_startup_guidance
  -> 4 passed in 0.94s; uv run pytest -q tests/test_self_heal_recovery.py tests/test_recovery_agent.py
  -> 10 passed in 1.32s; uv run pytest -q tests/test_retry_commit_and_recovery.py::test_attempt_stage_recovery_returns_none_when_recovery_agent_fails
  tests/test_retry_commit_and_recovery.py::test_attempt_stage_recovery_launches_agent_for_litehive_traceback_with_no_source_repo
  tests/test_retry_commit_and_recovery.py::test_attempt_stage_recovery_launches_recovery_agent_for_litehive_traceback
  -> 3 passed in 0.70s. Acceptance criteria are satisfied by inspection plus these
  targeted regressions. I did not rerun the full suite in this QA pass.'
