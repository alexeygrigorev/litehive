summary: 'Verified T-0235 independently in the current worktree. By inspection, the
  recovery contract is intact: built-in recovery startup guidance now says the recovery
  agent must diagnose why the previous agent failed, start from stdout/stderr/transcript/session
  metadata/exit code plus any litehive report attempt, fix Litehive infrastructure
  bugs rather than redo the failed stage, and submit its own recovery verdict; the
  recovery role prompt in litehive/subagents/_prompts.py keeps that contract and still
  preserves the legacy runnable-path wording expected by workflow tests; litehive/runtime/_recovery.py
  still loads failed-subagent diagnostics from session.yaml/stdout/stderr/transcript,
  summarizes litehive report clues, resolves the recovery execution root to litehive_source_path
  when configured, falls back to the current Litehive workspace root only when no
  explicit source path is configured, blocks cleanly when no Litehive source repo
  is available, and marks successful recovery reports with retry_decision=retry so
  the failed stage is retried automatically. I also verified the follow-on fixes that
  were needed to get the suite green: litehive/subagents/_engine_detection.py no longer
  lets a stale instance alias mask a real class-level run override when deciding live
  vs non-live execution, litehive/subagents/_manager.py again imports and uses superseded
  subagent artifact pruning, and crash-resume journaling still records resuming <engine>
