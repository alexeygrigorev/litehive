summary: 'Grooming pass. Verified the current public Typer CLI around the reported
  regressions. Reproduced `queue promote` failure end to end with `python -m litehive.main
  queue promote T-0002 --workspace <tmp>`: exit 1, traceback ends with `AttributeError:
  module ''typer'' has no attribute ''get_current_context''`, and the queue stays
  unchanged. Inspected `litehive/cli/__init__.py` and found the same `typer.get_current_context()`
  misuse in 13 wrapper commands (issue/intake/debug/logs/list/show/move/promote/resume/abandon/close/update/cleanup),
  so implementation should replace that wrapper pattern with injected `typer.Context`
  or an equivalent supported context lookup; keep the change reviewable, but do not
  leave promote as a one-off if the same bug remains adjacent. Reproduced `task add`
  end to end via the Typer app with `--goal`, `--priority`, `--acceptance-criteria`,
  and `--depends-on`; current checkout persisted all fields correctly in `task.yaml`,
  so the reported add regression is not reproducible on this branch as described and
  may already be partially fixed or narrower than the prompt states. Underlying command
  functions already appear healthy; the gap is missing end-to-end Typer coverage.
  Recommended implementation plan: 1) add CliRunner regression tests that invoke the
  Typer app for `task add` and `queue promote`, asserting exit code, queue movement,
  and persisted task.yaml contents; 2) fix the Typer wrapper/context wiring in `litehive/cli/__init__.py`;
  3) if a narrower `task add` failure appears while writing the new tests, fix only
  the Typer binding/signature mismatch needed to make the public command persist options
  again; 4) run the new focused tests plus `uv run pytest -q tests/test_run_cli.py`.
  Evidence gathered: `python -m litehive.main task add --help` shows the expected
  options are registered; direct public-CLI scratch repro for `task add` successfully
  created a task with goal=Goal text, priority=high, acceptance_criteria=[''Criterion
  A''], depends_on=[''T-0001'', ''T-0002'']; direct public-CLI scratch repro for `queue
  promote` failed exactly as reported; focused baseline pytest run `uv run pytest
  -q tests/test_observability_and_status.py -k ''test_add_command_persists_acceptance_criteria
  or test_add_command_deduplicates_depends_on_ids'' tests/test_task_commands_and_daemon.py
  -k ''test_promote_command_resumes_flagged_task_to_front''` returned `1 passed, 208
  deselected`, reinforcing that the regression sits in the Typer wrapper layer rather
  than the underlying command functions. PM sizing recommendation: PM_COMPLEXITY simple,
  PLANNED_EFFORT s.'
