summary: 'Fixed the Typer wrapper regressions by replacing unsupported typer.get_current_context()
  calls in litehive/cli/__init__.py with injected typer.Context handling via a shared
  _ctx_command() helper. This fixes queue promote and the adjacent wrapper commands
  that were wired through the same broken pattern (issue/intake/debug/logs/list/show/move/promote/resume/abandon/close/update/cleanup).
  Added public Typer CLI regression coverage in tests/test_run_cli.py using CliRunner:
  one test invokes ''litehive task add'' with --goal, --priority, --acceptance-criteria,
  and comma-separated --depends-on, then verifies persisted task.yaml contents; another
  invokes ''litehive queue promote'' and verifies exit 0, ''position: 1'', and queue
  reordering. Verified with: uv run pytest -q tests/test_run_cli.py -k ''typer_task_add_persists_options_to_task_yaml
  or typer_queue_promote_moves_task_to_front'' (2 passed), uv run pytest -q tests/test_run_cli.py
  (36 passed), uv run ruff check --select E402,F401 litehive tests (passed), and the
  forbidden noqa suppression check (passed/no output). Evidence for acceptance criteria:
  task add now persists title/goal/priority/acceptance_criteria/depends_on through
  the public Typer app, including depends_on normalized to [''T-0001'', ''T-0002''];
  queue promote now runs through the Typer app without AttributeError and moves the
  requested task to the front.'
