task_type: null
pipeline_mode: full
priority: low
depends_on: []
goal: "litehive is used from multiple project directories, so global + project config\
  \ is the right model. But the current implementation has schema archeology and multiple\
  \ code paths that are not needed.\n\n### Keep\n- Two-layer config merge: defaults\
  \ + ~/.config/litehive/config.yaml (global) + ./.litehive/config.yaml (project)\n\
  - Deep merge behavior so project config can override any global setting\n- Walking\
  \ up from cwd to find .litehive/ (so `litehive` works from subdirectories of a project)\n\
  \n### Simplify or delete\n- **Workspace registry** (~/.litehive/workspaces.yaml\
  \ + $XDG_CONFIG_HOME/litehive/workspaces.yaml): two possible locations, entries\
  \ can be strings OR dicts with four possible key names (path / root / workspace\
  \ / repo_path). Schema archeology. Pick ONE location ($XDG_CONFIG_HOME/litehive/workspaces.yaml\
  \ is the XDG-compliant choice) and ONE schema (list of strings \u2014 each is a\
  \ workspace path). Delete _workspace_registry_paths and _iter_registry_workspace_roots\
  \ helpers in favor of a single ~10-line function.\n- **Registry discovery**: if\
  \ the simplified registry has 0 or 1 entries for most users, consider whether the\
  \ registry is even needed. If `litehive --workspace <path>` and cwd-walkup cover\
  \ 95% of cases, the registry may be cuttable. Decide during the task.\n- **Global\
  \ config merge**: keep the concept, simplify the code. Load defaults, load global\
  \ (if exists), load project (if exists), deep merge in order. ~20 lines instead\
  \ of the current spread across loading.py / paths.py / workspace.py.\n\n### Method\n\
  1. Enumerate every function in config/loading.py and config/workspace.py that touches\
  \ config or registry discovery.\n2. For each: classify as essential (covers a real\
  \ use case I will have with multi-project) or incidental (covers a schema variant\
  \ or fallback that never fires).\n3. Delete incidentals. Collapse essentials into\
  \ a few short functions.\n4. Update tests to match; delete tests for deleted fallbacks.\n\
  \n### Target\nFrom ~120 LOC of merge+registry ceremony down to ~40 LOC total. Keep\
  \ both config layers, kill the fallback maze.\n\n### Preserve\n- ~/.config/litehive/config.yaml\
  \ for global defaults (real use case for future multi-project usage)\n- Project-local\
  \ .litehive/config.yaml always wins\n- `litehive --workspace /path` explicit override\n\
  - cwd-walkup to find .litehive/ automatically"
acceptance_criteria:
- Two-layer config merge (global + project) preserved and still deep-merges correctly
- Workspace registry simplified to ONE location (~/.config/litehive/workspaces.yaml
  or $XDG_CONFIG_HOME equivalent) and ONE schema (list of paths)
- Multi-key dict schema (path/root/workspace/repo_path) and multiple registry locations
  removed
- config/loading.py merge ceremony reduced to roughly 40 LOC total
- '`litehive --workspace <path>` explicit override still works'
- cwd-walkup discovery still works
- All tests pass; tests for deleted fallback schemas removed
