goal: 'Simplify merge conflict handling in commit_to_git. The flow is: (1) try git
  merge, (2) if conflict, launch merge agent ONCE, (3) if merge agent resolves it,
  done, (4) if merge agent fails, declare task failed, (5) launch recovery agent once,
  (6) if recovery resolves it, done, (7) if recovery fails, declare task recovery_failed
  and move on. No retries, no loops. T-0141 had 90 merge agent launches for the same
  conflict - this must never happen again.'
acceptance_criteria:
- Merge agent is launched exactly once per merge conflict
- If merge agent fails, task is declared failed
- Recovery agent is launched once after merge failure
- If recovery also fails, task status is recovery_failed
- recovery_failed tasks are left for manual resolution
- No loops - at most 1 merge agent + 1 recovery agent per conflict
- Journal logs each step clearly
