feedback: "## Implementation Complete: Merge agent retry limit for commit_to_git\n\
  \n### Changes Made\n\n1. **litehive/models.py** \u2014 Added `merge_agent_attempts:\
  \ int = 0` to `GitSettings`. Tracks how many times the merge agent has been launched\
  \ for a task.\n\n2. **litehive/runner/states.py** \u2014 Added `RECOVERY_FAILED\
  \ = \"recovery_failed\"` to `PipelineState`. New terminal state for tasks where\
  \ both merge and recovery agents failed.\n\n3. **litehive/runtime/_commit.py** \u2014\
  \ Guarded merge agent launch: checks `task.git.merge_agent_attempts >= 1` before\
  \ launching. If already attempted, skips the agent and logs a journal entry. On\
  \ first attempt, increments counter and persists via `save_task()` before launching.\n\
  \n4. **litehive/runner/core.py** \u2014 When `target == \"flagged\"` for commit_to_git\
  \ stage and recovery agent returns None (failed), sets `task.status = \"recovery_failed\"\
  ` instead of `\"flagged\"`, with a clear journal entry.\n\n5. **litehive/tasks.py**\
  \ \u2014 Added `task.git.merge_agent_attempts >= 1` guard to `_should_recover_flagged_commit_stage_task()`,\
  \ preventing the daemon repair loop from requeuing tasks that already had a merge\
  \ agent attempt.\n\n6. **tests/test_commit_recovery_bug.py** \u2014 3 new tests:\n\
  \   - `test_merge_agent_launches_exactly_once`: Verifies agent launches on first\
  \ attempt but NOT on second (counter guard works)\n   - `test_recovery_failed_blocks_repair_requeue`:\
  \ Verifies repair skips recovery_failed tasks\n   - `test_merge_attempts_blocks_repair_requeue`:\
  \ Verifies repair skips flagged tasks with merge_agent_attempts >= 1\n\n### Acceptance\
  \ Criteria Verification\n- Merge agent launched exactly once per conflict: counter\
  \ guard in _commit.py + test proves it\n- Failed merge declares task failed: existing\
  \ behavior preserved, verified by test\n- Recovery agent launched once after merge\
  \ failure: existing routing in core.py, unchanged\n- Failed recovery sets status\
  \ to recovery_failed: new routing in core.py line 691\n- recovery_failed tasks left\
  \ for manual resolution: not in any runnable status set, repair skips them\n- No\
  \ loops: counter + repair guard + terminal state = at most 1 merge + 1 recovery\
  \ per conflict\n- Journal logs each step: entries at merge skip, merge launch, and\
  \ recovery_failed declaration\n\n### Test Results\n- test_commit_recovery_bug.py:\
  \ 8 passed (5 existing + 3 new)\n- test_retry_commit_and_recovery.py: 89 passed\
  \ (no regressions)\n- test_recovery_agent.py: 4 passed (no regressions)"
