feedback: "## Implementation Summary\n\nImplemented retry limit for merge agent in\
  \ commit_to_git to prevent the infinite loop that caused T-0141's 90 merge agent\
  \ launches.\n\n## Changes Made\n\n### 1. `litehive/models.py` \u2014 Added `merge_agent_attempts:\
  \ int = 0` to `GitSettings`\nTracks how many times the merge agent has been launched\
  \ for this task.\n\n### 2. `litehive/runner/states.py` \u2014 Added `RECOVERY_FAILED\
  \ = \"recovery_failed\"` to `PipelineState`\nNew terminal state for tasks where\
  \ both merge agent and recovery agent failed.\n\n### 3. `litehive/runtime/_commit.py`\
  \ \u2014 Guarded merge agent launch\nBefore launching the merge agent, checks `task.git.merge_agent_attempts\
  \ >= 1`. If already attempted, skips the agent and logs a journal entry. On first\
  \ attempt, increments the counter and persists before launching.\n\n### 4. `litehive/runner/core.py`\
  \ \u2014 Route commit_to_git failure to recovery_failed\nWhen `target is None` (fail/reject/blocked\
  \ for commit_to_git) and recovery doesn't resolve it, sets `task.status = \"recovery_failed\"\
  ` instead of `\"flagged\"`, with a clear journal entry.\n\n### 5. `litehive/tasks.py`\
  \ \u2014 Guard repair from requeuing\nAdded `task.git.merge_agent_attempts >= 1`\
  \ check to `_should_recover_flagged_commit_stage_task()`. Combined with `recovery_failed`\
  \ not being in the eligible-for-execution statuses, this prevents the daemon repair\
  \ loop from requeuing these tasks.\n\n### 6. `tests/test_commit_recovery_bug.py`\
  \ \u2014 3 new tests\n- `test_merge_agent_launches_exactly_once`: Creates a merge\
  \ conflict, verifies agent launches on first attempt but NOT on second attempt (counter\
  \ guard works).\n- `test_recovery_failed_blocks_repair_requeue`: Verifies `_should_recover_flagged_commit_stage_task`\
  \ returns False for recovery_failed tasks.\n- `test_merge_attempts_blocks_repair_requeue`:\
  \ Verifies `_should_recover_flagged_commit_stage_task` returns False when merge_agent_attempts\
  \ >= 1.\n\n## Acceptance Criteria Verification\n- \u2705 Merge agent is launched\
  \ exactly once per merge conflict (counter guard in _commit.py + test)\n- \u2705\
  \ If merge agent fails, task is declared failed (existing behavior preserved)\n\
  - \u2705 Recovery agent is launched once after merge failure (existing behavior\
  \ in runner/core.py)\n- \u2705 If recovery also fails, task status is recovery_failed\
  \ (new routing in core.py)\n- \u2705 recovery_failed tasks are left for manual resolution\
  \ (not eligible for execution, repair skips them)\n- \u2705 No loops \u2014 at most\
  \ 1 merge agent + 1 recovery agent per conflict (counter + repair guard + terminal\
  \ state)\n- \u2705 Journal logs each step clearly (entries at merge skip, merge\
  \ launch, and recovery_failed)\n\n## Test Results\n- tests/test_commit_recovery_bug.py:\
  \ 8 passed (including 3 new)\n- tests/test_retry_commit_and_recovery.py: 89 passed\
  \ (no regressions)\n- tests/test_recovery_agent.py: 4 passed (no regressions)\n\n\
