    \ = \"recovery_failed\"` to `PipelineState`\nNew terminal state for tasks where\
    \ both merge agent and recovery agent failed.\n\n### 3. `litehive/runtime/_commit.py`\
    \ \u2014 Guarded merge agent launch\nBefore launching the merge agent, checks\
    \ `task.git.merge_agent_attempts >= 1`. If already attempted, skips the agent\
    \ and logs a journal entry. On first attempt, increments the counter and persists\
    \ before launching.\n\n### 4. `litehive/runner/core.py` \u2014 Route commit_to_git\
    \ failure to recovery_failed\nWhen `target is None` (fail/reject/blocked for commit_to_git)\
    \ and recovery doesn't resolve it, sets `task.status = \"recovery_failed\"` instead\
    \ of `\"flagged\"`, with a clear journal entry.\n\n### 5. `litehive/tasks.py`\
    \ \u2014 Guard repair from requeuing\nAdded `task.git.merge_agent_attempts >=\
    \ 1` check to `_should_recover_flagged_commit_stage_task()`. Combined with `recovery_failed`\
    \ not being in the eligible-for-execution statuses, this prevents the daemon repair\
    \ loop from requeuing these tasks.\n\n### 6. `tests/test_commit_recovery_bug.py`\
    \ \u2014 3 new tests\n- `test_merge_agent_launches_exactly_once`: Creates a merge\
    \ conflict, verifies agent launches on first attempt but NOT on second attempt\
    \ (counter guard works).\n- `test_recovery_failed_blocks_repair_requeue`: Verifies\
