    \ tasks.\n- `test_merge_attempts_blocks_repair_requeue`: Verifies `_should_recover_flagged_commit_stage_task`\
    \ returns False when merge_agent_attempts >= 1.\n\n## Acceptance Criteria Verification\n\
    - \u2705 Merge agent is launched exactly once per merge conflict (counter guard\
    \ in _commit.py + test)\n- \u2705 If merge agent fails, task is declared failed\
    \ (existing behavior preserved)\n- \u2705 Recovery agent is launched once after\
    \ merge failure (existing behavior in runner/core.py)\n- \u2705 If recovery also\
    \ fails, task status is recovery_failed (new routing in core.py)\n- \u2705 recovery_failed\
    \ tasks are left for manual resolution (not eligible for execution, repair skips\
    \ them)\n- \u2705 No loops \u2014 at most 1 merge agent + 1 recovery agent per\
    \ conflict (counter + repair guard + terminal state)\n- \u2705 Journal logs each\
    \ step clearly (entries at merge skip, merge launch, and recovery_failed)\n\n\
    ## Test Results\n- tests/test_commit_recovery_bug.py: 8 passed (including 3 new)\n\
    - tests/test_retry_commit_and_recovery.py: 89 passed (no regressions)\n- tests/test_recovery_agent.py:\
    \ 4 passed (no regressions)\n\nSTAGE_RESULT:\n{\"verdict\":\"pass\",\"summary\"\
