    \ New tests are needed for engines that DO provide resume IDs.\n\n### Plan for\
    \ implementation\n\n1. **Remove claude guard in crash resume** (`_builder.py:209-213`):\
    \ Change the condition from `engine_name == \"claude\" and continuation is not\
