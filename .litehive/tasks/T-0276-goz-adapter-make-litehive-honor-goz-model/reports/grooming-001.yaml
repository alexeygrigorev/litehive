summary: 'Grooming pass. Scope and current state verified without code changes. Adapter
  surface: litehive/agents/adapters/goz.py is the external CLI seam for goz run; model
  resolution flows through litehive/pipeline/_models.py:resolve_model() and stage
  execution passes the resolved model via subagents.run(..., model=model_name) from
  litehive/pipeline/_builder.py. Current evidence: GozCLIAdapter.build_command() already
  appends --model <value> when a model is provided, but GozCLIAdapter.DEFAULT_CAPABILITIES.supports_model_override
  is still False, so resolve_model() returns None for goz and Litehive never passes
  a resolved goz model through. Task record is already populated and appropriately
  scoped; no follow-up task needed. Focused implementation plan: 1) flip goz capability
  to supports_model_override=True at the adapter boundary, 2) add or adjust focused
  tests so goz is covered in both model resolution and invocation building, 3) keep
  changes isolated to goz adapter and focused tests only. Suggested verification for
  implementing/testing stages: uv run pytest -q tests/test_config.py -k resolve_model
  plus a focused goz adapter subset such as uv run pytest -q tests/test_engine_variants_and_timeline.py
  -k ''goz_engine_in_registry or goz_build_invocation'' and, if needed, the capability
  coverage in tests/test_runner_workflow.py. Baseline tests run in grooming: uv run
  pytest -q tests/test_config.py -k resolve_model -> 2 passed; uv run pytest -q tests/test_engine_variants_and_timeline.py
  -k ''goz_engine_in_registry or goz_build_invocation_includes_resume_session'' ->
  2 passed. Acceptance criteria remain implementation targets for the next stage;
  grooming outcome is that the task is clear, narrowly scoped, and ready for implementation.'
