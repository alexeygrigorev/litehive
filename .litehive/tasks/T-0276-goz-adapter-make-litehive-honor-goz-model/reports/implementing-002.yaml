summary: 'Implemented the goz model-override path at the adapter boundary by changing
  GozCLIAdapter.DEFAULT_CAPABILITIES.supports_model_override to true in litehive/agents/adapters/goz.py.
  This allows litehive/pipeline/_models.py:resolve_model() to return run/task/workspace
  model values for engine_name=''goz'', and goz command building already appends --model
  when a model is provided. Added focused coverage in tests/test_config.py for goz
  model resolution precedence (run override, then task model, then workspace goz_model)
