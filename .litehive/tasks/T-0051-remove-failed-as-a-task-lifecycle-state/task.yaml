goal: Adjust the task lifecycle so review rejection does not produce a terminal failed
  task state. QA or PM rejection should return the task to implementation until acceptance,
  while only true blockers should stop a task early. Migrate existing failed tasks
  to valid states and update status rendering, runner transitions, and reporting accordingly.
acceptance_criteria:
- '`TaskStatus` no longer includes `"failed"` as a valid value'
- The runner sets `status = "flagged"` for all terminal non-blocking failure outcomes
  (previously `"failed"`)
- '`requeue`, `resume`, and `abandon` commands accept `flagged` and `cancelled` tasks
  (not `failed`)'
- The `promote` CLI command guard no longer references `"failed"`
- Pool summary report uses `"flagged"` or `"stopped"` label instead of `"failed"`
  for non-done terminal tasks
- 'All existing `.litehive/tasks/*/task.yaml` files with `status: failed` are migrated
  to `status: flagged`'
- '`docs/state-machine.md` is updated to reflect removal of `failed` state'
- Existing tests pass; any test referencing `failed` status is updated
