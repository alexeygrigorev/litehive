    \ raw-path validation from only `startswith(\"$\")` to unresolved shell-variable\
    \ patterns anywhere in the input string, with focused and operator-readable error\
    \ text.\n  - Add focused tests in existing workspace/config bootstrap test modules\
    \ for each guard case and keep scope limited to these validation paths.\npm_complexity:\
    \ moderate\nplanned_effort: s\npriority: high\n\nNo follow-up task is needed at\
