goal: Prevent the accidental .litehive/.litehive/ and $tmpdir/.litehive/ creation
  bugs. ensure_workspace() should refuse any path that would create a workspace nested
  inside an existing workspace, or any path starting with $ (unresolved shell variable),
  or any path where a parent directory already contains a .litehive/.
acceptance_criteria:
- ensure_workspace() raises ValueError if the target is inside another .litehive/
  directory
- ensure_workspace() raises ValueError if the path starts with $ or contains unresolved
  shell vars
- ensure_workspace() raises ValueError if target is a git worktree path under .litehive/worktrees/
- Tests cover all guard cases
- Clear error messages explaining why and what to do
