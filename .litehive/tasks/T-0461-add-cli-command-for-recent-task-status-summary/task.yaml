title: Add CLI command for recent task status summary over a time window
created_at: '2026-04-21T20:50:33+00:00'
task_type: null
pipeline_mode: full
priority: medium
depends_on: []
goal: Add a fast CLI command that reports tasks touched in a configurable recent period
  using direct SQLite queries, including task id, title, elapsed time, transition
  count, and final state, based on the README query pattern rather than per-task CLI
  iteration.
acceptance_criteria:
- A command exists to list tasks touched in a configurable recent period such as 24
  hours, with a default period and an override flag like --since.
- Each output row includes at least task id, title, transition count, elapsed duration,
  and final state/status.
- The implementation uses direct database queries over pipeline_transitions/task_state
  (or equivalent persisted state) instead of iterating litehive task show per task.
- The command is documented with an example matching the README query intent for recent
  task reporting.
- Tests cover at least one recent-period summary case and verify the expected fields
  are rendered.
