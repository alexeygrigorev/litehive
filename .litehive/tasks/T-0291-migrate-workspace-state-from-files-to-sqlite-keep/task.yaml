id: T-0291
slug: migrate-workspace-state-from-files-to-sqlite-keep
title: Finish SQLite-only workspace-state migration
created_at: '2026-04-10T06:46:28+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on:
- T-0470
goal: Complete the SQLite-only migration so Litehive stores both task metadata and
  runtime state in SQLite, with filesystem artifacts treated as derived/export/archival
  only. This replaces the older split model that kept task intent in task.yaml.
acceptance_criteria:
- SQLite includes a canonical task metadata table (or equivalent normalized task-intent
  schema) for id, slug, title, created_at, priority, goal, acceptance criteria, constraints,
  plan, dependencies, provenance, and lifecycle state.
- Queue state, task status, pipeline state, reports, task activity, worktree/runtime
  metadata, and daemon/runner state are all persisted in SQLite.
- Managed worktrees, logs, subagent artifacts, and backups live under the XDG data/state
  roots instead of the repo, and the repo-local .litehive tree is no longer a live
  source of truth.
- No live command depends on task.yaml, journal.md, comments/activity YAML, report
  YAML, or recovery YAML as authoritative storage; reads come from SQLite first.
- Archive/delete/list/show/repair/queue/task-management commands operate correctly
  against the SQLite-first model.
- Migration/backfill imports existing task intent and runtime history into SQLite
  and tests cover clean bootstrap, migrated workspaces, and DB rebuild paths.
