goal: The v2 pipeline should create a dedicated git worktree for each task before
  the implementing stage, run agents in that worktree, and merge it back at the commit
  stage. Currently agents run in the main checkout, breaking the CLI mid-refactor
  and making the commit node a no-op. See the worktree investigation in the background
  agent output for full architecture analysis.
acceptance_criteria:
- 1. worktree_sync node creates a per-task worktree (git worktree add) if the task
  doesn't already have one recorded.
- 2. HeruEngineAdapter passes execution_root=worktree_path to SubagentManager so agents
  run in the task worktree, not the main checkout.
- 3. GitCommitNode merges the worktree branch back into main (real merge, not a no-op).
- "4. The main checkout remains clean while agents work \u2014 litehive CLI never\
  \ breaks mid-refactor."
- 5. Worktree is cleaned up after task reaches done or failed terminal state.
- 6. Existing pipeline tests pass; new test covers worktree creation + merge flow
  end-to-end.
