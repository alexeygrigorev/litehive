- role: swe
  step: implementing
  verdict: pass
  message: "Implemented per-task worktrees in the v2 pipeline.\n\nWhat changed:\n\
    - `GitWorktreeSyncNode` now provisions a dedicated task worktree with `git worktree\
    \ add -B litehive/<task-id>-<slug> ...` when no recorded worktree exists, records\
    \ the path on the task, and still syncs existing clean worktrees from `origin/main`.\n\
    - `HeruEngineAdapter` now resolves the task worktree and passes `execution_root=<worktree_path>`\
    \ to `SubagentManager`, so stage agents run inside the task worktree instead of\
    \ the main checkout.\n- `GitCommitNode` now merges the worktree branch name back\
    \ into `main` (falling back to HEAD only if detached), so commit is a real integration\
    \ step rather than merging main into itself.\n- `run_task()` now cleans up the\
    \ task worktree and deletes the task branch after terminal `done` and `failed`\
    \ outcomes.\n- Added deterministic branch helper in `litehive/tasks/worktrees.py`.\n\
    \nEvidence against acceptance criteria:\n1. Worktree creation: `tests/test_pipeline_v2_worktree_sync.py::test_worktree_sync_creates_missing_task_worktree`\
    \ verifies `worktree_sync` creates the worktree and checks out the dedicated task\
    \ branch.\n2. Agent execution root: `tests/test_pipeline_v2_heru_factory.py::test_heru_engine_adapter_runs_subagent_in_task_worktree`\
    \ verifies `SubagentManager(..., execution_root=worktree_path)` is used.\n3. Real\
    \ merge back into main: `tests/test_pipeline_v2_hooks_and_commit.py::test_commit_node_clean_merge_returns_pass`\
    \ now uses a real feature worktree and verifies the merged file appears in `main`;\
    \ the conflict test still verifies unresolved merges route correctly.\n4. Main\
    \ checkout stays clean while agents work: `tests/test_pipeline_v2_end_to_end.py::test_run_task_creates_worktree_and_merges_back_into_main`\
    \ asserts the main checkout has no non-`.litehive/` dirty paths during implementing\
    \ while the feature commit happens in the task worktree.\n5. Cleanup on terminal\
    \ states: `tests/test_pipeline_v2_end_to_end.py::test_run_task_creates_worktree_and_merges_back_into_main`\
    \ and `::test_run_task_cleans_up_worktree_after_failed_terminal_state` both verify\
    \ the recorded worktree path is cleared and the worktree directory is removed\
    \ after terminal `done` and `failed` runs.\n6. Existing tests + new end-to-end\
    \ coverage: added/updated coverage in `tests/test_pipeline_v2_worktree_sync.py`,\
    \ `tests/test_pipeline_v2_heru_factory.py`, `tests/test_pipeline_v2_hooks_and_commit.py`,\
    \ and `tests/test_pipeline_v2_end_to_end.py`.\n\nChecks run:\n- `uv run ruff check\
    \ --select E402,F401 litehive tests` \u2705\n- forbidden `noqa` grep hook command\
    \ \u2705\n- `uv run pytest -q` \u2705 (`521 passed, 5 skipped, 2 warnings in 131.16s`)\n"
