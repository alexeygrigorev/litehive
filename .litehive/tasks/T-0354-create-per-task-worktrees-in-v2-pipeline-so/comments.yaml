  message: "TASK_UPDATE:\n  goal: >-\n    Make the v2 pipeline use a dedicated managed\
    \ git worktree for each task before\n    the first agent stage runs, execute all\
    \ stage agents inside that worktree, then\n    merge the task branch back into\
    \ the main checkout during commit. This fixes the\n    current failure mode where\
    \ v2 agents edit the main checkout directly, breaking\n    the Litehive CLI mid-refactor\
    \ and making commit a no-op because it merges main\n    into itself.\n  acceptance_criteria:\n\
    \    - >-\n      worktree_sync creates a managed per-task worktree and records\
    \ its path on the\n      task when no usable worktree_path is recorded yet; reruns\
    \ reuse the recorded\n      worktree if it still exists.\n    - >-\n      The\
    \ worktree is created before the first agent turn in both full and single\n  \
    \    pipeline modes, so grooming/implementing/testing/accepting all execute from\n\
    \      the task worktree rather than the main checkout.\n    - >-\n      HeruEngineAdapter\
    \ resolves the task's recorded worktree and passes\n      execution_root=worktree_path\
    \ to SubagentManager; if no worktree is recorded,\n      behavior falls back explicitly\
    \ to the main workspace root.\n    - >-\n      GitCommitNode merges the task worktree\
    \ branch or HEAD back into main as a real\n      merge from the dedicated worktree\
    \ state, not a self-merge/no-op caused by\n      resolving the main checkout as\
    \ the worktree.\n    - >-\n      While a task is running, repo edits from agents\
    \ land only in the task\n      worktree; the main checkout remains usable for\
    \ Litehive CLI operations aside\n      from expected .litehive runtime/task metadata\
    \ updates.\n    - >-\n      The pipeline removes the managed worktree and clears\
    \ the recorded worktree_path\n      when the task reaches a terminal done state\
    \ or terminal failed/abandoned-style\n      outcome; non-terminal recovery paths\
    \ keep the worktree intact for inspection\n      and retry.\n    - >-\n      Existing\
    \ pipeline tests pass, and at least one new integration-style test\n      covers\
    \ create -> run in worktree -> commit merge -> cleanup end to end.\n  constraints:\n\
    \    - Keep scope to v2 pipeline worktree lifecycle and execution-root wiring.\n\
    \    - Reuse existing worktree/task helpers where possible instead of adding new\
    \ operator CLI surface.\n    - Do not fold in separate environment bootstrap work\
    \ such as .venv sharing or sandbox redesign.\n  plan:\n    - >-\n      Inspect\
    \ current worktree helpers in litehive.tasks.worktrees,\n      litehive.workspace.worktree_inspection,\
    \ and orchestration to identify the\n      smallest reusable path for create/resolve/cleanup.\n\
    \    - >-\n      Update the production worktree_sync path so GitWorktreeSyncNode\
    \ (or a focused\n      helper it calls) creates and records the managed worktree\
    \ before attempting\n      sync logic; preserve existing clean-skip/conflict behavior\
    \ for already-dirty\n      task worktrees.\n    - >-\n      Wire HeruEngineAdapter\
    \ to resolve the task execution root from the recorded\n      worktree and instantiate\
    \ SubagentManager with that execution_root for every\n      agent stage.\n   \
    \ - >-\n      Tighten GitCommitNode and orchestration worktree resolution so commit\
    \ merges\n      the task worktree branch/HEAD into main, then on successful terminalization\n\
    \      removes the worktree and clears task metadata.\n    - >-\n      Add tests\
    \ for worktree creation/reuse, agent execution_root selection, real\n      commit\
    \ merge behavior, and terminal cleanup; keep one end-to-end test that\n      proves\
    \ the main checkout stays clean while task code changes are made in the\n    \
    \  worktree.\n  pm_complexity: moderate\n  planned_effort: m\n  priority: high\n\
    \nProblem framing:\nThe user problem is operational, not just architectural: v2\
    \ agents currently mutate the main checkout, so Litehive can break its own CLI\
    \ while a task is mid-refactor, and commit provides no isolation benefit because\
    \ it effectively merges main into main. The task should deliver real per-task\
    \ execution isolation for the existing v2 pipeline, not generic worktree tooling.\n\
    \nScope notes:\nKeep this task focused on pipeline-owned lifecycle: create/reuse\
    \ worktree before the first agent stage, run stages inside it, merge it back at\
    \ commit, and clean it up only on terminal completion. Do not expand into new\
    \ user-facing worktree commands, rescue flows beyond current behavior, .venv symlink/bootstrap\
    \ work, or sandbox policy changes.\n\nImplementation hints:\n- Current gap: GitWorktreeSyncNode\
    \ only syncs an existing worktree; it does not create one.\n- Current gap: HeruEngineAdapter\
    \ still does SubagentManager(self.workspace_root).\n- Current gap: orchestration\
    \ resolves to the main root when no recorded worktree exists, which makes GitCommitNode\
    \ a no-op.\n- Likely touch points: litehive/pipeline/nodes/system.py, litehive/pipeline/heru_factory.py,\
    \ litehive/pipeline/orchestration.py, and existing worktree/task helper modules.\n\
    - Preserve the current behavior where non-terminal failures or merge conflicts\
    \ leave the worktree available for recovery/inspection.\n"
