  message: "Implemented OpenCode-specific inactivity timeout handling and retry coverage.\n\
    \nWhat changed:\n- Added a single effective inactivity-timeout helper in `litehive/agents/session.py`\
    \ so OpenCode live executions use a fixed 300.0s watchdog while other engines\
    \ keep `config.subagent_inactivity_timeout_seconds`.\n- Updated `litehive/agents/manager.py`\
    \ to pass that effective timeout into live runs and to use the same engine-specific\
    \ threshold when classifying stale stdout/output, so an OpenCode stall is converted\
    \ into `EngineFailure(kind=retryable_execution_error, classification=timeout)`\
    \ after terminating the stale subprocess.\n- Added tests proving the OpenCode\
    \ stale-output timeout path, preserving non-OpenCode behavior, and automatic retry/restart\
    \ through the pipeline when an OpenCode stage times out.\n\nAcceptance evidence:\n\
    - 300-second OpenCode watchdog: `tests/test_tasks_and_subagents.py::test_subagent_manager_enforces_300s_inactivity_timeout_for_opencode`\
    \ asserts `inactivity_timeout_seconds == 300.0`, simulates >300s without new stdout,\
    \ and verifies the stale subprocess is killed.\n- Retryable timeout classification:\
    \ the same test asserts `result.failure == EngineFailure(kind=\"retryable_execution_error\"\
    , reason=\"transient timeout\", classification=\"timeout\")` and transcript contains\
    \ `litehive killed stale subagent after 300s without new stdout`.\n- Automatic\
    \ retry/restart: `tests/test_pipeline_v2_end_to_end.py::test_run_task_retries_opencode_stage_after_timeout_failure`\
    \ stubs an OpenCode timeout on the first attempt and a pass on the second; `run_task(...)`\
    \ finishes at `done` with manager calls == 2.\n- Non-OpenCode behavior preserved:\
    \ `tests/test_tasks_and_subagents.py::test_subagent_manager_preserves_workspace_timeout_for_non_opencode_live_runs`\
    \ verifies Codex still receives the configured workspace timeout (`123.0`).\n\n\
