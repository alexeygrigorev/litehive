    \ retry/restart path resume the same task automatically. It does not mean restarting\
    \ the daemon or inventing a separate recovery subsystem.\n\nTASK_UPDATE:\ngoal:\
    \ Detect when an OpenCode subagent stops producing new output for 5 minutes, terminate\
    \ the stale subprocess, and automatically resume execution through Litehive's\
    \ existing timeout retry/restart flow instead of leaving the task hung.\nacceptance_criteria:\n\
    \  - OpenCode live executions enforce a 300-second inactivity watchdog based on\
    \ absence of new stdout/output from the agent.\n  - When the watchdog fires, Litehive\
    \ terminates the stale OpenCode subprocess and records the failure as a retryable\
    \ `timeout` classification.\n  - A timed-out OpenCode stage automatically re-enters\
    \ the existing retry/restart flow for the same task without manual operator action.\n\
