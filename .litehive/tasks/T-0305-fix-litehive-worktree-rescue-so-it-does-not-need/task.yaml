goal: 'When the daemon is running, ''litehive worktree rescue --apply'' successfully
  cherry-picks the worktree commits onto main but then fails to finalize task state
  because save_task tries to acquire the runner lock (held by the daemon). This leaves
  the rescue in a half-applied state where code landed but task.yaml still says merge_failed,
  requiring manual cleanup. The runner lock is guarding the wrong thing here: the
  task being rescued is in merge_failed state and is NOT being executed by the runner.
  Rescue should be safe to run concurrently with the daemon as long as it is modifying
  merge_failed tasks only.'
acceptance_criteria:
- _finalize_rescue (or the save_task call it makes) does not require the runner lock
  when the task being finalized is in merge_failed state and is not state.active_task_id
- 'Alternatively: introduce a lighter-weight per-task lock that rescue and the runner
  both respect for the specific task being modified, instead of a global workspace-wide
  runner lock'
- 'Integration test: start a fake long-running daemon that holds the runner lock,
  then run worktree rescue --apply against a pre-constructed merge_failed task, assert
  that rescue completes successfully (both the cherry-pick AND the state finalization)'
- If the task to be rescued happens to be state.active_task_id, rescue refuses with
  a clear error rather than racing
