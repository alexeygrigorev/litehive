goal: 'When the daemon is running, ''litehive worktree rescue --apply'' successfully
  cherry-picks the worktree commits onto main but then fails to finalize task state
  because save_task tries to acquire the runner lock (held by the daemon). This leaves
  the rescue in a half-applied state where code landed but task.yaml still says merge_failed,
  requiring manual cleanup. The runner lock is guarding the wrong thing here: the
  task being rescued is in merge_failed state and is NOT being executed by the runner.
  Rescue should be safe to run concurrently with the daemon as long as it is modifying
  merge_failed tasks only.'
acceptance_criteria:
- With the daemon holding the runner lock, litehive worktree rescue --apply succeeds
  for a merge_failed task that is not state.active_task_id, including both cherry-pick
  onto main and task-state finalization.
- After a successful rescue, the rescued task is persisted as done, its commit SHA
  matches main HEAD, its worktree path is cleared, and the task is removed from unmerged_worktrees.
- If the merge_failed task being rescued is state.active_task_id, the command exits
  with a clear conflict error and leaves task/workspace state unchanged.
- Automated coverage simulates a long-running daemon holding the runner lock during
  rescue and verifies both the successful non-active merge_failed rescue path and
  the active-task refusal path.
constraints: []
plan:
- Inspect the rescue finalize path and workspace/task locking code to identify the
  narrowest safe write path for merge_failed task finalization.
- Implement a task-scoped conflict check that allows rescue to finalize non-active
  merge_failed tasks without requiring the global runner lock, while preserving refusal
  for the active task.
- Add focused tests around worktree rescue with a held runner lock for both success
  and refusal behavior.
- Run targeted pytest coverage for worktree rescue and locking regressions.
