summary: "Validated the rescue lock fix with focused independent checks. I inspected\
  \ litehive/cli/worktree.py and confirmed _finalize_rescue now persists task+state\
  \ through _persist_task_and_state_without_runner_guard while holding _workspace_lock,\
  \ reloading state under the lock, refusing if the rescued task is still state.active_task_id,\
  \ and clearing unmerged_worktrees/worktree_path before marking the task done and\
  \ storing the main HEAD commit SHA. I also confirmed _cmd_worktree_rescue now reports\
  \ active_task results as a nonzero outcome. Test evidence: uv run pytest -q tests/test_task_commands_and_daemon.py\
  \ -k worktree_rescue -> 6 passed, 115 deselected. This includes the new held-runner-lock\
  \ success case and the active-task refusal case, plus the existing normal/already-landed/manual-conflict\
  \ rescue coverage. I also ran a narrower slice covering the new cases plus adjacent\
  \ rescue behaviors: uv run pytest -q tests/test_task_commands_and_daemon.py -k 'worktree_rescue_apply_succeeds_while_daemon_holds_runner_lock\
  \ or worktree_rescue_apply_refuses_active_task_even_with_runner_lock_held or worktree_rescue_apply_reports_manual_conflict\
  \ or worktree_rescue_apply_marks_task_done_and_clears_unmerged_state or worktree_rescue_apply_clears_already_landed_patch_without_duplicate_commit'\
  \ -> 3 passed, 118 deselected. Evidence for acceptance criteria: rescue succeeds\
  \ while a fake daemon holds the runner lock for another active task; the rescued\
  \ commit lands on main; task status/pipeline_status become done; commit_sha matches\
  \ main HEAD; worktree_path is cleared; unmerged_worktrees is emptied; and when the\
  \ rescued task is state.active_task_id the command exits 1 with a clear 'worktree\
  \ rescue refuses to race with the runner' message and leaves main/task/state unchanged.\
  \ Test-quality gate check: both new tests are under 50 lines and their assertions\
  \ would fail if the lock behavior regressed. Non-blocking note: uv run ruff check\
  \ litehive/cli/worktree.py tests/test_task_commands_and_daemon.py reports an unrelated\
  \ pre-existing F541 at litehive/cli/worktree.py:93, outside this task\u2019s change."
