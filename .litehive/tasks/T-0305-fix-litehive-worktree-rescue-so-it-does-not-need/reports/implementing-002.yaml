summary: 'Implemented a narrow rescue-specific lock fix in litehive/cli/worktree.py.
  _finalize_rescue no longer persists through save_task()/save_state under the global
  runner guard. Instead it acquires the workspace file lock, reloads state, explicitly
  refuses if the rescued task is still state.active_task_id, checks future-task mutation
  safety, clears the task from unmerged_worktrees, clears the worktree path, marks
  the task done with the main HEAD commit SHA, and persists task+state together via
  the existing no-runner-guard workflow helper. Rescue output now reports active_task
  results and exits nonzero for them. I also added focused integration coverage in
  tests/test_task_commands_and_daemon.py: one test starts a fake long-running daemon
  thread that holds workspace_runner_guard+runner_heartbeat for a different active
  task and verifies worktree rescue --apply succeeds end-to-end while the runner lock
  is held, including cherry-pick, task finalization to done, commit_sha update, cleared
  worktree path, and removal from unmerged_worktrees; the second test holds the runner
  lock with the rescued merge_failed task as state.active_task_id and verifies rescue
  refuses clearly, exits 1, does not cherry-pick onto main, and leaves task/state
  unchanged. Verification run: uv run pytest -q tests/test_task_commands_and_daemon.py
  -k worktree_rescue -> 6 passed; uv run ruff check --select E402,F401 litehive tests
  -> passed; forbidden noqa suppression gate -> passed; uv run pytest -q -> 965 passed
  in 121.64s. Acceptance criteria satisfied: rescue finalization no longer depends
  on the daemon-held runner lock for non-active merge_failed tasks, successful rescue
  finalizes task/state completely under lock, automated coverage simulates the held
  runner lock for both success and refusal paths, and active-task rescue now refuses
  with a clear message instead of racing.'
