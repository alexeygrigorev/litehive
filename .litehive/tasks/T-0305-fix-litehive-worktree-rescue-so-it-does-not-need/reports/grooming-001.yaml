  Task shaping updates have been persisted with litehive task update: task_type=bugfix,
  pm_complexity=moderate, planned_effort=m, four observable acceptance criteria, and
  a four-step implementation plan. The acceptance criteria now require: (1) rescue
  succeeds while the daemon holds the runner lock for a merge_failed task that is
  not state.active_task_id, including both cherry-pick and finalization; (2) successful
  rescue persists done status, main HEAD commit SHA, cleared worktree path, and removal
  from unmerged_worktrees; (3) rescue refuses clearly and leaves state unchanged when
  the target task is state.active_task_id; and (4) automated coverage simulates the
  held runner lock for both the success path and the refusal path.


  Recommended implementation approach: keep the change narrow. Do not redesign all
  workspace locking unless necessary. First inspect whether _finalize_rescue can switch
  from the global workspace mutation guard to a task-scoped conflict check for merge_failed
  tasks, reusing the existing active-task/marker logic in litehive/workspace/locking.py.
  The implementation should explicitly reject rescue of the active task before any
  write that could race. Then add focused tests around worktree rescue using the existing
  merge_failed fixture and runner-lock helpers, and run targeted pytest coverage for
  worktree rescue and locking regressions. Tests run in grooming: none; this stage
  was repo inspection and task shaping only.'
