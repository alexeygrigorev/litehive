  Evidence against the acceptance criteria: the new integration test test_worktree_rescue_apply_succeeds_while_daemon_holds_runner_lock
  starts a fake daemon thread that holds workspace_runner_guard plus runner_heartbeat
  for another active task, then runs worktree rescue --apply against a preconstructed
  merge_failed task and verifies rescue completes successfully while the runner lock
  is held, including the cherry-pick landing on main, task status/pipeline_status
  becoming done, git.commit_sha matching main HEAD, worktree_path cleared, and state.unmerged_worktrees
  emptied. The companion test test_worktree_rescue_apply_refuses_active_task_even_with_runner_lock_held
  verifies that when the rescued task is state.active_task_id, rescue exits 1 with
  the clear message worktree rescue refuses to race with the runner, does not advance
  main HEAD, and leaves task/state unchanged. Acceptance criteria met.'
