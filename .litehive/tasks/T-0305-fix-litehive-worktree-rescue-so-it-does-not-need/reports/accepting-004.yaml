summary: Accepted. I independently reviewed the rescue-finalization change in litehive/cli/worktree.py
  and verified that _finalize_rescue no longer persists through the global runner
  guard. It now acquires the workspace file lock, reloads state under that lock, refuses
  if the rescued task is still state.active_task_id, checks future-task mutation safety,
  clears the rescued task from unmerged_worktrees, clears the recorded worktree path,
  marks the task done, stores the main HEAD commit SHA, and persists task+state via
  _persist_task_and_state_without_runner_guard. I also confirmed _cmd_worktree_rescue
  treats that refusal as status active_task and exits nonzero.
