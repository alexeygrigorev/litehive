goal: 'Claude Code CLI tracks usage somehow but there is no obvious quota API endpoint.
  api.anthropic.com/api/claude_code/metrics exists but rejects OAuth tokens. The claude.ai/api/organizations/usage
  endpoint is behind Cloudflare. The CLI likely tracks usage locally against known
  tier limits (rateLimitTier field in credentials). Investigate the CLI source (minified
  JS at node_modules/@anthropic-ai/claude-code/cli.js) to find how it calculates and
  reports usage. Key functions: getCurrentUsage, generateUsageReport, getRateLimitTier,
  getOauthAccountInfo.'
acceptance_criteria:
- Produce a follow-up implementation task with exact API endpoint, auth method, and
  response fields for Claude quota checking
- If no API exists, document the local tracking approach with exact tier limits per
  subscription
- Check deobfuscated Claude Code source at github.com/yasasbanukaofficial/claude-code
  - specifically src/commands/usage/index.ts and usage.tsx, also src/commands/cost.ts
  and cost-tracker.ts
- This is a research-only task - no code changes, just produce a concrete implementation
  spec
