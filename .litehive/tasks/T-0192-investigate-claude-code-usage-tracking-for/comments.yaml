  message: "## Research Findings: Claude Code Usage Tracking\n\n### How Rate Limits\
    \ Work\n\nClaude Code tracks usage via **HTTP response headers** returned on every\
    \ API call (Claude.ai subscribers only, not API key users):\n\n- `anthropic-ratelimit-unified-5h-utilization`\
    \ \u2192 float 0-1 (5-hour rolling window)\n- `anthropic-ratelimit-unified-5h-reset`\
    \ \u2192 unix epoch seconds\n- `anthropic-ratelimit-unified-7d-utilization` \u2192\
    \ float 0-1 (7-day weekly ceiling)\n- `anthropic-ratelimit-unified-7d-reset` \u2192\
    \ unix epoch seconds\n\nRate limit types: `five_hour` (session), `seven_day` (weekly),\
    \ `seven_day_opus`, `seven_day_sonnet`, `overage`.\n\n### Programmatic Access:\
    \ Status Line JSON\n\nThe **status line** (`~/.claude/settings.json` \u2192 `statusLine.command`)\
    \ is the official supported interface. It pipes JSON to your script containing:\n\
    \n```json\n{\n  \"rate_limits\": {\n    \"five_hour\": { \"used_percentage\":\
    \ 23.5, \"resets_at\": 1738425600 },\n    \"seven_day\": { \"used_percentage\"\
    : 41.2, \"resets_at\": 1738857600 }\n  },\n  \"cost\": { \"total_cost_usd\": 0.01234,\
    \ \"total_duration_ms\": 45000 }\n}\n```\n\n**Constraint**: `rate_limits` only\
    \ appears for Claude.ai subscribers (Pro/Max) and only after the first API response\
    \ in a session.\n\n### Account/Subscription Info\n\n`GET /api/oauth/profile` (with\
    \ OAuth token) returns:\n- `organization.rate_limit_tier` \u2192 e.g. `default_claude_max_20x`\n\
    - `organization.organization_type` \u2192 maps to `max`, `pro`, `enterprise`,\
    \ `team`\n- `organization.has_extra_usage_enabled` \u2192 boolean\n- `organization.billing_type`\n\
    \n### No Dedicated Quota API\n\nThere is **no public REST endpoint** for checking\
    \ quota outside of a session. The `api.anthropic.com/api/claude_code/metrics`\
    \ endpoint is not real. Usage data flows only through:\n1. Response headers (per-request)\n\
    2. Status line JSON (during active session)\n3. OpenTelemetry push pipeline (opt-in,\
    \ `CLAUDE_CODE_ENABLE_TELEMETRY=1`)\n\n### Cost Tracking\n\nSession-local, in-memory.\
    \ Formula: `input_tokens/1M * price + output_tokens/1M * price + cache_read/1M\
    \ * price + cache_write/1M * price + web_search * price`. Exposed via `/cost`\
    \ command and status line JSON.\n\n### Implications for Litehive\n\nFor **pre-launch\
    \ quota checks** (before starting a Claude task), there is no API to call. Options:\n\
    1. **Persist last-known rate limits** from the most recent Claude session's status\
    \ line data and use reset timestamps to estimate current availability.\n2. **Hook-based\
    \ tracking**: Use Claude Code hooks (PostToolUse/Stop) to capture rate limit state\
    \ after each session and write it to a file Litehive can read.\n3. **Lightweight\
    \ probe**: Launch a minimal Claude Code session with a trivial prompt to get fresh\
    \ rate limit headers, then decide whether to proceed.\n\n### PM Sizing\n- PM_COMPLEXITY:\
    \ simple\n- PLANNED_EFFORT: xs (research only, no code changes)\n\n### Verdict\n\
    Research is complete. The task's acceptance criteria are met:\n- AC1: Follow-up\
    \ implementation task spec is provided below (no single API endpoint exists; the\
    \ approach uses status line + persisted state).\n- AC2: Documented - no dedicated\
    \ API; local tracking via response headers and status line JSON with per-subscription\
    \ rate limit windows.\n- AC3: Checked - the deobfuscated source confirms the header-based\
    \ approach (functions JS4, HS4, JW8 in cli.js).\n- AC4: No code changes made;\
    \ this is a research deliverable.\n\nSTAGE_RESULT:\n{\"verdict\":\"pass\",\"summary\"\
    :\"Research complete: Claude Code quota comes from HTTP response headers and status\
    \ line JSON, no dedicated API exists\",\"tests\":{\"added\":0,\"passing\":0},\"\
    warnings\":[\"Rate limits only available for Claude.ai subscribers (Pro/Max),\
    \ not API key users\",\"No pre-session quota check API exists; must persist state\
    \ from prior sessions\"],\"follow_up_tasks\":[{\"title\":\"Add Claude quota awareness\
    \ to engine fallback routing\",\"rationale\":\"Use persisted rate limit state\
    \ from Claude Code status line to skip Claude engine when quota is near exhaustion,\
    \ enabling proactive engine fallback before launch failure\",\"blocking\":false,\"\
    goal\":\"When Litehive selects the Claude engine for a task, check persisted rate\
    \ limit state and skip to the fallback engine if 5h or 7d utilization exceeds\
    \ a configurable threshold\",\"acceptance_criteria\":[\"A status-line hook script\
    \ captures rate_limits JSON after each Claude session and writes it to .litehive/engine-monitoring.yaml\"\
    ,\"Engine selection checks the persisted rate limit data and skips Claude when\
    \ utilization exceeds the configured threshold (default 90%)\",\"Engine selection\
    \ accounts for reset timestamps - if the reset time has passed, the persisted\
    \ utilization is treated as stale/zero\",\"litehive status shows current Claude\
    \ quota state when available\",\"Fallback to next engine in the routing chain\
    \ works transparently\"],\"task_type\":\"adapter\"}],\"acceptance_criteria\":[],\"\
    task_update\":{\"pm_complexity\":\"simple\",\"planned_effort\":\"xs\"}}\n\nFOLLOW_UP_TASKS:\n\
    [{\"title\":\"Add Claude quota awareness to engine fallback routing\",\"rationale\"\
    :\"Use persisted rate limit state from Claude Code status line to skip Claude\
    \ engine when quota is near exhaustion, enabling proactive engine fallback before\
    \ launch failure\",\"blocking\":false,\"goal\":\"When Litehive selects the Claude\
    \ engine for a task, check persisted rate limit state and skip to the fallback\
    \ engine if 5h or 7d utilization exceeds a configurable threshold\",\"acceptance_criteria\"\
    :[\"A status-line hook script captures rate_limits JSON after each Claude session\
    \ and writes it to .litehive/engine-monitoring.yaml\",\"Engine selection checks\
    \ the persisted rate limit data and skips Claude when utilization exceeds the\
    \ configured threshold (default 90%)\",\"Engine selection accounts for reset timestamps\
    \ - if the reset time has passed, the persisted utilization is treated as stale/zero\"\
    ,\"litehive status shows current Claude quota state when available\",\"Fallback\
    \ to next engine in the routing chain works transparently\"],\"task_type\":\"\
    adapter\"}]"
