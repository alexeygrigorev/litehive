goal: Reduce test maintenance cost by splitting oversized test modules into focused
  files and removing tests that do not provide meaningful behavioral coverage, without
  changing production behavior.
acceptance_criteria:
- Retry/commit/recovery coverage is split out of tests/test_retry_commit_and_recovery.py
  into smaller concern-focused test files, with the original monolithic file removed
  or reduced so it no longer acts as the primary home for those concerns.
- Config loading/routing coverage and run/CLI command coverage are separated instead
  of sharing one monolithic tests/test_config_and_run_cli.py file.
- Lock-free web dashboard snapshot coverage is split into smaller files by feature
  area such as runner status, task detail/task actions, engine dashboard, SSE, or
  queue controls instead of one monolithic tests/test_web_snapshot_lockfree.py file.
- The current multi-behavior tests for daemon API controls and web task action endpoints
  are decomposed into focused tests so each test verifies one endpoint or one user-visible
  behavior.
- No-op or duplicate tests are removed or rewritten so each remaining test fails when
  the covered behavior regresses, including the slugify identity case, the StageReport
  message identity case, and redundant flag_count coverage.
- The workspace-transition regression coverage in tests/test_tasks_and_subagents.py
  exercises _workspace_transition_writes directly instead of spawning a subprocess.
- The affected targeted test files pass under a 60s timeout and the full pytest suite
  remains under 3 minutes.
constraints: []
plan:
- 'Split tests/test_retry_commit_and_recovery.py into smaller files grouped by concern:
  execution-limit classification, retry/fallback policy, checkpoint/commit integration,
  and recovery/rollback flows.'
- Split tests/test_config_and_run_cli.py into config-focused tests and CLI/run-command
  tests, reusing shared helpers instead of reintroducing new monoliths.
- Split tests/test_web_snapshot_lockfree.py by web feature area and break the daemon/task-action
  mega-tests into endpoint-sized assertions.
- Remove or rewrite the identified no-op and duplicate tests, then replace the subprocess-based
  workspace-transition test with an in-process direct-call regression test.
- Run the affected test slices first, then the full suite, and keep file moves scoped
  to tests plus any helper imports required by the split.
