summary: 'Implemented runner hook execution policy with workspace-level runner_hook_execution_mode
  defaulting to run_all and opt-in fail_fast. Updated hook execution/reporting to
  collect all hook results, continue through all blocking hooks in run_all mode, and
  return one combined reject report listing every failed blocking hook with command,
  exit code, stdout, stderr, and artifact paths; fail_fast stops on the first blocking
  failure. Added focused regression coverage for config parsing/validation, default
  run_all aggregation, and fail_fast short-circuit behavior. Verified with: uv run
  pytest -q tests/test_config.py -k runner_hook; uv run pytest -q tests/test_task_commands_and_daemon.py
  -k ''hook and (blocks_after_implementing or records_non_blocking_runner_hook_failure_and_continues
