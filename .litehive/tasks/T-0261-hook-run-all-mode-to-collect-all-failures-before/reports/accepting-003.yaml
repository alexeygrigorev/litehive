summary: 'Accepted after direct verification. I inspected litehive/pipeline/_hooks.py
  and confirmed runner-hook execution now defaults to run_all via LitehiveConfig.runner_hook_execution_mode,
  accumulates blocking failures across all configured hooks in run-all mode, and only
  short-circuits on the first blocking failure when runner_hook_execution_mode=fail_fast.
  I verified combined reject reporting now enumerates every failed blocking hook with
  command, exit code, artifact path, stdout, and stderr, and that failure_diagnostics
  preserves the first failure plus failed_hook_commands/failed_hook_artifacts lists
  for the aggregated reject case. I also verified the config surface and validation
  in litehive/config/model.py, litehive/config/dataclasses.py, and tests/test_config.py:
  default run_all persists, explicit fail_fast loads, and invalid values raise ValueError.
  I checked the new task-level regression tests in tests/test_task_commands_and_daemon.py
  and confirmed the previously rejected oversized tests were refactored under the
  stage limit (collect-all test at lines 3872-3915, fail-fast test at lines 3918-3949).
  Commands I ran: uv run pytest -q tests/test_config.py -k ''runner_hook_execution_mode
  or configure_persists_runner_hooks'' => 3 passed; uv run pytest -q tests/test_task_commands_and_daemon.py
  -k ''collects_all_blocking_runner_hook_failures_by_default or stops_on_first_blocking_runner_hook_failure_in_fail_fast_mode''
  => 2 passed; uv run ruff check --select E402,F401 litehive tests => passed; uv run
  pytest -q => 894 passed. Acceptance criteria confirmed: run-all mode runs all hooks
  before rejecting, combined reject output includes all failed hooks and their output,
  fail-fast remains opt-in, default is run_all, and the existing test suite passes.'
