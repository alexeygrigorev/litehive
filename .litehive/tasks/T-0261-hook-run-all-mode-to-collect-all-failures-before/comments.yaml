    \ with current `runner_hooks` config and no new setting should get the new default\
    \ behavior: run all hooks, then reject once with combined failure details.\n-\
    \ Fail-fast should remain opt-in and should stop only on the first failed blocking\
    \ hook. Non-blocking hook failures should still be recorded as warnings/results\
    \ and should not stop execution.\n\nRecommended implementation plan:\n1. Add a\
    \ workspace-level hook execution mode setting, normalized and documented as `run_all`\
    \ by default with opt-in `fail_fast`.\n2. Update `litehive/pipeline/_hooks.py`\
    \ so blocking-hook execution can accumulate all hook results in run-all mode,\
