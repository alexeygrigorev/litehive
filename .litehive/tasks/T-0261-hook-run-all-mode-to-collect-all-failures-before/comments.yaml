    \ task needs an explicit workspace-level policy with backward-compatible default\
    \ behavior set to run-all.\n- The main regression surface is already present in\
    \ `tests/test_task_commands_and_daemon.py`, with adjacent hook tests covering\
    \ blocking/non-blocking behavior, report contents, and stage routing.\n\nScope\
