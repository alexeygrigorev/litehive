    \ first failure as the reject cause.\n5. Add targeted tests for: default run-all\
    \ across multiple failing blocking hooks, mixed pass/fail hook batches, opt-in\
    \ fail-fast behavior, and any config parsing/normalization needed for the new\
    \ mode. Finish with the existing suite command `uv run pytest -q`.\n\nPM_COMPLEXITY:\
    \ moderate\nPLANNED_EFFORT: s\n\nTASK_UPDATE:\n  task_type: bugfix\n  pm_complexity:\
    \ moderate\n  planned_effort: s\n  constraints:\n    - Keep changes scoped to\
    \ runner-hook execution policy and reporting.\n    - Preserve backward compatibility\
    \ for existing `runner_hooks` definitions.\n  plan:\n    - Add a workspace-level\
    \ hook execution mode with default `run_all` and opt-in `fail_fast`.\n    - Change\
