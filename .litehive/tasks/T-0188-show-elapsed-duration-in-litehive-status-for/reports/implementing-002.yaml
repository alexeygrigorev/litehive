feedback: 'Redesigned litehive status as an operator dashboard. Changes across 5 files:


  ## What changed


  **litehive/cli/status.py**: Restructured _cmd_status to show a dashboard by default.
  Default output (no flags) shows 5 sections: Active Task, Last Completed, Queue,
  Engine Health, Recent Activity. The old verbose output (config details, per-task
  dump, engine monitoring raw lines) is now behind --full flag only. Extracted old
  logic into _cmd_status_full helper.


  **litehive/observability/_status.py**: Added 7 new functions:

  - render_active_task_section: Shows task ID, stage, engine, and elapsed duration
  (e.g. "T-0161 implementing with copilot, running for 3m") plus stage elapsed time

  - find_last_completed_task: Finds most recently done task by updated_at

  - render_last_completed_section: Shows last done task with outcome verdict and timestamp

  - render_queue_section: Shows count and next task title

  - render_engine_health_section: Shows each engine as "ok" with usage or quota/rate/budget
  limited with reset time

  - collect_recent_activity: Scans events.jsonl across all task dirs, sorts by timestamp,
  returns last 5

  - render_recent_activity_section: Renders last 3-5 events with human-readable labels


  **litehive/observability/__init__.py**: Exports the new functions.


  **Tests updated across 4 files**:

  - tests/test_observability_and_status.py: Added test_status_default_dashboard_shows_sections_without_config_noise
  which verifies all 5 dashboard sections are present and config noise is absent.
  Updated 7 existing tests to pass full=True where they assert on full-mode-only output.

  - tests/test_retry_commit_and_recovery.py: Updated 1 test to use full=True

  - tests/test_task_commands_and_daemon.py: Updated 1 test to use full=True

  - tests/test_engine_freeze.py: Updated 2 tests to use full=True


  ## Acceptance criteria verification

  - Active task shows title, stage, engine, and elapsed duration: YES - render_active_task_section
  outputs e.g. "T-0161 implementing with copilot, running for 3m"

  - Current stage shows elapsed duration: YES - "stage: implementing elapsed 2m30s"

  - Last completed task shown with outcome and when: YES - render_last_completed_section
  shows task ID, verdict, timestamp

  - Queue summary shows count and next task title: YES - "1 queued, next: T-0002 Next
  feature"

  - Engine health shows available vs quota-limited with reset time: YES - render_engine_health_section
  shows "ok" or "quota resets 2026-04-30T00:00:00Z"

  - Recent activity shows last 3-5 events: YES - collect_recent_activity scans events.jsonl
  across tasks

  - Config details only shown with --full: YES - getattr(args, "full", False) defaults
  to False

  - No full task dump in default output: YES - render_task_summary only called in
  _cmd_status_full


