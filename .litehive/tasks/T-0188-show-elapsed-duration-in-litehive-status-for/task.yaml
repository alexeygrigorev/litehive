goal: Redesign litehive status to be a useful operator dashboard instead of a config
  dump. Show what matters at a glance - active task with duration, engine health,
  recent activity, queue summary. Remove noise like pool policies and retry config
  from default output.
acceptance_criteria:
- Active task shows title, stage, engine, and elapsed duration (e.g. "T-0161 implementing
  with copilot, running for 3m")
- Current stage shows elapsed duration
- Last completed task shown with outcome (pass/fail) and when
- Queue summary shows count and next task title
- Engine health shows which engines are available and which hit quota with reset time
- Recent activity shows last 3-5 events (task completed, engine switched, error)
- Config details (retry limits, pool policies, etc.) only shown with --full flag,
  not by default
- No full task dump in default output
