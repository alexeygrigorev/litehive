id: T-0131
slug: normalize-legacy-queued-interrupted-flagged-tasks-through-planner-before-retry
title: Normalize legacy queued/interrupted/flagged tasks through planner before retry
depends_on: []
task_type: null
engine: claude
model: null
mode: implementation
status: flagged
pipeline_status: implementing
priority: medium
