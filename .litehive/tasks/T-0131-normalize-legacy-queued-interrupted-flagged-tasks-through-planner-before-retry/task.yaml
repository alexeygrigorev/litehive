updated_at: '2026-04-03T14:58:51+00:00'
goal: Stop legacy underspecified tasks from bouncing straight back into SWE, QA, or
  reviewer loops. Before retrying queued, interrupted, or flagged tasks that lack
  a usable goal or acceptance criteria, litehive should normalize them through planner
  so the next execution pass has a bounded spec.
acceptance_criteria:
- Litehive detects when a queued, interrupted, or flagged task is missing a usable
  goal or meaningful acceptance criteria.
- Such tasks are routed to planner or grooming before they are sent back to SWE, QA,
  reviewer, or recovery.
- Planner output is written back into durable task state so the task record contains
  a non-empty goal, acceptance criteria, and an actionable plan before the next retry.
- The normalization flow preserves existing failure context, retry context, and continuation
  handoff data so planner sees why the task is being normalized.
- Tasks that already have a sufficient goal and acceptance criteria are not forced
  through planner again.
- Focused tests cover at least one underspecified queued task, one interrupted or
  flagged task, and one already-well-specified task that should continue without planner
  normalization.
constraints:
- Keep the normalization decision deterministic and runner-owned; do not rely on subagents
  to decide whether a task definition is sufficient.
- Avoid wiping prior runtime or failure history from the task record while normalizing
  the task.
- Reuse the existing planner and grooming path where possible instead of adding a
  parallel ad-hoc shaping flow.
- Normalized tasks must remain visible in the regular runnable lifecycle and should
  not disappear into a parked sink state.
plan:
- Define what counts as an underspecified task, including empty goal, empty acceptance
  criteria, or other clearly unusable legacy records.
- Add runner-side routing that sends underspecified queued, interrupted, or flagged
  tasks through planner before retry.
- Persist planner-produced goal, acceptance criteria, and plan fields back into task.yaml
  so later stages have durable structured inputs.
- Add focused tests for normalization routing, persistence of planner output, and
  the no-op path for already-specified tasks.
