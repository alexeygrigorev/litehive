summary: 'Verified requeue-time stale-pass retraction end to end. I inspected the
  implementation and confirmed the sweep runs in litehive/workspace/task_status.py:requeue_task()
  only, before the task is requeued, and only for prior pass comments from implementing/testing/accepting
  that have normalized non-placeholder files_changed. The check compares each claimed
  path from the task checkout/worktree against the workspace-root HEAD baseline via
  git diff; when none of the claimed files differ, the original thread entry is preserved
  and marked once with [retracted - filesystem check shows no changes landed]. I also
  confirmed prompt rendering now calls render_task_thread(..., for_prompt=True) so
  retracted pass bodies are withheld from discussion_thread while a compact retraction
  notice with claimed files remains visible for future agents. Persistence remains
  audit-friendly because the original thread entry is still stored in YAML with the
  appended marker, and re-running requeue is idempotent because duplicate markers
  are not appended. Tests run: uv run pytest -q tests/test_task_commands_and_daemon.py
  -k retracts_stale_pass_reports -vv -> 1 passed; uv run pytest -q tests/test_task_commands_and_daemon.py
  -k "retracts_stale_pass_reports or requeue_command" -> 5 passed; uv run pytest -q
  tests/test_runner_workflow.py -k agent_md_absent_falls_back_to_config -> 1 passed;
  uv run ruff check --select E402,F401 litehive tests -> passed. Evidence against
  the acceptance criteria: the focused regression test constructs a stale implementing
  pass claiming files_changed=["foo.py"] with no diff vs main, requeues the task,
  asserts the marker is persisted exactly once, asserts the next prompt contains the
  retraction notice and claimed file, and asserts the stale pass body is excluded
  from prompt context.'
