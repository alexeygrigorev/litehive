summary: Implemented stale pass-report retraction during requeue. `litehive/workspace/task_status.py:requeue_task()`
  now performs a once-per-requeue sweep over prior `pass` thread comments from `implementing`/`testing`/`accepting`
  that declare non-placeholder `files_changed`, compares each claimed path against
  current main via git diff in the task checkout/worktree, and appends `[retracted
  - filesystem check shows no changes landed]` exactly once when none of the claimed
  paths differ. `litehive/tasks/reports.py` now centralizes path normalization/retraction
  helpers, persists updated thread entries, and supports prompt-safe rendering that
  replaces retracted pass bodies with a compact retraction notice while preserving
  the original entry plus marker in the task journal YAML. `litehive/agents/_prompts.py`
  now uses prompt-safe thread rendering so stale pass text is excluded from future
  `discussion_thread` context. Added focused regression coverage in `tests/test_task_commands_and_daemon.py`
  that creates a git-backed task with a stale implementing pass report claiming `files_changed=["foo.py"]`
  while `foo.py` is unchanged versus main, requeues the task, asserts the marker is
  persisted once, asserts the next implementing prompt contains the retraction notice
  and claimed file, and asserts the original stale pass body is excluded from prompt
  context; the test also proves idempotency across a second requeue.
