id: T-0314
slug: retract-stale-pass-reports-from-task-thread-when
title: Retract stale 'pass' reports from task thread when filesystem evidence contradicts
  them
created_at: '2026-04-10T14:54:49+00:00'
task_type: null
mode: implementation
pipeline_mode: full
priority: medium
pm_complexity: null
planned_effort: null
depends_on:
- T-0313
goal: "T-0240's confirmation-bias loop was amplified because a single hallucinated\
  \ 'Implementation Complete' report from 2026-04-09 stayed in the task's discussion\
  \ thread forever and was fed to every subsequent SWE as authoritative context. The\
  \ pipeline never re-validated prior reports against the actual repository state\
  \ between retries. When a task is requeued after the original 'pass' report, the\
  \ orchestrator should check whether the claimed work is actually present in the\
  \ worktree or on main; if not, the prior report is retracted (marked as [retracted\
  \ \u2014 filesystem check shows no changes landed]) and NOT included in the next\
  \ prompt's discussion thread. This prevents the 'lies propagate forward' failure\
  \ mode even if the upstream guard (T-0308) is somehow bypassed."
acceptance_criteria:
- Before including the discussion thread in a new subagent prompt, the orchestrator
  validates prior 'pass' reports from implementing/testing/reviewer stages by checking
  whether the files they claim to have changed actually differ between main and the
  current worktree HEAD
- "If a prior report claims files_changed that show no diff vs main, the report is\
  \ marked retracted in the thread (a marker appended, not the original entry deleted\
  \ \u2014 audit trail)"
- Retracted reports are still visible in the journal for forensics but are EXCLUDED
  from the prompt's discussion_thread section that gets fed to subagents
- "The thread retraction logic runs at task requeue time, not at each subagent spawn\
  \ \u2014 idempotent, cheap, once per task cycle"
- 'Test: construct a task with a prior ''pass'' report claiming files_changed=[''foo.py'']
  where foo.py is unchanged relative to main. Requeue the task. Assert the thread
  fed to the next subagent prompt contains a retraction marker for the stale report.'
