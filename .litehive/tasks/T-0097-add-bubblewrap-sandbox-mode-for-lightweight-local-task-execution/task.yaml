goal: Add a lightweight `bubblewrap` sandbox mode that constrains task execution to
  the workspace and a minimal runtime surface, so an agent or compromised package
  cannot freely read, modify, or delete files outside the allowed mounts.
acceptance_criteria:
- Litehive can execute supported task stages inside `bubblewrap` as a selectable sandbox
  mode.
- The sandbox mounts only the intended workspace paths plus the minimal runtime paths
  needed to execute the toolchain.
- The sandbox configuration prevents writes outside the allowed workspace mounts.
- Sensitive host paths like the broader home directory are not exposed unless explicitly
  required for the selected executor.
- Sandbox policy and propagated mounts/env are visible in task/run diagnostics.
constraints:
- Treat `bubblewrap` as complementary to Docker, not a replacement for Docker-based
  resource and environment isolation.
- Default to the narrowest practical filesystem and environment exposure.
- Make executor-specific credential propagation explicit rather than inheriting the
  full host environment.
plan:
- Add a `bubblewrap` sandbox backend with a minimal mount and environment policy.
- Restrict default access to the workspace plus only the runtime/tool paths required
  for execution.
- Surface the resulting sandbox config in diagnostics and verify that paths outside
  the workspace are not writable or broadly readable.
