- role: qa
  step: testing
  verdict: reject
  message: 'REJECT


    Observed regression:

    `drain_task_pool()` can report `parallel_batch_complete` even when the pool actually
    stopped with blocked work remaining after a failed task. In `litehive/pipeline/compat.py:115-140`,
    `_should_run_parallel_integration_check()` allows `blocked_tasks_remaining`, and
    `_finalize_pool_run()` overwrites that stop reason with `parallel_batch_complete`
    whenever the integration command succeeds.


    EXPECTED behavior:

    The deterministic integration stage should only run after a batch completes naturally,
    and it must not mask unresolved blocked work or a prior task failure. A pool run
    that ends with blocked tasks remaining should keep a stop reason that reflects
    the blocked/incomplete state unless there is an explicit product decision otherwise.


    OBSERVED behavior:

    A mixed batch with one successful task, one failed task (`merge_failed`), and
    one dependent blocked task returns:

    - `stop_reason == "parallel_batch_complete"`

    - `blocked_count == 1`

    - `blocked_task_ids == ["T-0003"]`

    - `integration_success == True`

    - `integration_task_ids == ["T-0001"]`

    So the summary claims the batch completed even though task `T-0003` is still blocked
    by the failed task.


    Reproduction steps:

    1. Create a temp workspace with `parallel_integration_check` configured, e.g.
    `${sys.executable} -c "print(''ok'')"`.

    2. Create three tasks: `T-0001`, `T-0002`, and `T-0003` where `T-0003` depends
    on `T-0002`.

    3. Monkeypatch `litehive.pipeline.compat.run_task` so the first task returns `final_stage="done"`
    and the second returns a non-done result while persisting `status="merge_failed"`,
    `pipeline_status="merge_failed"`.

    4. Call `drain_task_pool(root)`.

    5. Observe that the summary reports `parallel_batch_complete` despite `summary.blocked`
    still containing `T-0003`.


    Validation performed:

    - `pytest -q tests/test_parallel_integration.py tests/test_config.py` passes.

    - Independent repro above fails semantically and demonstrates the incorrect final
    summary.


    Acceptance/task fit not met:

    The task goal is to add a deterministic integration stage for parallel worker
    outputs. The current implementation is not safe because it can misreport an incomplete/blocked
    pool run as a completed parallel batch.

    '
