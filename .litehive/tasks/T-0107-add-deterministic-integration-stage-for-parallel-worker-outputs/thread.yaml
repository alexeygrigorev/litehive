    1. Multiple SWE agents working on the same task in parallel (e.g., exploring different\
    \ approaches), with a stage to pick/merge the best result.\n2. Multiple tasks\
    \ running concurrently in separate worktrees, with a stage to integrate their\
    \ combined changes into main without conflicts.\n3. Subtask decomposition where\
    \ a parent task spawns child tasks that execute in parallel, then a gather/reduce\
    \ stage merges their outputs.\n4. A post-commit integration check that validates\
    \ multiple recently-merged tasks don't conflict at the integration level.\n\n\
    Each of these implies fundamentally different architecture, scope, and effort.\n\
