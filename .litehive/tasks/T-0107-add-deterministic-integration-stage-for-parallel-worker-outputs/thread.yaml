    deterministic\" mean here \u2014 ordering guarantee? idempotent merge? reproducible\
    \ conflict resolution?\n- What are the inputs and outputs of the integration stage?\n\
    - How does this interact with the existing single-worktree-per-task model and\
    \ workspace runner guard?\n\nRECOMMENDATION:\nEither (a) provide product context\
    \ and re-groom, or (b) decompose into a research spike (e.g., \"Design parallel\
    \ execution model for litehive\") followed by the implementation task."
