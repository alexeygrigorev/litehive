  message: "BLOCKED: Task T-0107 cannot be groomed \u2014 insufficient product context\
    \ to shape.\n\nWHAT EXISTS TODAY:\n- Litehive executes tasks strictly sequentially\
    \ with a workspace-wide runner guard (one active task at a time).\n- Each task\
    \ gets a single worktree, runs through fixed stages (grooming \u2192 implementing\
