  2.80s. Acceptance criteria coverage confirmed: configured integration check auto-runs
  after merges and before batch completion; no-op when parallel_integration_check
  is unset; passing check preserves stop_reason parallel_batch_complete; failing check
  produces stop_reason parallel_integration_failed plus batch report and failure journal
  entries; report includes command, exit_code, stdout, stderr, timestamp, task_ids,
  and merge_order; behavior stays scoped to the parallel pipeline and does not alter
  sequential flow. Note: an earlier implementation note referenced tests/test_config_and_run_cli.py,
  but in this workspace those checks live in tests/test_config.py and tests/test_run_cli.py;
  both passed.'
