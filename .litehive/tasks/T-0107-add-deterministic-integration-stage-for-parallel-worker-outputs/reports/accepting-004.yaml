summary: 'ACCEPTED. I verified the implemented scope matches the shaped task for deterministic
  post-merge integration verification in the parallel pipeline. Code review confirms
  litehive/config/model.py adds optional parallel_integration_check on LitehiveConfig;
  litehive/pipeline/_parallel.py adds IntegrationCheckResult, exposes integration_check
  on ParallelRunSummary, runs a Phase 4 integration check on the main worktree after
  deterministic task-ID-ordered merges, writes batch reports under .litehive/logs/parallel-integration/,
  records task_ids/merge_order/command/exit_code/stdout/stderr/timestamp, sets stop_reason
  to parallel_integration_failed on non-zero exit, and appends failure journal entries
  to each merged task. The behavior remains scoped to the parallel pipeline; the sequential
  single-task flow is unchanged. Fresh verification in this workspace: uv run pytest
  tests/test_parallel_execution.py -q -> 20 passed in 1.18s; uv run pytest tests/test_parallel_execution.py
  -q -k ''integration_check or run_integration_check'' -> 4 passed, 16 deselected
  in 0.56s; uv run pytest tests/test_config.py -q -> 39 passed in 0.60s; uv run pytest
  tests/test_run_cli.py -q -> 34 passed in 2.86s. Acceptance criteria coverage: configured
  integration check runs automatically after all successful merges and before batch
  completion; no-op when parallel_integration_check is unset; passing check preserves
  stop_reason parallel_batch_complete; failing check produces stop_reason parallel_integration_failed
  plus batch report and per-task journal evidence; report content is sufficient for
  diagnosis; focused tests cover pass, fail, no-op, and output capture scenarios.
  Note: git status shows a modified task record file (.litehive/tasks/T-0107-add-deterministic-integration-stage-for-parallel-worker-outputs/task.yaml)
  from grooming persistence, but it does not affect the acceptance outcome.'
