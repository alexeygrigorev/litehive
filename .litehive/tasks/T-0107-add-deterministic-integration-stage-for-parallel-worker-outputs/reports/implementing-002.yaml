feedback: "## Implementation Complete\n\n### What was implemented\nAdded a post-merge\
  \ integration verification stage (Phase 4) to the parallel execution pipeline.\n\
  \n### Changes made\n\n**litehive/config/model.py:**\n- Added `parallel_integration_check:\
  \ str | None = None` field to `LitehiveConfig`. When set to a shell command string,\
  \ the integration check runs after all parallel task merges complete.\n\n**litehive/pipeline/_parallel.py:**\n\
  - Added `IntegrationCheckResult` dataclass with fields: command, exit_code, stdout,\
  \ stderr, timestamp, task_ids, merge_order, success.\n- Added `integration_check:\
  \ IntegrationCheckResult | None` field to `ParallelRunSummary`.\n- Added `_run_integration_check()`\
  \ function that runs the configured command via `subprocess.run` on the main worktree,\
  \ captures all output, and writes a YAML batch report to `.litehive/logs/parallel-integration/{timestamp}-batch.yaml`.\n\
  - Added Phase 4 logic in `run_parallel_tasks()` after Phase 3 merge loop: if `parallel_integration_check`\
  \ is configured and at least one task merged successfully, runs the check. If it\
  \ fails, sets `stop_reason` to `parallel_integration_failed` and appends a journal\
  \ entry to each merged task.\n\n**tests/test_parallel_execution.py:**\n- `test_integration_check_passes`:\
  \ Configured check (`true`) passes \u2192 `parallel_batch_complete`, report written.\n\
  - `test_integration_check_fails`: Configured check (`false`) fails \u2192 `parallel_integration_failed`,\
  \ report written with batch info, journal entries written.\n- `test_integration_check_not_configured`:\
  \ No check configured \u2192 no-op, no report directory created, existing behavior\
  \ preserved.\n- `test_run_integration_check_captures_output`: Direct unit test of\
  \ `_run_integration_check` verifying stdout capture, report file, and field values.\n\
  \n### Acceptance criteria verification\n1. \u2705 After all parallel tasks merge,\
  \ integration verification runs automatically \u2014 Phase 4 in `run_parallel_tasks`.\n\
  2. \u2705 Configurable via `parallel_integration_check` in config.yaml, no-op if\
  \ unconfigured.\n3. \u2705 If check passes, stop_reason is `parallel_batch_complete`\
  \ \u2014 verified by `test_integration_check_passes`.\n4. \u2705 If check fails,\
  \ stop_reason is `parallel_integration_failed`, failure captured in report, journal\
  \ entries written \u2014 verified by `test_integration_check_fails`.\n5. \u2705\
  \ Integration report includes: batch task IDs, merge order, check command, exit\
  \ code, stdout/stderr, timestamp \u2014 verified by report content assertions.\n\
  6. \u2705 Integration check is idempotent: runs on committed git state after merges.\n\
  7. \u2705 Existing tests pass (20/20), new tests cover pass/fail/unconfigured scenarios.\n\
  \n### Tests run\n- `uv run pytest tests/test_parallel_execution.py -q` \u2192 20\
  \ passed\n- `uv run pytest tests/test_config_and_run_cli.py -q` \u2192 58 passed"
