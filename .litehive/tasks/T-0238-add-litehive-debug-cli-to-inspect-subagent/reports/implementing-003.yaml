  - `litehive/cli/__init__.py` \u2014 Imported and dispatched `_cmd_debug`\n- `tests/workspace_helpers.py`\
  \ \u2014 Exported `_cmd_debug` for test use\n\n### Acceptance criteria verification\n\
  \n1. **Session info (engine, exit code, status, duration)** \u2014 MET. Displays\
  \ engine, role, status from SubagentRef. When RuntimeSubagentState is available\
  \ (from runtime.yaml), also shows exit_code, started_at, completed_at. Falls back\
  \ to session.yaml when runtime state is not available. Tests: `test_debug_latest_subagent`,\
  \ `test_debug_shows_exit_code_from_runtime`\n\n2. **Verdict submitted and what it\
  \ was** \u2014 MET. Cross-references thread.yaml to find the latest non-comment\
  \ verdict matching the subagent's role. Shows verdict value and first line of message.\
  \ Tests: `test_debug_shows_verdict`, `test_debug_no_verdict`\n\n3. **Tail of stdout\
  \ and stderr (last 500 chars)** \u2014 MET. Reads stdout.txt/stderr.txt (plain or\
