  \ Tests: `test_debug_stdout_tail_500`, `test_debug_stderr_output`\n\n4. **Transcript\
  \ summary (first 200 chars)** \u2014 MET. Reads transcript.md (plain or gzip), shows\
  \ first 200 chars with total length. Tests: `test_debug_transcript_summary_200`\n\
  \n5. **`--all` lists all subagents** \u2014 MET. Iterates task.subagents and shows\
  \ id, role, engine, status for each. Tests: `test_debug_all_subagents`, `test_debug_all_no_subagents`\n\
  \n6. **All existing tests pass** \u2014 MET. Ran test_config_and_run_cli (58 passed),\
  \ test_list_and_show (9 passed), plus all 13 new debug tests pass.\n\n### Additional\
