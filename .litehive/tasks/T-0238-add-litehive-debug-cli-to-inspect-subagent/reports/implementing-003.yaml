  \ Missing artifacts graceful handling: `test_debug_missing_artifacts_graceful`\n\
  - Task not found error: `test_debug_task_not_found`\n- No subagents: `test_debug_no_subagents`\n\
  - Runtime exit code display: `test_debug_shows_exit_code_from_runtime`"
