  \ variants.\n\n**Verdict correlation**: Verdicts are stored in `{TASK_ID}.thread.yaml`\
  \ (via `TaskThreadComment`), NOT in subagent artifacts. To show whether a verdict\
  \ was submitted, cross-reference the task's thread entries by timestamp/role against\
  \ the subagent's role and time window.\n\n**CLI pattern**: Follow existing pattern\
  \ in `litehive/cli/parser.py` (add subparser), create `litehive/cli/debug.py` handler,\
  \ register in `litehive/cli/__init__.py`.\n\n**Latest subagent**: The task's `subagents`\
  \ list in `task.yaml` is ordered. The last entry is the latest. Use its `path` field\
  \ to locate artifacts.\n\n### Acceptance Criteria Assessment\nAll 6 criteria are\
  \ observable and testable:\n1. Session info display (engine, exit code, status,\
  \ duration) \u2014 read from `session.yaml` fields\n2. Verdict display \u2014 cross-reference\
  \ `thread.yaml` entries\n3. stdout/stderr tail (last 500 chars) \u2014 read/decompress\
  \ artifact files\n4. Transcript summary (first 200 chars) \u2014 read/decompress\
  \ `transcript.md`\n5. `--all` flag lists all subagents \u2014 iterate task's subagent\
  \ list\n6. Existing tests pass \u2014 standard regression check\n\n### Implementation\
