  \ (handling gzip), cross-references thread.yaml for verdicts, and formats output\"\
  \n  - \"Register debug command in litehive/cli/__init__.py dispatcher\"\n  - \"\
  Add tests in tests/ covering: default single-subagent output, --all listing, gzipped\
  \ artifact handling, missing artifacts gracefully handled, verdict display\"\n \
  \ - \"Run full test suite to confirm no regressions\"\npm_complexity: simple\nplanned_effort:\
  \ s\n```\n\n### Risks\n- None significant. This is a read-only diagnostic command\
