goal: Add a command like 'litehive debug T-XXXX' that shows the latest subagent's
  session.yaml, report.yaml, exit code, transcript summary, stdout tail, stderr, and
  whether a verdict was submitted. Makes it easy to diagnose why a task failed without
  manually navigating subagent directories.
acceptance_criteria:
- litehive debug T-XXXX shows latest subagent session info (engine, exit code, status,
  duration)
- litehive debug T-XXXX shows whether verdict was submitted and what it was
- litehive debug T-XXXX shows tail of stdout and stderr (last 500 chars)
- litehive debug T-XXXX shows transcript summary (first 200 chars)
- litehive debug T-XXXX --all lists all subagents with their status/exit code
- All existing tests pass
