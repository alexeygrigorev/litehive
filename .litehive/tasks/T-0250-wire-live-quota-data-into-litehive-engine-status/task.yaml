goal: Wire the existing live quota checkers into litehive engine status so the status
  output shows both recorded monitoring data and current quota state for each supported
  engine, with graceful fail-open output when a quota source is unavailable.
acceptance_criteria:
- litehive engine status claude prints a quota section with Claude 5-hour and 7-day
  utilization plus reset timestamps from the live quota checker.
- litehive engine status codex prints a quota section with Codex 5-hour and weekly
  usage percentages and reset information from the live quota checker.
- litehive engine status copilot prints a quota section with Copilot premium remaining
  versus entitlement and the quota reset date from the live quota checker.
- litehive engine status opencode and litehive engine status goz print a quota section
  with Z.AI API-call and token utilization percentages from the live quota checker.
- If any quota fetch fails or credentials are missing, litehive engine status still
  exits successfully and prints an unavailable-style quota message instead of crashing.
- The updated engine status behavior is covered by automated tests, and uv run pytest
  -q passes with zero failures.
constraints: []
plan:
- Confirm the operator-facing output contract for all-engines and single-engine status
  calls, including what should print when monitoring data is absent but live quota
  is still queryable.
- Refactor litehive.cli.engine to call the Claude, Codex, Copilot, and Z.AI quota
  helpers consistently and render a stable quota block per engine.
- Ensure quota failures stay fail-open and user-readable, reusing unavailable-style
  output rather than surfacing tracebacks or aborting the command.
- Expand CLI tests to cover Claude, Codex, Copilot, and Z.AI quota rendering plus
  quota-error handling in both scoped and aggregate engine status flows when applicable.
- Run targeted engine-status tests during development, then run uv run pytest -q before
  handoff.
