summary: 'Grooming pass completed after repo inspection and task shaping. I updated
  T-0250 with PM_COMPLEXITY=moderate, PLANNED_EFFORT=s, six concrete acceptance criteria,
  and a five-step implementation plan. Key evidence from inspection: litehive/cli/engine.py
  already has a live quota renderer for codex, claude, copilot, and Z.AI-backed engines,
  but the behavior is inconsistent with the task goal. In all-engines mode, live quota
  is only printed for engines already present in monitoring.engines. In single-engine
  mode, codex proactively refreshes quota before loading monitoring, but claude/copilot/goz/opencode
  return early with "engine_status: no monitoring data for <engine>" and never print
  live quota if there is no monitoring record. The next agent should normalize that
  behavior so live quota output is available per requested engine and graceful unavailable
  output is preserved when a quota fetch fails. I also clarified the Z.AI acceptance
  language to use the real engine names opencode and goz rather than a non-existent
  zai engine name. Tests run in grooming: none; this stage was inspection and task
  shaping only.'
