goal: Agents running tasks that touch git history (filter-repo, filter-branch, force-push,
  reset --hard, push -f) must run in a sandbox. The T-0266 incident had codex running
  non-sandboxed with full host access, including the ability to force-push to origin.
  Add a policy that detects these tool invocations in agent prompts or subagent args
  and refuses to run outside sandbox.
acceptance_criteria:
- 'Deny-list of destructive commands hard-blocks subagent execution: git filter-repo,
  filter-branch, push --force, push -f, reset --hard (without specific args), reflog
  expire, gc --prune=now'
- Deny-list is checked against the agent's raw command output BEFORE execution proceeds
- Any attempted destructive operation routes to human_attention queue instead of running
- Bypass requires human_checkpoint:before_implementation set on the task
constraints:
- Do not allow any silent escape route - prefer false positive (flag for human) over
  false negative (let destructive op run)
