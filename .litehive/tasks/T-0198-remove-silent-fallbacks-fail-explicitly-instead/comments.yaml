- role: recovery
  step: backlog
  verdict: pass
  message: "Root cause: the planner/recovery CLI path was blocked by two Litehive\
    \ infrastructure bugs, not by T-0198 itself.\n\n1. Eager `heru` imports made lightweight\
    \ commands unusable in a checkout without the sibling `../heru` repo.\n   - `litehive\
    \ task show T-0198` went through the full root app, which imported runner/daemon/workspace\
    \ modules and failed before command dispatch.\n   - `litehive update` / `litehive\
    \ close` also hit unnecessary `heru` imports through planner/task modules.\n2.\
    \ Single-task shaping commands were coupled to unrelated SQLite runtime rows.\n\
    \   - `list_tasks(include_runtime=False)` ignored `include_runtime` and still\
    \ required SQLite runtime rows for every task.\n   - `active_task_markers()` used\
    \ a strict full-workspace runtime scan, so `update_task()` could fail on an unrelated\
    \ missing row like `T-0002`.\n\nLitehive fix made:\n- Added direct dispatch in\
    \ `litehive/main.py` for `task` and `pipeline` subcommands so they no longer depend\
    \ on the heavyweight root app import path.\n- Extracted pipeline commands into\
    \ `litehive/cli/pipeline_cli.py` so `litehive pipeline journal` and `litehive\
    \ pipeline rules` stay usable without importing unrelated engine code.\n- Narrowed\
    \ `litehive/cli/task_cli.py` imports so `task show`/`task logs` do not pull in\
    \ debug/worktree code unless those commands are actually invoked.\n- Made `litehive/cli/parse.py`\
    \ tolerate missing `heru` by using a local fallback for `ENGINE_CHOICES`.\n- Switched\
    \ `litehive/tasks/runtime.py` to use Litehive\u2019s own heru-compat layer instead\
    \ of importing `heru.types` directly.\n- Fixed `litehive/state/records.py` so\
    \ `list_tasks(include_runtime=False)` actually skips SQLite runtime loading.\n\
    - Fixed `litehive/tasks/queue.py` so `active_task_markers()` uses non-strict task\
    \ loading and no longer blocks single-task mutations on unrelated missing runtime\
    \ rows.\n- Added regression tests for the state-loader and task-update paths.\n\
    \nVerification:\n- `PYTHONPATH=/tmp/heru_stub .venv/bin/pytest tests/state/test_task_runtime_storage.py::test_list_tasks_without_runtime_tolerates_missing_runtime_rows\
    \ tests/tasks/test_status_updates.py::test_update_task_ignores_unrelated_missing_runtime_rows\
    \ tests/tasks/test_status_updates.py::test_update_task_closes_task_with_structured_outcome\
    \ tests/tasks/test_status_updates.py::test_update_task_parks_task_with_structured_action\
    \ tests/tasks/test_status_updates.py::test_update_task_requeues_task_with_structured_action\
    \ tests/tasks/test_status_updates.py::test_update_task_abandons_task_with_structured_action`\n\
    - Real CLI repros without any heru shim now work:\n  - `.venv/bin/litehive task\
    \ show T-0198` prints task details instead of crashing on `ModuleNotFoundError:\
    \ heru`.\n  - `.venv/bin/litehive pipeline journal T-0198` now reaches the real\
    \ v2-state check (`no v2 state row for task T-0198`) instead of crashing in CLI\
    \ import.\n  - In a temp workspace containing an unrelated missing runtime row\
    \ `T-0002`, `LITEHIVE_AGENT_ROLE=planner .venv/bin/litehive update --task-id T-0001\
    \ ...` succeeds.\n  - In that same workspace, `LITEHIVE_AGENT_ROLE=planner .venv/bin/litehive\
    \ close --task-id T-0001 --outcome duplicate ...` succeeds.\n\nNotes:\n- `uv`\
    \ is not installed in this checkout, so I used `.venv/bin/pytest` directly.\n\
    - One pre-existing test in this branch (`tests/state/test_task_runtime_storage.py::test_get_task_requires_sqlite_runtime_state_row`)\
    \ is inconsistent with the current `get_task()` behavior and was not changed as\
    \ part of this recovery fix.\n\nWhy retry should succeed now:\n- The grooming/planner\
    \ agent can now use the required Litehive mutation commands in this checkout without\
    \ a `heru` checkout and without being blocked by unrelated missing SQLite runtime\
    \ rows. That restores the task-shaping path for T-0198.\n"
