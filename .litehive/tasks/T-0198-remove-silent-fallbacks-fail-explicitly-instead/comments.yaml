- role: recovery
  step: backlog
  verdict: pass
  message: 'Root cause: the grooming-path CLI still had two Litehive infrastructure
    failures. First, `litehive/main.py` was routing agent-role commands through the
    full root CLI app, which eagerly imported engine-model code and crashed `litehive
    agent update`, `litehive agent close`, and root `litehive add` with `ModuleNotFoundError:
    heru`. Second, `litehive/tasks/status.py` required a SQLite runtime row on the
    target task itself, so single-task mutation commands still failed for file-backed
    tasks like T-0198 even after unrelated-row tolerance work landed.


    Fixes made:

    - `litehive/main.py`: keep lightweight dispatch for agent-role commands instead
    of falling through to the full root CLI, and route root `litehive add` to the
    task CLI without importing the full app.

    - `litehive/tasks/status.py`: `update_task()` and `close_task()` now load the
    target task via `get_task_record(...)` and persist runtime state as part of the
    mutation instead of failing up front when the target runtime row is missing. `close_task()`
    follow-up validation was also switched to tolerant single-task lookup.

    - `litehive/cli/task_logs_support.py`: single-task log lookups no longer do a
