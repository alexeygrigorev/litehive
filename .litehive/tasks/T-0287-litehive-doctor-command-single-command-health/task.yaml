id: T-0287
slug: litehive-doctor-command-single-command-health
title: Add litehive doctor command
created_at: '2026-04-10T05:59:18+00:00'
task_type: null
pipeline_mode: full
priority: medium
depends_on: []
goal: Run one CLI that reports duplicate task IDs, merge_failed tasks, flagged tasks,
  divergence, stale worktrees, stuck commit_to_git tasks, orphaned subagents, and
  broken state.
acceptance_criteria:
- litehive doctor runs all health checks and reports findings
- 'Detects: duplicate IDs, merge_failed, flagged, origin divergence, stale worktrees,
  orphaned subagents, YAML conflicts'
- Each finding includes a recommended fix command
- --fix flag runs the automated fixes for non-destructive problems
constraints:
- Keep changes scoped to the new `doctor` command and shared detection/fix helpers
  it needs.
- Prefer reusing existing `repair_workspace_state()`, worktree inspection, and task-loading
  utilities over reimplementing repair logic.
- Treat malformed `state.yaml` as a first-class doctor finding; the command should
  diagnose it without crashing.
- Do not make `--fix` delete worktrees, resolve git divergence, or mutate ambiguous
  flagged/merge-failed task state automatically.
plan:
- Define the `doctor` command surface and output contract, including exit-code behavior
  for clean, warning, and fix-applied runs.
- Extract current ad hoc health checks from `litehive/main.py` / related CLI code
  into reusable doctor detection helpers.
- Implement detectors for each required finding class, including a safe parser path
  for malformed or conflict-marked `.litehive/state.yaml`.
- Wire `--fix` only to deterministic non-destructive remediations, likely by delegating
  duplicate-ID and stranded-commit recovery to existing repair helpers and adding
  narrow helpers for any remaining safe cases.
- Add focused CLI tests that construct each broken workspace condition and assert
  both the finding text and the recommended fix command.
- Update CLI help/README so operators know when to use `doctor` versus `health` and
  `repair`.
