summary: 'Accepted T-0287. I verified the new top-level doctor surface is wired through
  the CLI parser and implemented in the shared recovery doctor module, with one-line
  findings plus recommended fix commands for duplicate_task_id, merge_failed_task,
  flagged_task, origin_divergence, stale_worktree, commit_to_git_stuck, orphaned_subagent,
  and broken_state_yaml. I also confirmed malformed/conflict-marked .litehive/state.yaml
  is diagnosed without crashing and that --fix remains intentionally narrow: duplicate-ID
  repair and stranded/orphaned commit recovery reuse repair_workspace_state(), while
  orphaned active_subagent runtime markers are cleared only when the task is no longer
  running or artifacts are missing; flagged/merge_failed/divergence/stale-worktree
  findings remain manual. Evidence run during acceptance: uv run pytest -q tests/test_observability_and_status.py
  -k ''doctor or parser_exposes_doctor_command'' -> 13 passed, 75 deselected; uv run
  pytest -q tests/test_observability_and_status.py -> 88 passed. Direct sanity check:
  invoking litehive.cli.doctor._cmd_doctor against a temporary empty workspace printed
  ''doctor: clean ...'' and returned exit_code=0. Acceptance criteria status: AC1
  met by clean exit 0 and clean summary behavior; AC2 met by per-finding stable labels/context/fix
  commands in focused tests; AC3 met by explicit focused tests for every required
  finding class; AC4 met by focused --fix tests proving safe fixes are applied while
  unsafe findings such as flagged tasks remain unchanged; AC5 met because coverage
  is now split into short focused tests rather than a monolithic multi-behavior flow.
  No acceptance-stage regressions found in the doctor path.'
