- role: swe
  step: implementing
  verdict: pass
  message: 'Implemented a new top-level ''litehive doctor'' command with a shared
    workspace-doctor scanner under litehive/pipeline/recovery/doctor.py. The scan
    now reports one-line findings with stable labels and recommended fix commands
    for duplicate task IDs, merge_failed tasks, flagged tasks, origin divergence,
    stale managed worktrees, stuck commit_to_git tasks, orphaned subagent runtime
    state, and broken/conflicted .litehive/state.yaml. Added --fix support for deterministic
    non-destructive fixes only: duplicate-ID repair and stranded/orphaned commit_to_git
    recovery via existing repair helpers, plus clearing orphaned active_subagent runtime
    markers when the task is no longer running or artifacts are missing. Reused the
    shared doctor task-alert helpers in litehive/main.py so fast status no longer
    carries bespoke duplicate/flagged/merge_failed scanning logic. Added parser/CLI
    wiring and documented the new command in .litehive/context.md. Verification: uv
    run ruff check --select E402,F401 litehive tests -> pass; forbidden-noqa check
