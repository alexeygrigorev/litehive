    \ path, and cover it with docs/tests. Do not broaden this into daemon-level stale-runner\
    \ recovery; that is a separate concern already represented by `inactivity_timeout_seconds`.\n\
    \nTASK_UPDATE:\n  goal: >-\n    Detect stalled live Codex execution after 5 minutes\
    \ without new output and\n    recover automatically by treating it as a retryable\
    \ stage restart, reusing\n    continuation/resume state when available.\n  acceptance_criteria:\n\
    \    - >-\n      Live Codex subagent runs use a 300-second inactivity threshold\
    \ by default,\n      and the threshold remains configurable through workspace\
    \ config instead of\n      being hardcoded in the adapter.\n    - >-\n      If\
    \ no new stdout arrives for the configured threshold, Litehive terminates\n  \
    \    the stale Codex process, records the timeout in session/report artifacts,\n\
    \      and classifies the result as a retryable `timeout` failure.\n    - >-\n\
    \      The pipeline's existing retry flow performs the automatic restart for that\n\
    \      stage after an inactivity timeout; when a continuation/resume id is\n \
    \     available, the restarted Codex turn receives it so work can continue from\n\
    \      the prior session instead of starting fresh.\n    - >-\n      Workspace\
    \ config templates and user-facing docs describe the 5-minute\n      default and\
    \ clarify that this behavior applies to live subagent output\n      stalls, not\
    \ daemon-level stale-runner recovery.\n    - >-\n      Automated tests cover timeout\
    \ detection, retry classification, and\n      continuation/resume handoff for\
    \ the restarted Codex turn.\n  constraints:\n    - Keep changes scoped to Codex/live\
    \ subagent inactivity handling.\n    - Do not redesign workspace-level `inactivity_timeout_seconds`\
    \ or daemon restart behavior in this task.\n    - Reuse the existing retry/continuation\
    \ path instead of introducing a second restart mechanism.\n  plan:\n    - >-\n\
    \      Audit the current live subagent timeout path in `litehive/agents/manager.py`,\n\
    \      `litehive/agents/session.py`, and the Heru/Codex adapter boundary to confirm\n\
    \      where the 360-second default is sourced and how timeout failures propagate.\n\
    \    - >-\n      Update the default/wiring so Codex live execution enforces a\
    \ 300-second\n      inactivity threshold and still surfaces a retryable `timeout`\
    \ failure with\n      the expected transcript/session metadata.\n    - >-\n  \
    \    Verify the automatic restart path uses the existing same-stage retry flow\n\
    \      and preserves any available continuation/resume id for the next Codex turn.\n\
