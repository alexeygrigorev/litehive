id: T-0296
slug: move-worktrees-out-of-repo-to-local-state
title: Move worktrees out of repo to ~/.local/state/litehive/<wid>/worktrees/
created_at: '2026-04-10T06:48:59+00:00'
task_type: null
mode: implementation
pipeline_mode: full
priority: medium
pm_complexity: null
planned_effort: null
depends_on:
- T-0291
goal: Git worktrees should never live inside the repo they belong to (gitignore helps
  but nested .git directories cause confusion and archival risks). Move worktrees
  to $XDG_STATE_HOME/litehive/<workspace-id>/worktrees/<task-id>/. The workspace-id
  is a stable hash of the repo's canonical path or git remote, stored in ~/.config/litehive/workspaces.yaml
  registry.
acceptance_criteria:
- New worktree_root() helper returns $XDG_STATE_HOME/litehive/<wid>/worktrees/ (default
  ~/.local/state/litehive/<wid>/worktrees/)
- git worktree add uses the new external path
- Existing .litehive/worktrees/ path supported read-only for migration
- State migration moves existing worktrees to new path (or cleans stale ones)
- All tests pass using tmp_path workspaces with temporary XDG dirs
