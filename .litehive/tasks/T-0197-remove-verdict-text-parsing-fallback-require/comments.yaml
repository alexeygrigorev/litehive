    \ or update them.\n  - Update the missing-report handling so the first miss triggers\
    \ a same-session nudge with explicit `litehive agent report` guidance, not verdict\
    \ inference.\n  - Ensure a second miss surfaces a clear failure/error path for\
    \ the stage runner.\n  - Add or update unit/integration coverage for both the\
    \ nudge-success and nudge-failure flows.\npm_complexity: moderate\nplanned_effort:\
    \ m\npriority: high\n"
