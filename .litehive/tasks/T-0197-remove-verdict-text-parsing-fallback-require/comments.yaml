  message: "Shaped this task to focus on the remaining runtime gap: agents already\
    \ do not get verdicts inferred from transcript text in `litehive/agents/parsing.py`,\
    \ so the work here is to enforce the missing-report recovery path cleanly. Treat\
    \ this as a bugfix to the nudge/failure flow: if no `litehive agent report` verdict\
    \ exists for the stage, continue the same session once with an explicit CLI instruction;\
    \ if the agent still does not report, fail the stage clearly.\n\nTASK_UPDATE:\n\
    goal: Require stage agents to submit verdicts via `litehive agent report`, with\
    \ one explicit resume/nudge when no report is submitted and no transcript-based\
    \ verdict extraction.\nacceptance_criteria:\n  - If an agent turn ends without\
    \ a persisted CLI report for the current step and without a resource-limit classification,\
    \ the runner resumes the same session once with an explicit instruction to run\
    \ `litehive agent report --verdict <pass|reject|blocked>`.\n  - Verdict resolution\
    \ reads only persisted Litehive reports for the current step; transcript text,\
    \ including `VERDICT:` lines or similar free-form output, is never parsed or inferred\
    \ into a verdict.\n  - If the nudged agent still does not submit a CLI report,\
    \ the stage fails with a clear missing-report error that names the `litehive agent\
    \ report` requirement.\n  - Resource-limit exits still resolve to `blocked` without\
    \ requiring a CLI verdict.\n  - Tests cover both paths: missing report then successful\
