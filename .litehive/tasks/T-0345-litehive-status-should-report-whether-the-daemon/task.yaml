planned_effort: s
depends_on: []
goal: 'Today ''litehive status'' shows workspace state (active_task_id, queued_tasks,
  pool_stop_reason, engine_monitoring) but does not report whether the background
  runner process is actually alive. This lets a dead daemon hide behind normal-looking
  output: queue sits still, no active task, no pool stop reason, and the user assumes
  the daemon is idle when in fact it has crashed. The user should be able to tell
  from ''litehive status'' alone whether the daemon is running, crashed, or never
  started, without having to cross-check pids with ''ps''.'
acceptance_criteria:
- '''litehive status'' output includes a clear liveness field for the background runner
  (e.g. running / stopped / dead)'
- When the recorded daemon pid no longer exists, status reports it as dead rather
  than as running or idle
- When the daemon was never started in this workspace, status reports that distinctly
  from 'dead'
- 'tests/ covers: alive daemon, cleanly stopped daemon, stale-pid (dead) daemon, never-started
  workspace'
- tests/ passes
constraints:
- Keep provider-specific behavior isolated to the adapter boundary.
- Preserve deterministic workspace state and execution flow.
