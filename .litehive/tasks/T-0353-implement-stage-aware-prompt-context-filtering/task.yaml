goal: Replace the current thread trimming heuristic with stage-aware filtering so
  retrying agents only see relevant context, preventing budget exhaustion. See docs/plans/prompt-context-management.md
  for the full plan and T-0294 case study.
acceptance_criteria:
- '1. SWE on retry sees only: grooming pass (truncated to 500 chars) + last_rejection.
  No recovery comments, no old SWE passes, no old QA rejects.'
- '2. QA sees only: last implementing pass. No grooming, no old rejects.'
- '3. Accepting sees only: last implementing pass + last testing pass.'
- 4. Recovery entries with verdict=comment are never included in any stage's thread.
- 5. Individual thread messages are capped at 500 chars with truncation marker.
- 6. Thread entries matching last_rejection (same source + reason) are not duplicated
  in the thread section.
- 7. Existing prompt_serializer tests pass, new tests cover stage-aware filtering
  rules.
