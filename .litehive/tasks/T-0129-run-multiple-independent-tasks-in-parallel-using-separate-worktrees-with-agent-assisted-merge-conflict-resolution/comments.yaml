- role: reviewer
  step: accepting
  verdict: reject
  message: 'Rejecting T-0129.


    EXPECTED behavior:

    When Litehive is running multiple independent tasks in parallel and the runner
    becomes stale or crashes, stale-runner repair must recover those concurrent active
    tasks cleanly so they can be resumed or requeued. This is explicitly required
    by the task constraints: the design must work with recovery, stale-runner repair,
    and queued task resumption when several tasks are active concurrently.


    OBSERVED behavior:

    `recover_stale_runner_state()` is hard-disabled as soon as more than one task
    is marked running. In `litehive/recovery/workspace_repair.py:380-381`, `_can_attempt_stale_runner_recovery()`
    returns `False` for `len(running_task_ids) > 1`, so Litehive leaves both tasks
    in `runtime.execution_status=running` with stale `active_task_id` / `active_task_ids`
    state instead of recovering them.


    Reproduction steps:

    1. Create a workspace with two tasks.

    2. Mark both tasks `status=in_progress`, `pipeline_status=implementing`, `runtime.execution_status=running`,
    and set workspace state `active_task_id=<first>` plus `active_task_ids=[first,
    second]`.

    3. Call `recover_stale_runner_state(root)`.

    4. Observe it returns `False`, leaves `active_task_id` and `active_task_ids` intact,
    and both tasks remain `runtime.execution_status=running`.


    Concrete repro observed in this review run:

    `{''recovered'': False, ''active_task_id'': ''T-0001'', ''active_task_ids'': [''T-0001'',
    ''T-0002''], ''queue'': [''T-0001'', ''T-0002''], ''statuses'': {''T-0001'': ''running'',
    ''T-0002'': ''running''}}`


    Acceptance criteria not met:

    - "Make sure the design works with recovery, stale-runner repair, and queued task
    resumption when several tasks are active concurrently."

    - By extension, the runner does not yet track and recover live execution state
    cleanly while multiple tasks are active.


    Additional evidence:

    - The focused happy-path coverage does pass for parallel execution, isolated worktrees,
    deterministic integration order, conflict routing, and status rendering.

    - Recovery coverage only exercises single-running-task scenarios (`tests/test_recovery_runtime.py:22-76`);
    there is no focused test for stale recovery with multiple active parallel tasks.


    Required fix:

    Teach stale-runner recovery to handle multiple concurrently running tasks instead
    of bailing out, and add focused tests that cover stale recovery and resumption
    for parallel active tasks.

    '
