    \ explicitly references parallel-task integration, not intra-task workers.\n7.\
    \ **Status reporting shows multiple active tasks**: `render_active_tasks_section()`\
    \ shows task id, title, stage, engine, worktree, and conflict/integration status.\
    \ Tests: `test_render_active_tasks_section_multiple`, `test_render_active_tasks_section_empty`\n\
    8. **Focused tests**: 16 tests covering config, state, selection, execution, integration\
    \ (success + conflict), status rendering, deterministic ordering, and worktree\
    \ isolation.\n\n### Tests Run\n- `tests/test_parallel_execution.py`: 16 passed\n\
