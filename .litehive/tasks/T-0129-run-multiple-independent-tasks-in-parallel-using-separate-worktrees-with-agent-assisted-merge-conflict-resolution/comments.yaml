- role: qa
  step: testing
  verdict: reject
  message: "Rejecting T-0129.\n\nPrimary finding:\n- `dequeue_parallel_task_batch()`\
    \ corrupts task state before execution by persisting the selected tasks as `done/done`\
    \ immediately after batch selection.\n- Root cause is in `litehive/tasks/queue_ops.py:417-442`.\
    \ `_resolve_parallel_tasks_from_state()` builds `tasks_by_id` from the real `TaskRecord`\
    \ objects, appends `next_task` into `selected`, then mutates `tasks_by_id[next_task.id].status\
    \ = \"done\"` and `pipeline_status = \"done\"` to simulate dependency satisfaction.\
    \ Because `selected` contains the same objects, `dequeue_parallel_task_batch()`\
    \ later persists those mutated records in `litehive/tasks/queue_ops.py:104-115`.\n\
    \nEXPECTED behavior:\n- Selecting a parallel batch should mark chosen tasks as\
    \ active / in-progress and preserve accurate live execution state until the runner\
    \ actually finishes them.\n- Any dependency-satisfaction simulation used to choose\
    \ the next runnable task must operate on copies, not on the real persisted `TaskRecord`s.\n\
    \nOBSERVED behavior:\n- Immediately after `dequeue_parallel_task_batch(root, 2)`,\
    \ both selected tasks are stored as `done/done` even though no execution has started.\n\
    - Reproduction output from this workspace:\n  - `selected ['T-0001', 'T-0002']`\n\
    \  - `state_active ['T-0001', 'T-0002']`\n  - `stored_first done done`\n  - `stored_second\
    \ done done`\n\nReproduction steps:\n1. Create a fresh workspace.\n2. Create two\
    \ independent queued tasks.\n3. Call `dequeue_parallel_task_batch(root, 2)`.\n\
    4. Reload each task with `get_task()`.\n5. Observe both tasks are already `status='done'`\
    \ and `pipeline_status='done'` before `run_parallel_tasks()` is invoked.\n\nAcceptance\
    \ criteria not met:\n- `The runner tracks per-task worktree ownership, live execution\
    \ state, and final task outcome cleanly while multiple tasks are active.` Live\
    \ execution state is wrong before execution starts.\n- `Status and runtime reporting\
    \ show multiple active tasks clearly ... and whether a task is blocked on integration\
    \ or conflict resolution.` With tasks prematurely persisted as done, reporting\
    \ can no longer rely on correct task lifecycle state.\n- `Make sure the design\
    \ works with recovery, stale-runner repair, and queued task resumption when several\
    \ tasks are active concurrently.` Persisting pre-run tasks as terminal states\
    \ will interfere with those flows.\n\nNotes:\n- Focused tests currently miss this\
    \ because `tests/test_parallel_task_execution.py` checks selected IDs and later\
    \ end-state behavior, but does not assert that selected tasks are persisted as\
    \ `in_progress` immediately after batch dequeue.\n- I also ran `pytest -q tests/test_parallel_task_execution.py`\
    \ and `pytest -q tests/test_recovery_runtime.py tests/test_status_broken_states.py`;\
    \ they pass, which suggests this regression needs an explicit test around post-dequeue\
    \ persisted state.\n"
