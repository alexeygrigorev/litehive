    \ list[str]` to `WorkspaceState`\n- `litehive/pipeline/__init__.py` \u2014 Exported\
    \ parallel module symbols\n- `litehive/observability/_status.py` \u2014 Added\
    \ `render_active_tasks_section()` for parallel task display\n- `litehive/cli/parser.py`\
    \ \u2014 Added `--parallel` flag to `litehive run`\n- `litehive/cli/run.py` \u2014\
    \ Added `_cmd_run_parallel()` handler\n\n### Acceptance Criteria Verification\n\
