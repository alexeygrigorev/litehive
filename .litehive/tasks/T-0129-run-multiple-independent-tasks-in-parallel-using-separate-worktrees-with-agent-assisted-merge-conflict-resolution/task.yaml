goal: Allow litehive to run multiple independent tasks in parallel, each in its own
  dedicated worktree, while keeping runner-owned orchestration and using a dedicated
  agent only when merge conflicts or integration problems need to be resolved. This
  is explicitly about parallel separate tasks, not fanout of multiple workers inside
  one task.
acceptance_criteria:
- litehive can execute more than one independent queued task at the same time when
  parallel capacity is available, and each running task uses its own isolated worktree
  rather than sharing the main checkout.
- Parallel execution happens at the task level, not by splitting one task into multiple
  worker slices. The implementation and docs make that distinction explicit.
- The runner tracks per-task worktree ownership, live execution state, and final task
  outcome cleanly while multiple tasks are active at once.
- When parallel tasks finish without conflicts, the runner integrates them back deterministically
  using the system-controlled git flow rather than relying on agents to perform arbitrary
  manual git operations.
- When merge conflicts or integration conflicts occur between completed parallel tasks,
  litehive can invoke a dedicated merge-conflict or integration-recovery agent to
  resolve the conflict and return the blocked task or tasks to a finishable state.
- Conflict handling is scoped to integration problems between independent tasks, not
  to parallel workers within one parent task.
- Status and runtime reporting show multiple active tasks clearly, including task
  id, title, stage, engine, worktree, and whether a task is blocked on integration
  or conflict resolution.
- Focused tests cover successful parallel task execution, isolated worktree usage,
  deterministic integration back to the main branch, and at least one conflict case
  that routes through the merge-conflict agent path.
constraints:
- Preserve runner ownership of state transitions, queue decisions, and git integration.
  Agents should not be allowed to bypass the orchestrated process.
- Reuse the existing worktree execution model as the base; do not reintroduce a design
  centered on multiple workers inside one task.
- 'Keep the model deterministic: task scheduling, integration order, and conflict
  handling must be explicit and observable.'
- Make sure the design works with recovery, stale-runner repair, and queued task resumption
  when several tasks are active concurrently.
plan:
- Define the parallel task execution model, including how many tasks may run at once,
  how tasks are selected, and how each active task is bound to its own worktree.
- Extend runtime and status surfaces so litehive can represent multiple active tasks
  and their worktrees simultaneously without collapsing back to a single-active-task
  view.
- Define the deterministic integration flow for completed parallel tasks, including
  merge order, conflict detection, and when the merge-conflict agent is invoked.
- Add focused lifecycle tests for parallel task execution, integration success, and
  conflict recovery, then document the feature as task-level parallelism rather than
  intra-task worker fanout.
