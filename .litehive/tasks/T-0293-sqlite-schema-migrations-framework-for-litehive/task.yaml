id: T-0293
slug: sqlite-schema-migrations-framework-for-litehive
title: SQLite schema migrations framework for litehive data.db
created_at: '2026-04-10T06:46:58+00:00'
task_type: null
pipeline_mode: full
priority: medium
depends_on:
- T-0291
goal: Evolve the data.db schema over time without data loss. Every schema change is
  a numbered migration that runs automatically on daemon startup if the DB's schema
  version is behind. Migrations are transactional and tracked in a schema_migrations
  table.
acceptance_criteria:
- schema_migrations table tracks applied migrations by version number and timestamp
- Migrations live at litehive/db/migrations/<NNNN>_<description>.sql and are embedded
  in the package
- On daemon startup, run all pending migrations inside a single transaction per migration
  (rollback on error)
- litehive db status - show current schema version and pending migrations
- litehive db migrate - manually run pending migrations
- litehive db migrate --dry-run - preview migrations without applying
- Initial migration 0001_initial.sql creates the full T-0291 schema
- A forward-only model (no down migrations) with backups handling rollback (via T-0292)
- All existing tests pass
