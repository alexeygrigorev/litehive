  Independent verification I ran: uv run pytest -q tests/test_db_migrations.py tests/test_workspace_bootstrap.py
  tests/test_backup.py tests/test_task_commands_and_daemon.py -> 162 passed, 3 existing
  Typer deprecation warnings; uv run pytest -q -> 999 passed, 3 existing Typer deprecation
  warnings. I also performed a manual smoke check on a fresh temporary workspace:
  uv run litehive db status --workspace <tmp> reported schema_version: 1, applied_migrations:
  1, pending_migrations: 0, and uv run litehive db migrate --dry-run --workspace <tmp>
  exited cleanly with dry_run: yes and pending_migrations: 0. The focused migration
  tests cover embedded discovery of 0001_initial.sql, status/dry-run reporting of
  pending migrations, transactional rollback of a broken migration with no partial
  table left behind, and daemon auto-application before startup. Based on that evidence,
  the acceptance criteria are met, including the forward-only model with rollback
  delegated to backups from T-0292, and the existing test suite remains green.'
