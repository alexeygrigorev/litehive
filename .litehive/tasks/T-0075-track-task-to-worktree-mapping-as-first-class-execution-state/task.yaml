goal: Make the task-to-worktree relationship durable execution state so active tasks
  can resolve, report, recover, and clean up their assigned worktree without relying
  on ad hoc or duplicated git metadata.
acceptance_criteria:
- A task with an assigned worktree persists that mapping in the task's live execution
  state, and later stage/resume paths load the same mapping without recomputing ownership
  from unrelated state.
- Worktree creation, reuse, recovery, dirty-worktree ownership checks, and cleanup
  all read and update the same canonical task-to-worktree execution-state field instead
  of a split or stale source of truth.
- Focused tests cover persistence/migration from any legacy task or workspace worktree
  metadata plus at least one execution path and one cleanup/recovery path that prove
  the mapping survives until it is intentionally cleared.
constraints: []
plan:
- Confirm the canonical execution-state field for task-to-worktree mapping and remove
  ambiguity between task git metadata, runtime state, and any workspace-level side
  mapping.
- Update worktree lifecycle paths to use that canonical mapping consistently for creation,
  reuse, reporting, recovery, dirty-worktree ownership checks, and cleanup.
- Keep backward-compatible reads for legacy task/workspace metadata only as migration
  input, and clear migrated or completed mappings so stale ownership does not persist.
- Add focused regression coverage for persistence/migration plus at least one execution
  path and one cleanup or recovery path.
