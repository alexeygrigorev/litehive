summary: 'Accepted. I verified the new Litehive-managed worktree commands in code
  and by rerunning the relevant checks. Implementation review confirms the worktree
  ls command enumerates only task-recorded worktrees under .litehive/worktrees, prints
  task_id, task status, change_count, path, and active flag, and worktree clean removes
  only closed-task worktrees in statuses done, deferred, wont_do, and duplicate while
  explicitly protecting the active task worktree. Dispatch and parser wiring are present
  in the CLI entrypoint, and README plus .litehive/context.md were updated for operator
  discoverability. Verification run: uv run pytest tests/test_task_commands_and_daemon.py
  -q -k worktree_ls or worktree_clean -> 3 passed, 104 deselected in 1.29s. Broader
  regression check: uv run pytest tests/test_task_commands_and_daemon.py -q -> 107
  passed in 17.78s. Direct CLI checks: uv run litehive worktree --help showed the
  new ls and clean subcommands, and uv run litehive worktree ls --workspace . returned
  the expected empty-state output in the current workspace with worktree_count: 0
  and worktrees: none. The targeted tests cover ls mixed-state output with change
  counts, clean dry-run reporting without deletion, removal of done, deferred, and
  duplicate worktrees, and active-task protection. Acceptance criteria are met.'
