goal: Add litehive worktree ls to show all worktrees with their task status and whether
  they have changes. Add litehive worktree clean to remove worktrees for closed/deferred/done
  tasks. This replaces manual git worktree list + status checking.
acceptance_criteria:
- litehive worktree ls shows all worktrees with task ID, status, and change count
- litehive worktree clean removes worktrees for done/deferred/wont_do/duplicate tasks
- litehive worktree clean --dry-run shows what would be removed without removing
- Active task worktrees are never cleaned
- All existing tests pass
