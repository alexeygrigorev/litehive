goal: Add a logs command for quick access to all log types without navigating directories
  manually. Covers daemon run logs, task journals, and agent stdout/transcript.
acceptance_criteria:
- litehive logs shows tail of latest daemon run log
- litehive logs --daemon lists last 5 daemon run sessions with timestamps and outcomes
- litehive logs T-XXXX shows the task journal (journal.md)
- litehive logs T-XXXX --agent shows latest subagent stdout/transcript tail
- litehive logs T-XXXX --agent --all lists all subagent runs with role, engine, exit
  code, duration
- litehive logs --follow tails the currently running agent's stdout in real time
- All existing tests pass
