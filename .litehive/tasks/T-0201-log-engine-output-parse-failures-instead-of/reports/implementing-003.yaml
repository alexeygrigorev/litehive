feedback: "## Summary\nAdded warning-level log messages at all silent-skip points\
  \ across 5 engine adapter files so parse failures are diagnosable.\n\n## Changes\
  \ Made\n\n### base.py (iter_jsonl_payloads)\n- Added `logger = logging.getLogger(__name__)`\n\
  - Log warning on JSONDecodeError with exception details and truncated line content\n\
  - Log warning when parsed JSON is not a dict (e.g. array, string)\n\n### claude.py\
  \ (_extract_claude_text_delta_fallback)\n- Added `logger = logging.getLogger(__name__)`\n\
  - Log warning when JSON string literal decode fails, with line number and content\n\
  \n### goz.py (_goz_extract_text)\n- Added `logger = logging.getLogger(__name__)`\n\
  - Log warning when a non-empty dict has no recognized keys (text, delta, content,\
  \ message, data, result, part)\n- Empty dicts do not trigger warning (intentional\
  \ \u2014 no useful context)\n\n### codex.py (_extract_codex_transcript)\n- Log warning\
  \ when item.completed has non-dict item field\n- Log warning when agent_message\
  \ has no text field\n\n### opencode.py (_extract_opencode_transcript)\n- Added `logger\
  \ = logging.getLogger(__name__)`\n- Log warning when text event has non-dict part\
  \ field\n- Log warning when text event part has no text field\n\n## Acceptance Criteria\
  \ Verification\n1. **Unparseable engine output items produce a warning log** \u2014\
  \ MET: all five adapter files now log warnings at skip points\n2. **No items silently\
  \ dropped without logging** \u2014 MET: every `continue` or skip at a parse-failure\
  \ point now has a preceding logger.warning()\n3. **Warning logs include enough context**\
  \ \u2014 MET: messages include adapter name, line number or item index, key list,\
  \ and truncated raw content (%.200s)\n4. **Existing tests still pass** \u2014 MET:\
  \ 45/45 engine tests pass, 112/112 runner tests pass\n\n## Tests\n- 12 new tests\
  \ in tests/test_engine_parse_warnings.py covering all warning paths\n- All 12 pass\n\
  - 45 existing engine tests pass (no regressions)\n- 112 runner workflow tests pass\
  \ (no regressions)\n\n## Note on goz refactor\nThe grooming pass correctly split\
  \ out the goz key-path refactor as a separate follow-up task. This implementation\
  \ adds logging to the existing trial-and-error pattern but does not refactor it."
