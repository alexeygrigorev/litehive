feedback: "## Summary\nAdded `runner_status_readonly()` function that reads runner\
  \ status using only file reads and PID liveness checks (os.kill(pid, 0)) \u2014\
  \ no fcntl.flock calls. Updated `build_workspace_snapshot()` in `litehive/web/__init__.py`\
  \ to use `runner_status_readonly()` instead of `runner_status()`.\n\n## Changes\n\
  1. **litehive/tasks/locking.py**: Added `runner_status_readonly(root)` \u2014 reads\
  \ `.runner.lock` metadata, checks PID liveness via `_runner_pid_is_alive()`, and\
  \ heartbeat staleness via `_heartbeat_is_late()`. Returns idle/running/late/stale\
  \ without any lock acquisition.\n2. **litehive/tasks/__init__.py**: Exported `runner_status_readonly`.\n\
  3. **litehive/web/__init__.py**: Changed `build_workspace_snapshot()` to import\
  \ and call `runner_status_readonly` instead of `runner_status`.\n4. **tests/test_web_snapshot_lockfree.py**:\
  \ 5 new tests covering all acceptance criteria.\n\n## Tests (5 added, 5 passing)\n\
  - `test_runner_status_readonly_returns_idle_when_no_metadata` \u2014 no lock file\
  \ \u2192 idle\n- `test_runner_status_readonly_returns_running_when_pid_alive` \u2014\
  \ live PID \u2192 running\n- `test_runner_status_readonly_returns_stale_when_pid_dead`\
  \ \u2014 dead PID \u2192 stale\n- `test_runner_status_readonly_returns_late_when_heartbeat_expired`\
  \ \u2014 old heartbeat + live PID \u2192 late\n- `test_build_workspace_snapshot_does_not_block_on_runner_lock`\
  \ \u2014 monkeypatches fcntl.flock to always raise BlockingIOError, proves snapshot\
  \ completes in <2s with correct data\n\n## Acceptance Criteria Verification\n1.\
  \ \u2705 Web dashboard loads while runner is active \u2014 snapshot uses readonly\
  \ path, no lock contention\n2. \u2705 /api/snapshot responds within 2s \u2014 test\
  \ proves <2s even with flock completely blocked\n3. \u2705 No data corruption risk\
  \ \u2014 reads use already-atomic YAML files (os.replace writes)\n4. \u2705 Snapshot\
  \ code path does not call fcntl.flock \u2014 verified by monkeypatching flock to\
  \ raise\n\nSTAGE_RESULT:\n{\"verdict\":\"pass\",\"summary\":\"Added runner_status_readonly()\
  \ using PID+heartbeat checks instead of fcntl.flock; web snapshot no longer blocks\
  \ on runner lock\",\"tests\":{\"added\":5,\"passing\":5},\"warnings\":[],\"follow_up_tasks\"\
  :[],\"acceptance_criteria\":[\"Web dashboard loads and shows data while the runner\
  \ is actively executing a task\",\"The /api/snapshot endpoint responds within 2\
  \ seconds even when the runner holds the lock\",\"No data corruption risk from lock-free\
  \ reads\",\"The snapshot code path does not attempt any fcntl.flock() calls\"],\"\
