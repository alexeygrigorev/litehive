feedback: "## QA Verification \u2014 T-0214 Fix web dashboard hanging when runner\
  \ is active\n\n### What was verified\n\n1. **Code review**: `runner_status_readonly()`\
  \ (locking.py:128-138) reads `.runner.lock` metadata via `_read_runner_lock_metadata()`\
  \ (pure file read), checks PID liveness via `_runner_pid_is_alive()` (`os.kill(pid,\
  \ 0)`), and heartbeat staleness via `_heartbeat_is_late()`. No `fcntl.flock` calls\
  \ in this path.\n\n2. **Web endpoint**: `build_workspace_snapshot()` (web/__init__.py:54)\
  \ imports and calls `runner_status_readonly` instead of `runner_status`. The import\
  \ at line 18 confirms this.\n\n3. **Export**: `runner_status_readonly` is properly\
  \ exported from `litehive/tasks/__init__.py:84`.\n\n### Tests run\n\nAll 5 tests\
  \ in `tests/test_web_snapshot_lockfree.py` pass (0.35s):\n- `test_runner_status_readonly_returns_idle_when_no_metadata`\
  \ \u2014 no lock file returns idle\n- `test_runner_status_readonly_returns_running_when_pid_alive`\
  \ \u2014 live PID returns running\n- `test_runner_status_readonly_returns_stale_when_pid_dead`\
  \ \u2014 dead PID returns stale\n- `test_runner_status_readonly_returns_late_when_heartbeat_expired`\
  \ \u2014 old heartbeat + live PID returns late\n- `test_build_workspace_snapshot_does_not_block_on_runner_lock`\
  \ \u2014 monkeypatches fcntl.flock to raise BlockingIOError, proves snapshot completes\
  \ in <2s with correct data\n\n### Acceptance criteria status\n\n1. \u2705 Web dashboard\
  \ loads while runner is active \u2014 snapshot uses readonly path, no lock contention\
  \ possible\n2. \u2705 /api/snapshot responds within 2s even when runner holds lock\
  \ \u2014 test proves <2s with flock completely blocked\n3. \u2705 No data corruption\
  \ risk \u2014 reads use already-atomic YAML files (written via os.replace)\n4. \u2705\
  \ Snapshot code path does not call fcntl.flock \u2014 verified by code review and\
  \ monkeypatch trap test"
