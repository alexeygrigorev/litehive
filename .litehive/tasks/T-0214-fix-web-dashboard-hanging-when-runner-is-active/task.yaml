goal: The web dashboard API endpoint /api/snapshot hangs indefinitely when the runner
  holds the workspace lock. build_workspace_snapshot calls load_state and list_tasks
  which try to acquire the lock. The web server should read state files directly without
  locking. The dashboard is read-only - it should never need to wait for the runner
  lock.
acceptance_criteria:
- Web dashboard loads and shows data while the runner is actively executing a task
- The /api/snapshot endpoint responds within 2 seconds even when the runner holds
  the lock
- No data corruption risk from lock-free reads
