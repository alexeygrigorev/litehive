  message: "GROOMING PASS \u2014 T-0214 Fix web dashboard hanging when runner is active\n\
    \n## Problem Analysis\n\nThe `/api/snapshot` endpoint in `litehive/web/__init__.py:50-68`\
    \ calls `runner_status()` (locking.py:128-143) which probes the runner lock file\
    \ via `_runner_lock_is_active()` (locking.py:72-84). While this uses `LOCK_NB`\
    \ (non-blocking), the web dashboard should never touch lock files at all \u2014\
    \ it is read-only. Additionally, the fallback path `_runner_status_needs_reconciliation()`\
    \ (locking.py:87-94) redundantly re-reads all task state. The snapshot should\
    \ use a purely file-read approach.\n\nKey findings:\n- `load_state()` and `list_tasks_state_first()`\
    \ are already lock-free (pure YAML reads)\n- `runner_status()` is the only function\
    \ in the snapshot path that touches lock files\n- Writes use `_atomic_write_text`\
    \ with `os.replace`, so lock-free reads are safe (no partial file risk)\n- The\
    \ lock metadata file (`.runner.lock`) contains PID, status, heartbeat \u2014 enough\
    \ to determine runner state without lock probing\n\n## Acceptance Criteria (refined)\n\
    \n1. Web dashboard loads and shows data while the runner is actively executing\
    \ a task\n2. The `/api/snapshot` endpoint responds within 2 seconds even when\
    \ the runner holds the lock\n3. No data corruption risk from lock-free reads (already\
    \ safe via atomic writes)\n4. The snapshot code path does not attempt any `fcntl.flock()`\
    \ calls\n\n## Plan\n\n1. Add a `runner_status_readonly(root)` function in `litehive/tasks/locking.py`\
    \ that reads `.runner.lock` metadata + checks PID liveness via `os.kill(pid, 0)`\
    \ without touching any lock. Fall back to \"idle\" if metadata is missing/unparseable.\n\
    2. Update `build_workspace_snapshot()` in `litehive/web/__init__.py` to call `runner_status_readonly()`\
