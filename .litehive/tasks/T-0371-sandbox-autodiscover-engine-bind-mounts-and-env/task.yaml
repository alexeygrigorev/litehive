id: T-0371
slug: sandbox-autodiscover-engine-bind-mounts-and-env
title: 'Sandbox: autodiscover engine bind mounts and env overrides, with refresh command'
created_at: '2026-04-13T20:32:36+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: 'Current sandbox per-engine policies in .litehive/config.yaml are hardcoded
  with absolute paths like /home/alexey/.codex and /home/alexey/.nvm/versions/node/v24.13.1.
  This is brittle: (1) breaks across operators/hosts, (2) breaks when the operator
  upgrades node (nvm version changes), (3) leaves stale entries when an engine is
  uninstalled, (4) silently misses engines that are installed later. Replace the hardcoded
  policy with runtime autodiscovery that probes shutil.which(''<engine>'') for each
  known engine, walks up to the node-cli root or binary dir, checks for the expected
  session state dir (~/.codex, ~/.claude, ~/.copilot, ~/.gemini, ~/.config/opencode,
  ~/bin + ~/.goz), and builds a fresh ExternalEngineSandboxPolicy for only the engines
  that are actually installed. Wire it into SandboxLauncher so the config can carry
  just ''enabled: true'' without the hardcoded bind lists. Add a CLI command ''litehive
  sandbox refresh'' (or similar) that prints the discovered policies so the operator
  can audit or persist them.'
acceptance_criteria:
- litehive/agents/sandbox_discovery.py (or equivalent) exposes discover_engine_policy(engine_name)
  and discover_all_engine_policies() returning ExternalEngineSandboxPolicy objects
  with only existing paths
- SandboxLauncher._policy_for_engine falls back to autodiscovery when the workspace
  config does not pin a policy, OR merges hardcoded binds with discovered binds
- 'Discovered policies handle: codex (~/.codex + CODEX_HOME), claude (~/.claude),
  copilot (~/.copilot + ~/.config/gh), gemini (~/.gemini + ~/.config/gcloud), opencode
  (~/.config/opencode), goz (~/.goz + ~/.config/goz + ~/bin + ~/.local/bin for uv)'
- CLI command 'litehive sandbox refresh' prints or writes a discovered policy set;
  useful for auditing and for bootstrapping a fresh workspace
- Unit tests monkeypatch HOME to a tmp dir and verify that each discoverer returns
  None when session state is missing and the correct policy when present
- tests_integration/helpers.py sandboxed_integration_workspace uses the same discovery
  module rather than duplicating bind logic
- '.litehive/config.yaml per-engine policies are reduced to ''enabled: true'' with
  optional overrides; tests still pass'
