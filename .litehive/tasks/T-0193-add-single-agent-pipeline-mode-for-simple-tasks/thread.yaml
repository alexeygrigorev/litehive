- role: swe
  step: implementing
  verdict: pass
  message: "Implemented proactive codex quota checking via chatgpt.com API. All files\
    \ created and integration points wired up.\n\n## Files Changed\n- litehive/engines/_codex_quota.py\
    \ (NEW): Core quota check module with bearer token reading from ~/.codex/auth.json\
    \ (tokens.access_token), API call to GET chatgpt.com/backend-api/wham/usage with\
    \ Authorization: Bearer header, response parsing for rate_limit.limit_reached\
    \ + primary_window (5h) and secondary_window (weekly) used_percent and reset_at,\
    \ 60s TTL module-level cache, and fail-open error handling.\n- litehive/runtime/_execution.py:\
    \ Added import of check_codex_quota/codex_quota_block_reason. Added _record_codex_monitoring()\
    \ helper. Inserted proactive codex quota check before each codex invocation in\
    \ the engine selection loop \u2014 when limit_reached=true, codex is skipped and\
    \ fallback engine is used via the existing engine switch path.\n- litehive/cli/_dry_run.py:\
    \ Added import and proactive quota check in dry-run engine selection so quota-blocked\
    \ codex is surfaced in --dry-run output.\n- litehive/observability/_engine_monitoring.py:\
    \ Added record_codex_quota_check() that surfaces quota used_percent (as usage\
    \ percent with limit=100), reset_at, and per-window metadata in engine-monitoring.yaml.\n\
    - tests/test_codex_quota.py (NEW): 17 targeted tests covering token reading (success,\
    \ missing file, bad JSON, missing field), response parsing (limit reached/not\
    \ reached, empty response), quota check with caching (cache hit, cache expiry,\
    \ no auth), block reason (limit reached, not reached, fail-open), and monitoring\
    \ integration (records quota, skips error status).\n- tests/conftest.py (NEW):\
    \ Autouse fixture that neutralizes real codex quota API calls during tests (except\
    \ test_codex_quota.py which uses explicit fake fetchers).\n\n## Acceptance Criteria\
    \ Verification\n1. Quota checked before each codex invocation: YES - check_codex_quota()\
    \ called in _execution.py engine loop before invocation\n2. Bearer token from\
    \ ~/.codex/auth.json: YES - _read_bearer_token() reads tokens.access_token\n3.\
    \ limit_reached=true skips codex: YES - codex_quota_block_reason() returns blocking\
    \ reason, engine fallback path executes\n4. reset_at from response used: YES -\
    \ parsed from API response, stored in monitoring\n5. Both primary and secondary\
    \ windows checked: YES - _parse_quota_response() extracts both\n6. Engine monitoring\
    \ shows quota: YES - record_codex_quota_check() writes used_percent, reset_at,\
    \ per-window metadata\n7. No wasted invocations: YES - check happens BEFORE invocation,\
    \ not after failure\n8. Cache with 60s TTL: YES - module-level cache with configurable\
    \ TTL\n9. Claude/Copilot out of scope: YES - only codex is checked\n\n## Tests\n\
    - 17 tests added in test_codex_quota.py, all passing\n- 169 tests passing across\
    \ test_codex_quota.py, test_runner_workflow.py, and test_engine_variants_and_timeline.py\n\
    \n## Design Notes\n- Fail-open: if auth.json is missing, API call fails, or response\
    \ is unexpected, codex is NOT blocked\n- Cache is module-level with monotonic\
    \ clock for TTL\n- Monitoring recording is best-effort (wrapped in try/except)\n\
    - conftest.py neutralizes quota API calls in all other test modules to prevent\
    \ flaky tests"
