goal: Add single-agent pipeline mode. Single mode is work -> done. One agent gets
  the task, does whatever is needed, and submits a verdict. No grooming, QA, or reviewer
  stages. Goes to commit_to_git if there are code changes, otherwise straight to done.
acceptance_criteria:
- Tasks have a pipeline_mode field which is either single or full
- 'single mode: work -> done (one agent, no grooming/QA/review stages)'
- If single mode produces code changes, commit_to_git runs after work stage
- 'full mode: current pipeline (grooming, implementing, testing, accepting, commit_to_git)'
- full is the default pipeline_mode
- litehive add --single creates a task with single pipeline mode
