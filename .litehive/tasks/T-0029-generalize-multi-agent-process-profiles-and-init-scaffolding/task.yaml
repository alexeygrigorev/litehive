goal: Analyze the common process patterns across codehive, litehive, rustkyl, pymermaid,
  and ai-shipping-labs, then define a generic customizable process for all projects.
  Capture the shared stages, role model, TDD expectations, acceptance and commit flow,
  and project-profile overlay design. Add a scaffold/init model where generic base
  prompts are combined with project-specific overlays, with templates for at least
  Rust, Python, Django, and Codehive-style projects. Use judgment to generalize strong
  ideas like TDD, orchestrator-as-manager, deterministic routing, issue/task source
  of truth, verification discipline, and commit/recovery policy.
