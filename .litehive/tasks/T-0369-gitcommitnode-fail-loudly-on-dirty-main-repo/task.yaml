goal: 'T-0368 ran through implementing/testing/accepting successfully and produced
  232 lines of real SWE work, but GitCommitNode crashed at commit stage because the
  main repo had an uncommitted orphan file. Error: ''git merge failed with no conflict
  files: Your local changes would be overwritten by merge''. Recovery then exhausted
  and deleted the worktree + branch, losing the commit (operator manually recovered
  it from the dangling commit via cherry-pick). The bug: GitCommitNode assumes main
  repo is clean before merging. It should detect dirty main (git status --porcelain
  pre-merge) and either: (a) stash + retry, or (b) emit a Blocked event with a clear
  actionable attention item pointing the operator at the specific dirty files. Reference
  commit: 943316eb (the recovered work) and e58b66e9 (the per-task-worktree autocommit
  fix).'
acceptance_criteria:
- GitCommitNode detects dirty main repo before attempting git merge and emits Blocked
  (not Crash)
- Attention item describes which files are dirty so operator can fix in seconds
- 'Regression test: dirty main repo + non-empty worktree -> Blocked with file list,
  no Crash, no recovery invoked'
- No change to the clean-main fast path
