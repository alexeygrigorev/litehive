goal: 'Implement the minimal task-pool loop runner only. Scope is limited to: while
  queue not empty, re-read workspace state on every iteration, pick the next eligible
  task, run exactly one task, then continue until the queue is currently empty and
  no active task remains. The loop must pick up tasks added, requeued, or reprioritized
  while it is running. Do not include unrelated engine, adapter, config, or prompt
  changes in this task.'
