goal: Back up the litehive workspace database regularly so operators can recover from
  corruption, accidental deletes, or disk failure. Back ups should be automatic (daemon-driven),
  compressed, rotated, and easily restorable via a CLI command.
acceptance_criteria:
- Daemon performs nightly SQLite backup using sqlite3 .backup API (online-safe, no
  lock conflicts)
- Backups written to $XDG_DATA_HOME/litehive/<wid>/backups/data-YYYY-MM-DDTHH.db.gz
- 'Rotation: keep 7 daily + 4 weekly backups, auto-prune older'
- litehive backup create - manual backup trigger
- litehive backup list - show available backups with timestamp and size
- litehive backup restore <timestamp> - restore a backup (warns before overwriting
  current data.db)
- All existing tests pass
