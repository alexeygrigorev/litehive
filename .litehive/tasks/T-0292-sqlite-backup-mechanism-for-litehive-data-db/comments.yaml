    \ creates at most one backup per calendar day instead of requiring an exact nightly\
    \ wake-up time.\n- `litehive/cli/__init__.py` and `litehive/cli/daemon.py` show\
    \ a Typer-based CLI with no existing `backup` command group, so this task needs\
    \ new CLI surface for `create`, `list`, and `restore`.\n- Current tests cover\
    \ workspace bootstrap and daemon loop behavior (`tests/test_workspace_bootstrap.py`,\
    \ `tests/test_task_commands_and_daemon.py`), but there is no SQLite backup coverage\
    \ yet.\n\nPlanning judgment:\n- Scope is appropriate for one implementation task\
    \ if kept focused on workspace `data.db` backup/restore only.\n- Main product\
    \ risk is operator safety during restore. The implementer should not guess here:\
    \ restore should warn before overwrite and avoid racing with an active daemon\
    \ or runner.\n- \"Nightly\" should be interpreted as automatic once-per-day backup\
    \ creation when the daemon is running, not as dependence on starting at a specific\
    \ wall-clock minute.\n\nRecommended implementation plan:\n1. Add backup path helpers\
    \ near the existing workspace data.db path logic so archive storage remains under\
