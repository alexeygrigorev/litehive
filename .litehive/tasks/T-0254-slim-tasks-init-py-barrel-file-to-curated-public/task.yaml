goal: Replace the oversized litehive.tasks barrel with a curated top-level API focused
  on core task CRUD, queue, thread/report, and runtime/status helpers. Repo-internal
  code and tests that need private or module-specific helpers should import them from
  their defining litehive.tasks.* or litehive.workspace.* modules instead of from
  litehive.tasks.
acceptance_criteria:
- litehive/tasks/__init__.py is under 50 lines and exports only the curated top-level
  task API, rather than the current broad internal surface.
- No Litehive package module or test imports private or internal-only task helpers
  from litehive.tasks; those imports resolve from the defining submodule instead.
- The selected curated symbols that remain top-level in litehive.tasks cover the common
  package-facing task API used by callers after this refactor.
- The relevant Litehive test suite for task, pipeline, CLI, web, observability, and
  recovery flows passes with zero failures.
constraints:
- Keep changes scoped to the litehive.tasks public surface and the direct callers
  that must switch to specific submodule imports.
- Preserve package-level compatibility only for symbols intentionally kept in the
  curated public API or for narrowly justified module-level monkeypatch hooks that
  tests still require.
plan:
- Inventory current litehive.tasks exports and barrel import sites, then define the
  explicit curated keep-list for the public API before editing imports.
- Move repo-internal and test imports for removed helpers to their defining litehive.tasks.*
  or litehive.workspace.* modules, keeping package boundaries explicit.
- Rewrite litehive/tasks/__init__.py as a small explicit facade with only the curated
  exports and any narrowly justified compatibility module objects.
- Run focused regression tests covering tasks, pipeline, CLI, web, observability,
  and recovery paths touched by the import changes, then widen if needed until the
  suite is clean.
