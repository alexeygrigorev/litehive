title: Fix litehive stop not killing stuck daemon process
created_at: '2026-04-17T07:07:11+00:00'
task_type: bugfix
pipeline_mode: full
priority: critical
depends_on: []
goal: litehive stop sends SIGTERM but the daemon process sometimes does not exit.
  The next litehive start then fails with 'daemon already running' even though the
  old daemon is unresponsive. litehive stop should escalate to SIGKILL after a timeout
  if SIGTERM does not work, and litehive start should handle live-but-unresponsive
  daemons by force-killing them when the recorded PID does not respond to health checks.
acceptance_criteria:
- litehive stop kills the daemon process within 10 seconds even if it ignores SIGTERM
- litehive start succeeds even if a previous daemon is stuck and unresponsive
- No manual kill required to recover from a stuck daemon
