goal: Add first-class CLI support for rich structured task shaping and updates so
  humans can refine tasks through litehive itself instead of editing YAML directly.
  The CLI should support the same kinds of structured task updates that the planner
  can already persist during grooming.
acceptance_criteria:
- litehive exposes a supported CLI path for shaping an existing task's rich fields,
  including goal, acceptance criteria, constraints, plan, PM complexity, planned effort,
  and other durable task metadata that humans may need to refine after creation.
- The CLI supports adding or replacing multi-line structured content without forcing
  direct YAML edits, and the UX is practical for large task updates.
- At minimum, the design explicitly considers flags, file input, and editor flows,
  and implements one or more approaches that make rich updates ergonomic for real
  use.
- The resulting task updates use the same durable task record fields that the planner
  already shapes during grooming, so human shaping and planner shaping do not diverge
  into different storage models.
- The CLI can be used to add more details to a task later, not only during task creation,
  so operators can progressively refine backlog items over time.
- Validation and error messages are clear when structured values are malformed, incomplete,
  or inconsistent with the task state.
- Focused tests cover at least one real rich-update flow for an existing task, including
  persistence of the updated structured fields.
constraints:
- Keep the CLI as the supported operator path for task shaping; direct YAML editing
  should not be required for normal use.
- Reuse existing task record fields and validation rules where possible instead of
  inventing a parallel task-shaping format.
- Preserve deterministic task state and avoid ambiguous partial writes when a rich
  update fails.
plan:
- Define the supported rich-update UX for humans, including whether shaping happens
  through repeated flags, file input, editor-based updates, or a combination.
- Map that UX onto the existing durable task fields that planner grooming already
  persists today.
- Implement structured validation and atomic persistence for rich task updates.
- Add focused tests and document how operators should create and refine detailed tasks
  through the CLI over time.
