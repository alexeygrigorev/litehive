  message: 'Implemented first-class rich task shaping on `litehive update` using the
    existing durable task record fields. Added direct flag support for `--constraint`
    and `--plan-step`, plus ergonomic large-update flows via `--from-file <yaml>`
    and `--edit` ($EDITOR/$VISUAL). The YAML/editor schema maps onto the same task
    fields the planner shapes today: `goal`, `acceptance_criteria`, `constraints`,
    `plan`, `pm_complexity`, `planned_effort`, `depends_on`, `human_checkpoints`,
    `task_type`, `mode`, `priority`, `engine`, `model`, `retry_limit`, and `auto_commit`.
    Validation now rejects malformed YAML, unsupported fields, bad enum values/types,
    empty rich-update documents, and overlapping file/editor plus flag updates before
    any task write occurs, preserving deterministic atomic persistence.


    Verified persistence with focused CLI tests covering a real rich-update flow for
    an existing task from YAML file input, editor-backed rich shaping, malformed rich-update
    rejection, and the existing update-command slices. Ran: `uv run pytest -q tests/test_task_commands_and_daemon.py
    tests/test_runner_workflow.py tests/test_engine_variants_and_timeline.py -k "update_command
    or seeds_task_brief_when_switching_to_tasks_mode"` -> 23 passed. Evidence: updated
    task records now persist constraints/plan alongside goal, acceptance criteria,
    and PM sizing; `tasks` mode briefs regenerate with the new structured fields;
    README and `.litehive/context.md` document the supported operator flows for progressive
    task refinement over time.'
