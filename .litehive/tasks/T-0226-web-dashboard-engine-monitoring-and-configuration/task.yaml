goal: Add an engine monitoring dashboard to the web UI showing engine status, usage
  metrics from engine-monitoring.yaml, and configuration. Allow switching the default
  engine and viewing engine routing rules.
acceptance_criteria:
- GET /api/engines endpoint returns engine configuration, routing rules, and usage
  metrics
- Engine dashboard page shows current default engine, task-type routing table, and
  engine freeze status
- Usage metrics display shows per-engine token/cost usage from engine-monitoring.yaml
- POST /api/engines/default endpoint allows switching the default engine
- Engine switch action for individual tasks available from task detail view (mirrors
  litehive switch)
