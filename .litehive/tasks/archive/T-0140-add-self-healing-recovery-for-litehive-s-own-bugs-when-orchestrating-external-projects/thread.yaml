  verdict: pass
  message: 'Implemented bounded Litehive self-heal for external-project stage failures.
    The runner now captures the Python traceback on unhandled stage exceptions, recovery
    classifies failure ownership from traceback frame paths, and Litehive-owned failures
    route into a Litehive worktree under configured litehive_source_path instead of
    repairing the target project. Self-heal persists one traceback fingerprint per
    task to cap retries at one attempt per unique Litehive bug. The self-heal flow
    logs launch and completion details to the originating task thread, writes structured
    recovery actions to the recovery artifact, runs `uv run pytest` in the Litehive
    worktree before merge, blocks merge if pytest fails or litehive_source_path is
    unavailable, merges successful fixes onto Litehive main, and returns a retry-style
    pass so the runner requeues the original task at the same stage for the next wrapper
    iteration rather than continuing in the old process.


