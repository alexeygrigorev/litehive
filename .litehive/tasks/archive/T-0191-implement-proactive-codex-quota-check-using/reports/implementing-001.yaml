  \ + primary_window (5h) and secondary_window (weekly) used_percent and reset_at,\
  \ 60s TTL module-level cache, fail-open on errors.\n- litehive/runtime/_execution.py\
  \ (commit ba9ae20): Proactive codex quota check inserted before each codex invocation\
  \ in the engine selection loop (line ~711). When limit_reached=true, codex is skipped\
  \ and fallback engine is used. Also records quota status to engine monitoring.\n\
  - litehive/cli/_dry_run.py (commits ba9ae20 + f3f5961): Quota check in both pool\
  \ dry-run and single-task dry-run engine selection paths. The single-task path was\
  \ missing in the original commit and fixed in f3f5961.\n- litehive/observability/_engine_monitoring.py\
  \ (commit ba9ae20): record_codex_quota_check() surfaces used_percent (as usage percent\
  \ with limit=100), reset_at, and per-window metadata in engine-monitoring.yaml.\n\
  - tests/test_codex_quota.py (NEW, commit ba9ae20): 17 targeted tests \u2014 all\
  \ passing.\n- tests/conftest.py (NEW, commit ba9ae20): Autouse fixture neutralizes\
  \ codex quota API calls in all other test modules.\n\n## Acceptance Criteria Verification\n\
