    \                        continue  # proceed to next stage\n\n               \
    \ task.pipeline_status = current  # type: ignore[assignment]\n               \
    \ report = self._terminal_report(\n                    task,\n               \
    \     step=current,\n                    verdict=\"fail\",\n                 \
    \   summary=reason,\n                    outcome=\"flagged\",\n              \
    \      outcome_reason_code=\"stage_exception\",\n                    reason=reason,\n\
    \                    retry_count=rejections,\n                    warnings=[str(exc)],\n\
    \                )\n                task.status = \"queued\"\n               \
    \ _apply_task_outcome(\n                    task,\n                    kind=\"\
    flagged\",\n                    stage=current,\n                    reason_code=\"\
