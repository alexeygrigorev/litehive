acceptance_criteria:
- The `implementing` stage can launch more than one SWE worker for a single task from
  a deterministic local plan, and the runner does not advance the task to `testing`
  until all launched workers have reached a terminal state.
- Litehive persists per-worker runtime state and artifacts while fanout is in progress,
  including worker identity, role/engine, status, path, and recent progress, so a
  live run no longer collapses to a single `active_subagent`.
- Task observability surfaces parallel worker state clearly in status/reporting output,
  showing multiple active or recently finished workers for the same task instead of
  only one active/last worker.
- If a fanout run is interrupted or a worker fails, the task remains recoverable at
  the same stage with enough persisted worker context to diagnose or resume/retry
  deterministically; it must not silently leave ambiguous single-worker runtime state.
- Focused tests cover successful multi-worker fanout for one task, persisted live
  worker state, status/summary rendering for multiple workers, and interrupted or
  failed fanout behavior.
