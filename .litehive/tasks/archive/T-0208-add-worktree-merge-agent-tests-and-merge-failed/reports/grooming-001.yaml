feedback: "## Grooming Summary\n\nTask is well-scoped with three clear deliverables.\
  \ The codebase already has the merge agent infrastructure in place; this task adds\
  \ test coverage for the full scenario matrix and introduces proper tracking for\
  \ merge failures.\n\n### Current State\n- Merge failures during commit_to_git route\
  \ to generic `flagged` status (runner/states.py:100-102)\n- WorkspaceState (models.py:444-449)\
  \ has no unmerged worktree tracking\n- Existing tests in test_commit_recovery_bug.py\
  \ cover the \"merge agent launches once\" guard but NOT the full rebase/merge scenario\
  \ matrix\n- The merge flow lives in runtime/_commit.py:64-136 with SubagentManager.run()\
  \ for merge-resolver role\n\n### Plan\n\n**Part 1: Test the worktree merge agent\
  \ scenario matrix**\n- Create new test file `tests/test_worktree_merge_agent.py`\n\
  - Mock SubagentManager.run to simulate merge agent behavior\n- Test scenarios:\n\
  \  1. Rebase succeeds (no merge agent needed) \u2014 verify task proceeds to done\n\
  \  2. Rebase fails, git merge succeeds \u2014 verify task proceeds to done without\
  \ agent\n  3. Rebase fails, merge has conflict, agent resolves \u2014 verify merge_agent_attempts=1,\
  \ task proceeds to done\n  4. Rebase fails, merge has conflict, agent fails \u2014\
  \ verify merge_agent_attempts=1, task gets merge_failed status, worktree tracked\
  \ as unmerged\n\n**Part 2: Add merge_failed pipeline status**\n- Add MERGE_FAILED\
  \ to PipelineState enum in runner/states.py\n- Update _ROUTES and _SINGLE_ROUTES:\
  \ (commit_to_git, fail) should check if failure is merge-related and route to merge_failed\
  \ instead of flagged\n- The commit stage in runtime/_commit.py should return a distinguishable\
  \ verdict or summary when the failure is specifically a merge failure (vs other\
  \ commit failures)\n- Update litehive status display to show merge_failed tasks\n\
  \n**Part 3: Track unmerged worktrees in state.yaml**\n- Add `unmerged_worktrees`\
  \ field to WorkspaceState model (list of {task_id, worktree_path})\n- When a merge\
  \ fails and the task transitions to merge_failed, record the worktree in state.yaml\n\
  - When a merge is later resolved (via repair/recover), remove the entry\n\n### Acceptance\
  \ Criteria (refined)\n1. Tests cover all four scenarios: rebase success, merge success\
  \ after rebase fail, agent resolves conflict, agent fails to resolve\n2. Tests mock\
  \ SubagentManager.run to simulate merge agent behavior without real git conflicts\n\
  3. merge_failed pipeline status exists in PipelineState enum and is set when worktree\
  \ merge cannot be resolved\n4. state.yaml tracks unmerged worktrees with task ID\
  \ and worktree path (via WorkspaceState model)\n5. `litehive status` shows tasks\
  \ with merge_failed status distinctly from flagged\n6. All existing tests continue\
  \ to pass (uv run pytest -q)\n\n### PM Sizing\n- PM_COMPLEXITY: moderate\n- PLANNED_EFFORT:\
  \ m\n\n### Key Files to Modify\n- litehive/runner/states.py \u2014 add MERGE_FAILED\
  \ state, update routes\n- litehive/models.py \u2014 add unmerged_worktrees to WorkspaceState\n\
  - litehive/runtime/_commit.py \u2014 distinguish merge failures, record unmerged\
  \ worktrees\n- litehive/cli.py or status display \u2014 show merge_failed\n- tests/test_worktree_merge_agent.py\
  \ \u2014 new test file for scenario matrix"
