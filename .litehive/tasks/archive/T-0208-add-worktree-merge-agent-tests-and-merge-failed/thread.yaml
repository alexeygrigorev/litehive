  message: "## Grooming Summary\n\nTask is well-scoped with three clear deliverables.\
    \ The codebase already has the merge agent infrastructure in place; this task\
    \ adds test coverage for the full scenario matrix and introduces proper tracking\
    \ for merge failures.\n\n### Current State\n- Merge failures during commit_to_git\
    \ route to generic `flagged` status (runner/states.py:100-102)\n- WorkspaceState\
    \ (models.py:444-449) has no unmerged worktree tracking\n- Existing tests in test_commit_recovery_bug.py\
