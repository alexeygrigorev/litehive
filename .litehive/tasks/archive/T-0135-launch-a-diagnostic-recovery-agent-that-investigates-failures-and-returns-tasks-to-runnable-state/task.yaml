goal: When a task breaks, litehive should launch a dedicated recovery agent that gathers
  the right logs and task/runtime artifacts, classifies the failure, applies bounded
  repairs, and returns the task to a runnable state whenever possible.
acceptance_criteria:
- Recovery is triggered for stale-runner recovery, flagged tasks, repeated same-stage
  retry churn, commit_to_git failures, and engine startup/preflight failures.
- The recovery agent gathers evidence automatically from task.yaml, runtime.yaml,
  latest subagent report/session/transcript/stdout/stderr/events artifacts, wrapper
  logs, engine monitoring state, and relevant git/worktree state.
- The recovery agent produces a structured recovery report that records what broke,
  what evidence was used, what changed, and whether the task is runnable, parked,
  or still blocked.
- The recovery agent can apply bounded repairs such as clearing stale active state,
  requeueing at the correct stage, rerouting underspecified tasks to planner, repairing
  continuation handoff/engine bindings, and recovering commit_to_git tasks when safe.
- If the task cannot be returned to runnable state, the recovery result records an
  explicit blocker and does not leave the task in ambiguous limbo.
- Focused tests cover at least one stale-runner recovery case, one flagged task case,
  one late-stage commit_to_git case, and one unrecoverable blocked case.
constraints:
- Keep recovery runner-owned and deterministic; the agent may investigate and suggest
  bounded actions, but surrounding state transitions must remain explicit and auditable.
- Prefer reusing existing runtime, repair, stale-runner, and commit-recovery flows
  instead of creating a disconnected side channel.
- Do not override user-requested parked tasks or explicit CLI stops.
- Recovery should aim to return tasks to a runnable state, not silently discard failure
  history or leave tasks in ambiguous partially-active states.
- Evidence gathering must use existing task/runtime/log/worktree artifacts rather
  than requiring manual operator inspection first.
plan:
- Define the trigger conditions that escalate from normal retry into recovery-agent
  execution.
- Implement evidence collection so the recovery prompt includes task metadata, runtime
  state, latest subagent artifacts, wrapper logs, engine monitoring, and relevant
  git/worktree context.
- Implement structured recovery outputs and bounded repair actions that can requeue,
  reroute, repair continuation state, or recover commit_to_git work when safe.
- Integrate the recovery agent into the task lifecycle so repaired tasks re-enter
  normal execution and unrecoverable tasks record an explicit blocker.
- Add focused regression coverage for stale-runner repair, flagged-task repair, late-stage
  commit recovery, and unrecoverable blocked outcomes.
