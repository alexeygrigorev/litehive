goal: Create a small local web service that shows the current queue, active task,
  task details, stage status, subagent status, recent transcripts/logs, and latest
  run-all logs. It should provide a lightweight operational view of litehive without
  requiring the terminal UI, including a live view of active session messages by tailing
  the on-disk artifacts written during execution.
acceptance_criteria:
- The web UI shows the current queue, active task, task details, stage status, and
  subagent status.
- For an active subagent, the UI shows live or near-live messages/output by reading
  the task-local transcript/stdout/stderr artifacts as they change.
- The UI distinguishes active sessions from completed sessions and makes it obvious
  which files are being tailed.
- Recent run-all logs remain accessible from the same interface.
constraints:
- Keep the UI local-only and lightweight.
- Reuse the on-disk task artifacts as the source of truth rather than inventing a
  separate live state store.
- Degrade gracefully when live capture is unavailable for a given engine.
plan:
- Build a small local HTTP service and simple UI for queue/task inspection.
- Add active-session views that tail the transcript/stdout/stderr files for the selected
  task/subagent.
- Verify that active output appears while a task is running and that completed runs
  remain browsable afterward.
