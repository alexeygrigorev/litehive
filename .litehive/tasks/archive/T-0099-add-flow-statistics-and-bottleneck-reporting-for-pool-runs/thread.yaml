  message: "## Implementation: T-0101 \u2014 run-all continues after task requeue\n\
    \n### What was done\n\nIdentified and fixed a gap where run_single_task did not\
    \ persist pool_stop_reason=task_requeued to state.yaml. The daemon continued anyway\
    \ (via the null-passthrough at line 361), but the explicit task_requeued guard\
    \ at line 359 was never exercised in production.\n\n### Change (one-line fix)\n\
    \nlitehive/runtime/_execution.py \u2014 extended the set_pool_stop_reason call\
    \ in run_single_task to include task_requeued alongside human_checkpoint_* reasons:\n\
    \  Before: if stop_reason.startswith('human_checkpoint_'):\n  After:  if stop_reason.startswith('human_checkpoint_')\
    \ or stop_reason == 'task_requeued':\n\n### Tests added (2 new + 1 updated)\n\n\
    1. test_run_single_task_persists_task_requeued_stop_reason \u2014 asserts run_single_task\
    \ writes pool_stop_reason=task_requeued to state.yaml when a testing rejection\
    \ requeues the task.\n2. test_drain_task_pool_continues_when_only_task_is_requeued_for_another_pass\
    \ \u2014 asserts drain_task_pool continues past a task_requeued result and eventually\
    \ completes the task.\n3. test_daemon_foreground_continues_after_task_requeued\
    \ (updated) \u2014 mock now writes pool_stop_reason=task_requeued (not null) to\
    \ state, confirming the daemon's explicit line-359 path is exercised.\n\n### Verification\n\
    \nAll 3 new/modified tests pass. The 3 pre-existing failures (test_drain_task_pool_allows_future_queue_mutation_during_active_run,\
    \ test_update_command_supports_rich_task_shaping_via_editor, test_switch_command_interrupts_active_task_persists_engine_and_records_thread_comment)\
    \ were already failing before this change and are unrelated."
