  \ `test_detect_repo_ssh`, `test_detect_repo_https`, and `test_cmd_import_issue_from_url`\
  \ (no --repo, repo parsed from URL)\n4. \u2705 Issue labels mapped to task_type\
  \ and priority using hardcoded defaults \u2014 tested in `test_map_labels_*`, `test_cmd_import_issues_bulk`\
  \ verifies bug\u2192bugfix, documentation\u2192docs, enhancement\u2192refactor,\
  \ priority labels\n5. \u2705 Re-importing same issue prints skip message with existing\
  \ task ID \u2014 tested in `test_import_duplicate_skipped`, `test_cmd_import_issue_duplicate`\n\
  6. \u2705 `litehive import-issues` imports all open issues not already tracked \u2014\
  \ tested in `test_cmd_import_issues_bulk`, `test_cmd_import_issues_skips_existing`\n\
  7. \u2705 Missing or unauthenticated gh CLI produces clear error \u2014 tested in\
  \ `test_run_gh_missing`, `test_check_gh_auth_failure`, `test_cmd_import_issue_gh_missing`,\
  \ `test_cmd_import_issues_gh_not_authenticated`\n8. \u2705 Tests cover single import,\
  \ duplicate skip, bulk import, label mapping, and missing gh error \u2014 24 tests,\
  \ all passing\n\n## Test evidence\n```\nuv run pytest tests/test_github_import.py\
  \ -q\n24 passed in 1.02s\n```"
