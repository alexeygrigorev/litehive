  \ `github_origin` parameter to `create_task()` and wired it into TaskRecord construction.\n\
  - `litehive/cli/parser.py` \u2014 Registered `import-issue` and `import-issues`\
  \ subparsers.\n- `litehive/cli/__init__.py` \u2014 Added command dispatch for both\
  \ new commands.\n\n## Acceptance criteria verification\n\n1. \u2705 `litehive import-issue\
  \ <github-url>` creates a task with title, goal, and github_origin populated \u2014\
  \ tested in `test_cmd_import_issue_from_url`, `test_import_single_issue_creates_task`\n\
  2. \u2705 `litehive import-issue <number> --repo owner/repo` works with just an\
  \ issue number \u2014 tested in `test_cmd_import_issue_from_number`\n3. \u2705 Repo\
