goal: Use the last captured event timestamp as the canonical inactivity heartbeat
  and restart/recover a task at the same stage when no new event arrives within the
  configured timeout.
acceptance_criteria:
- Inactivity timeout is based on the last persisted event timestamp, not a separate
  heartbeat mechanism.
- When inactivity timeout fires, the task is recovered at the same stage instead of
  being sent back to implementation.
