verdict: pass
source: agent
summary: 'Root cause: the merge-resolver git denylist only inspected explicit command
  arguments for protected refs, so \''git cherry-pick <sha>\'' on a checked-out protected
  branch like main returned no rejection reason and would have been forwarded to real
  git. Fix: updated both litehive/sandbox/git_wrapper.py and the duplicated wrapper
  template in litehive/agents/sandbox.py to resolve the current git ref from repository
  state (.git dir/file plus HEAD) and reject both `git cherry-pick` and `git rebase`
  when the current ref is protected, in addition to the existing protected-target
  argument checks. Added focused regression coverage in tests/test_sandbox_git_profiles.py
  for the exact rejected case (_rejection_reason(["cherry-pick", "deadbeef"], cwd=<repo
  on main>) now returns a block reason) and for the merge-resolver sandbox wrapper
  path when bubblewrap is available. Verification run: uv run ruff check --select
  E402,F401 litehive tests => passed; uv run pytest -q tests/test_sandbox_git_profiles.py
  tests/test_runner_workflow.py -k ''sandbox or worktree_origin or merge_resolver''
  => 17 passed, 4 skipped. Extra direct repro check: a temp repo on main now prints
  `git cherry-pick` while on a protected ref is not allowed instead of None. The previous
  implementing stage should be retried from its existing context; this was a Litehive
  infrastructure denylist gap, not a task/worktree bug.'
