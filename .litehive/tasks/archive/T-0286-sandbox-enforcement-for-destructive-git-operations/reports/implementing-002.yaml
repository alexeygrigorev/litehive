source: agent
summary: 'Implemented per-role git sandbox enforcement and supporting audit coverage.
  Added a single audited role->SandboxProfile selector in litehive/agents/sandbox.py
  with fail-closed default to no-git, threaded role-aware sandbox summaries/invocation
  wrapping through SubagentManager/session artifacts, and added merge-resolver-only
  git wrapper enforcement with attention-log writes plus destructive-command denylist.
  Bubblewrap sandboxes now mount git-filtered command directories so non-merge-resolver
  roles do not see git entrypoints, while merge-resolver gets only /sandbox/bin/git
  on PATH. Task worktree setup now removes origin before normal subagent handoff.
  Added deterministic tests in tests/test_sandbox_git_profiles.py for profile selection,
  wrapper denylist, worktree origin removal, and real sandbox subprocess behavior;
  on hosts where bubblewrap itself cannot create a namespace, those direct subprocess
  checks skip instead of misreporting a Litehive regression. Added docs/sandboxing.md
  plus references from docs/README.md, docs/configuration.md, and docs/engines.md,
  and added a manual adversarial audit harness under experiments/sandbox-breakout/
  with a driver that launches a real adapter invocation inside the no-git profile.
  Also fixed stale workspace repair bookkeeping so stranded commit recovery no longer
  reports a spurious cleared_active_task_id, which was required to keep the full suite
  green. Verification run: uv run ruff check --select E402,F401 litehive tests experiments;
  uv run pytest -q tests/test_sandbox_git_profiles.py tests/test_runner_workflow.py
  -k ''sandbox or worktree_origin or merge_resolver'' => 16 passed, 4 skipped, 111
  deselected; uv run pytest -q => 936 passed, 4 skipped.'
