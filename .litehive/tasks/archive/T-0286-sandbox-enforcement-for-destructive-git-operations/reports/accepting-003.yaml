summary: 'Accepted. I verified the implementation against the task acceptance criteria
  in code and by rerunning the focused acceptance test slice. Evidence reviewed: litehive/agents/sandbox.py
  now contains the single audited role-to-SandboxProfile selector with fail-closed
  default to no-git; merge-resolver is the only role mapped to merge-resolver. The
  bubblewrap and docker sandbox setup prepares git-filtered mirrored command directories
  so /usr/bin/git and PATH-discovered git are absent for non-merge-resolver roles,
  while merge-resolver gets only /sandbox/bin/git plus a hidden real git path behind
  the wrapper. litehive/pipeline/_worktree.py removes origin before normal task handoff.
  litehive/sandbox/git_wrapper.py rejects the required destructive commands, including
  the QA-found gap for git cherry-pick <sha> and git rebase while currently on a protected
  ref, and logs rejections to .litehive/runtime/attention.log. Docs and manual audit
  assets are present in docs/sandboxing.md and experiments/sandbox-breakout/. Tests
  run by reviewer: uv run pytest -q tests/test_sandbox_git_profiles.py tests/test_runner_workflow.py
  -k ''sandbox or worktree_origin or merge_resolver'' => 17 passed, 4 skipped, 111
  deselected in 3.02s. Those tests cover fail-closed profile mapping; no-git profile
  making git, which git, and /usr/bin/git fail even after PATH and LITEHIVE_* mutation
  attempts; merge-resolver allowing safe git commands; wrapper rejection and logging
  for force push, filter-repo, reset --hard origin/main, and cherry-pick on protected
  checked-out refs; and worktree origin removal before handoff. Remaining caveat:
  the bubblewrap-backed real subprocess cases still skip on hosts that cannot create
  the namespace; this is already called out in tests and docs and did not block the
  focused acceptance slice on this host.'
