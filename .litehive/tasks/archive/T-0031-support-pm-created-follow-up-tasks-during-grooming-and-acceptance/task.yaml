goal: Allow PM and acceptance stages to create new queued follow-up tasks when they
  discover separate work, record why each follow-up was created, and ensure run-all
  picks up those tasks on later iterations instead of dropping them. Discovering extra
  work must not abort the current task unless it is explicitly blocking. The current
  task should continue through implement, verify, accept, and commit as long as its
  own acceptance criteria are still met.
acceptance_criteria:
- Grooming and accepting stage outputs can declare one or more follow-up tasks in
  a structured format that Litehive parses deterministically.
- Each created follow-up task is persisted as a normal queued task with its creation
  rationale recorded durably in workspace state or task artifacts.
- Creating a non-blocking follow-up during grooming or acceptance does not abort,
  fail, or requeue the current task; the current task continues through implement,
  test, accept, and commit if its own criteria are met.
- Explicitly blocking follow-up work can still block the current task when the stage
  verdict says it is blocking.
- Follow-up tasks created during a run remain in the queue and are picked up by later
  `litehive run` or `scripts/run-all.sh` iterations.
- Focused automated tests cover parsing, persistence, queue behavior, and the non-blocking-versus-blocking
  routing behavior.
