- role: swe
  step: implementing
  verdict: pass
  message: "Removed files_changed from agent report format. Git is now the sole source\
    \ of truth.\n\n## Changes made\n\n1. **litehive/subagents/_prompts.py**: Removed\
    \ FILES_CHANGED from both text and JSON report format templates that agents see.\
    \ Agents no longer produce this field.\n\n2. **litehive/subagents/_parsing.py**:\
    \ Stopped extracting files_changed from agent STAGE_RESULT JSON metadata and from\
    \ CLI verdict thread comments. The field is no longer populated from agent output.\n\
    \n3. **litehive/engines/base.py**: Stopped populating files_changed from StageResultSubmission\
    \ in parse_stage_report_text.\n\n4. **litehive/runner/core.py**: Refactored the\
    \ empty SWE guard to always check git status directly (worktree or main repo),\
    \ never relying on report.files_changed. The guard now: (a) checks worktree if\
    \ available, (b) falls back to main repo root if it's a git repo, (c) skips the\
    \ guard entirely for non-git workspaces.\n\n5. **litehive/runtime/_commit.py**:\
    \ Added git-diff-based population of files_changed at commit stage \u2014 after\
    \ successful merge, the report's files_changed is populated from `git diff --name-only\
    \ head_before head_after`.\n\n6. **litehive/cli/parser.py + litehive/cli/report.py**:\
    \ Removed --files-changed CLI argument from the report command since agents no\
    \ longer need to pass it.\n\n7. **tests/workspace_helpers.py**: Updated _write_cli_verdict,\
    \ _completed_subagent_result, and _successful_stage_execution to stop passing\
    \ files_changed. Updated _completed_subagent_result to write real file changes\
    \ to the worktree so the git-based guard detects them.\n\n8. **tests/test_stage_result_submission.py**:\
    \ Updated assertion to expect empty files_changed from parsed agent output.\n\n\
    ## Acceptance criteria verification\n\n- Agent prompt templates no longer ask\
    \ for FILES_CHANGED: verified in _prompts.py \u2014 both text and JSON formats\
    \ removed\n- StageReport.files_changed is populated from git diff at commit stage:\
    \ verified in _commit.py \u2014 uses git diff head_before..head_after\n- Empty\
    \ SWE guard uses only git status, never report.files_changed: verified in runner/core.py\
    \ \u2014 always runs git diff/status regardless of report content\n- Existing\
    \ tests updated to not require FILES_CHANGED in fake agent output: verified \u2014\
    \ all helpers updated, 616 tests passing across all test files\n\n## Tests run\n\
    \n- tests/test_runner_workflow.py: 104 passed\n- tests/test_engine_variants_and_timeline.py:\
    \ 45 passed\n- tests/test_retry_commit_and_recovery.py: 89 passed\n- tests/test_stage_result_submission.py:\
    \ 8 passed\n- tests/test_tasks_and_subagents.py: 35 passed\n- tests/test_config_and_run_cli.py:\
    \ 55 passed\n- tests/test_runtime_pool.py: 64 passed\n- tests/test_recovery_agent.py\
    \ + others: 214 passed\n- Total: 616 tests, all passing"
