verdict: pass
summary: 'Implemented the web dashboard daemon lifecycle surface and verified it with
  focused web tests. The monitor serves GET /api/daemon/status plus POST /api/daemon/start,
  /api/daemon/stop, and /api/daemon/restart through the existing daemon helpers, with
  clear JSON conflict errors, status payloads including pid/started_at/uptime/recent
  run-all logs, and HTTP 202 for start/restart and 200 for stop. The dashboard markup
  now includes daemon running/stopped state, start/stop/restart controls, and a daemon
  log viewer wired to polling/SSE refresh via the snapshot+daemon status flow. I also
  aligned the web package exports/indirection so daemon helpers and run-all log readers
  are patchable and consistently reused by the server and snapshot builder. Verified
  with: uv run pytest -q tests/test_web_daemon_monitor.py (3 passed) and uv run pytest
  -q tests/test_web_snapshot_lockfree.py -k ''web or stream or snapshot'' (26 passed).
  These cover daemon status payload shape, start/stop/restart API behavior, dashboard
  control markup, JSON error handling when stop is requested while already stopped,
  and broader web monitor snapshot/stream behavior.'
