summary: 'Accepted after reviewer verification. I confirmed the web server exposes
  GET /api/daemon/status plus POST /api/daemon/start, /api/daemon/stop, and /api/daemon/restart,
  with start/restart returning HTTP 202, stop returning HTTP 200, clear JSON 409 conflict
  handling when stop is requested while already stopped, and restart including previous_pid
  while status payloads include daemon_status, pid, started_at, uptime, log_dir, and
  recent run-all log previews. I also confirmed the dashboard renders a daemon control
  panel with running/stopped indicator, PID/uptime/log-dir fields, start/stop/restart
  buttons, and a daemon log viewer, and that the client refresh loop updates daemon
  state through /api/snapshot plus /api/daemon/status with SSE live updates and polling
  fallback so logs/status refresh without a full reload. Evidence inspected in litehive/web/server.py,
  litehive/web/snapshot.py, and litehive/web/templates/index.html. Verification run:
  uv run pytest -q tests/test_web_daemon_monitor.py (3 passed) and uv run pytest -q
  tests/test_web_snapshot_lockfree.py -k ''web or stream or snapshot'' (26 passed).
  Acceptance criteria are met.'
