feedback: 'Redesigned litehive status as an operator dashboard. Default output now
  shows 5 dashboard sections instead of a config dump.


  ## Changes (5 files)


  **litehive/observability/_status.py**: Added 7 new dashboard rendering functions:

  - render_active_task_section: Shows task ID, stage, engine, elapsed run duration,
  and stage elapsed time

  - find_last_completed_task: Finds most recently done task by updated_at

  - render_last_completed_section: Shows task with verdict and timestamp

  - render_queue_section: Shows count and next task title

  - render_engine_health_section: Shows each engine as ok or limit-kind limited with
  reset time

  - collect_recent_activity: Scans events.jsonl across task dirs, returns last 5 sorted
  by timestamp

  - render_recent_activity_section: Maps event kinds to human-readable labels


  **litehive/observability/__init__.py**: Exports the 7 new functions.


  **litehive/cli/status.py**: Split _cmd_status into dashboard mode (default) and
  _cmd_status_full (--full). Default shows: workspace header, Active Task, Last Completed,
  Queue, Engine Health, Recent Activity. Full mode preserves all original verbose
  output (config details, per-task dump).


  **Test updates across 4 files**:

  - tests/test_observability_and_status.py: Added test_status_default_dashboard_shows_sections_without_config_noise.
  Updated 4 existing tests to pass full=True.

  - tests/test_retry_commit_and_recovery.py: Updated 1 test to use full=True

  - tests/test_task_commands_and_daemon.py: Updated 1 test to use full=True

  - tests/test_engine_freeze.py: Already had full=False, no changes needed


  ## Acceptance criteria verification

  1. Active task shows title, stage, engine, and elapsed duration: YES - "T-0001 implementing
  with codex, running for 3m"

  2. Current stage shows elapsed duration: YES - "stage: implementing elapsed 2m30s"

  3. Last completed task shown with outcome and when: YES - shows task ID, title,
  verdict, timestamp

  4. Queue summary shows count and next task title: YES - "1 queued, next: T-0003
  Next feature"

  5. Engine health shows available vs quota-limited with reset time: YES - "codex:
  ok" or "codex: quota limited resets 2026-04-30T00:00:00Z"

  6. Recent activity shows last 3-5 events: YES - collect_recent_activity scans events.jsonl,
  renders with human labels

  7. Config details only shown with --full: YES - getattr(args, "full", False) defaults
  to False

  8. No full task dump in default output: YES - render_task_summary only called in
  _cmd_status_full


  ## Tests run

  - tests/test_observability_and_status.py: 72 passed

  - tests/test_engine_freeze.py: 17 passed

  - tests/test_retry_commit_and_recovery.py: 89 passed

  - tests/test_task_commands_and_daemon.py: 101 passed

  Total: 279 passed, 0 failed'
