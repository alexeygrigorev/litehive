    Next feature"

    5. Engine health shows available vs quota-limited with reset time: YES - "codex:
    ok" or "codex: quota limited resets 2026-04-30T00:00:00Z"

    6. Recent activity shows last 3-5 events: YES - collect_recent_activity scans
    events.jsonl, renders with human labels

    7. Config details only shown with --full: YES - getattr(args, "full", False) defaults
    to False

    8. No full task dump in default output: YES - render_task_summary only called
