  \ Complete rewrite with freeze/unfreeze/set handlers, local timezone datetime parsing\
  \ to UTC storage\n- litehive/runtime/_models.py: Added is_engine_frozen() and active_engine_freezes()\
  \ helpers; frozen engines filtered out in resolve_engine_attempt_order()\n- litehive/runtime/__init__.py:\
  \ Exported new helpers\n- litehive/cli/status.py: Shows frozen engines with local\
  \ timezone unfreeze dates\n- tests/test_config_and_run_cli.py: Updated parser test\
  \ for new arg name\n- tests/test_engine_freeze.py: 17 new tests covering all acceptance\
  \ criteria\n\n## Acceptance Criteria Verification:\n\n1. **freeze CLI with date\
  \ and datetime**: test_engine_freeze_cli_roundtrip, test_engine_freeze_with_datetime,\
