  \ shows frozen engines**: test_status_shows_frozen_engines, test_status_no_frozen_engines\
  \ \u2014 displays \"engine_frozen: codex until <local time>\" when frozen, nothing\
  \ when not.\n\n5. **Auto-unfreeze when date passes**: test_expired_freeze_not_skipped,\
  \ test_is_engine_frozen_and_active_freezes \u2014 expired freezes are not active,\
  \ engine passes through normally.\n\n## Test Results:\n- 17 new tests in tests/test_engine_freeze.py:\
  \ all pass\n- Existing test suite: no regressions (2 pre-existing failures confirmed\
  \ unrelated)"
