  \ all pass. Supports both \"2026-04-08\" and \"2026-04-08 09:47\" formats, local\
  \ TZ -> UTC storage.\n\n2. **Frozen engines skipped in resolve_engine_plan and fallback**:\
  \ test_frozen_engine_skipped_in_attempt_order, test_frozen_engine_in_fallback_chain_skipped\
  \ \u2014 frozen engines removed from attempt order including fallback chains.\n\n\
