goal: 'Establish a protocol so that projects orchestrated by litehive can contribute
  back to litehive itself: filing issues, proposing code changes, and triggering fixes.
  This enables a feedback loop where real usage drives litehive improvements automatically.'
acceptance_criteria:
- A project can file a litehive issue via CLI (e.g. litehive issue --upstream 'engine
  timeout not working') that creates a task in the litehive workspace
- Recovery agents in external projects can detect litehive bugs and file upstream
  issues automatically instead of just logging them
- 'A litehive self-heal flow can accept a patch from an external project: the external
  recovery agent creates a branch in the litehive repo with a fix and files a PR or
  task'
- When working on project X and a litehive behavior needs changing, there is a documented
  way to propose the change without switching context
- 'The protocol handles these scenarios: (1) bug discovered during task execution,
  (2) missing feature needed by the project, (3) config or prompt improvement based
  on real usage, (4) engine adapter fix needed'
- litehive_source_path config field is used to locate the litehive repo for upstream
  contributions
- 'Contributions are tracked: the litehive workspace shows which issues came from
  which project'
- Protocol is documented in docs/contributing-back.md
