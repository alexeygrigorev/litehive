goal: Make commit_to_git robust when Litehive owns the final git step. The runner
  should tolerate unrelated persistent workspace metadata, commit accepted task changes
  deterministically, and in worktree-backed flows integrate the task commit back to
  main without spurious failure on unrelated queued-task metadata.
acceptance_criteria:
- commit_to_git distinguishes task-owned code changes from unrelated persistent workspace
  metadata.
- Accepted task work can still be committed successfully even when unrelated durable
  .litehive state exists.
- In worktree-backed execution, commit_to_git completes the task-local commit and
  deterministic merge-back without treating unrelated queue metadata as fatal dirt.
