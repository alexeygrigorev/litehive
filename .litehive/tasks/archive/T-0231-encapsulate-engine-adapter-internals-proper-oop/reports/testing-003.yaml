summary: 'Verified the engine-adapter encapsulation refactor against the acceptance
  criteria. Confirmed by import and code inspection that litehive/engines/__init__.py
  now builds ENGINE_REGISTRY from a simple ordered adapter-class list with zero adapter-specific
  kwargs, while get_engine() and ENGINE_REGISTRY behavior remain unchanged. Confirmed
  adapter defaults now live on the classes (name/binary/capabilities, plus OpenCode
  DEFAULT_STRIPPED_ENV_VARS) and engine-specific stream/continuation handling is dispatched
  through adapter methods instead of name-based branching in the registry module.
