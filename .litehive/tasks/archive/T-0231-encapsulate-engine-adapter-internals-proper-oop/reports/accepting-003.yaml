summary: 'Acceptance review for T-0231: pass. The refactor now encapsulates adapter
  defaults inside each adapter class instead of leaking private implementation details
  into the registry. ExternalCLIAdapter resolves subclass-owned defaults (DEFAULT_NAME,
  DEFAULT_BINARY, DEFAULT_CAPABILITIES, DEFAULT_STRIPPED_ENV_VARS), and litehive/engines/__init__.py
  now builds ENGINE_REGISTRY by instantiating a simple ENGINE_ADAPTER_TYPES list with
  no adapter-specific kwargs. Private adapter internals are no longer re-exported
  from litehive.engines.adapters; stream event adapters, live-event extraction, and
  continuation parsing were moved behind adapter methods such as stream_event_adapter()
  and extract_continuation(), with per-adapter helpers kept as class methods/static
  methods rather than package-level API. Public lookup behavior remains intact: get_engine()
  still returns the same registry objects keyed by the same engine names, and the
  registry contents remain codex, opencode, goz, gemini, copilot, claude. Validation:
  pytest -q tests/test_engine_variants_and_timeline.py passed (48 passed), python
  -m compileall litehive/engines litehive/runtime/_builder.py passed, and direct smoke
  checks confirmed the adapter package no longer exposes _OPENCODE_STRIPPED_ENV_VARS,
  _CLAUDE_STREAM_EVENT_ADAPTER, _COPILOT_STREAM_EVENT_ADAPTER, or the old _*_live_events
  helpers. I also started broader pytest runs (pytest -q and a targeted engine/runtime/subagent
  slice); both progressed cleanly deep into the suite with no failures reported before
  entering a slow/stalled late segment unrelated to the changed code. No acceptance
  findings in the modified surface.'
