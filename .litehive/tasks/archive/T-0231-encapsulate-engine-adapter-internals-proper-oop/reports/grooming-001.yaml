summary: 'Grooming pass. Verified by inspection that litehive/engines/__init__.py
  currently imports private adapter internals (_OPENCODE_STRIPPED_ENV_VARS, _codex_live_events,
  _claude/_copilot stream adapters, unwrap helpers) and manually wires adapter-specific
  kwargs into ENGINE_REGISTRY; extract_engine_continuation also branches on engine
  name in the registry module. This confirms the task is a bounded refactor of adapter
  encapsulation, registry construction, and engine-specific helper placement. Clarified
  public API mismatch: the current public module exports get_engine plus ENGINE_REGISTRY/ENGINE_CHOICES;
  there is no ENGINES symbol today, so implementation should preserve existing lookup
  behavior and module-level registry names rather than inventing a new public name.
  Recommended scope: 1) move per-adapter defaults (name/binary/capabilities/stripped
  env vars) behind adapter class defaults or zero-arg constructors, 2) move engine-specific
  live-event/stream-adapter/continuation logic onto adapter classes or adapter-owned
  attributes/methods, 3) rebuild ENGINE_REGISTRY from a simple ordered list of adapter
  classes with no adapter-specific kwargs in litehive/engines/__init__.py, 4) stop
  re-exporting private adapter constants/helpers from litehive/engines/adapters/__init__.py,
  5) update targeted tests around registry shape, invocation defaults, timelines,
  and continuation extraction while keeping get_engine and ENGINE_REGISTRY behavior
  unchanged. PM sizing: moderate, effort m. Tests run: none in grooming; verification
  was targeted code inspection only.'
