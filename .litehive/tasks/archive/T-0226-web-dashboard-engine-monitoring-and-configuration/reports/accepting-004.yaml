summary: 'Acceptance pass. I verified the implementation directly in litehive/web/__init__.py
  and litehive/web/templates/index.html, then reran the focused slice: uv run pytest
  tests/test_web_snapshot_lockfree.py -q, which passed with 17 tests in 3.47s. Evidence:
  GET /api/engines is wired and returns engine config, routing precedence/default
  fallback order, task-type routing rows, freeze state, and engine-monitoring payload
  via read_engine_dashboard; POST /api/engines/default validates and persists default_engine
  to .litehive/config.yaml; POST /api/task/engine requires task_id/engine/reason and
  delegates to switch_task_engine so the web flow mirrors litehive switch semantics.
  The UI renders an Engine Dashboard with current default engine, recovery engine,
  fallback order, frozen engines, routing rules, task-type routing table, and per-engine
  usage/token-cost cards, plus a default-engine form and a task-level engine switch
  form in task detail. SSE watch coverage includes both .litehive/config.yaml and
  .litehive/engine-monitoring.yaml so dashboard changes refresh. Acceptance criteria
  satisfied.'
