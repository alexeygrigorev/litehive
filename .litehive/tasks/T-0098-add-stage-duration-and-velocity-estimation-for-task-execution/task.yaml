goal: ''
acceptance_criteria:
- StageReport model includes a `duration_seconds` field defaulting to 0.
- Runner populates `duration_seconds` from stage start/end timestamps when the executor
  does not supply it.
- '`estimate_task_execution()` returns an `ExecutionEstimate` with stage_duration_seconds,
  remaining_seconds, and velocity_stages_per_hour computed from workspace report history.'
- '`render_task_summary()` displays stage_estimate, velocity, and eta when estimate
  data is available.'
- '`litehive status` passes workspace root to `render_task_summary` so estimates are
  computed.'
- At least one test verifies duration is persisted in the report YAML.
- At least one test verifies the summary output includes stage_estimate, velocity,
  and eta.
