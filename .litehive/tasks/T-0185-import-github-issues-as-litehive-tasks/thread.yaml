    \ covering all acceptance criteria.\n\n### Modified files\n- `litehive/models.py`\
    \ \u2014 Added `GitHubOrigin` model (repo, issue_number, issue_url, imported_at)\
    \ and `github_origin` field on `TaskRecord`.\n- `litehive/tasks.py` \u2014 Added\
    \ `github_origin` parameter to `create_task()` and wired it into TaskRecord construction.\n\
    - `litehive/cli/parser.py` \u2014 Registered `import-issue` and `import-issues`\
    \ subparsers.\n- `litehive/cli/__init__.py` \u2014 Added command dispatch for\
    \ both new commands.\n\n## Acceptance criteria verification\n\n1. \u2705 `litehive\
    \ import-issue <github-url>` creates a task with title, goal, and github_origin\
    \ populated \u2014 tested in `test_cmd_import_issue_from_url`, `test_import_single_issue_creates_task`\n\
    2. \u2705 `litehive import-issue <number> --repo owner/repo` works with just an\
    \ issue number \u2014 tested in `test_cmd_import_issue_from_number`\n3. \u2705\
    \ Repo is auto-detected from git remote when --repo is not provided \u2014 tested\
    \ in `test_detect_repo_ssh`, `test_detect_repo_https`, and `test_cmd_import_issue_from_url`\
    \ (no --repo, repo parsed from URL)\n4. \u2705 Issue labels mapped to task_type\
    \ and priority using hardcoded defaults \u2014 tested in `test_map_labels_*`,\
    \ `test_cmd_import_issues_bulk` verifies bug\u2192bugfix, documentation\u2192\
    docs, enhancement\u2192refactor, priority labels\n5. \u2705 Re-importing same\
    \ issue prints skip message with existing task ID \u2014 tested in `test_import_duplicate_skipped`,\
    \ `test_cmd_import_issue_duplicate`\n6. \u2705 `litehive import-issues` imports\
    \ all open issues not already tracked \u2014 tested in `test_cmd_import_issues_bulk`,\
    \ `test_cmd_import_issues_skips_existing`\n7. \u2705 Missing or unauthenticated\
    \ gh CLI produces clear error \u2014 tested in `test_run_gh_missing`, `test_check_gh_auth_failure`,\
    \ `test_cmd_import_issue_gh_missing`, `test_cmd_import_issues_gh_not_authenticated`\n\
    8. \u2705 Tests cover single import, duplicate skip, bulk import, label mapping,\
    \ and missing gh error \u2014 24 tests, all passing\n\n## Test evidence\n```\n\
    uv run pytest tests/test_github_import.py -q\n24 passed in 1.02s\n```"
