goal: Add a command like 'litehive import-issue <github-url>' or 'litehive import-issues'
  that fetches GitHub issues and creates litehive tasks from them. Map issue title
  to task title, issue body to goal, and labels to task_type or priority. Support
  both single issue import and bulk import of open issues.
acceptance_criteria:
- litehive import-issue <url-or-number> creates a task from a GitHub issue
- Task title, goal, and acceptance criteria are populated from the issue
- Issue labels are mapped to task_type or priority where possible
- Duplicate import of the same issue is detected and skipped
- litehive import-issues imports all open issues that don't already have tasks
