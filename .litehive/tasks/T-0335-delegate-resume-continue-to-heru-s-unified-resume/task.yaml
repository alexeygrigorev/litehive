goal: "heru T-0003 shipped a unified --resume/--continue path across all engine adapters.\
  \ litehive currently has per-engine resume/continuation logic (see extract_engine_continuation\
  \ and friends in litehive/agents/). Replace that with a single call into heru's\
  \ unified resume API. Delete the per-engine continuation extractors where heru now\
  \ covers them. Preserve litehive's RuntimeContinuationHandoff semantics \u2014 only\
  \ the low-level 'how do I hand a session id back to engine X' layer changes. Bump\
  \ the heru dependency pin to a version including T-0003."
acceptance_criteria:
- litehive/agents/ no longer contains per-engine resume/continuation extraction logic
  that heru's unified API covers
- extract_engine_continuation (or equivalent) delegates to heru for all supported
  engines
- RuntimeContinuationHandoff behavior is unchanged from the caller's perspective
- heru dependency pin bumped to a version including T-0003
- tests/ passes
- tests_integration/ resume/continuation tests pass for codex and at least one other
  engine
