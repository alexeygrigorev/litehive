summary: 'Implemented a narrow fix in litehive/agents/base.py for JSONL parsing noise
  from malformed Codex command_execution payloads. iter_jsonl_payloads now coalesces
  consecutive unparseable physical lines into a single warning and caches parsed stdout
  by exact content so repeated rescans of the same Codex run no longer re-emit the
  same warning burst. Safety is preserved: only successfully decoded JSON objects
  are returned, and valid events before/after a malformed multiline block still parse
  normally. Added focused regression coverage in tests/test_engine_parse_warnings.py
  using a malformed multiline command_execution fixture with valid neighboring item.completed
  agent_message events; the test asserts only the valid events are returned, transcript
  extraction still sees the neighboring messages, and repeated scans only produce
  one grouped unparseable warning. Verification run: uv run pytest -q tests/test_engine_parse_warnings.py
  (13 passed). Required checks run and passing: uv run ruff check --select E402,F401
  litehive tests; forbidden noqa suppression check command from the task instructions.
  Remaining edge case: a single first-time scan of a previously unseen stdout with
  a malformed multiline payload still emits one grouped warning for that malformed
  block, which is intentional for visibility without log flooding.'
