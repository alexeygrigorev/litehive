source: agent
summary: Implemented shared workspace resolution via litehive.config.resolve_workspace(task_id,
  workspace=...). It now resolves from explicit task id or LITEHIVE_TASK_ID, honors
  LITEHIVE_WORKSPACE_ROOT only when it matches the target task, walks up from cwd,
  and falls back to both ~/.litehive/workspaces.yaml and XDG workspaces registries.
  Added invalid-root validation to reject unresolved shell-variable paths and nested
  workspace creation; ensure_workspace now refuses roots inside another .litehive
  tree while preserving worktree-path aliases where task path helpers need them. Wired
  report and fast status to the shared resolver, made report fail clearly when workspace/task
  cannot be resolved, and changed report CLI defaults so agents can omit --workspace.
  Updated stage prompts and verdict nudges to use plain litehive report --verdict
  ... --role ... --step ... --message ... without --workspace or --task-id. Verified
  with uv run ruff check --select E402,F401 litehive tests, focused pytest coverage
  for config/report/status/prompt flows (394 passed), and full smoke suite uv run
  pytest -q (985 passed, 12 warnings).
