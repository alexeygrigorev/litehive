goal: state.yaml has an unmerged_worktrees list that tracks tasks whose worktree commits
  have not yet landed on main. When a task is rescued (via worktree rescue) or finalized
  out-of-band, its task.yaml moves to done/done but the unmerged_worktrees entry is
  left behind. Today both T-0281 and T-0305 are done and their worktrees are deleted
  from the filesystem, but their entries linger in state.yaml.unmerged_worktrees.
  These entries are harmless but noisy and confuse human inspection of state.yaml.
  Doctor should detect them and either report or auto-clean.
acceptance_criteria:
- 'litehive doctor detects stale unmerged_worktrees entries: an entry is stale if
  the referenced task.yaml status is in the terminal set (done, abandoned, cancelled,
  wont_do, duplicate, deferred) OR the referenced worktree path no longer exists on
  disk'
- Doctor auto-removes stale entries from state.yaml on each run (this is a pure cleanup,
  no behavioral risk)
- Doctor output reports the number of stale entries removed per run
- 'Test: construct a state.yaml with an entry pointing at a done task and a missing
  worktree, run doctor, assert entry is removed and no warning remains'
