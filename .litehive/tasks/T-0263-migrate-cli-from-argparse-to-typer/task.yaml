goal: Replace the argparse-based Litehive CLI with a Typer-based entrypoint that preserves
  the current public command surface, aliases, help visibility, and validation behavior
  while removing the dedicated parser module and dict-style dispatch wiring in favor
  of decorated functions with type-annotated arguments and auto-generated help.
acceptance_criteria:
- '`litehive --help` and grouped help commands expose the same 39 public commands
  as today, with internal-only commands remaining hidden.'
- Representative invocations for top-level commands, grouped commands, and legacy
  aliases continue to accept the same arguments/options and reject invalid input with
  equivalent validation behavior.
- The CLI entrypoint routes commands through Typer callbacks without relying on `litehive/cli/parser.py`
  or dict-based dispatch tables in `litehive/cli/__init__.py`.
- The existing CLI test suite passes after migrating parser-oriented tests to the
  Typer entrypoint or an equivalent compatibility seam, and `uv run pytest -q` passes
  with zero failures.
- '`pyproject.toml` includes `typer` as a runtime dependency.'
constraints:
- Preserve current public command names, grouped subcommands, legacy aliases, and
  no-argument fallback behavior.
- Keep business logic in existing command handler modules unless a Typer-specific
  extraction is required.
- Keep the refactor scoped to CLI wiring, help output, argument parsing, and test/documentation
  updates needed by that migration.
plan:
- Inventory each current parser builder and map it to a Typer app, subgroup, alias,
  or hidden command so no public command is dropped during the migration.
- Introduce a Typer root app and grouped sub-apps that call the existing handler functions,
  using typed parameters/options to preserve current defaults and coercions.
- Recreate current routing edge cases in Typer, including hidden/internal commands,
  grouped command help filtering, and no-argument fallback behavior.
- Remove `litehive/cli/parser.py` and the dict-based dispatch tables once Typer owns
  registration and routing.
- Update parser-focused tests and docs, then run focused CLI tests followed by `uv
  run pytest -q`.
