summary: 'Verified the Typer migration on the live CLI path and against the required
  test suites. Reproduced the previously rejected public fallback with ''uv run litehive
  archive'' and confirmed it now exits 2 with Typer-formatted help starting ''Usage:
  litehive archive [OPTIONS] [TASK_ID] COMMAND [ARGS]...'' rather than falling back
  to legacy argparse output. Confirmed the public help surface from ''uv run litehive
  --help'' still exposes the expected top-level command groups, that ''litehive/cli/parser.py''
  is removed, and that ''pyproject.toml'' includes runtime dependency ''typer>=0.16.0''.
  Searched the repo for ''build_parser|COMMAND_PARSER_BUILDERS|argparse'' and found
  the remaining argparse usage confined to the compatibility seam/tests rather than
  the live archive runtime path that previously failed. Ran focused regression coverage:
  ''uv run pytest -q tests/test_archive.py tests/test_run_cli.py tests/test_config.py
  tests/test_logs_command.py tests/test_engine_freeze.py tests/test_observability_and_status.py''
  -> 214 passed, 12 warnings. Ran required full suite: ''uv run pytest -q'' -> 976
  passed, 12 warnings, 0 failures. Acceptance criteria are met from QA evidence: Typer
  owns the verified public runtime/help path including the no-argument archive fallback,
  parser.py is removed, existing CLI tests and full pytest pass, help/validation behavior
  remains covered by the focused CLI regression set, and typer is present in runtime
  dependencies. Residual note: pytest reports 12 Typer deprecation warnings from tests/test_archive.py
  about unsupported ''is_flag''/''flag_value'' parameters in Typer, but these did
  not cause behavioral failures in this task.'
