  \nKey findings for the next stage:\n- The repository currently uses `argparse` through\
  \ `litehive/cli/parser.py` plus per-command parser builders under `litehive/cli/parsers/`.\n\
  - Command dispatch is split across dict tables in `litehive/cli/__init__.py`.\n\
  - The prompt's \"39 commands\" matches the public help surface (18 top-level commands\
  \ plus grouped subcommands), while the repo currently registers 41 parser builders\
  \ because internal/legacy entry points are also present.\n- `typer` is not currently\
  \ in runtime dependencies.\n- Existing tests assert parser behavior directly via\
  \ `build_parser().parse_args(...)`, so the implementation stage will need to migrate\
  \ those tests or provide a compatible testing seam.\n\nTests run: none in grooming.\
  \ Evidence gathered from source inspection and command-surface enumeration only.\n\
  \nTASK_UPDATE:\n  goal: Replace the `argparse`-based Litehive CLI with a Typer-based\
  \ entrypoint that preserves the current public command surface, aliases, help visibility,\
  \ and validation behavior while removing the dedicated parser module and dict-style\
  \ dispatch wiring.\n  acceptance_criteria:\n    - '`litehive --help` and grouped\
  \ help commands expose the same 39 public commands as today, with internal-only\
  \ commands remaining hidden.'\n    - 'Representative invocations for top-level commands,\
  \ grouped commands, and legacy aliases continue to accept the same arguments/options\
  \ and reject invalid input with equivalent validation behavior.'\n    - 'The CLI\
  \ entrypoint routes commands through Typer callbacks without relying on `litehive/cli/parser.py`\
  \ or dict-based dispatch tables in `litehive/cli/__init__.py`.'\n    - 'The existing\
  \ CLI test suite passes after migrating parser-oriented tests to the Typer entrypoint\
  \ or an equivalent compatibility seam, and `uv run pytest -q` passes with zero failures.'\n\
  \    - '`pyproject.toml` includes `typer` as a runtime dependency.'\n  constraints:\n\
  \    - Preserve current public command names, grouped subcommands, legacy aliases,\
  \ and no-argument fallback behavior.\n    - Keep business logic in existing command\
  \ handler modules unless a Typer-specific extraction is required.\n    - Keep the\
  \ refactor scoped to CLI wiring, help output, argument parsing, and test/documentation\
  \ updates needed by that migration.\n  plan:\n    - Inventory each current parser\
  \ builder and map it to a Typer app, subgroup, alias, or hidden command so no public\
  \ command is dropped during the migration.\n    - Introduce a Typer root app and\
  \ grouped sub-apps that call the existing handler functions, using typed parameters/options\
  \ to preserve current defaults and coercions.\n    - Recreate current routing edge\
  \ cases in Typer, including hidden/internal commands, grouped command help filtering,\
  \ and no-argument fallback behavior.\n    - Remove `litehive/cli/parser.py` and\
  \ the dict-based dispatch tables once Typer owns registration and routing.\n   \
  \ - Update parser-focused tests and docs, then run focused CLI tests followed by\
  \ `uv run pytest -q`.\n  pm_complexity: complex\n  planned_effort: l\n  task_type:\
  \ refactor"
