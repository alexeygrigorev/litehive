- role: recovery
  step: implementing
  verdict: pass
  message: 'Root cause: the Typer migration left the public ''archive'' no-argument
    fallback on the legacy argparse compatibility seam. The runtime path was archive_app.callback
    -> _cmd_archive(), and _cmd_archive() imported build_parser() when task_id was
    missing and --all-done was false, so ''uv run litehive archive'' printed argparse
    help and exited 2. Fix: moved the no-argument help/exit handling into the Typer
    callback in litehive/cli/__init__.py using ctx.get_help() + typer.Exit(2), and
    removed the lazy build_parser() fallback from litehive/cli/queue.py so runtime
    archive help no longer depends on argparse. Updated tests/test_archive.py to assert
    the real Typer entrypoint with CliRunner instead of the compatibility parser for
    this behavior. Verification: reproduced the original failure before the fix with
    ''uv run litehive archive''; after the fix the same command exits 2 with Typer-formatted
    help (''Usage: litehive archive [OPTIONS] [TASK_ID] COMMAND [ARGS]...''). Ran
    ''uv run pytest -q tests/test_archive.py tests/test_run_cli.py tests/test_config.py
    tests/test_logs_command.py tests/test_engine_freeze.py tests/test_observability_and_status.py''
    -> 214 passed. Ran ''uv run ruff check --select E402,F401 litehive tests'' ->
    passed. Ran the forbidden noqa gate from the task instructions -> passed. Retry
    guidance: re-run implementing/testing for T-0263; the archive public fallback
    is now Typer-owned, which addresses the rejection on criteria 1 and 3 without
    redoing unrelated task work.'
  files_changed: []
  created_at: '2026-04-10T14:20:23+00:00'
