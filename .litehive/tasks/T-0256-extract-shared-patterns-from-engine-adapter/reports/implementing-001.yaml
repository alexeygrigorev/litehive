summary: 'Root cause after reproducing the rejected acceptance gap: running ''uv run
  pytest -q'' exposed 11 real regressions introduced by the adapter split, not just
  missing evidence. The refactor had moved legacy helper functions behind private
  impl modules without preserving their public import surface or logger names, so
  tests that still import _extract_claude_text_delta_fallback, _goz_extract_text,
  _extract_codex_transcript, and _extract_opencode_transcript from the public adapter
  modules broke. It also made stderr-only limit detection use provider-sourced monitoring
  via ExternalCLIAdapter.usage_observation_from_scan, which changed codex fallback
  telemetry from source=local to source=provider and broke status/monitoring expectations.
  Fixes made: restored backward-compatible public helper exports in the public adapter
  modules, pointed helper loggers at the public adapter logger names expected by warning
  tests, added a small codex compatibility transcript helper preserving the prior
  warning behavior, and changed usage_observation_from_scan to label stderr-only fallback
  observations as source=local while keeping payload-backed observations as source=provider.
  Verified acceptance criteria with: uv run pytest tests/test_engine_parse_warnings.py
  -q (12 passed), uv run pytest tests/test_workspace_bootstrap.py -q -k ''record_engine_execution_tracks_local_usage_fallback
  or record_engine_execution_tracks_codex_provider_limit_observation'' (2 passed),
  uv run pytest tests/test_observability_and_status.py -q -k cmd_status_includes_engine_monitoring_lines
  (1 passed), uv run ruff check --select E402,F401 litehive tests (passed), and uv
  run pytest -q (924 passed, 3 skipped). Adapter line counts remain under 200: claude
  148, codex 136, copilot 91, gemini 101, goz 85, opencode 111.'
