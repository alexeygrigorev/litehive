    \ moderate\n- PLANNED_EFFORT: s\n\n## TASK_UPDATE\ngoal: Ensure the recovery agent\
    \ is always launched as the last resort before flagging any task, across all stages\
    \ and failure types, so the pool never stops on unexpected task failure.\npm_complexity:\
    \ moderate\nplanned_effort: s\nplan:\n  - Extract _try_recovery_before_flagging()\
    \ helper on TaskExecutionRunner\n  - Insert recovery calls at all 4 flagging sites\
    \ in runner/core.py\n  - Extend executor recovery to cover commit_to_git and accepting\n\
    \  - Ensure pool continues after recovery-handled failures\n  - Add 6+ targeted\
    \ tests\n  - Update context docs\nacceptance_criteria:\n  - Any stage that would\
    \ flag a task first attempts _attempt_stage_recovery before flagging\n  - Recovery\
