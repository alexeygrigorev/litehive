    After recovery is attempted (success or failure), the final status should not\
    \ trigger stop_on_failure:\n- Flagged tasks that went through recovery should\
    \ produce final_status=queued (flagged-in-queue) rather than final_status=flagged,\
    \ so _pool_stop_reason does not return failure_detected.\n- Alternatively, add\
    \ a recovery_attempted flag to RunResult and check it in _pool_stop_reason.\n\n\
    ### Step 5: Add targeted tests\n- test_recovery_fires_on_unsupported_verdict_before_flagging\n\
