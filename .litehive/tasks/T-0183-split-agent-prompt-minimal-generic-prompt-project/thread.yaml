    \ recovered report verdict\n4. If recovery fails, the task is flagged with failure_classification,\
    \ failure_diagnostics, and a recovery report written to recovery/\n5. Pool does\
    \ not stop on task failure \u2014 flagged tasks that went through recovery continue\
    \ in the pool, and the next task is selected\n6. commit_to_git merge failures,\
