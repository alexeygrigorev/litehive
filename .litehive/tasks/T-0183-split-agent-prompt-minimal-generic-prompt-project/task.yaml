goal: 'Agents get a bloated 34K prompt where the task is buried under litehive internals.
  Split into: (1) Generic prompt built into litehive code (~500 chars): role, pipeline
  stages, how to report verdicts, basic rules. Same for every project. (2) Project
  context.md per workspace: project purpose, key files, build/test commands, project-specific
  rules. Remove all CLI command docs, engine routing, pool modes, daemon details,
  hook points, recovery layering from the agent prompt. Only keep what the agent needs
  to do its job.'
acceptance_criteria:
- Generic prompt contains only what agents need to do their job - role, pipeline stages,
  report command, basic working rules. No arbitrary size limit but be mindful about
  every line included
- context.md contains only project-specific info - purpose, key files, build/test
  commands, project rules
- No full litehive CLI command catalog in agent prompts - only include commands the
  agent actually needs for its role (e.g. litehive report for submitting verdicts)
- No engine routing, pool modes, daemon, or hook details in agent prompts
- Total prompt size for a typical task is under 5K chars (was 34K)
- Generic prompt contains zero references to .litehive/ directory structure, task.yaml,
  runtime.yaml, or any litehive internal file layout
- Litehive internal structure info only appears in litehive own project context.md,
  not in the generic prompt
- All agent interactions with litehive happen through CLI only - agents do not need
  to know internal file structure
