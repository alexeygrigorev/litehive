  message: "## Grooming Summary\n\nTask is well-scoped and ready for implementation.\n\
    \n### Key Design Decision\n`list_tasks()` in tasks.py iterates one level deep\
    \ under `.litehive/tasks/`. Moving task dirs to `tasks/archive/` naturally excludes\
    \ them from all existing list/queue/status calls \u2014 no filtering changes needed.\n\
    \n### Refined Acceptance Criteria\n1. `litehive archive` (no args) moves all done\
    \ tasks to `.litehive/tasks/archive/`\n2. `litehive archive T-XXXX` moves a specific\
    \ done task to archive\n3. `litehive cleanup --older-than 30d` deletes archived\
    \ tasks older than 30 days (measured from archive date)\n4. Archived tasks do\
    \ not appear in `litehive queue` or `litehive status` output\n5. Archive and cleanup\
    \ operations print a summary of affected tasks\n6. All new commands have tests\n\
    \n### Implementation Plan\n1. **tasks.py**: Add `archive_task()`, `archive_done_tasks()`,\
    \ `cleanup_archived_tasks()`, and `list_archived_tasks()` functions. Archive should\
    \ record archive timestamp in task.yaml metadata.\n2. **parser.py**: Register\
    \ `archive` subcommand (optional positional task_id, --workspace) and `cleanup`\
    \ subcommand (--older-than with duration string, --workspace).\n3. **cli/queue.py**\
    \ (or new cli/archive.py): Add `_cmd_archive()` and `_cmd_cleanup()` implementations\
    \ following existing command patterns.\n4. **cli/__init__.py**: Wire dispatch\
    \ for new commands.\n5. **Tests**: Add test coverage for archive (bulk + single),\
    \ cleanup with age filter, and verify archived tasks are excluded from list_tasks/queue/status.\n\
    \n### PM Sizing\n- PM_COMPLEXITY: simple\n- PLANNED_EFFORT: s\n\n### Scope Notes\n\
    - Only \"done\" tasks are archivable (status == done, pipeline_status == done).\n\
