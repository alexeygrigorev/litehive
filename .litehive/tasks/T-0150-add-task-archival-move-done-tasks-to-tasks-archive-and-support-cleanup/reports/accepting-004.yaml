  \ 94 passed, 0 failures.\n\n### Acceptance criteria verification\n1. **litehive\
  \ archive moves all done tasks to tasks/archive/** \u2014 Verified. `archive_done_tasks()`\
  \ filters for status==done and pipeline_status==done, calls `archive_task()` for\
  \ each. Tested in `test_archive_done_tasks_bulk` and `test_cmd_archive_all_done`.\n\
  2. **litehive archive T-XXXX moves a specific done task to archive** \u2014 Verified.\
  \ `archive_task()` validates status==done, stamps `archived_at` in task.yaml, moves\
  \ dir via shutil.move. Tested in `test_archive_single_done_task` and `test_cmd_archive_single_task`.\
  \ Non-done and unknown tasks are properly rejected.\n3. **litehive cleanup --older-than\
  \ 30d deletes archived tasks older than 30 days from archive date** \u2014 Verified.\
  \ `_parse_duration()` parses d/h/m/s units. `cleanup_archived_tasks()` compares\
  \ `archived_at` against threshold and uses `shutil.rmtree`. Tested with backdated\
  \ timestamps in `test_cleanup_deletes_old_archived_tasks` and `test_cmd_cleanup`.\
  \ Recent tasks preserved in `test_cleanup_keeps_recent_archived_tasks`.\n4. **Archived\
  \ tasks do not appear in litehive queue or litehive status** \u2014 Verified. Structural\
  \ exclusion: `list_tasks()` iterates one level deep under `tasks/`, so `tasks/archive/`\
  \ subdirectory contents are invisible. Tested in `test_archived_tasks_excluded_from_list_tasks`,\
  \ `test_archived_tasks_excluded_from_queue`, `test_archived_tasks_excluded_from_status`.\n\
  5. **Archive and cleanup print a summary of affected tasks** \u2014 Verified. CLI\
  \ handlers print `archived: <id>`, `archived_count:`, `deleted: <id>`, `deleted_count:`\
  \ lines. Tested in CLI tests.\n6. **All new commands have tests** \u2014 19 tests\
  \ covering unit functions, CLI commands, edge cases, and error paths.\n\n### Code\
