feedback: "Implemented litehive archive and litehive cleanup commands.\n\n## Changes\n\
  1. **litehive/tasks.py**: Added `archive_root()`, `archive_task()`, `archive_done_tasks()`,\
  \ `list_archived_tasks()`, `_parse_duration()`, and `cleanup_archived_tasks()` functions.\
  \ Archive moves task dirs to `.litehive/tasks/archive/` and stamps `archived_at`\
  \ in task.yaml. Cleanup deletes archived dirs older than the specified duration.\n\
  2. **litehive/cli/parser.py**: Registered `archive` (optional positional task_id)\
  \ and `cleanup` (--older-than required) subcommands.\n3. **litehive/cli/queue.py**:\
  \ Added `_cmd_archive()` and `_cmd_cleanup()` handlers following existing patterns.\n\
  4. **litehive/cli/__init__.py**: Wired dispatch for both new commands.\n5. **tests/test_archive.py**:\
  \ 19 tests covering all acceptance criteria.\n6. **tests/workspace_helpers.py**:\
  \ Added imports for new functions.\n\n## Acceptance criteria verification\n- \u2705\
  \ `litehive archive` moves all done tasks to tasks/archive/ \u2014 tested in `test_archive_done_tasks_bulk`,\
  \ `test_cmd_archive_all_done`\n- \u2705 `litehive archive T-XXXX` moves a specific\
  \ done task \u2014 tested in `test_archive_single_done_task`, `test_cmd_archive_single_task`\n\
  - \u2705 `litehive cleanup --older-than 30d` deletes archived tasks older than 30\
  \ days from archive date \u2014 tested in `test_cleanup_deletes_old_archived_tasks`,\
  \ `test_cmd_cleanup`\n- \u2705 Archived tasks do not appear in queue or status \u2014\
  \ tested in `test_archived_tasks_excluded_from_list_tasks`, `test_archived_tasks_excluded_from_queue`,\
  \ `test_archived_tasks_excluded_from_status`\n- \u2705 Archive and cleanup print\
  \ a summary of affected tasks \u2014 tested in CLI command tests checking output\n\
  - \u2705 All new commands have tests \u2014 19 tests, all passing\n\n## Tests\n\
  - Added: 19\n- Passing: 19\n- Command: `uv run pytest tests/test_archive.py -q`\n\
