  message: 'Implemented T-0289 as a first-class SQLite-backed operator attention queue.


    What changed:

    - Added `litehive/attention.py` with a persistent attention item model and DB-backed
    store over the existing `attention` table. Items keep audit history via payload
    state (`pending`/`resolved`, `resolved_at`, `resolution`) instead of deleting
    rows.

    - Added `litehive attention list` and `litehive attention resolve <id>` via `litehive/cli/attention.py`
    and CLI wiring in `litehive/cli/__init__.py` plus argparse parser support.

    - Updated `litehive status` and fast status to show `attention_items: <n>` and
    a `waiting for you:` section driven by the structured queue.

    - Unified attention producers/reconciliation for duplicate task ids, flagged tasks,
    merge_failed tasks, stale managed worktrees, origin/main divergence, human checkpoint
    before commit, and destructive git wrapper denials. The merge-resolver sandbox
    continues writing `.litehive/runtime/attention.log`, and reconciliation imports
    those entries into the queue so operators do not need to inspect the log separately.

    - Added `pool_stop_on_attention` config/plumbing and daemon gating so the pool
    halts before starting more work when unresolved attention items exist.


    Acceptance criteria evidence:

    - `litehive attention list` / resolve UX and persistence covered by `tests/test_attention_queue.py::test_attention_list_and_resolve_persist_items`.

    - Status count + `waiting for you:` rendering covered by `tests/test_attention_queue.py::test_status_shows_attention_count_and_waiting_actions`.

    - Producer creation + auto-clear for duplicate ids, flagged, merge_failed, stale
    worktree, origin divergence, and human checkpoint covered by `tests/test_attention_queue.py::test_detectable_attention_items_reconcile_and_auto_clear`.

    - Denied destructive git op producer covered by `tests/test_sandbox_git_profiles.py::test_merge_resolver_profile_rejects_force_push_and_logs_attention`.

    - Pool stop behavior covered by `tests/test_attention_queue.py::test_pool_stops_before_running_tasks_when_attention_gate_enabled`.


    Verification run:

    - `uv run ruff check --select E402,F401 litehive tests` -> passed

    - forbidden `noqa` suppression check -> passed

    - `uv run pytest -q` -> `544 passed, 5 skipped, 4 warnings in 129.18s`

    '
