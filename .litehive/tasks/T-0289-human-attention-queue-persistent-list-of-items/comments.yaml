- role: qa
  step: testing
  verdict: reject
  message: 'REJECT


    EXPECTED behavior:

    `litehive attention resolve <id>` should dismiss the selected attention item while
    preserving audit history. That includes structured detectable items such as `duplicate_task_id`,
    `origin_divergence`, `flagged_task`, `merge_failed_task`, `stale_worktree`, and
    `human_checkpoint_before_commit`, because the acceptance criteria explicitly require
    a resolve flow and say items are dismissed either by explicit resolve or by running
    the suggested fix.


    OBSERVED behavior:

    Detectable items are recreated immediately on the next reconciliation scan after
    being resolved, so the resolve command does not actually dismiss them unless the
    underlying condition is already fixed. The recreated row gets a new id, which
    also breaks the notion of resolving a stable queue entry.


    Reproduction steps:

    1. Create a workspace with a detectable condition, for example duplicate task
    ids.

    2. Run `list_attention(root)` or `litehive attention list` and note the item id.

    3. Run `resolve_attention(root, <id>)` or `litehive attention resolve <id>`.

    4. Run `list_attention(root)` / `litehive attention list` again without fixing
    the duplicate.

    5. The same attention item reappears immediately with a new id.


    Minimal repro used in QA:

    - create task `T-0001`

    - add a second `.litehive/tasks/.../task.yaml` claiming the same `id`

    - first `list_attention(root)` => `[(1, ''duplicate_task_id'', ''pending'', ''duplicate_task_id:T-0001'')]`

    - `resolve_attention(root, 1)` => resolved

    - second `list_attention(root)` => `[(2, ''duplicate_task_id'', ''pending'', ''duplicate_task_id:T-0001'')]`


    Why this happens:

    - `resolve_attention()` only marks the payload as resolved: `litehive/attention.py:204-206`.

    - Reconciliation only dedupes against pending rows: `litehive/attention.py:81-85`,
    `124-141`.

    - On the next scan, the detectable condition is still present, so `reconcile()`
    inserts a fresh pending row for the same dedupe key instead of honoring the explicit
    operator resolution.


    Acceptance criteria not met:

    - `litehive attention resolve <id>` dismisses an item.

    - Built-in detectable conditions can be cleared via explicit `litehive attention
    resolve <id>` when the operator chooses that path.

    - Items are dismissed only via explicit resolve or by the operator running the
    suggested fix.


    Suggested fix direction:

    Persist explicit operator dismissal state by dedupe key for detectable items and
    have reconciliation suppress recreation until the underlying condition clears
    and later reoccurs, or otherwise distinguish operator-resolved detectable items
    from auto-resolved items.

    '
