  message: 'Implemented the QA follow-up for T-0289.


    QA issue fixed:

    - Explicit `litehive attention resolve <id>` on detectable items now suppresses
    that dedupe key until the underlying condition clears once. Reconciliation no
    longer recreates a fresh pending row immediately after an operator resolve.

    - When the condition later clears, the resolved item is marked as having cleared
    after resolution. If the same condition reoccurs later, reconciliation creates
    a new attention row with a new id, preserving both dismissal semantics and recurrence
    auditability.


    Code changes:

    - Updated `litehive/attention.py` reconciliation logic to consider resolved rows
    for detectable dedupe keys, persist operator-dismissal suppression metadata, and
    release that suppression only after the condition disappears on a later scan.

    - Added regression coverage in `tests/test_attention_queue.py::test_operator_resolve_suppresses_detectable_attention_until_condition_clears`.


