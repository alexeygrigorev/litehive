pipeline_mode: full
priority: high
depends_on: []
goal: 'Maintain a persistent list of items that need human (operator) attention. Items
  enter the queue when: destructive operation attempted, task hits human_checkpoint_before_commit,
  task flagged manually, origin/main diverged from local, duplicate task IDs detected,
  stuck worktree. Items show in litehive status as ''waiting for you:'' with a clear
  action. Items are dismissed only via explicit litehive attention resolve <id> or
  by the operator running the suggested fix.'
acceptance_criteria:
- litehive attention list shows all pending attention items with title, created_at,
  reason, suggested action
- litehive attention resolve <id> dismisses an item
- litehive status shows count of pending attention items prominently
- 'New items are added when: subagent attempts denied destructive op, human_checkpoint
  hit, origin diverged, duplicate IDs, merge_failed'
- Pool pauses until zero attention items remain if pool_stop_on_attention is set
- Attention items persisted in .litehive/attention/ as YAML files (one per item)
