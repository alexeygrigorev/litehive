id: T-0470
slug: add-append-only-task-event-log-that-can-rebuild
title: Add append-only task event log that can rebuild SQLite state
created_at: '2026-04-22T07:12:49+00:00'
task_type: null
pipeline_mode: full
priority: high
depends_on: []
goal: Introduce a durable append-only task event log outside the SQLite DB so Litehive
  can reconstruct task metadata and lifecycle history if the workspace database is
  lost or corrupted. This log must exist before task.yaml ceases to be authoritative.
acceptance_criteria:
- Every task lifecycle mutation appends an immutable event record with timestamp,
  task id, event type, and enough payload to rebuild task metadata and status transitions
  without consulting SQLite.
- The append-only log is stored outside the SQLite database and survives DB deletion
  or recreation.
- A rebuild command or bootstrap path can reconstruct at least the canonical task
  table, queue state, task activity/audit trail, and current lifecycle status from
  the append-only log.
- Task create/update/close/requeue/archive/delete/report transitions are all represented
  in the log before their SQLite write is considered complete.
- Tests cover normal replay, partial-log recovery, and DB-loss rebuild from the append-only
  log.
