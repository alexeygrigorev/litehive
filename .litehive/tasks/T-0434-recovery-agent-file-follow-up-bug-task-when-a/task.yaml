title: Handle unrelated failing tests with explicit follow-up tasks and operator-visible
  scope decisions
created_at: '2026-04-17T16:17:03+00:00'
task_type: bugfix
pipeline_mode: full
priority: high
depends_on: []
goal: When acceptance fails on tests outside the task's changed surface, agents must
  not silently skip them. Attribute whether the failure is task-caused or pre-existing,
  create a follow-up bug task when it is unrelated, and either flag the current task
  or proceed only with an explicit, recorded narrower gate so the decision is auditable.
acceptance_criteria:
- The system distinguishes task-caused test failures from pre-existing/unrelated failures.
- Unrelated failures create an explicit follow-up task or attention item; nothing
  is silently ignored.
- If the current task proceeds under a narrower gate, the skip/ignore is recorded
  in activity/report output with linked follow-up context.
- Tests cover both attribution branches and explicit follow-up creation or escalation.
