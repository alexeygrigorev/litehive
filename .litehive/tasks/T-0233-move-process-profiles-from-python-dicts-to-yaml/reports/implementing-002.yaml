summary: 'Moved process profile data into YAML files under litehive/config/profiles/
  and replaced litehive.config.profiles with a 42-line package loader plus rendering
  helper module. Preserved public API and merge semantics: shared base is loaded from
  _shared.yaml, project overlays still extend development_rules/tool_usage/workspace_overlay/specifics/prompt_scaffold/init_scaffold
  lists and per-stage stage_overlay/stage_instructions entries, and unknown profiles
  still fall back to generic. Added a focused test asserting the loader stays under
  50 lines and that the YAML files are present. Verified behavior with uv run pytest
  tests/test_workspace_bootstrap.py -q (22 passed) and uv run pytest tests/test_config_and_run_cli.py
  -q (58 passed). Also smoke-checked CLI behavior with litehive configure --workspace
  /tmp/litehive-t0233-smoke --default-engine codex --process-profile rust, then confirmed
  .litehive/config.yaml contained process_profile: rust and .litehive/context.md still
  contained ## Rust specifics and . Added wheel packaging include for litehive/config/profiles/*.yaml
  so installed builds can load the new file-backed profiles.'
