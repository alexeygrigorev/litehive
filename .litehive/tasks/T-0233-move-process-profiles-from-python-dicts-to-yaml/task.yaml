goal: "profiles.py is 425 lines of hardcoded Python dicts with no logic \u2014 pure\
  \ data. Move each profile to a YAML file under litehive/config/profiles/ (e.g. _shared.yaml,\
  \ generic.yaml, python.yaml, django.yaml, rust.yaml). Replace profiles.py with a\
  \ small loader that reads and merges shared base with project overlay."
acceptance_criteria:
- Each profile is a separate YAML file under litehive/config/profiles/
- A shared base profile is merged with project-specific overlays at load time
- profiles.py replaced with a loader under 50 lines
- All existing tests pass
- litehive configure --process-profile still works as before
constraints:
- Preserve the public profile API and current profile names so configure, context
  rendering, and prompt generation remain behaviorally compatible.
- Keep subagent resource-limit defaults in config normalization out of scope unless
  a failing test proves the profile loader change requires coordinated updates.
plan:
- Inventory the current shared and per-profile fields in litehive/config/profiles.py
  and map them to a YAML schema that preserves list-vs-override merge behavior.
- Add YAML profile files under litehive/config/profiles/, including a shared base
  and one overlay per existing process profile name, with content matching the current
  rendered outputs.
- Replace the dict-only portion of litehive/config/profiles.py with a small loader
  that reads YAML files, merges the shared base with the selected overlay, and keeps
  available_process_profiles, resolve_process_profile, and render_context_template
  behavior stable.
- Update config/profile validation call sites as needed so process_profile choices
  and fallback-to-generic behavior still work when profiles are file-backed.
- Run focused profile/configure/bootstrap tests, then the existing suite required
  by the task, to confirm litehive configure --process-profile behaves the same and
  all acceptance criteria are met.
