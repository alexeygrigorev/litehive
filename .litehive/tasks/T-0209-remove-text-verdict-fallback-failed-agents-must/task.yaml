goal: When an agent is killed or fails (non-zero exit), the text parsing fallback
  in parse_stage_report_text still runs and _parse_verdict defaults to pass when no
  VERDICT line is found. This is wrong - a failed agent should never produce a pass
  verdict. If no CLI report was submitted and the agent failed, the verdict must be
  fail. Remove the default-to-pass logic in _parse_verdict line 737 of engines/base.py.
acceptance_criteria:
- Failed agents (non-zero exit) always produce fail verdict
- _parse_verdict does not default to pass for any failed subagent
- Only agents that explicitly submit via litehive report CLI can produce pass
