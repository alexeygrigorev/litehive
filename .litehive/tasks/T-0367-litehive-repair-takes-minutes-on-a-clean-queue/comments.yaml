- role: qa
  step: testing
  verdict: reject
  message: 'Rejecting T-0367.


    EXPECTED behavior:

    - `litehive repair` should stay fast on a clean queue, but it must still repair
    any real inconsistencies that appear later.

    - Legacy `thread.yaml` migration should run whenever legacy thread files are present,
    not only before an initial marker is written.


    OBSERVED behavior:

    - `repair_workspace_state()` now writes `.litehive/runtime/legacy-thread-migration-v1`
    on the first clean run and then returns early on every later run (`litehive/recovery/workspace_repair.py:53-55,82`).

    - If a workspace is repaired once while clean, and a task with legacy `thread.yaml`
    appears afterward, later `litehive repair` runs do not migrate it at all. The
    legacy file remains in place and `comments.yaml` is never created.

    - This is a functional regression in repair behavior even though the clean-path
    performance is good. On my synthetic clean 100-task workspace, repair completed
    in about 202ms, and the targeted tests passed, but the late-legacy migration case
    is broken.


    Reproduction steps:

    1. Create a fresh workspace and run `repair_workspace_state()` once with no legacy
    `thread.yaml` files present.

    2. Create a new task and manually write `.litehive/tasks/<task>/thread.yaml` with
    a legacy comment payload.

    3. Run `repair_workspace_state()` again.

    4. Observe that the second run reports no mutation, leaves `thread.yaml` in place,
    and does not create `comments.yaml`.


    Concrete repro observed during QA:

    - First run: `first_mutated False marker True`

    - Second run after adding legacy file: `second_mutated False legacy_exists True
    comments_exists False`


    Acceptance criteria not met:

    - `Repair work scales with the number of inconsistencies it actually fixes, not
    with total queue size` is not met functionally, because after the marker is written
    repair stops fixing this inconsistency class entirely.


    Validation run:

    - `pytest -q tests/test_recovery_runtime.py tests/test_attention_queue.py tests/test_task_comments.py`
    -> 14 passed

    - Synthetic clean 100-task benchmark: `repair_workspace_state()` completed in
    ~202ms

    '
