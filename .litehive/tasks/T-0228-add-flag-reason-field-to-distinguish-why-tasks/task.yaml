  through journals and reports.
acceptance_criteria:
- task.yaml gets a flag_reason field set whenever status becomes flagged
- All code paths that set status=flagged also set a meaningful flag_reason
- litehive list and litehive show display the flag_reason
- Existing flagged tasks without flag_reason show as 'unknown' or similar
