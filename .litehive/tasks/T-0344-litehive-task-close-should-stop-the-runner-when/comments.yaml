  message: 'Implemented T-0344.


    What changed:

    - `litehive/workspace/task_status.py:462-465` now detects when `close_task()`
    targets `workspace.active_task_id` and calls `stop_current_task(root)` before
    entering the existing close transition. This reuses the normal stop path for SIGINT,
    runner-lock wait, stale-runner recovery, and active execution cleanup; if the
    runner does not stop cleanly, close still fails instead of falsely marking the
    task closed.

    - `litehive/cli/queue.py:245-246` now reports `WorkspaceConflictError` from `cmd_close_task`
    as a normal `close failed: ...` CLI failure instead of leaving it uncaught.

    - Added `tests/test_task_close_active.py:23-125`, an end-to-end regression that
    starts a real subprocess holding the runner lock/heartbeat for the active task,
    runs `cmd_close_task`, and asserts the process exits, the runner lock file is
    cleared, the task ends in `wont_do`, `runtime.active_subagent` is cleared, `active_task_id`
    is null, the task is removed from the queue, and the close journal entry is written.


    Evidence:

    - `uv run pytest -q tests/test_task_close_active.py` -> passed

    - `uv run ruff check --select E402,F401 litehive tests` -> passed

    - `uv run pytest -q` -> 532 passed, 5 skipped, 4 warnings in 137.23s


    Residual edge case / follow-up risk:

    - Active close now intentionally writes the normal stop/interruption journal entry
    before the existing close journal entry, because it reuses `stop_current_task()`
    as requested. Final persisted task state matches idle close behavior, but active-close
    history includes that extra interruption breadcrumb.

    '
