  verdict: pass
  message: "Pass. T-0344 is ready for implementation.\n\nUser problem\n`litehive task\
    \ close <id>` currently fails for the actively running task because the close\
    \ path hits the future-task mutation guard before it stops the runner. That makes\
    \ `close` unusable for the common \"kill this bad run now\" workflow and forces\
    \ an extra manual `litehive stop`.\n\nImplementation guidance\n- Keep this narrowly\
    \ scoped to active-task close.\n- `litehive/workspace/task_status.py:close_task()`\
    \ currently calls `ensure_future_task_mutation_allowed(...)` while the task is\
    \ still active, so it conflicts on `workspace.active_task_id`.\n- Reuse the existing\
    \ stop path rather than inventing a second shutdown flow. `stop_current_task()`\
    \ already handles SIGINT, waits for the runner lock to clear, recovers stale runner\
    \ state, and clears active execution state.\n- After stopping the active run,\
    \ apply the existing close transition so the final persisted task/state/journal\
    \ outcome matches idle close behavior.\n- Do not redesign idle close semantics\
    \ in this task; only remove the active-close failure mode.\n\nTest guidance\n\
    - Add coverage for the end-to-end active close path through the CLI or equivalent\
    \ integration surface used by `cmd_close_task`.\n- Assert that closing the active\
    \ task succeeds without a prior `litehive stop`.\n- Assert that in-flight execution\
    \ is actually stopped, not just hidden: runner lock / runner PID / active subagent\
    \ state should no longer indicate a live run after close.\n- Assert final state\
    \ matches idle close behavior: outcome status set, removed from queue, `active_task_id`\
    \ cleared, journal written.\n- Run the relevant focused regression tests and then\
    \ the required test suite for this task.\n\nRisk to preserve\nIf the runner cannot\
    \ be stopped cleanly, the command should fail rather than falsely marking the\
    \ task closed. Preserve that safety behavior while fixing the default active-close\
    \ flow.\n\nTASK_UPDATE:\n  constraints:\n    - Prefer the smallest change that\
    \ removes the failure mode.\n    - Do not change idle close semantics beyond making\
    \ active close reuse the existing stop path.\n    - Call out any remaining edge\
    \ cases or follow-up risk explicitly.\n"
