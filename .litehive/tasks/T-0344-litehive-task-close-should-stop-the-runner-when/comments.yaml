    Validated implementation against the acceptance criteria.


    What I verified:

    - `litehive/workspace/task_status.py:close_task()` now detects `state.active_task_id
    == task_id` and calls `stop_current_task(root)` before the existing close transition.
    This is the narrow change requested and reuses the established stop path rather
    than introducing a second shutdown flow.

    - `stop_current_task()` still preserves the safety invariant: if the runner lock
    remains held after SIGINT, it raises `WorkspaceConflictError` and the close does
    not proceed. This avoids falsely marking a still-running task as closed.

    - `tests/test_task_close_active.py` exercises the end-to-end active-close path
    through `cmd_close_task()` using a real subprocess that acquires the runner lock
    and heartbeat. The test asserts the close succeeds without prior `litehive stop`,
    the subprocess exits, the runner lock file is cleared, `runtime.active_subagent`
    is cleared, the task status becomes `wont_do`, `active_task_id` is cleared, the
    task is removed from the queue, and the close journal entry is written.

    - CLI handling in `litehive/cli/queue.py` now reports `WorkspaceConflictError`
    from close as a normal `close failed: ...` failure instead of leaving it uncaught.


    Test evidence:

    - `uv run pytest -q tests/test_task_close_active.py` -> passed

    - `uv run pytest -q` -> 532 passed, 5 skipped, 4 warnings in 135.59s


    Remaining note:

    - Active close now records the normal stop/interruption journal breadcrumb before
    the close journal breadcrumb because it intentionally reuses `stop_current_task()`.
    Final persisted state matches idle close behavior, and I do not consider this
    a blocker for T-0344.

    '
