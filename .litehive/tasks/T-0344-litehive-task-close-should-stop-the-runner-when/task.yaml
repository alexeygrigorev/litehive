id: T-0344
slug: litehive-task-close-should-stop-the-runner-when
title: '''litehive task close'' should stop the runner when closing an actively-running
  task'
created_at: '2026-04-11T07:23:39+00:00'
task_type: bugfix
mode: tasks
pipeline_mode: full
priority: medium
pm_complexity: moderate
planned_effort: s
depends_on: []
goal: 'Today, closing an actively-running task is rejected by the concurrency guard
  and the user has to stop the daemon manually before retrying close. This is the
  wrong default: if a user explicitly asks to close a task, they are telling litehive
  to abandon the work, and litehive should honor that by stopping the runner as part
  of the close. Otherwise ''close'' is only usable on idle tasks, which defeats its
  purpose for the common ''this task is going the wrong direction, kill it'' workflow.'
acceptance_criteria:
- Running 'litehive task close <id>' on the currently-active task succeeds without
  requiring a prior 'litehive stop'
- Any in-flight subagent/engine execution for the closed task is actually stopped,
  not left running in the background
- The task ends up in the same final state as closing an idle task (status set to
  the outcome, removed from queue, active_task_id cleared, journal entry written)
- tests/ covers the 'close an active task' path end-to-end
- tests/ passes
constraints:
- Prefer the smallest change that removes the failure mode.
- Do not change idle close semantics beyond making active close reuse the existing
  stop path.
- Call out any remaining edge cases or follow-up risk explicitly.
plan:
- Reproduce or localize the failing behavior.
- Implement the minimal targeted fix.
- Run focused regression coverage for the affected behavior.
