goal: "litehive/pipeline/__init__.py imports ~90 names from 12 private _xxx.py modules\
  \ and re-exports them in a giant __all__. Dozens of underscore-prefixed helpers\
  \ (_path_within, _budget_ledger_from_conditions, _dirty_worktree_owner_task, ...)\
  \ are re-exported at package level \u2014 which is both code-in-__init__.py (anti-pattern\
  \ I'm cutting) and a lie about what's private.\n\n### Target\nStrip pipeline/__init__.py\
  \ to the ~10 names actually imported from outside the package:\n- run_task\n- run_parallel_tasks\
  \ (removed by T-0321 parallel deletion)\n- drain_task_pool\n- TaskPoolStopConditions\n\
  - recover_completed_task\n- rollback_completed_task\n- inspect_dirty_worktree_gate\n\
  - active_engine_freezes\n- is_engine_frozen\n- repair_workspace_state\n\n### Method\n\
  1. Grep 'from litehive.pipeline import' and 'from litehive.pipeline.xxx import'\
  \ across litehive/ and tests/ to find external consumers.\n2. Any import from litehive.pipeline\
  \ that matches a name currently re-exported: leave alone (these are the survivors).\n\
  3. Any import from litehive.pipeline.<private> directly: also leave alone.\n4. Any\
  \ name re-exported but not imported externally: delete from __init__.py.\n5. Any\
  \ internal sibling module doing `from litehive.pipeline import _helper`: rewrite\
  \ to import from the actual sibling module directly.\n6. Delete __all__ entries\
  \ for removed names.\n\n### Verification\n- grep shows no 'from litehive.pipeline\
  \ import _' patterns (no underscore re-exports)\n- All tests pass\n- pipeline/__init__.py\
  \ is under 30 LOC"
acceptance_criteria:
- litehive/pipeline/__init__.py is under 30 LOC
- No underscore-prefixed names in pipeline/__init__.py's __all__
- Internal cross-module imports route through sibling modules directly, not via pipeline
  package
- External callers unaffected (same public names importable from litehive.pipeline)
- All tests pass
