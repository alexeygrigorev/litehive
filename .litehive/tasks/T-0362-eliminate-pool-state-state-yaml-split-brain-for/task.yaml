goal: 'Two sources of truth for active_task_id: .litehive/state.yaml and ~/.local/share/litehive/<workspace>/data.db:pool_state.
  When a task terminates, state.yaml gets updated but pool_state sqlite doesn''t,
  causing the recurring stale-runner wedge I had to manually clear ~5 times this session.
  Pick one canonical store and make the other a read-only projection.'
acceptance_criteria:
- 1. Make pool_state sqlite the canonical store for active_task_id, queue, unmerged_worktrees,
  etc.
- 2. state.yaml either goes away, or becomes a read-only snapshot regenerated on demand
  for operator tooling (and never read by the runner).
- 3. Any pipeline transition to a terminal state (done, failed) atomically clears
  active_task_id in the canonical store.
- '4. Regression test: after a task fails, next daemon iteration does NOT re-pick
  the same failed task.'
