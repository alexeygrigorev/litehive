    \ only `reject_on_failure` hooks to agents, so removing reject semantics must\
    \ also update prompt context rather than only the runner.\n\nTASK_UPDATE:\n  goal:\
    \ |\n    Simplify the v2 runner-hook system by collapsing it to a single sequential,\
    \ warning-only execution path keyed by the existing hook-point names. Keep the\
    \ nine current hook-point keys and the current workspace's `runner_hooks` entries\
    \ loading without operator edits, but remove execution-mode and reject-on-failure\
    \ control flow from config, orchestration, prompt plumbing, and hook execution.\
    \ A failing hook command should be logged/surfaced as a stage warning and must\
    \ not change pipeline transitions.\n  acceptance_criteria:\n    - `litehive/pipeline/nodes/hook.py`\
    \ no longer defines an execution-mode matrix; hooks for a phase run in order and\
