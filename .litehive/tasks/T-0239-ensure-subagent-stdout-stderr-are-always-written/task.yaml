goal: Some subagent runs produce no stdout/transcript artifacts (only session.yaml
  and report.yaml). This makes debugging impossible. Ensure stdout.txt and stderr.txt
  are always written, even if empty, so we can distinguish 'agent produced nothing'
  from 'artifacts were lost'.
acceptance_criteria:
- Every subagent run produces stdout.txt and stderr.txt files in its artifact directory
- Files are written even when the agent exits quickly (under 5 seconds)
- Files are written even when using the non-live run path
- All existing tests pass
