    \ criteria verification\n\n1. **Every subagent run produces stdout.txt and stderr.txt**\
    \ \u2014 PASS. The new test proves empty-output runs create both files. The fix\
    \ is in the shared `_write_stream_artifact()` path called by `_write_session_finish()`\
    \ for all runs.\n\n2. **Files are written even when the agent exits quickly (under\
    \ 5 seconds)** \u2014 PASS. The FakeEngine returns instantly (well under 5s).\
    \ The fix is in the artifact-write path, not timing-dependent.\n\n3. **Files are\
