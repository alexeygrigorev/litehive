    \ content is empty, instead of deleting both plain and compressed files. The `.gz`\
    \ variant is still cleaned up. This is a 2-line net change \u2014 correct and\
    \ minimal.\n\n**New test** (`tests/test_tasks_and_subagents.py:3398`): `test_subagent_empty_stdout_stderr_still_written`\
    \ creates a subagent with a FakeEngine that returns empty stdout/stderr, then\
