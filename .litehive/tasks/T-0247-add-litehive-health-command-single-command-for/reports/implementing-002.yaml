summary: 'Implemented a new top-level ''health'' CLI command wired through parser
  and dispatch. The command now aggregates workspace diagnostics in one view: active
  task/stage, flagged tasks with flag reason and latest verdict summary, managed worktrees
  with change counts, dirty/stale worktree findings from inspect_dirty_worktree_gate,
  all engine quota statuses (including unsupported gemini), daemon running/stopped
  status, and the last 3 completed tasks. Exit code returns 1 when flagged tasks exist,
  a main-checkout/ambiguous/missing-recorded-worktree problem is present, or any proactive
  engine quota reports warning/limit reached; otherwise 0. Verification: uv run pytest
  tests/test_config_and_run_cli.py -q (60 passed) and uv run pytest tests/test_observability_and_status.py
  -q (74 passed). New tests cover parser wiring plus healthy/unhealthy health-command
  output and exit-code behavior, including flagged summaries, worktree diagnostics,
  daemon status, quota warnings, and recent completions.'
