goal: 'One command that shows everything needed to assess workspace health: active
  task + stage, flagged tasks with reasons, stale worktrees, uncommitted code changes,
  engine quotas, daemon status, and recent completions. Replaces running 5+ commands
  manually.'
acceptance_criteria:
- 'litehive health shows: active task, flagged tasks with last verdict summary, worktrees
  with change counts, all engine quotas, daemon status (running/stopped), last 3 completed
  tasks'
- Exit code 0 if healthy, 1 if problems detected (flagged tasks, stale worktrees,
  quota warnings)
- All existing tests pass
constraints: []
plan:
- Add a top-level 'health' CLI command wired through parser and dispatch, following
  the existing status/daemon/worktree command layout.
- 'Implement a workspace health summary that aggregates: active task/stage, flagged
  tasks with flag reason and latest verdict/report summary, managed worktrees with
  change counts, dirty/stale worktree findings, daemon status, engine quota status,
  and the last 3 completed tasks.'
- 'Define the health exit code from aggregated findings: return 1 when flagged tasks
  exist, dirty/stale worktree findings block or indicate cleanup debt, or any engine
  reports quota/rate/budget warnings; otherwise return 0.'
- Add focused CLI tests covering healthy and unhealthy outputs, including flagged-task
  summaries, worktree diagnostics, recent completions, daemon status, and exit-code
  behavior.
