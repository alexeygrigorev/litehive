title: 'Recovery agent: distinguish operator cleanup from SWE scope creep'
created_at: '2026-04-17T16:16:57+00:00'
task_type: bugfix
pipeline_mode: full
priority: high
depends_on: []
goal: "When the recovery agent evaluates a worktree it currently treats any diff outside\
  \ the task's obvious scope as SWE scope creep. This breaks when an operator manually\
  \ cleans up unrelated broken code in the worktree to unblock the task \u2014 recovery\
  \ calls it 'removing unrelated tests to avoid fixing them.' Recovery should be able\
  \ to tell operator-origin cleanup from SWE-origin scope-dodging. Possible signals:\
  \ commit author, an operator-cleanup marker file, a journal entry, or simply: if\
  \ the 'removed' files are already broken/unused on main, treat as cleanup not scope\
  \ creep."
acceptance_criteria:
- Recovery has a defined signal for operator-origin cleanup vs SWE-origin scope creep
- Operator cleanup does not cause recovery to reject the task with scope-creep reasoning
- SWE-origin scope creep (e.g. deleting tests instead of fixing them) is still caught
