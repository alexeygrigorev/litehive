goal: 'Persist subagent output to disk in real time so active runs can be inspected
  before completion. This should behave like the Telegram writing assistant Claude
  runner: create the task-local artifact directory immediately, stream stdout/stderr
  and transcript updates incrementally, and keep session metadata current while the
  process is still running.'
acceptance_criteria:
- Starting a subagent immediately creates its task-local artifact directory with session
  metadata on disk.
- stdout, stderr, and transcript files are updated incrementally while the subagent
  is still running.
- A stopped or long-running subagent can be inspected from disk without waiting for
  the process to exit.
- Litehive status and any future web UI can rely on the same on-disk live artifacts
  instead of post-hoc snapshots only.
constraints:
- Keep the live-write format simple append-or-rewrite text files; do not require a
  database for live capture.
- Preserve the final report/session artifact format already used by completed tasks.
- Avoid losing partial output if the runner is interrupted.
plan:
- Compare Litehive subagent capture with the Telegram writing assistant real-time
  Claude streaming mechanism.
- Update subagent execution so files are created and refreshed while the process is
  active, not only after completion.
- Verify that a live task can be tailed from disk during execution and still produces
  the expected final report artifacts.
