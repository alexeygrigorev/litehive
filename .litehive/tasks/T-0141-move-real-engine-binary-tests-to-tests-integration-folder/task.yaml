goal: Separate tests that invoke real engine binaries (codex, claude, opencode, gemini,
  copilot, goz) into tests_integration/ so the main test suite runs fast without needing
  live engines
acceptance_criteria:
- tests_integration/ folder exists with integration tests that call real engine binaries
- main test suite in tests/ runs without invoking any real engine binary
- integration tests can be run separately with uv run pytest tests_integration/
- 'integration tests verify each engine adapter end-to-end: build_command, run, render_transcript,
  parse_stage_report'
- main test suite completes in under 60 seconds without recovery agent timeout delays
