goal: When creating a git worktree for a task, symlink .venv to the main repo .venv
  instead of letting agents create separate venvs. Saves ~7-30MB per worktree and
  avoids duplicate installs. Add the symlink in _resolve_task_execution_root after
  git worktree add.
acceptance_criteria:
- New worktrees have .venv symlinked to main repo .venv
- Agents can run uv run pytest from worktree without creating a new venv
- No duplicate .venv directories in worktrees
