  message: "Implemented T-0280 by distinguishing commit-stage no-op reconciliation\
    \ from real merge failure.\n\nWhat changed:\n- `litehive/pipeline/nodes/system.py`:\
    \ `CommitNode` now returns pass metadata from `_merge_worktree()`. `GitCommitNode`\
    \ now detects the case where `git merge` succeeds but main `HEAD` does not move,\
    \ classifies it as `already_landed` vs generic `no_op`, and returns structured\
    \ `commit_result` metadata with the reconciled main SHA.\n- `litehive/pipeline/runner.py`:\
    \ preserves `commit_result` metadata on task state so terminal sync can see the\
    \ reconciliation outcome.\n- `litehive/pipeline/orchestration.py`: when commit-stage\
    \ reconciliation is a no-op, the task now finishes in `done`, records `task.git.commit_sha`\
    \ / runtime commit SHA to the reconciled main commit, and appends an operator-visible\
    \ journal entry. Real commit-stage failures still route to `merge_failed`, with\
    \ a distinct failure journal line.\n- Tests added:\n  - `tests/test_pipeline_v2_hooks_and_commit.py::test_commit_node_reports_already_landed_noop_reconciliation`\n\
    \  - `tests/test_pipeline_v2_end_to_end.py::test_run_task_records_already_landed_commit_reconciliation`\n\
    \nAcceptance criteria evidence:\n- No-op/already-landed integration is treated\
    \ as success: the new end-to-end test forces `run_task()` through `commit_to_git`\
    \ with `commit_result={status: reconciled_noop, reason: already_landed, head_sha:\
    \ deadbeefcafebabe}` and asserts final stage `done`, task status `done`, pipeline_status\
    \ `done`, and `task.git.commit_sha == deadbeefcafebabe`.\n- Operator-visible record\
    \ includes reason and SHA: the same test asserts `journal.md` contains `patch\
    \ already landed on main at deadbeefcafebabe`.\n- Conflict behavior stays separate:\
    \ existing regression `tests/test_pipeline_v2_hooks_and_commit.py::test_commit_node_with_conflict_emits_merge_conflict_detected`\
    \ still passes, preserving merge-conflict routing.\n\nChecks run:\n- `uv run pytest\
    \ -q tests/test_pipeline_v2_hooks_and_commit.py tests/test_pipeline_v2_end_to_end.py\
    \ tests/test_recovery_runtime.py` -> 26 passed\n- `uv run ruff check --select\
    \ E402,F401 litehive tests` -> passed\n- forbidden `noqa` suppression check ->\
    \ passed\n- `uv run pytest -q` -> 529 passed, 5 skipped, 3 warnings in 121.34s\n\
    \nRemaining edge case called out:\n- This change classifies reconciliation only\
    \ when `git merge` succeeds and main `HEAD` stays unchanged. If Git decides to\
    \ create a real merge commit even though the patch content was already present\
    \ on main, that still follows the ordinary clean-merge success path rather than\
    \ the new reconciled-no-op path.\n"
