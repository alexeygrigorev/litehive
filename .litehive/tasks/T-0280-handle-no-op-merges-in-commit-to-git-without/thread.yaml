  message: 'Implemented a scoped commit_to_git reconciliation fix for already-landed/no-op
    merges. In litehive/pipeline/_commit.py, commit_to_git now detects when a worktree-only
    patch is already represented on main by comparing the worktree tip against the
    pre-merge main head with git cherry; if merge succeeds without advancing main,
    the task is finished as done with task.git.commit_sha set to the reconciled main
    SHA and an explicit success summary/journal message saying the work was already
    landed and the merge was a no-op. Real merge failures now emit a distinct merge-conflict
    summary instead of the old generic ''did not produce new commits'' text. Added
    regression coverage in tests/test_recovery_and_rollback.py for a worktree commit
    whose patch was cherry-picked onto main before commit_to_git, asserting pass verdict,
    done status, reconciled commit SHA, worktree cleanup, and operator-facing journal
    text. Updated tests/test_worktree_merge_agent.py to assert conflict failures keep
    the explicit merge-conflict summary. Verification run: uv run pytest -q tests/test_recovery_and_rollback.py
