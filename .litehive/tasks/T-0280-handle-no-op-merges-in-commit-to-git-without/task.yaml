goal: Make commit_to_git reconcile tasks correctly when the intended changes are already
  present on the target branch and merge produces no new commit.
acceptance_criteria:
- If merge produces no new commit because the patch is already present on main, Litehive
  does not leave the source task in merge_failed.
- Task state is reconciled to a non-stuck outcome with a clear reason when merge work
  is already applied.
- Operator-facing logs distinguish real merge conflicts from already-landed/no-op
  merges.
