goal: Add real-time browser updates for active task state and agent output so operators
  can watch work progress without repeatedly polling large snapshots.
acceptance_criteria:
- The web surface exposes a streaming endpoint, preferably SSE, for incremental workspace
  and active-task updates.
- Active subagent transcript and stdout updates are streamed from the same artifact
  sources used by litehive task logs and follow mode.
- Browser reconnect logic resubscribes cleanly and rehydrates current state after
  a disconnect or reload.
- The streaming implementation stays idle when no task is active and avoids lock-heavy
  polling loops.
- Tests cover snapshot event emission and active-subagent output updates.
