    the main checkout with commit_sha missing, and 2) resolving a running commit_to_git
    task with an existing checkpoint before selecting new work. Tightened the existing
    stranded-commit recovery assertion to prove git history does not advance. Verified
    with: uv run pytest -q tests/test_retry_commit_and_recovery.py -k ''integrates_existing_litehive_checkpoint_from_clean_worktree
