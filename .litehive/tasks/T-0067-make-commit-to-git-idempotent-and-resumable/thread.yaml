    or finalizes_running_commit_stage_with_existing_checkpoint_before_new_work or
    recovers_orphaned_commit_stage_before_new_work'' -> 5 passed, 85 deselected. Evidence:
    checkpoint_attempts stays at 1 in rerun/recovery cases, HEAD commit count stays
    unchanged during reconciliation, and the recovered task records the existing commit
