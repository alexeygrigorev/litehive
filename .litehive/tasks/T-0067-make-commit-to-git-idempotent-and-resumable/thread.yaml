    attempts or creating a new commit, and the existing done-task recovery path reuses
    the same helper. In litehive/tasks.py, stale-runner recovery now reconciles an
    existing checkpoint for running commit_to_git tasks before requeueing, and the
    active-task recovery/finalization path now reuses the shared recovered-commit
    finalizer instead of duplicating state updates. Added focused tests in tests/test_retry_commit_and_recovery.py
