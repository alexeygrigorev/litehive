goal: Agents should not have to list files they changed in their report. Git already
  knows. Remove files_changed from the report format that agents produce. Instead,
  populate it automatically from git diff in the worktree at commit time. The guard
  already checks git directly. The field can stay in StageReport as internal metadata
  but agents should never be asked to produce it.
acceptance_criteria:
- Agent prompt templates no longer ask for FILES_CHANGED
- StageReport.files_changed is populated from git diff at commit stage, not from agent
  output
- Empty SWE guard uses only git status, never report.files_changed
- Existing tests updated to not require FILES_CHANGED in fake agent output
