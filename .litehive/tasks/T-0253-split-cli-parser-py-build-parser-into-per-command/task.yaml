goal: build_parser() is 1015 lines in a single function with 39 subparsers. Split
  into one module per command group (run, queue, tasks, daemon, etc.) that each define
  their own parser arguments. The main build_parser() just assembles them.
acceptance_criteria:
- build_parser() under 100 lines
- Each command group has its own parser module (cli/parsers/run.py, cli/parsers/queue.py,
  etc.)
- Adding a new command only requires a new file + 1-line registration
- All existing tests pass including parser duplicate detection test
constraints: []
plan:
- Inventory the current top-level and nested parser surface, including defaults, aliases,
  and special cases such as duplicate detection coverage and archive help wiring.
- Introduce a litehive/cli/parsers/ package with one parser-registration module per
  command group and a small central registry that build_parser() iterates to assemble
  the CLI.
- Keep parser behavior stable for existing commands and nested groups such as engine,
  daemon, and worktree, including current dest names, defaults, and set_defaults hooks.
- Run focused parser tests, including the duplicate subcommand/argument detection
  test, and fix any regressions caused by registration order or shared option extraction.
