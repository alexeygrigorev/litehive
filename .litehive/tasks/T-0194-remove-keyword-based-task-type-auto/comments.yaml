  verdict: pass
  message: 'Shaped T-0194 for implementation.


    User problem:

    Engine choice must be predictable. Litehive should never infer an engine from
    title keywords like "refactor", "bugfix", or "research", and it should not keep
    dead config for that behavior.


    Scope:

    Remove the remaining keyword-routing legacy and any config/template/doc/test residue
    tied to it. Keep this task narrowly about engine-selection cleanup. Do not broaden
    into unrelated task_type changes or a new engine-selection feature.


    Important branch reality:

    - The live resolver already appears to ignore title keywords and `task_type`;
    the likely remaining work is cleanup and regression coverage rather than a fresh
    behavior change.

    - The current branch does not expose a `task.engine` field on `TaskRecord` / `resolve_engine_plan`.
    Do not expand this task into inventing that feature. Preserve existing explicit
    override surfaces and `default_engine` fallback only.


    Acceptance criteria now persisted on the task:

    - No engine-selection path inspects task title text, keyword buckets, `routing_patterns`,
    or task_type-derived routing.

    - `task_engine_routing` is removed end-to-end from config model/loading, workspace
    template/defaults, and operator-facing docs.

    - Legacy routing-only symbols are removed if still present: `_task_routing_key`,
    `VALID_TASK_ROUTING_KEYS`, `_default_task_engine_routing`, `routing_patterns`,
    and any routing parser/normalizer helpers used only for keyword-based engine selection.

    - Focused tests cover explicit engine precedence without keyword inference.

    - Relevant tests pass.


    Recommended implementation path:

    1. Inspect `litehive/config/engine_models.py`, config loading/model code, workspace
    template, and docs for any remaining routing-only references.

    2. Remove dead config/constants/helpers and update docs/templates to describe
    only explicit engine precedence.

    3. Tighten focused tests around engine precedence and absence of routing config/helpers,
    then run the relevant slice.


    Likely touch points:

    `litehive/config/engine_models.py`, `litehive/config/model.py`, `litehive/config/loading.py`,
    `litehive/tasks/constants.py`, `litehive/cli/templates/workspace_config.yaml`,
    `docs/configuration.md`, `docs/engines.md`, and focused config/engine tests.


    No follow-up task extracted.

    '
