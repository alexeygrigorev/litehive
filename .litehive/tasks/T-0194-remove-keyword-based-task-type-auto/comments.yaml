    - Re-exported `save_task_runtime` from `litehive.tasks`.

    - Added an explicit `LITEHIVE_AGENT_CONTEXT=1` marker for real managed subagent
    sessions in `litehive/agents/manager.py`.

    - Tightened agent-only CLI restrictions in `litehive.main` and `litehive.cli.agent_cli`
    so they only apply when that explicit marker is present.

    - Hardened `tests_integration/helpers.py::cli_command()` to strip leaked Litehive
    agent env and prepend the current checkout to `PYTHONPATH`, so subprocess CLI
    tests execute the code under test consistently.

    - Updated `tests/test_main.py` to cover the new explicit agent-context behavior.


