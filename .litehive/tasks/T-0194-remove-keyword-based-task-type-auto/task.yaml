goal: 'Remove _task_routing_key which guesses task_type from title keywords (refactor,
  bugfix, research, etc.) and overrides default_engine. Remove task_engine_routing
  from config entirely. Engine selection should only come from: default_engine, task-level
  engine override, or CLI --engine override. Remove VALID_TASK_ROUTING_KEYS, _default_task_engine_routing,
