acceptance_criteria:
- No more keyword-based auto-classification of tasks from title text
- task_engine_routing removed from LitehiveConfig
- _default_task_engine_routing and VALID_TASK_ROUTING_KEYS removed from constants
- Engine selection uses only default_engine, task.engine, or CLI override
- All tests pass after removal
