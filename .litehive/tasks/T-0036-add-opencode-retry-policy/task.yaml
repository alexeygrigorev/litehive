acceptance_criteria:
- '`LitehiveConfig` defines an OpenCode-specific `execution_retry_policies` default
  that is consistent with the shared execution retry contract and remains visible
  through existing config/CLI observability.'
- Failed OpenCode executions that represent transient timeout, network, or service
  failures are classified as `retryable_execution_error` with the expected retry classification
  and reason.
- OpenCode limit/quota/rate-limit style failures continue to classify as execution
  limits and are not misclassified as retryable failures.
- Focused tests cover the OpenCode retry policy selection and retryable failure detection
  behavior, including at least one retry path that produces the expected warning/journal
  observability.
