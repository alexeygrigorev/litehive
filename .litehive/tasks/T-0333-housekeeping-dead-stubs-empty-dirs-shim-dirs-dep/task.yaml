  \ module, delete the stub.\n\n### 2. litehive/engines/ shim\nlitehive/engines/__init__.py\
  \ is `from litehive.agents import *` (3 lines). Used only by tests/test_engine_variants_and_timeline.py.\
  \ Rewrite the test import to `from litehive.agents import ENGINE_REGISTRY, get_engine`\
  \ and delete the directory.\n\n### 3. Empty directories\n- litehive/runner/\n- litehive/runtime/\n\
