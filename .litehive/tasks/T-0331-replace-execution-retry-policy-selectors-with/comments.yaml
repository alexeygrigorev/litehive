  verdict: pass
  message: 'Implemented T-0331 by removing the selector-based execution retry config
    and wiring the live retry path to flat config.


    What changed:

    - Deleted selector-era production code and exports: `ExecutionRetryPolicy`, `default_execution_retry_policies`,
    `normalize_execution_retry_policies`, `resolve_execution_retry_policy`, `_execution_retry_model_family`,
    `ResolvedExecutionRetryPolicy`, and `litehive/config/retry.py`.

    - Replaced `LitehiveConfig.execution_retry_policies` with flat `retry_on: list[str]`
    beside `default_retry_limit`; normalization now accepts only `execution_limit`,
    `timeout`, `network`, and `service`.

    - Updated runtime retry behavior at the live boundary: `SubagentManager` failure
    results are translated by `HeruEngineAdapter`, and `AgentNode` now retries only
    when `failure_kind in retry_on`.

    - `run_task()` now applies the effective retry budget from `resolve_task_retry_policy(task,
    config)`, so per-task `retry_limit` overrides control the runtime retry cap.

    - Updated CLI/status/docs to show `retry_on` instead of selector policies.

    - Deleted selector-priority tests and replaced them with flat-config/runtime tests,
    including `run_task()` coverage for workspace `retry_on` and per-task `retry_limit`
    override.


    Evidence:

    - `uv run ruff check --select E402,F401 litehive tests` -> passed

    - `uv run pytest -q` -> 497 passed, 5 skipped

    - Focused retry/config tests also passed during bring-up: `uv run pytest -q tests/test_config.py
    tests/test_pipeline_v2_agent_retries.py tests/test_pipeline_v2_end_to_end.py`
    -> 76 passed


    Acceptance criteria status:

    - Selector classes/helpers/constants removed from production code: met

    - `LitehiveConfig.execution_retry_policies` removed and `retry_on` added: met

    - Live runtime retry decision uses flat failure-kind membership plus effective
    retry limit: met

    - Per-task `retry_limit` override still works at runtime: met

    - Selector tests deleted and full test suite passes: met

    '
