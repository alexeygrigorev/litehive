goal: Replace the confusing per-engine fallback maps with a single global engine_preference
  list (e.g. [claude, codex, goz, copilot]). When any engine fails, try the next available
  in the list. No per-engine config needed.
acceptance_criteria:
- 'config has engine_preference: list of engines in priority order'
- When an engine fails, fallback walks the preference list skipping the failed engine
- Per-engine engine_fallbacks dict is removed
- Existing engine_fallbacks in config.yaml is migrated or ignored
