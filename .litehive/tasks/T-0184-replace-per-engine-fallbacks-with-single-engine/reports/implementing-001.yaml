feedback: "Verified engine_preference implementation is complete and correct.\n\n\
  ## Changes verified (4 source files + 3 test files + 2 docs):\n- config/__init__.py:\
  \ engine_fallbacks: dict[str,list[str]] replaced with engine_preference: list[str]\
  \ (default: [codex, opencode, gemini, copilot, goz], claude excluded). Old engine_fallbacks\
  \ silently dropped via data.pop in load_config().\n- runtime/_budget.py: _engine_attempt_order()\
  \ simplified \u2014 primary engine first, then remaining preference-list engines\
  \ in order.\n- runtime/_models.py: resolve_engine_attempt_order passes config.engine_preference\
  \ (line 91).\n- runtime/_execution.py: uses config.engine_preference.\n- Tests updated:\
  \ test_claude_not_in_engine_preference, test_frozen_engine_in_fallback_chain_skipped,\
  \ engine_fallbacks refs in test_retry_commit_and_recovery.py converted.\n- docs/engines.md\
  \ and docs/configuration.md updated.\n\n## Acceptance criteria verification:\n1.\
  \ config.engine_preference is list[str] with default [codex, opencode, gemini, copilot,\
  \ goz] \u2014 claude excluded (config/__init__.py:204-206) \u2014 CONFIRMED\n2.\
  \ Fallback walks engine_preference in order, skipping failed engine (_engine_attempt_order\
  \ in runtime/_budget.py:82-92) \u2014 CONFIRMED\n3. Per-engine engine_fallbacks\
  \ dict removed from LitehiveConfig \u2014 no such field exists \u2014 CONFIRMED\n\
  4. Old engine_fallbacks silently ignored via data.pop(\"engine_fallbacks\", None)\
  \ in load_config (config/__init__.py:398,403) \u2014 CONFIRMED\n5. _engine_attempt_order\
  \ simplified: primary engine first, then remaining preference-list engines in order\
  \ \u2014 CONFIRMED\n6. resolve_engine_attempt_order still filters frozen engines\
  \ (runtime/_models.py:91) \u2014 CONFIRMED\n7. test_claude_not_in_engine_preference\
  \ verifies claude excluded from defaults \u2014 PASSED\n8. No engine_fallbacks references\
  \ remain in source except data.pop migration lines \u2014 CONFIRMED via grep\n\n\
  ## Tests run:\n- test_claude_not_in_engine_preference \u2014 PASSED\n- test_frozen_engine_in_fallback_chain_skipped\
  \ \u2014 PASSED\n- test_run_next_task_walks_same_stage_fallback_graph_after_usage_limit\
  \ \u2014 PASSED\n\nMinor note: data.pop(\"engine_fallbacks\", None) appears twice\
  \ in load_config (lines 398 and 403) \u2014 redundant but harmless."
