goal: Make litehive tasks/status/queue commands useful for both agents and humans.
  Default to showing only active (not-done) tasks. Show compact output (ID + title)
  by default. Add filters (--status, --stage, --engine). Add --all flag to show everything.
  Add litehive show T-XXXX for detailed single-task view.
acceptance_criteria:
- Default output excludes done tasks
- 'Compact mode shows one line per task: ID, status, title'
- 'Filters: --status, --pipeline-status, --engine narrow the list'
- --all flag shows all tasks including done
- litehive show T-XXXX prints full task details
