  fail with clear error asking the agent to resubmit. Covers: base.py lines 536-602,
  670-687, 700-714.'
acceptance_criteria:
- parse_stage_report_text only accepts structured JSON or litehive report CLI submissions
- _extract_line, _extract_int, _extract_list, _extract_section_block removed
- Invalid JSON fails with clear error, not silent fallback to text
- Agent gets session continued with instruction to resubmit properly
