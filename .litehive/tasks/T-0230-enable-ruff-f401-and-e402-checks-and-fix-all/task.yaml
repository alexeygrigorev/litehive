acceptance_criteria:
- pyproject.toml ruff config includes F401 and E402 rules
- ruff check --select E402,F401 passes with zero errors on litehive/ and tests/
- All existing tests still pass
- A runner_hook or pre-commit check runs ruff so violations are caught before merge
- "All wildcard imports (import *) in tests replaced with explicit imports \u2014\
  \ no noqa F401/F403 suppressions"
- Add a runner_hook that runs git grep for noqa F401/F403 suppressions and fails if
  any are found
