plan:
- Update pyproject Ruff configuration to enable F401 and E402 for the repository without
  broadening scope beyond litehive/ and tests/.
- Fix current F401 findings by converting package re-exports to explicit export patterns
  or removing unused imports, and replace wildcard-import test usage with explicit
  imports from tests.workspace_helpers.
- Fix current E402 findings by moving module-level imports to the top of affected
  files while preserving behavior and helper initialization.
- Wire a blocking before_pm_acceptance runner hook that runs Ruff on litehive/ and
  tests/ and add coverage for hook persistence and failure behavior, including a grep
  guard that rejects noqa F401/F403 suppressions.
- Verify with uv run ruff check --select E402,F401 litehive tests plus targeted and
  full pytest coverage required by the touched workflow.
