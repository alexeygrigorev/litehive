summary: 'Completed T-0230 and re-closed the acceptance gaps. Kept the Ruff F401/E402
  config and hook wiring intact, then fixed the remaining regressions from the wildcard-import
  cleanup by restoring explicit imports in tests/test_engine_variants_and_timeline.py
  (get_engine) and tests/test_runner_workflow.py (needs_normalization). After running
  a suite-wide pytest gate, found a deeper cross-test regression in subagent execution
  detection: singleton engine adapters could retain stale instance-bound run/run_live
  aliases after monkeypatch cleanup, which caused later class-level overrides in tests
  to be ignored. Fixed this by resolving effective run/run_live callables against
  the current class-visible implementation in litehive/subagents/_engine_detection.py,
  litehive/subagents/_sandbox.py, and litehive/subagents/_manager.py, and added focused
  regressions in tests/test_tasks_and_subagents.py covering stale instance aliases
  for both run and run_live. Verification: uv run ruff check --select E402,F401 litehive
  tests -> pass; targeted pytest slices for the repaired files and new regressions
  -> pass; full suite gate uv run pytest -q --maxfail=1 -> 824 passed, 3 skipped in
  111.24s. Evidence against acceptance criteria: pyproject.toml still enables F401/E402,
  blocking before_pm_acceptance hooks still run Ruff plus the git-grep suppression
  guard, wildcard imports remain removed, suppression grep stays clean, and the existing
  test suite now passes end-to-end.'
