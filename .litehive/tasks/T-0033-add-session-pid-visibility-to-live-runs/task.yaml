goal: Persist and display the OS PID for each running subagent session so status,
  logs, and task artifacts show which process is currently executing. Include the
  PID in structured session metadata and live observability output.
acceptance_criteria:
- Each subagent session persists the OS PID in structured metadata while the subagent
  is running and after it completes.
- Task runtime metadata stores the active and last subagent PID so the PID survives
  reloads and is available to status rendering.
- Live observability output rendered through shared status formatting includes the
  PID for an active subagent, and completed-subagent output retains the last known
  PID where available.
- Session artifacts under the task subagent folder include the PID in `session.yaml`
  without regressing existing transcript, stdout, stderr, or report persistence.
- Focused tests cover PID persistence for non-streaming and streaming subagent execution
  plus status/observability rendering of the PID.
