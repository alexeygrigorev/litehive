summary: 'Implemented a dedicated tests_integration/ suite with explicit real-engine
  matrix docs and one smoke test file per adapter: codex, opencode, gemini, copilot,
  claude, and goz. Added shared harness helpers that build each adapter invocation
  through Litehive, run the real binary with an opt-in engine gate (LITEHIVE_INTEGRATION_ENGINES)
  and timeout, capture stdout/stderr, validate STAGE_RESULT against the StageResultSubmission
  schema, and assert parsed stage reports. Added codex-specific integration coverage
  proving an engine can invoke litehive report and persist a thread.yaml comment,
  plus a separate CLI-level switching test that verifies mid-task engine switching
  requeues the task and persists continuation_handoff and last_engine_switch metadata
  without monkeypatching. Verified with: uv run pytest tests_integration/ -q => 1
  passed, 7 skipped; LITEHIVE_INTEGRATION_ENGINES=codex uv run pytest tests_integration/test_codex.py
  tests_integration/test_switching.py -q => 3 passed. This meets the acceptance criteria
  for a separate tests_integration/ suite, per-engine real-binary coverage, report
  CLI side effects, documented skip conditions, and engine-switch persistence coverage.'
