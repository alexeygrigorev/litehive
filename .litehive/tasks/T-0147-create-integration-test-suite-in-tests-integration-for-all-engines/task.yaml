goal: Build tests_integration/ with end-to-end tests for each engine adapter that
  run real binaries, capture output, and verify STAGE_RESULT. These are the safety
  net for refactoring.
acceptance_criteria:
- Create a dedicated `tests_integration/` test package that is collected by `uv run
  pytest tests_integration/` without pulling in the unit-test suite.
- Define and document the integration engine matrix in the suite, covering every adapter
  this repo currently intends to exercise through real CLIs; if any adapter remains
  intentionally deferred or opt-in, the suite must mark that explicitly rather than
  silently omitting it.
- For each in-scope engine, add a per-engine integration test that invokes the real
  binary through the Litehive adapter path, submits a minimal prompt, and verifies
  the parsed `STAGE_RESULT` structure.
- At least one integration path verifies the engine can invoke `litehive report` and
  that the expected task thread/report side effect is persisted in workspace state.
- Add integration coverage for mid-task engine switching that exercises the persisted
  handoff/resume metadata through the CLI or runner flow rather than pure unit-level
  monkeypatching.
- Document the exact command(s) and any required local credentials or skip conditions
  so developers can run the integration suite separately from unit tests.
constraints: []
plan:
- Confirm the intended in-scope engine matrix from repo source of truth (`VALID_ENGINE_NAMES`,
  process guidance, and any opt-in/deferred flags), then codify explicit skip rules
  for engines that cannot run in a local CI/dev environment.
- Design a shared `tests_integration` harness that creates an isolated Litehive workspace,
  invokes real engine CLIs with minimal prompts, captures stdout/stderr/transcript
  artifacts, and exposes helpers for asserting parsed stage reports.
- Add one integration test module per in-scope engine, reusing the shared harness
  while keeping engine-specific prompt/command/skip logic local to each file.
- Add at least one integration scenario that verifies `litehive report` side effects
  and one scenario that verifies engine switching/handoff persistence mid-task.
- Wire the suite into pytest collection/documentation so `uv run pytest tests_integration/`
  is the supported focused entrypoint, then run the targeted integration suite or
  the subset that is executable in the local environment.
