  \ not a code issue.\n\nCode evidence (all on main):\n1. litehive/agents/_manager.py\
  \ \u2014 subagent status is \"completed\" only when exit_code == 0; non-zero exits\
  \ are \"failed\" first, and classify_execution_interruption can only reclassify\
  \ to \"interrupted\", never \"completed\". The inactivity-timeout handler explicitly\
  \ sets exit_code=124 and status=\"failed\".\n2. litehive/engines/base.py \u2014\
  \ parse_stage_report_text downgrades structured STAGE_RESULT pass/accept verdicts\
  \ to \"fail\" when subagent_status is not \"completed\", preventing timeout-killed\
  \ agents from preserving passing verdicts.\n\nTest evidence:\n- `uv run pytest -q\
  \ tests/test_tasks_and_subagents.py tests/test_stage_result_submission.py -k 'marks_generic_non_zero_exit_as_failed\
  \ or kills_stale_live_process_using_stdout_mtime or timeout_cannot_preserve_structured_pass_verdict\
  \ or failed_subagent_cannot_turn_structured_pass_into_passing_report'` \u2192 3\
  \ passed, 72 deselected.\n\nAll acceptance criteria are met:\n- Exit code 124 is\
  \ classified as failed/interrupted, not completed \u2713\n- Any non-zero exit code\
  \ is not classified as completed \u2713\n- Timeout-killed agents do not produce\
  \ pass verdicts \u2713\n\nTASK_UPDATE:\npm_complexity: simple\nplanned_effort: xs\n\
  auto_commit: true\n\nThe QA stage should verify by running the test command above\
  \ and confirming 3 passes."
