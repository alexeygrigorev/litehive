id: T-0208
slug: classify-exit-code-124-timeout-as-failure-not
title: Classify exit code 124 (timeout) as failure, not completed
depends_on: []
task_type: null
engine: null
model: null
mode: implementation
pipeline_mode: full
status: flagged
pipeline_status: testing
priority: medium
pm_complexity: null
planned_effort: null
created_at: '2026-04-07T08:24:48+00:00'
updated_at: '2026-04-08T16:03:50+00:00'
goal: When a subagent process exits with code 124 (killed by timeout), litehive classifies
  it as completed. It should be classified as failed/interrupted. This causes downstream
  issues where the text verdict fallback generates a fake pass verdict. Check subagent
  status classification in subagents/_execution.py and engines/base.py.
acceptance_criteria:
- Exit code 124 is classified as failed or interrupted, not completed
- Any non-zero exit code is not classified as completed
- Timeout-killed agents do not produce pass verdicts
