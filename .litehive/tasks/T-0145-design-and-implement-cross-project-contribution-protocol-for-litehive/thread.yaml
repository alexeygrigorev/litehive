- role: planner
  step: grooming
  verdict: pass
  message: 'Grooming passed after creating the missing local task record for T-0145
    and turning the prompt into an explicit execution contract. Verified by repository
    inspection that no cross-project upstream contribution workflow exists yet, that
    T-0140 already covers the self-heal-litehive-from-external-project slice, and
    that this task should integrate that capability into a broader local-first contribution
    protocol rather than duplicate it. No code tests were run because this was planner-stage
    task shaping only.


    Key shaping decisions:

    - T-0145 now depends on T-0140 so the self-heal execution path is treated as a
    prerequisite slice, while this task owns the broader protocol: upstream issue/task
    creation, source-project attribution, patch handoff, tracking, and docs.

    - The protocol is explicitly local-first: creating a litehive task in the litehive
    workspace is the required baseline; hosted PR or issue integrations can be additive
    but are not required to satisfy the contract.

    - Later stages need proof for four contribution classes: runtime bug, missing
    feature, config/prompt improvement, and engine adapter fix.

    - Later stages also need durable attribution showing which external project and
    source task triggered each upstream contribution.


    PM_COMPLEXITY: complex

    PLANNED_EFFORT: l

    ACCEPTANCE_CRITERIA:

    - litehive exposes a supported CLI workflow for filing an upstream litehive issue/task
    from another project, such as `litehive issue --upstream ...`, and the resulting
    litehive task record preserves source-project metadata.

    - External-project recovery flows can classify a failure as a likely litehive
    bug and create an upstream litehive task automatically instead of only leaving
    a local log entry.

    - The protocol defines and implements a local-first patch handoff path using `litehive_source_path`
    so an external project can propose a litehive fix branch/worktree and file the
    corresponding upstream task or PR context for review.

    - The implementation covers the four required contribution classes: runtime bug
    discovered during task execution, missing feature request, config or prompt improvement
    based on real usage, and engine adapter fix.

    - Litehive durable state and operator-visible views show which upstream contribution
    tasks came from which project and include enough metadata to navigate back to
    the originating workspace/task.

    - `litehive_source_path` is documented and used as the locator for upstream contributions
    into the litehive source repo.

    - Operator documentation in `docs/contributing-back.md` explains how to file an
    upstream issue, how recovery agents escalate automatically, and how to hand off
    a candidate patch without leaving the current project context.


    Implementation plan:

    1. Define the durable upstream contribution model and origin metadata fields in
    litehive task state.

    2. Add the CLI/operator entrypoint for creating upstream litehive tasks from another
    project.

    3. Extend recovery behavior so likely litehive bugs or missing-litehive-feature
    failures can escalate automatically with reproduction context.

    4. Integrate the `litehive_source_path` patch handoff path for litehive fix proposals.

    5. Surface upstream-origin tracking in operator views and document the end-to-end
    workflow in `docs/contributing-back.md`.


    Warning: the workspace state still has `active_task_id: T-0081`, while this worktree
    and report target T-0145. The report was submitted with `--task-id T-0145`, but
    operators should reconcile workspace state separately if they expect T-0145 to
    become the active queued task in this checkout.'
