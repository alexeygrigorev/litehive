goal: Create the first browser operator surface from scratch. Introduce a litehive/web
  package with a server entrypoint, HTML shell, and read-only task and status endpoints
  that mirror the CLI task detail and status views.
acceptance_criteria:
- A new litehive/web package exists with a server entrypoint, shared HTTP helpers,
  and template or static asset structure suitable for later browser tasks.
- GET / serves a browser dashboard shell for the current workspace.
- Read-only endpoints expose workspace status, queue state, and per-task detail data
  sourced from existing state and observability modules.
- The task detail view exposes the core fields from litehive task show, plus report,
  activity, and recovery summaries from existing task artifacts.
- The initial browser UI can navigate between queue items and render task detail,
  recent activity, and empty or error states without any mutation endpoints.
- Tests cover app startup plus the read-only task and status endpoints.
