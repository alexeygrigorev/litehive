goal: 'Split the current PM role into two distinct PM-oriented agents: planner for
  grooming and reviewer for final acceptance. Both should think from the user''s/product
  point of view, but with different prompts, responsibilities, and success criteria.'
acceptance_criteria:
- Grooming routes to planner instead of pm.
- Accepting routes to reviewer instead of pm.
- Planner prompt is PM-oriented and focuses on user problem framing, scope clarification,
  acceptance criteria, decomposition, follow-up tasks, and complexity estimation.
- Reviewer prompt is PM-oriented and focuses on strict end-user outcome validation,
  regression detection, and final done/not-done judgment.
- The runner role mapping and on-disk task artifacts clearly distinguish planner from
  reviewer.
- Documentation explains that planner and reviewer are both PM-style roles with different
  stage ownership and prompts.
