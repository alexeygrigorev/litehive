summary: 'Accepted. Verified the implementation and current workspace behavior for
  the status-mode swap. Code inspection confirms litehive/cli/status.py now uses state-first
  reads by default in dashboard mode, ignores --fast there, and routes --full through
  the hydrated verbose path with status_read_mode: full; litehive/cli/parser.py keeps
  --fast accepted as a deprecated compatibility alias. Direct CLI check: uv run litehive
  status --workspace . exited 0 and printed the concise fast summary header immediately
  (workspace/default_engine/mode/active_task_id/queued_tasks/queue_head/active task
  fields), confirming fast mode is now the default user path. Test evidence: uv run
  pytest -q tests/test_observability_and_status.py -k "status and (default_dashboard
  or full_mode_ignores_fast_flag or default_and_fast_flag_match_dashboard_output or
  parser_accepts_status_fast_flag)" -> 4 passed, 69 deselected in 0.53s. Full regression
  suite: uv run pytest -q -> 909 passed, 3 skipped in 140.55s. Acceptance criteria
  met: default status is fast, --full preserves verbose output, --fast remains a no-op
  compatibility flag, and existing tests pass.'
