summary: 'Grooming complete. I updated T-0248 with PM sizing (simple, effort s), a
  clarified goal, tightened acceptance criteria, one scope constraint, and a 3-step
  implementation plan. Key verification: the packaged CLI entrypoint already routes
  `litehive status` through the fast path in litehive.main unless --full is present,
  so the remaining implementation is an alignment task rather than a net-new feature.
  Evidence checked: pyproject.toml registers litehive = litehive.main:main; litehive/main.py
  short-circuits status to _fast_status when --full is absent; litehive/cli/status.py
  and parser still model fast mode as optional via args.fast/full; tests already cover
  default dashboard output, explicit fast mode, and parser acceptance of --fast. Commands
  run: uv run litehive status --workspace . confirmed default fast-style output; uv
  run litehive status --workspace . --fast confirmed the legacy fast invocation still
  succeeds; uv run pytest -q tests/test_observability_and_status.py -k ''status and
  (fast_mode or default_dashboard or parser_accepts_status_fast_flag)'' passed (3
  passed). Recommended SWE scope: make the status command path itself default to fast/state-first
  reads, keep --full as the explicit verbose path, keep --fast accepted as a no-op
  compatibility alias, and update targeted tests/help/docs to reflect the new default
  consistently across direct _cmd_status and CLI entrypoint behavior.'
