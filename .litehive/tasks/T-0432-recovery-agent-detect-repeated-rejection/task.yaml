goal: 'When the recovery agent is invoked 2+ times with the same rejection fingerprint
  (same failure pattern across cycles), it should stop re-routing and escalate: either
  (a) flag the task as blocked on external issue with a clear fingerprint description,
  or (b) file a follow-up bug task for the specific unfixable failure and close this
  task. Currently recovery just keeps re-routing to the same place until the budget
  is exhausted, burning subagents on doomed cycles.'
acceptance_criteria:
- Recovery tracks rejection fingerprints across its own invocations
- On 2+ identical fingerprints in the recovery history, recovery stops re-routing
  and takes an escalation action
- 'Escalation path: create a follow-up bug task for the failing behavior, then flag
  or close the current task with the reference'
- Test covers the repeat-fingerprint detection and escalation branch
