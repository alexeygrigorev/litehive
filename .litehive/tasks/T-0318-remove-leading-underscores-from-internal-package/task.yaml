goal: "This is a single-user repo. Everything is 'private' by the only convention\
  \ that matters (I am the only consumer). Leading underscores on module names, function\
  \ names, and directory names are visual noise that obscure which names are actually\
  \ internal-to-a-file vs package-wide.\n\nExamples of the noise:\n- `litehive/cli/_pool.py`,\
  \ `_parse.py`, `_display.py`, `_dry_run.py` \u2014 these are sibling modules, not\
  \ file-private anything.\n- `litehive/daemon/_execution.py`, `_state.py`, etc. \u2014\
  \ same.\n- `_cmd_doctor`, `_cmd_run`, `_cmd_status` \u2014 functions called across\
  \ modules but marked private; the underscore is cargo.\n- `_render_finding`, `_subparsers_action`,\
  \ `_filter_public_help`, `_add_command`, `_choice`, `_ns`, `_ctx_command` \u2014\
  \ helpers that are imported from other modules; the underscore is lying.\n- `_ScalarLimit`,\
  \ `_pool_stop_reason_or`, `_load_runtime_state` \u2014 internal but package-wide.\n\
  \nThe rule I actually want: a leading underscore means 'file-private \u2014 defined\
  \ and used only within this one module'. If something is imported from another file\
  \ in the same package, it shouldn't start with an underscore.\n\nScope:\n1. Rename\
  \ all underscore-prefixed module files in `litehive/` that are imported from sibling\
  \ modules. (Keep `__init__.py`.)\n2. Rename all underscore-prefixed functions/classes/constants\
  \ in `litehive/` that are imported across files in the same package. Leave truly\
  \ file-local helpers alone.\n3. Update every importer.\n4. Update any string references\
  \ in tests (e.g. `from litehive.cli._pool import ...` \u2192 new name).\n5. heru/\
  \ is a separate repo \u2014 out of scope.\n\nDo NOT touch:\n- `__init__.py`, `__main__.py`\
  \ (dunder, not single underscore)\n- File-local helpers with underscore prefix that\
  \ stay inside one module\n- External public API stability \u2014 nothing outside\
  \ litehive imports these, so renames are free\n- The actual litehive package-internal\
  \ dir names that start with `_` if any exist (list them as part of the task, don't\
  \ assume)\n\nStart by grepping for all `_`-prefixed imports across the package (`from\
  \ litehive.* import _*` and `from ._* import`) and producing the full rename list\
  \ as the first step. Then do renames in small batches per subpackage."
acceptance_criteria:
- No `from litehive.xxx import _something` in the codebase (except dunder names)
- No `from ._something import` across sibling modules in the same package (except
  dunder names)
- All tests pass after the rename
- File-local helpers that are genuinely only used within their defining module may
  keep their underscore prefix
- heru/ repo is not modified
