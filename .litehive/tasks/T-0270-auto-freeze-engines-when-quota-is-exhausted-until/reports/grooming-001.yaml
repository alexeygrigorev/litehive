  \ reset timestamp.\n- The selector should distinguish:\n  - active freeze in the\
  \ future: skip engine immediately and do not call quota APIs for that engine.\n\
  \  - freeze expired: allow one fresh quota check; if still exhausted and reset is\
  \ known, refresh the freeze; if recovered, continue normally.\n- Dry-run should\
  \ use the same selector contract or a shared helper so predicted engine choice matches\
  \ actual runtime behavior.\n- The implementation should stay scoped to engine selection\
  \ and freeze persistence; do not broaden into unrelated engine adapter cleanup.\n\
  \nTASK_UPDATE:\ngoal: When quota detection finds an engine exhausted and provides\
  \ a reset timestamp, Litehive automatically freezes that engine until the reset\
  \ time, skips it without further quota/API checks while the freeze is active, and\
  \ re-checks quota once the freeze expires before using it again.\nacceptance_criteria:\n\
  \  - When the preferred engine reports quota exhaustion with a known reset timestamp,\
  \ Litehive records an engine freeze until that timestamp and falls back to the next\
  \ eligible engine.\n  - While an engine freeze is still active, execution, recovery-engine\
  \ selection, and dry-run planning all skip that engine without calling its quota\
