summary: 'Implemented a shared pipeline select_engine() path and routed execution,
  recovery, and dry-run engine choice through it. The selector now skips active engine
  freezes before quota/API checks, re-checks engines once a freeze expires, auto-persists
  a freeze to config.engine_freeze when quota exhaustion includes a reset timestamp,
  and refreshes that freeze if the engine is still exhausted after expiry. Runtime
  builder fallback logic now consumes the shared selector without reintroducing previously
  failed engines, recovery auto-engine selection uses the same selector and selected
  model, and dry-run planning uses the same chooser so predicted fallback behavior
  matches runtime. Added focused tests for auto-freeze persistence, active-freeze
  skip without quota call, expired-freeze recheck for both refresh and recovery, and
  call-site coverage for builder/dry-run/recovery delegation. Verification: uv run
  ruff check --select E402,F401 litehive tests; uv run pytest -q tests/test_commit_to_git_and_checkpoint.py::test_run_next_task_records_blocked_reason_code_when_fallbacks_are_exhausted;
  uv run pytest -q tests/test_engine_freeze.py tests/test_crash_resume.py tests/test_run_cli.py;
  uv run pytest -q. Evidence: 918 passed in 144.55s on the full pytest run after fixing
  one fallback-loop regression surfaced during verification.'
