  message: 'Implemented a shared pipeline select_engine() path and routed execution,
    recovery, and dry-run engine choice through it. The selector now skips active
    engine freezes before quota/API checks, re-checks engines once a freeze expires,
    auto-persists a freeze to config.engine_freeze when quota exhaustion includes
    a reset timestamp, and refreshes that freeze if the engine is still exhausted
    after expiry. Runtime builder fallback logic now consumes the shared selector
