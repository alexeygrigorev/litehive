goal: "These three commands are hidden=True in the typer app, so they don't show up\
  \ in `litehive --help`. They are all legitimately useful and I want to keep them\
  \ \u2014 they just aren't discoverable.\n\n- `litehive recover <task_id>`: requeue\
  \ a completed task without reverting code (useful when an accepted task needs a\
  \ follow-up pass without git rollback).\n- `litehive switch <task_id> <engine> --reason\
  \ \"...\"`: stop a task, record an engine switch in its thread comment, requeue\
  \ it for the next iteration with the new engine.\n- `litehive prioritize <task_id>\
  \ [task_id ...]`: bulk-promote multiple queued tasks to the front in the requested\
  \ order.\n\nWork:\n1. Remove hidden=True from all three in litehive/cli/ after the\
  \ T-0317 rewrite.\n2. Add a section to README.md under Usage explaining when to\
  \ use each, with example invocations.\n3. Mention them in CLAUDE.md's CLI overview\
  \ if it has one.\n\nDependency: should land after T-0317 to avoid merge conflicts\
  \ with the CLI rewrite."
acceptance_criteria:
- recover, switch, prioritize are visible in `litehive --help`
- README.md has a section documenting all three with example usage
- Each command has a clear --help one-liner explaining when to use it
