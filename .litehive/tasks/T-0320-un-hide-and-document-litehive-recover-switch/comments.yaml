- role: recovery
  step: recovering
  verdict: pass
  message: 'Root cause: `commit_to_git` auto-committed every dirty worktree file before
    merging, including runner-owned task metadata under `.litehive/tasks/<task-id>-*/task.yaml`.
    For T-0320, the worktree checkpoint commit included that task metadata rewrite,
    while the main checkout also had its own local runner-written edit to the same
    `task.yaml`. `git merge` then aborted with `Your local changes ... would be overwritten
    by merge`, even though the task''s real implementation changes were mergeable.


    Litehive fix made: narrowed `GitCommitNode._autocommit_worktree_changes()` so
    the automatic checkpoint commit excludes runner-owned workspace metadata for the
    current task (`.litehive/tasks/<task-id>-*`, archived copies, and `.litehive/state.yaml`).
    The node now also skips creating an auto-commit entirely when those excluded metadata
    files are the only dirty paths. Added a regression test covering the exact failure
    mode: main has a local runner edit to task metadata, the worktree has both a real
    code/doc change and a task metadata rewrite, and `commit_to_git` must merge the
    real change without touching the runner-owned metadata.


    Why retry should succeed: the failed T-0320 branch already contains the intended
    CLI/help changes, and the merge blocker was Litehive''s checkpoint plumbing, not
    the task implementation. With the metadata excluded from the worktree auto-commit,
    the next commit-stage retry should merge the actual task changes cleanly instead
    of crashing on `task.yaml`.


    Verification:

    - `uv run pytest tests/test_pipeline_v2_hooks_and_commit.py`

    - `uv run pytest tests/test_root_queue_recovery_help.py`

    '
