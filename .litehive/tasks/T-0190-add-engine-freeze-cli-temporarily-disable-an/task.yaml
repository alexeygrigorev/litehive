goal: 'Add ''litehive engine freeze codex --until 2026-04-08'' to temporarily disable
  an engine. Frozen engines are skipped during engine selection and fallback. This
  is a manual step toward automatic quota-based engine switching. Store frozen state
  in config.yaml (e.g. engine_freeze: {codex: ''2026-04-08''}). Auto-unfreeze when
  the date passes.'
acceptance_criteria:
- '''litehive engine freeze <engine> --until <datetime>'' disables the engine (supports
  both date like 2026-04-08 and datetime like "2026-04-08 09:47", interpreted as local
  timezone, stored as UTC)'
- Frozen engines are skipped in resolve_engine_plan and fallback chains
- '''litehive engine unfreeze <engine>'' removes the freeze manually'
- '''litehive status'' shows frozen engines with their unfreeze date'
- Frozen engines auto-unfreeze when the date passes
