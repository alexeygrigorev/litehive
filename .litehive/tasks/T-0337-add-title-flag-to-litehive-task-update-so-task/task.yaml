goal: '''litehive task update'' should support renaming a task''s title in place.
  Today there is no way to change a title after creation, which forces close-and-recreate
  workflows that burn task ids and fragment history. The task id must be preserved
  across the rename.'
acceptance_criteria:
- '''litehive task update <id> --title "new title"'' replaces the stored title'
- '''litehive task show <id>'' reflects the new title'
- Task id is preserved across the rename
- tests/ passes
constraints:
- Keep provider-specific behavior isolated to the adapter boundary.
- Preserve deterministic workspace state and execution flow.
