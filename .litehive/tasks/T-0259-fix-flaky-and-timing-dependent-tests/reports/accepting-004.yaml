summary: 'Accepted after review of the test-only diff plus independent spot verification.
  Verified the implementation changes match the acceptance criteria: tests/test_inactivity_timeout.py
  raises the inactivity timeout margins from 0.5s to 1.0s in the timing-sensitive
  cases; tests/test_tasks_and_subagents.py re-enables the previously skipped callable-override
  coverage and isolates class-level ExternalCLIAdapter monkeypatching with reload-scoped
  helpers and fresh engine instances so state does not leak between tests; tests/test_web_snapshot_and_verdicts.py
  replaces hardcoded calendar timestamps with current UTC-derived values while preserving
  ordering assertions. I independently ran: uv run pytest -q tests/test_inactivity_timeout.py
  tests/test_tasks_and_subagents.py -k ''has_callable_override or keeps_inherited_run_live_when_base_run_is_rebound
  or does_not_leak_rebound_base_run_between_engines'' tests/test_web_snapshot_and_verdicts.py
  -k ''runner_status_readonly or build_workspace_snapshot or submit_stage_verdict_via_web''
  and got 14 passed, 35 deselected in 1.25s. QA evidence also reports repeated targeted
  runs for the three affected areas, confirms the flaky override tests are no longer
  skipped, notes the only remaining skip in tests/test_tasks_and_subagents.py is unrelated
  and justified, and reproduces 10 consecutive clean full-suite runs of uv run pytest
  -q with 891 passed each time. Based on the diff plus independent verification, the
  named flaky areas are stabilized, no task-relevant skipped tests remain, and the
  full-suite reliability criterion is satisfied.'
