- role: swe
  step: implementing
  verdict: pass
  message: "Implemented flow statistics and bottleneck reporting for pool runs.\n\n\
    ## What was implemented\n\nAdded flow statistics and bottleneck reporting to the\
    \ pool run summary in litehive/cli/_pool.py:\n\n1. **_fmt_seconds(seconds)** -\
    \ local duration formatter (e.g. 10s, 2m00s, 1h05m)\n\n2. **_task_reports_dir(root,\
    \ task_id)** - finds the reports directory for a task by searching the tasks dir\
    \ for a folder with the matching task_id prefix\n\n3. **_collect_task_stage_stats(root,\
    \ task_id)** - reads all report YAMLs for a task and returns step/verdict/duration_seconds\
    \ for each\n\n4. **_compute_pool_flow_statistics(root, task_entries)** - aggregates\
    \ across all provided task entries: per-stage average durations, pass/fail counts,\
    \ total stages executed, and identifies the bottleneck stage (highest average\
    \ duration). Returns None when no stage has non-zero duration data.\n\n5. **_pool_summary_report_data**\
    \ updated to include flow_stats from _compute_pool_flow_statistics for completed+flagged\
    \ tasks\n\n6. **_pool_summary_report_lines** updated to render flow_stats section\
    \ when present:\n   - flow_stats: stages_executed=N bottleneck=implementing (avg=2m00s)\n\
    \   - stage_durations: grooming=10s implementing=2m00s testing=30s ...\n   - stage_failures:\
    \ implementing=1 testing=1 (only when failures present)\n\nThe flow_stats dict\
    \ is also persisted in the durable YAML report under .litehive/logs/pool-runs/.\n\
    \n## Tests added (7 new tests in test_observability_and_status.py)\n\n1. test_compute_pool_flow_statistics_returns_none_when_no_durations\
    \ - no timing data returns None\n2. test_compute_pool_flow_statistics_identifies_bottleneck\
    \ - slowest stage identified correctly\n3. test_compute_pool_flow_statistics_averages_across_multiple_tasks\
    \ - averages across 2 tasks\n4. test_compute_pool_flow_statistics_tracks_failures\
    \ - stage failures counted and averaged with retries\n5. test_pool_summary_includes_flow_stats_lines_when_durations_available\
    \ - text output includes flow_stats/stage_durations lines\n6. test_pool_summary_omits_flow_stats_when_no_duration_data\
    \ - no output when data unavailable\n7. test_pool_summary_flow_stats_in_durable_report\
    \ - flow_stats key present in YAML report\n\n## Verification\n- 70/70 tests pass\
    \ in test_observability_and_status.py (63 pre-existing + 7 new)\n- 40 failures\
    \ in the broader suite are all pre-existing and unrelated to this change (verified\
    \ by git stash)\n- Files changed: litehive/cli/_pool.py, tests/test_observability_and_status.py"
  files_changed: []
  created_at: '2026-04-06T10:10:38+00:00'
- role: qa
