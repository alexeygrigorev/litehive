  message: "REJECT: Implementation has substantive gaps vs acceptance criteria.\n\n\
    TESTS RUN: 7 new tests in test_observability_and_status.py all pass. 40 pre-existing\
    \ failures on HEAD are unrelated to this task.\n\nEXPECTED (from task.yaml acceptance\
    \ criteria):\n1. pool-summary.txt includes a 'flow_statistics' section with per-stage\
    \ counts (pass, fail, retry) AND duration metrics (avg_seconds, min_seconds, max_seconds).\n\
    2. Bottleneck tie-breaking uses retry count when average durations are equal.\n\
    3. Durable YAML contains 'flow_statistics' and 'bottleneck' as fields.\n4. Tests\
    \ verify bottleneck tie-breaking by retry count.\n\nOBSERVED:\n1. Output key is\
    \ 'flow_stats:' not 'flow_statistics:' in both pool-summary.txt and durable YAML.\
    \ Only avg duration is tracked \u2014 min_seconds and max_seconds are never computed\
    \ or stored. Stage pass counts are not shown in the text summary (only fail counts\
    \ via stage_failures: line).\n2. Bottleneck is selected with Python max() on avg_seconds\
    \ only \u2014 no retry-count tie-breaking: 'bottleneck_stage = max(stage_avg_durations,\
    \ key=lambda s: stage_avg_durations[s])' (litehive/cli/_pool.py:107).\n3. Durable\
    \ YAML stores nested 'flow_stats' dict with 'bottleneck_stage' key inside it,\
    \ not top-level 'bottleneck' field.\n4. No test for bottleneck tie-breaking by\
    \ retry count exists in the test suite.\n\nREPRODUCE GAP 1 (naming/metrics):\n\
    \  grep 'flow_stats\\|flow_statistics\\|min_seconds\\|max_seconds' litehive/cli/_pool.py\n\
    \  \u2192 Only 'flow_stats' found; min/max never computed from stage_durations\
    \ list.\n\nREPRODUCE GAP 2 (tie-breaking):\n  grep -n 'tiebreak\\|retry_count\\\
    |tie' litehive/cli/_pool.py \u2192 nothing\n  The _compute_pool_flow_statistics\
    \ function builds stage_avg_durations but bottleneck = max(stage_avg_durations,\
    \ ...) with no secondary sort key.\n\nREPRODUCE GAP 4 (missing test):\n  uv run\
    \ pytest tests/test_observability_and_status.py -k 'tie' \u2192 no tests collected.\n\
    \nCRITERIA MET: criteria 4 (scope to current run), 5 (omit empty stages), 6 (pre-existing\
    \ failures unchanged). The core mechanism (flow aggregation, bottleneck identification,\
    \ durable YAML inclusion, stage-scoped collection) is correctly structured.\n\n\
    FIXES NEEDED:\n- Rename 'flow_stats' -> 'flow_statistics' in report data keys\
    \ and text output.\n- Add min_seconds and max_seconds to per-stage stats (keep\
    \ raw list and compute min/max at emit time).\n- Add retry_count tie-breaking:\
    \ secondary sort by sum of fail_counts for the stage.\n- Add test: two stages\
    \ with equal avg_seconds, verify bottleneck = the one with more retries (fail_counts)."
