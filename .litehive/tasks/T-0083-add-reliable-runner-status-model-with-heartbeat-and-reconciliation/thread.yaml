- role: planner
  step: grooming
  verdict: pass
  message: "Grooming PASS for T-0099: Add flow statistics and bottleneck reporting\
    \ for pool runs.\n\nSCOPE: After a pool drain run, operators currently see completed/flagged/skipped\
    \ task counts and stage outcomes per task, but have no aggregated view of where\
    \ time is spent or where failures cluster across stages. This task adds per-stage\
    \ flow statistics and bottleneck identification to the pool run summary.\n\nGOAL:\
    \ Extend the pool run summary (pool-summary.txt and the durable YAML under .litehive/logs/pool-runs/)\
    \ with (a) per-stage aggregate statistics derived from completed-task report YAMLs\
    \ in the current pool run, and (b) a bottleneck field naming the pipeline stage\
    \ with the highest average duration or most retries.\n\nACCEPTANCE CRITERIA:\n\
    1. After litehive run --drain completes, pool-summary.txt includes a flow_statistics\
    \ section with per-stage counts (pass, fail, retry) and duration metrics (avg_seconds,\
    \ min_seconds, max_seconds).\n2. pool-summary.txt includes a bottleneck field\
    \ naming the pipeline stage with the highest average duration (ties broken by\
    \ retry count).\n3. The durable YAML under .litehive/logs/pool-runs/ contains\
    \ the same flow_statistics and bottleneck fields.\n4. Statistics cover only tasks\
    \ processed in the current pool run (completed + flagged), not the full workspace\
    \ history.\n5. Pipeline stages with no report data in the current run are omitted\
    \ from flow_statistics rather than shown as zeros.\n6. All existing tests still\
    \ pass.\n7. New focused tests verify: (a) flow statistics aggregation from mock\
    \ report YAML data, (b) bottleneck selection when stages have different avg durations,\
    \ (c) bottleneck tie-breaking by retry count, (d) correct inclusion of flow_statistics\
    \ and bottleneck in pool_summary_report_lines output.\n\nPLAN:\n1. Add _compute_flow_statistics(root,\
    \ task_ids) in litehive/cli/_pool.py \u2014 reads report YAMLs for the given task\
    \ IDs, groups by step, computes pass/fail/retry counts and duration metrics per\
    \ stage.\n2. Add _identify_bottleneck(flow_stats) that returns the stage name\
    \ with highest avg_seconds, with retry_count as tiebreaker.\n3. Extend _pool_summary_report_data\
    \ to call these helpers with the completed+flagged task IDs and add flow_statistics\
    \ and bottleneck keys to the returned dict.\n4. Extend _pool_summary_report_lines\
    \ to emit flow_statistics per-stage lines and a bottleneck line in the text output.\n\
    5. Add tests in tests/test_observability_and_status.py covering the four criterion-7\
    \ cases above.\n\nFILES EXPECTED TO CHANGE:\n- litehive/cli/_pool.py (core logic)\n\
    - tests/test_observability_and_status.py (new tests)\n\nPM_COMPLEXITY: moderate\n\
    PLANNED_EFFORT: s\n\nBASELINE: 63 tests pass in test_observability_and_status.py\
    \ (no regressions at grooming time)."
  files_changed: []
