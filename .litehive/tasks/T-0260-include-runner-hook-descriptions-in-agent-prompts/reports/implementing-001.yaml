summary: 'Implemented a narrow follow-up fix for the reviewer-found regression in
  commit-stage hook handling. Preserved the new hook-origin report shape and diagnostics,
  but restored after_merge commit-stage semantics so post-merge hook failures return
  verdict=blocked with retry_decision=retry, keeping the merged main state and requeueing
  the task at implementing without reverting the merge. This leaves the intended T-0260
  behavior unchanged for implementing/accepting hooks: SWE prompts include configured
  runner hooks with command+description, RunnerHook supports optional description,
  StageReport carries source=agent|hook, and blocking implementing/accepting hook
  failures persist structured hook reports with command, exit code, stdout/stderr
  feedback and route back to SWE instead of flagging. Verified with uv run pytest
  -q tests/test_retry_commit_and_recovery.py::test_commit_to_git_requeues_implementing_when_after_merge_hook_fails
  and uv run pytest -q tests/test_runner_workflow.py tests/test_task_commands_and_daemon.py
  tests/test_config_and_run_cli.py; 287 tests passed total across those runs.'
