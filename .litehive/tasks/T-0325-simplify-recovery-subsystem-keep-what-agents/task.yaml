goal: "Recovery is load-bearing \u2014 the system must self-heal. The goal is SIMPLIFY,\
  \ not delete.\n\nTarget state machine on stage failure:\n  break -> attempt recovery\
  \ -> success? continue state machine : declare failed\n\nCurrent state is ~3000\
  \ LOC across pipeline/recovery/ (workspace_repair.py 1061, execution_recovery.py\
  \ 676, detection.py 282, doctor.py 279) + ~2400 LOC of tests. Too much code for\
  \ a single-user self-healing loop.\n\n### Target size\n~1000 LOC code + ~800 LOC\
  \ tests. 60-65% reduction while preserving every path the daemon actually uses for\
  \ self-healing.\n\n### Methodology\n1. Classify every public function in litehive/pipeline/recovery/\
  \ as LIVE (called by daemon in normal failure path), TEST-ONLY, or DEAD (historical\
  \ bug workaround).\n2. For the state-machine loop itself: make the happy path obvious\
  \ \u2014 `stage_failed -> try_recover(stage) -> recovered? resume : mark_failed`.\
  \ Any code that doesn't fit this shape is candidate for removal.\n3. Historical-bug\
  \ handlers (e.g. _is_orphaned_commit_stage_task, _should_resume_done_task_at_commit_stage,\
  \ _recover_existing_checkpoint_commit, _recover_flagged_commit_task) are specific\
  \ fixes to incidents I hit once. Verify reproducing condition is unreachable today,\
  \ then delete.\n4. Workspace_repair.py scan logic beyond stale-runner cleanup and\
  \ interrupt bookkeeping is shelfware \u2014 delete.\n\n### Non-negotiable keeps\n\
  - recover_stale_runner_state (daemon crash cleanup)\n- _mark_interrupted_subagent\
  \ / _prepare_interrupted_task (ctrl-c bookkeeping)\n- Self-heal recovery agent path\
  \ (this is the main self-healing loop)\n- Any function the stage loop calls directly\
  \ on failure\n\n### Candidates to cut\n- litehive doctor CLI command (I never type\
  \ it)\n- litehive rollback CLI command\n- Scan checks in doctor.py beyond what's\
  \ essential\n- Narrow historical-bug handlers in workspace_repair.py\n- Tests covering\
  \ deleted paths\n\n### Verification\n- Simulated kill -9 during stage: daemon recovers,\
  \ workspace is clean\n- Simulated ctrl-c: interrupt bookkeeping written, task resumable\n\
  - Simulated stage reject: recovery agent gets called, either recovers or marks failed\n\
  - All remaining tests pass"
acceptance_criteria:
- Each public function in litehive/pipeline/recovery/ classified as LIVE/TEST-ONLY/DEAD
  with grep evidence in the task journal
- recover_stale_runner_state, _mark_interrupted_subagent, _prepare_interrupted_task
  preserved unchanged
- Historical-bug handlers in workspace_repair.py verified and deleted only after confirming
  reproducing condition cannot occur
- Simulated daemon crash (kill -9) still produces clean workspace via recovery path
- Simulated ctrl-c during stage still writes interruption bookkeeping
- All tests pass; tests for deleted paths removed not ported
- Recovery subsystem reduced by at least 40% in LOC (code + tests)
