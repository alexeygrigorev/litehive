summary: 'Verified the CLI reorganization against the acceptance criteria. Public
  help exposes grouped commands task, queue, import, worktree, and archive plus top-level
  start, stop, and restart, while removed or internal names are absent from top-level
  help. I checked uv run litehive --help, uv run litehive task --help, uv run litehive
  queue --help, uv run litehive import --help, uv run litehive start --help, uv run
  litehive stop --help, uv run litehive restart --help, and uv run litehive run --help;
  run remains the foreground runner path. Backward-compat aliases still execute directly
  through their hidden parsers, including daemon, import-issue, prioritize, and switch,
  but they stay hidden from public help. Verified litehive queue still reports queue
  state: on a fresh configured workspace it printed active_task_id None, queue_length
  0, and resumable_tasks 0; on the populated repo workspace it returned the full queue
  listing in about 15 seconds. I scanned current user-facing docs, prompts, config
  guidance, and web code for stale command references with rg; remaining matches were
  internal compatibility routes such as /api/daemon and /api/queue/prioritize or generic
  prose about daemon logs, not stale public CLI commands. Focused regression slice
  passed with uv run pytest -q tests/test_run_cli.py tests/test_web_daemon_monitor.py
  tests/test_web_task_actions.py tests/test_web_snapshot_and_verdicts.py tests/test_runner_workflow.py
  -q. Full suite passed with uv run pytest -q: 910 passed in 133.89s. Evidence supports
  the acceptance criteria for grouped CLI names, hidden legacy aliases, updated docs
  and prompts, aligned web terminology, and passing tests.'
