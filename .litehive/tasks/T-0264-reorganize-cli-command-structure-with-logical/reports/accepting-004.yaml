summary: 'Accepted. I verified the current workspace directly against the acceptance
  criteria. uv run litehive --help shows the reorganized public surface with grouped
  task, queue, import, engine, worktree, and archive commands plus top-level start,
  stop, restart, and foreground-only run; removed/internal names such as daemon, dirty-worktree-gate,
  recover, prioritize, switch, import-issue, and import-issues are not exposed in
  public help. uv run litehive task --help exposes add/list/show/update/close/abandon/debug/logs;
  uv run litehive queue --help exposes move/promote/requeue/resume/stop; uv run litehive
  import --help exposes github/spec/issue, preserving the upstream issue-filing workflow
  under the new grouped path. I also checked uv run litehive start --help, stop --help,
  restart --help, and run --help; run remains the foreground execution path and is
  not a daemon alias. User-facing docs, prompts, config guidance, and the context
  template now use the new vocabulary, including the agent-facing API centered on
  litehive report, litehive task add, litehive task update, and litehive task close.
  Web terminology is aligned: the implementation and tests use /api/runner/*, queue/requeue,
  and queue/stop, while any /api/daemon/* handling remains only as temporary compatibility
  aliases. Verification I ran locally: uv run litehive --help, uv run litehive task
  --help, uv run litehive queue --help, uv run litehive import --help, uv run litehive
  start --help, uv run litehive stop --help, uv run litehive restart --help, uv run
  litehive run --help, rg checks over README/docs/.litehive/context.md/prompt/config
  files for command references, and uv run pytest -q tests/test_run_cli.py tests/test_web_daemon_monitor.py
  tests/test_web_task_actions.py tests/test_web_snapshot_and_verdicts.py tests/test_runner_workflow.py
  -q, which passed. QA previously ran the full suite with uv run pytest -q and reported
  910 passed; nothing I observed contradicts that evidence. Outcome: pass.'
