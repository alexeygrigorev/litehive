summary: 'Implemented the CLI surface reorganization and aligned the web/docs/prompts
  to it. Public parser now exposes grouped task, queue, and import commands plus top-level
  start/stop/restart; legacy flat names remain available as hidden compatibility parsers.
  queue requeue now covers completed-task recover semantics, run remains foreground-only,
  daemon and other removed/internal names are no longer in public help, and the web
  dashboard now uses /api/runner/*, /api/queue/requeue, and /api/queue/stop on the
  public surface. Updated README, affected docs, and agent prompt guidance to use
  litehive report, litehive task add, litehive task update, and litehive task close
  terminology. Verification: uv run litehive --help, uv run litehive task --help,
  uv run litehive queue --help, and uv run litehive import --help showed the new grouped
  public surface; uv run ruff check --select E402,F401 litehive tests passed; focused
