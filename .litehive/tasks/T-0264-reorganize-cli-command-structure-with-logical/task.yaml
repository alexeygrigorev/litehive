goal: Restructure the CLI for clarity. Group commands under task/queue/engine/worktree/archive/import.
  Rename daemon to start/stop/restart. Remove internal commands from public API. Keep
  backward compat aliases temporarily.
acceptance_criteria:
- litehive start/stop/restart replace daemon run/stop/restart
- litehive task add/list/show/update/close/abandon/debug/logs group task commands
- litehive queue/queue move/queue promote/queue requeue/queue resume group queue commands
- litehive import github/import spec replace issue/intake/import-issue/import-issues
- litehive run is foreground only, litehive start is background
- dirty-worktree-gate removed from public CLI
- recover/prioritize/switch removed, functionality covered by other commands
- Old command names kept as hidden aliases for backward compat
- 'Agent-facing API is 4 commands: report, task update, task close, task add'
- All existing tests pass
- README.md updated with new command names and examples
- Agent prompts updated to use new command names (litehive report, litehive task update,
  litehive task close, litehive task add)
- config.yaml agent_startup_guidance updated with new command names
- context.md template updated if it references CLI commands
- All docs/*.md files updated with new command names
- Web dashboard API endpoints and UI labels match new CLI terminology (e.g. start/stop
  not daemon, task group names)
- Web dashboard action buttons use same command names as CLI
constraints:
- Update all docs and prompts that reference CLI commands - no stale references
- Web dashboard must use same terminology as CLI - no mismatch between web and terminal
