goal: Add web dashboard support for submitting a stage verdict for the active task,
  mirroring the litehive report CLI flow so operators can move review stages forward
  from the browser.
acceptance_criteria:
- POST /api/report accepts the active task verdict payload with role, step, verdict,
  and message, records it in the task thread, and returns an updated task payload
  or a clear validation error.
- When the selected task is the active task and its pipeline stage is testing or accepting,
  the dashboard shows a verdict submission form with pass, fail, reject, blocked,
  and comment actions plus a message textarea.
- Submitting the form updates the task detail view without a manual page reload so
  the new thread entry and resulting pipeline status are visible in the dashboard.
- Tasks outside reviewable stages, or tasks that are not the active task, do not show
  the verdict submission control.
constraints: []
plan:
- Reuse the existing CLI report semantics in a web helper that appends a TaskThreadComment
  for the active task and validates the required payload fields.
- Expose the helper through POST /api/report and cover success plus invalid-input
  cases with targeted web handler tests.
- Extend the dashboard task detail panel to render a review-stage verdict form, submit
  it via fetch, and refresh local snapshot state after success.
- Add focused web snapshot/template tests that verify the form gating and the post-submit
  UI/thread refresh behavior.
