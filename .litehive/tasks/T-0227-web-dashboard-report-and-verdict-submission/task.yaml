goal: Add a web form for submitting stage verdicts (pass, fail, reject, blocked, comment)
  for the active task, mirroring the litehive report CLI command. This enables operators
  to drive the pipeline from the browser without needing the terminal.
acceptance_criteria:
- POST /api/report endpoint submits a stage verdict with role, step, and message
- Frontend shows a verdict submission form when a task is in a reviewable stage (testing,
  accepting)
- Verdict options (pass, fail, reject, blocked, comment) are presented as buttons
  with a message textarea
- After submission, the task state updates and the UI reflects the new pipeline status
