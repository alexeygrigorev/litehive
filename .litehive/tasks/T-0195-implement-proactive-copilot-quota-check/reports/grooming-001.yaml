  \ The copilot CLI itself uses this same endpoint internally.\n\n### Response Format\
  \ (verified live)\nTop-level fields: `login`, `access_type_sku`, `copilot_plan`,\
  \ `quota_reset_date`, `quota_reset_date_utc`.\n\n`quota_snapshots` dict with three\
  \ sub-objects: `chat`, `completions`, `premium_interactions`.\n\nEach snapshot contains:\n\
  - `entitlement` (int): total requests allowed (0 if unlimited)\n- `remaining` (int):\
  \ requests remaining\n- `percent_remaining` (float): percentage remaining (0-100)\n\
  - `unlimited` (bool): whether quota is unlimited\n- `overage_count` (int): requests\
  \ over limit\n- `overage_permitted` (bool): whether overage is allowed\n- `quota_remaining`\
  \ (float): remaining quota\n- `quota_id` (str): snapshot name\n- `timestamp_utc`\
  \ (str): ISO-8601 timestamp\n- `has_quota` (bool)\n- `quota_reset_at` (int)\n\n\
