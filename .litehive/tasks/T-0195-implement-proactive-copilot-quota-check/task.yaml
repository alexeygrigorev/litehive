  the endpoint is GET https://github.com/github-copilot/chat/entitlement with GitHub
  session cookies (credentials: include). Returns monthly premium interaction quota
  percentage. Need to figure out how to get auth tokens from the copilot CLI or GitHub
  CLI (gh) rather than browser cookies. Check if gh auth token or copilot CLI stores
  credentials we can reuse.'
acceptance_criteria:
- Find the exact API endpoint for copilot quota (try gh auth token with github.com/github-copilot/chat/entitlement
  or alternatives)
- Verify it works from CLI without browser cookies
- Document the response format (fields, quota percentage, reset time)
- Produce a follow-up implementation task with exact endpoint, auth method, response
  fields, and code to write
- This is research only - no code changes
