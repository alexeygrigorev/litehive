  message: "Task shaped for rework. The current tree already contains divergence-detection\
    \ code, but it does not match the product requirement: `litehive/daemon/execution.py`\
    \ currently attempts automatic recovery by creating a backup branch and hard-resetting\
    \ to `origin/main`, and on failure it falls back to `pool_stop_reason=attention_required`.\
    \ This task should instead stop immediately with an explicit `diverged_from_origin`\
    \ stop reason and operator-facing manual reconciliation guidance. `litehive status`\
    \ should surface that state prominently.\n\nScope stays narrow: only daemon pre-pick\
    \ git sync/divergence behavior, persisted stop reason, status/attention rendering,\
    \ and regression coverage for those paths. Do not expand this into generic git\
    \ health checks or broader recovery automation.\n\nTASK_UPDATE:\n  action: requeue\n\
    \  task_type: bugfix\n  priority: critical\n  pm_complexity: moderate\n  planned_effort:\
    \ s\n  goal: >-\n    Before the daemon picks each new task from the pool, it must\
    \ refresh `origin/main`\n    and compare it against local `main`. If the two branches\
    \ have truly diverged\n    (neither side is an ancestor of the other), the daemon\
    \ must stop the pool and\n    require a human to reconcile the branch state before\
    \ any more work is started.\n    This prevents the T-0266 failure mode where the\
    \ daemon continued committing for\n    hours on a local `main` that no longer\
    \ matched upstream history.\n  acceptance_criteria:\n    - >-\n      On every\
    \ daemon iteration before a new task is picked, Litehive runs `git fetch`\n  \
    \    for `origin main` and evaluates local `main` versus `origin/main` using\n\
    \      fast-forward/ancestor semantics.\n    - >-\n      If local `main` and `origin/main`\
    \ are equal, or either side can fast-forward\n      to the other, the daemon continues\
    \ normally and does not stop the pool for\n      divergence.\n    - >-\n     \
    \ If local `main` and `origin/main` have truly diverged, the daemon halts before\n\
    \      starting task work, persists `pool_stop_reason=diverged_from_origin`, and\
    \ does\n      not attempt auto-recovery, backup-branch creation, or reset/merge/rebase\
    \ on the\n      operator's behalf.\n    - >-\n      The operator-facing error\
    \ and/or attention message names both refs and gives\n      concrete manual reconciliation\
    \ guidance, including inspecting\n      `git log --oneline --left-right main...origin/main`\
    \ and then reconciling with\n      reset, rebase, or merge before restarting the\
    \ pool.\n    - >-\n      `litehive status` shows this condition prominently as\
    \ an attention-required\n      state, with the stop reason and remediation visible\
    \ without needing to inspect\n      daemon logs.\n    - >-\n      Regression tests\
    \ cover the non-diverged cases (equal, local behind, local ahead)\n      and the\
    \ true-divergence case, plus status/attention rendering for the persisted\n  \
    \    `diverged_from_origin` stop reason.\n  constraints:\n    - Keep changes scoped\
    \ to daemon divergence handling, persisted stop reason wiring, and status/attention\
    \ presentation.\n    - Do not add automatic branch reconciliation in this task.\n\
    \  plan:\n    - >-\n      Replace the current divergence branch in `litehive/daemon/execution.py`\
    \ so the\n      pre-pick check fetches `origin main`, treats only true split-history\
    \ as fatal,\n      and stops with `diverged_from_origin` instead of auto-recovering.\n\
    \    - >-\n      Remove or bypass the current auto-recovery path for this scenario,\
    \ including any\n      backup-branch/reset behavior that conflicts with manual\
    \ reconciliation.\n    - >-\n      Ensure the persisted stop reason and any attention\
    \ item or daemon output use the\n      same `diverged_from_origin` vocabulary\
    \ end to end.\n    - >-\n      Update `litehive status` and related attention\
    \ rendering so divergence appears as\n      a prominent attention-required condition\
    \ with actionable remediation text.\n    - >-\n      Add focused tests for ancestor/equality\
    \ cases, true divergence, persisted stop\n      reason behavior, and status/attention\
    \ output.\n\nNext agent should treat the existing auto-recovery implementation\
    \ as the main product mismatch to remove or refactor, not as a foundation to preserve.\n"
