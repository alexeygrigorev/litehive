goal: "Before starting the pool, daemon should git fetch origin and check if local\
  \ main and origin/main have diverged (not fast-forward). If so, halt the pool with\
  \ a clear error \u2014 something went wrong and manual reconciliation is needed.\
  \ Prevents the T-0266 incident where codex force-pushed origin and the daemon kept\
  \ committing to a diverged local branch for hours."
acceptance_criteria:
- Daemon runs git fetch before each task pick
- If local main and origin/main have diverged (neither is ancestor of the other),
  halt pool with pool_stop_reason=diverged_from_origin
- Clear error message points to the manual reconciliation steps
- litehive status shows the divergence warning prominently (!!! ATTENTION REQUIRED
  !!!)
