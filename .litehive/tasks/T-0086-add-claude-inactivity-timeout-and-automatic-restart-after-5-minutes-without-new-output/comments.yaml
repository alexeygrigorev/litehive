  message: "The codebase already has generic stale-subagent handling: live subagents\
    \ are killed when stdout stops changing, the failure is classified as `timeout`,\
    \ and pipeline retries already treat `timeout` as retryable. The remaining product\
    \ gap is to make this explicitly satisfy the Claude use case at a 5-minute threshold,\
    \ not to invent a second restart mechanism.\n\nTASK_UPDATE:\n  action: requeue\n\
    \  title: Set Claude stale-output timeout to 5 minutes and verify automatic retry/resume\n\
    \  task_type: adapter\n  priority: medium\n  pm_complexity: m\n  planned_effort:\
    \ s\n  auto_commit: true\n  goal: >-\n    Make Claude runs behave predictably\
    \ when the CLI stops producing output by\n    enforcing a 5-minute stale-output\
    \ timeout, surfacing that condition as a\n    retryable timeout, and preserving\
    \ the existing automatic retry/resume flow.\n  acceptance_criteria:\n    - Claude\
    \ live executions are considered stale after 300 seconds without new stdout, not\
    \ 360 seconds, and the stale process is terminated.\n    - A stale Claude run\
    \ is surfaced to the pipeline as a retryable timeout so the normal retry path\
    \ automatically restarts the stage without manual operator action.\n    - When\
    \ Claude exposes a continuation or resume id, the retry path preserves and reuses\
    \ it; when none is available, the retry still starts a fresh attempt cleanly.\n\
    \    - Workspace config defaults and operator-facing docs/examples reflect the\
    \ 300-second timeout and make clear that the setting is overrideable.\n    - Automated\
    \ tests cover the timeout threshold change and at least one Claude-specific retry/resume\
    \ path without requiring the real Claude CLI.\n  constraints:\n    - Keep scope\
    \ on subagent/live-execution inactivity handling; do not mix in daemon-level inactive-task\
    \ repair or unrelated timeout systems.\n    - Reuse the existing retry and continuation\
    \ plumbing instead of introducing a Claude-only restart framework.\n    - Avoid\
    \ real engine subprocesses in tests; use fakes/mocks consistent with current adapter\
    \ signatures.\n  plan:\n    - Change the default subagent inactivity timeout from\
    \ 360 seconds to 300 seconds in config/model/template layers and update any assertions\
    \ that codify the old default.\n    - Add or update tests proving stale live output\
    \ is classified as a timeout and that Claude retries can continue through the\
    \ existing resume-session plumbing.\n    - Refresh README/docs/config examples\
    \ so operators understand the new 5-minute default and the override knob.\n  \
    \  - Verify there is no separate implementation gap in pipeline retry wiring;\
    \ if a gap is found, fix only that wiring rather than broadening the task.\n\n\
    Implementation notes for the next agent:\n- Existing timeout plumbing is in `litehive/agents/session.py`\
    \ and `litehive/agents/manager.py`.\n- Existing continuation/retry plumbing is\
    \ in `litehive/pipeline/heru_factory.py` and the retry tests under `tests/test_pipeline_v2_agent_retries.py`.\n\
    - Existing default is currently `360.0` in `litehive/config/model.py`, the workspace\
    \ template, and tests.\n"
