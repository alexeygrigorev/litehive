goal: Ensure Claude live runs that stop producing new stdout for 5 minutes are terminated
  and retried through Litehive's existing timeout/continuation flow instead of hanging
  indefinitely.
acceptance_criteria:
- Claude live executions are subject to a 300-second inactivity watchdog based on
  absence of new stdout/output.
- When the watchdog fires, Litehive terminates the stale Claude subprocess and classifies
  the failure as retryable timeout.
- A timed-out Claude stage automatically re-enters the existing retry/restart flow,
  reusing a continuation or resume id when one is available.
- Workspace config defaults and operator-facing docs reflect the 300-second subagent
  inactivity timeout and distinguish it from runner-level inactivity timeout.
- Focused automated coverage proves Claude timeout forwarding and resume-on-retry
  behavior without requiring the real Claude CLI.
constraints:
- Keep scope on Claude/live subagent inactivity handling and the existing retry/continuation
  plumbing.
- Do not broaden this into daemon stale-runner recovery, workspace repair UX, or a
  separate restart mechanism.
- Prefer shared live-engine timeout plumbing; only add Claude-specific logic if the
  generic path has a concrete gap.
plan:
- Verify the current shared run_live inactivity watchdog and Claude adapter parity.
- Verify timeout failures already map to the existing retryable timeout classification
  and resume-session plumbing.
- If the current code already satisfies the task, close it instead of sending an engineer
  to re-implement the same behavior.
