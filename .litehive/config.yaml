default_engine: codex
recovery_engine: auto
litehive_source_path: null
process_profile: generic
codex_model: null
opencode_model: zai-coding-plan/glm-5.1
goz_model: glm-5-turbo
gemini_model: null
copilot_model: null
claude_model: claude-sonnet-4-20250514
claude_max_turns: 30
default_retry_limit: 3
default_stage_retry_limit: 2
task_time_budget_seconds: 3600.0
pool_stop_on_failure: false
pool_max_tasks: null
pool_stop_on_dirty_git: false
runner_hooks:
  after_implementing:
  - command: uv run ruff check --select E402,F401 litehive tests
  - command: "if [ -n \"${LITEHIVE_CHANGED_PATHS:-}\" ] \\\n  && printf '%s\\n' \"\
      $LITEHIVE_CHANGED_PATHS\" | grep -q . \\\n  && printf '%s\\n' \"$LITEHIVE_CHANGED_PATHS\"\
      \ \\\n    | xargs -r -d '\\n' git grep -nE 'noqa:.*F401|noqa:.*F403|ruff:\\\
      s*noqa:\\s*F401|ruff:\\s*noqa:\\s*F403' --; then\n  echo 'Forbidden noqa F401/F403\
      \ suppression found.'\n  exit 1\nfi"
  - command: uv run pytest -q
    timeout_seconds: 300
    description: Run full suite before QA; reject if > 5 minutes
    instructions_on_failure: "The full test suite either failed OR exceeded the 5-minute\
      \ budget.\n\nIf the suite TIMED OUT (exit code 124):\n- The suite used to run\
      \ in ~2 minutes; something slowed it down drastically.\n- Run `uv run pytest\
      \ -q --durations=20` to find the slowest tests.\n- Likely culprits: tests doing\
      \ real subprocess calls, real SQLite file I/O,\n  network calls, `time.sleep`,\
      \ or expensive fixtures.\n- The T-0291 SQLite migration is a recent change \u2014\
      \ suspect fixtures that\n  build a new workspace/DB per test. Share a session-scoped\
      \ DB where safe.\n- Do NOT mark tests with `@pytest.mark.skip` or delete tests\
      \ to pass this hook.\n- Do NOT raise the 300s budget \u2014 fix the root cause.\n\
      \nIf the suite FAILED (non-zero exit, not timeout):\n- Read the pytest stdout\
      \ above for the failing tests and fix them.\n- If the failures are unrelated\
      \ to your change, still fix them \u2014\n  you cannot leave the tree in a broken\
      \ state.\n\nAfter fixing, re-run `uv run pytest -q` locally and confirm it completes\n\
      in under 5 minutes before submitting.\n"
subagent_inactivity_timeout_seconds: 300.0
inactivity_timeout_seconds: null
external_engine_sandbox:
  enabled: false
  backend: docker
  runtime_binary: docker
  image: litehive-external-engine:latest
  workspace_mount_path: /workspace
  binary_mount_root: /litehive/bin
  runtime_args: []
  default_network_mode: none
  default_workspace_mode: rw
  read_only_rootfs: true
  drop_capabilities: true
  no_new_privileges: true
  tmpfs:
  - /tmp
  engine_policies:
    codex:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
      - /home/alexey/.codex
      setenv:
        HOME: /home/alexey
        CODEX_HOME: /home/alexey/.codex
    claude:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
      - /home/alexey/.claude
      setenv:
        HOME: /home/alexey
    copilot:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
      - /home/alexey/.copilot
      - /home/alexey/.config/gh
      setenv:
        HOME: /home/alexey
    gemini:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
      - /home/alexey/.gemini
      setenv:
        HOME: /home/alexey
    goz:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/bin
      - /home/alexey/.goz
      - /home/alexey/.config/goz
      - /home/alexey/.local/bin
      setenv:
        HOME: /home/alexey
    opencode:
      enabled: true
      network_mode: host
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
      - /home/alexey/.config/opencode
      setenv:
        HOME: /home/alexey
engine_preference:
- codex
- claude
- copilot
- goz
agent_startup_guidance:
  planner:
  - Rewrite scope with `litehive agent update ...` before passing grooming.
  swe:
  - Finish the stage with `litehive report ...` after verification.
auto_commit: true
task_mode_name: tasks
implementation_mode_name: implementation
