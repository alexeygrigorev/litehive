default_retry_limit: 3
default_stage_retry_limit: 2
execution_retry_policies:
  claude:
    max_retries: 2
    backoff_seconds: 0.25
    backoff_multiplier: 2.0
    retry_on:
    - timeout
    - network
    - service
  codex:
    max_retries: 2
    backoff_seconds: 0.25
    backoff_multiplier: 2.0
    retry_on:
