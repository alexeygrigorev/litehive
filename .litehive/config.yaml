pool_stop_on_failure: false
pool_max_tasks: null
pool_stop_on_execution_limit: false
pool_quota_threshold: null
pool_budget_threshold: null
pool_stop_on_dirty_git: false
pool_selection_policy: dependency_aware
runner_hooks:
  after_implementing:
  - command: uv run ruff check --select E402,F401 litehive tests
    reject_on_failure: true
  - command: "if [ -n \"${LITEHIVE_CHANGED_PATHS:-}\" ] \\\n  && printf '%s\\n' \"\
      $LITEHIVE_CHANGED_PATHS\" | grep -q . \\\n  && printf '%s\\n' \"$LITEHIVE_CHANGED_PATHS\"\
      \ \\\n    | xargs -r -d '\\n' git grep -nE 'noqa:.*F401|noqa:.*F403|ruff:\\\
      s*noqa:\\s*F401|ruff:\\s*noqa:\\s*F403' --; then\n  echo 'Forbidden noqa F401/F403\
      \ suppression found.'\n  exit 1\nfi"
    reject_on_failure: true
  - command: uv run pytest -q
    timeout_seconds: 300
    reject_on_failure: true
    description: "Run full suite before QA; reject if > 5 minutes"
    instructions_on_failure: |
      The full test suite either failed OR exceeded the 5-minute budget.

      If the suite TIMED OUT (exit code 124):
      - The suite used to run in ~2 minutes; something slowed it down drastically.
      - Run `uv run pytest -q --durations=20` to find the slowest tests.
      - Likely culprits: tests doing real subprocess calls, real SQLite file I/O,
        network calls, `time.sleep`, or expensive fixtures.
      - The T-0291 SQLite migration is a recent change — suspect fixtures that
        build a new workspace/DB per test. Share a session-scoped DB where safe.
      - Do NOT mark tests with `@pytest.mark.skip` or delete tests to pass this hook.
      - Do NOT raise the 300s budget — fix the root cause.

      If the suite FAILED (non-zero exit, not timeout):
      - Read the pytest stdout above for the failing tests and fix them.
      - If the failures are unrelated to your change, still fix them —
        you cannot leave the tree in a broken state.

      After fixing, re-run `uv run pytest -q` locally and confirm it completes
      in under 5 minutes before submitting.
subagent_inactivity_timeout_seconds: 360.0
inactivity_timeout_seconds: null
subagent_resource_limits:
  enabled: false
  memory_mb: null
  cpu_count: null
  process_limit: null
external_engine_sandbox:
