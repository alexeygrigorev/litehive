  backend: docker
  runtime_binary: docker
  image: litehive-external-engine:latest
  workspace_mount_path: /workspace
  binary_mount_root: /litehive/bin
  runtime_args: []
  default_network_mode: none
  default_workspace_mode: rw
  read_only_rootfs: true
  drop_capabilities: true
  no_new_privileges: true
  tmpfs:
  - /tmp
  engine_policies:
    codex:
      enabled: false
      network_mode: null
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
    claude:
      enabled: false
      network_mode: null
      workspace_mode: null
      environment: []
      credential_inputs: []
      extra_ro_binds:
      - /home/alexey/.nvm/versions/node/v24.13.1
engine_freeze:
