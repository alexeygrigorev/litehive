[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "heru"
version = "1.0.0"
description = "Standalone engine adapter package for Litehive"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11.0",
    "typer>=0.16.0",
]

[project.scripts]
heru = "heru.main:main"

[tool.setuptools]
packages = ["heru", "heru.adapters", "heru.quota"]

[tool.setuptools.package-dir]
heru = "."
