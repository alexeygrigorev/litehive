[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litehive"
description = "Local-first deterministic autonomous coding workspace"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
    "heru",
]

[tool.uv.sources]
heru = { path = "../heru", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
litehive = "litehive.main:main"

[tool.hatch.build.targets.wheel]
packages = ["litehive"]
include = ["litehive/config/profiles/*.yaml", "litehive/db/migrations/*.sql"]

[tool.hatch.version]
path = "litehive/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
markers = [
    "integration: real-binary Litehive adapter integration coverage",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E402", "F401"]

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]

[tool.ruff.format]
