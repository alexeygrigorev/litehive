[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litehive"
description = "Local-first deterministic autonomous coding workspace"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "heru>=2.0.1",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
litehive = "litehive.main:main"

[tool.hatch.build.targets.wheel]
packages = ["litehive"]
include = ["litehive/db/migrations/*.sql"]

[tool.hatch.version]
path = "litehive/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 60
markers = [
    "integration: slower end-to-end, sandbox, and external-boundary coverage",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E402: module-level imports must come first
# F401: unused imports
# PLC0415: imports should be at top-level (no inline imports unless
#          they break a real cycle or shave cold-start latency; the
#          remaining ones in the codebase carry an explicit
#          ``# noqa: PLC0415`` annotation paired with a comment
#          explaining the cycle).
extend-select = ["E402", "F401", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally use inline imports for fixture isolation and to
# defer heavy module loading. The PLC0415 rule applies to production
# code only (``litehive/``); test scaffolding has different concerns.
"tests/**/*.py" = ["PLC0415"]
"tests_integration/**/*.py" = ["PLC0415"]

[dependency-groups]
dev = [
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
    "pytest-xdist>=3.8.0",
    "pyrefly>=0.62.0",
]

[tool.uv.sources]
heru = { path = "../heru", editable = true }

[tool.ruff.format]

[tool.pyrefly]
# Type-check sources and tests, but not the local fetched-transcript
# cache or build artifacts. Notebooks are not yet in use; keep the
# ipynb glob so a future notebook is checked automatically.
project-includes = [
    "litehive/**/*.py",
    "tests/**/*.py",
    "tests_integration/**/*.py",
    "**/*.ipynb",
]
project-excludes = [
    ".venv/**",
    "build/**",
    "dist/**",
    "fetched/**",
]
errors = { unannotated-parameter = "error", unannotated-return = "error" }
# All current errors are recorded in pyrefly-baseline.json so CI is
# green from day one. New errors fail; existing ones are silenced
# until they are individually fixed.  Refresh with:
#   uv run pyrefly check --baseline pyrefly-baseline.json --update-baseline
#
# Burndown plan: every type-ignore removed (or domain-string fix per
# R4) drops one entry from the baseline. Do not re-baseline to mask
# new regressions — fix the regression instead.
