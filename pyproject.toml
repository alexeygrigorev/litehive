[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litehive"
description = "Local-first deterministic autonomous coding workspace"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "heru>=1.0.1",
    "pydantic>=2.11.0",
    "pyyaml>=6.0.2",
    "sqlitesearch>=0.0.3",
    "typer>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
litehive = "litehive.main:main"

[tool.hatch.build.targets.wheel]
packages = ["litehive"]
include = ["litehive/config/profiles/*.yaml", "litehive/db/migrations/*.sql"]

[tool.hatch.version]
path = "litehive/__version__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
timeout = 60
markers = [
    "integration: slower end-to-end, sandbox, and external-boundary coverage",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["E402", "F401"]

[dependency-groups]
dev = [
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=8.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.12.0",
    "pytest-xdist>=3.8.0",
]

[tool.uv.sources]
heru = { path = "packages/heru-1.0.1-py3-none-any.whl" }

[tool.uv.pip]
find-links = ["./packages"]

[tool.ruff.format]
